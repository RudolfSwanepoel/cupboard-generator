<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1010" width="920" height="1010" font-family="Segoe UI, Arial, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="920" height="1010" fill="#fff"/>
  <text x="20" y="26" font-size="16" font-weight="600">Drawer setting, v2: bottom drawer, Gelmar 45 mm full-extension ball-bearing runner</text>
  <text x="20" y="44" fill="#555">Figures from Gelmar: 45 high, rail 12.7 ±0.2 thick, side clearance 13.5, drawer width = opening − 27, box length = runner length.</text>
  <text x="20" y="60" fill="#c0392b">Red = my assumption, not measured. Please check these.</text>

  <!-- ================= 1. SIDE VIEW, 1 px = 1 mm ================= -->
  <text x="20" y="92" font-size="14" font-weight="600">1. Side view (front on the left), 1 : 1 on screen</text>
  <!-- z0 at y=340 ; depth y0 (carcass front) at x=80 -->
  <!-- carcass side behind -->
  <rect x="80" y="120" width="560" height="220" fill="#f4f2ed" stroke="#c4c0b7"/>
  <text x="520" y="138" fill="#8a867d">carcass side, 560 deep</text>
  <!-- bottom panel -->
  <rect x="80" y="324" width="560" height="16" fill="#d9d6cf" stroke="#777"/>
  <text x="560" y="356" fill="#444">bottom 16</text>
  <!-- runner outer, 450 long, from carcass front, z16..61 -->
  <rect x="80" y="279" width="450" height="45" fill="#b7c9db" stroke="#3f5f80"/>
  <!-- inner member centred, z21..56, set back 3 from box front -->
  <rect x="83" y="284" width="447" height="35" fill="#6f8fb0" stroke="#2f4a66"/>
  <text x="540" y="276" fill="#2f4a66" font-size="11">runner 45: outer on the carcass,</text><text x="540" y="290" fill="#2f4a66" font-size="11">inner centred (≈35 high)</text>
  <!-- drawer side: z21..171 , length 450 -->
  <rect x="80" y="169" width="450" height="150" fill="#ece5d6" fill-opacity="0.25" stroke="#6b6254"/>
  <text x="220" y="200" fill="#6b6254">drawer side 450 long (= runner length), bottom flush with the inner member</text>
  <!-- groove / base line -->
  <line x1="80" y1="300" x2="530" y2="300" stroke="#6b5a3e" stroke-dasharray="5 3"/>
  <text x="330" y="296" fill="#6b5a3e" font-size="11">3 mm base, groove 16 up</text>
  <!-- face: y -16..0 , z0..220 -->
  <rect x="64" y="120" width="16" height="220" fill="#c9b79c" stroke="#6b5a3e"/>
  <text x="16" y="114" fill="#6b5a3e">face 16, bottom flush with the carcass bottom</text>
  <!-- space behind -->
  <line x1="530" y1="250" x2="640" y2="250" stroke="#333"/>
  <line x1="530" y1="244" x2="530" y2="256" stroke="#333"/><line x1="640" y1="244" x2="640" y2="256" stroke="#333"/>
  <text x="552" y="244">110 ≥ 40 ✓</text>
  <!-- set back -->
  <text x="86" y="376" fill="#c0392b">Inner member starts ≈3 behind the box front, so the face closes fully</text>
  <!-- elevation dims -->
  <line x1="700" y1="340" x2="700" y2="319" stroke="#333"/>
  <line x1="694" y1="340" x2="706" y2="340" stroke="#333"/><line x1="694" y1="324" x2="706" y2="324" stroke="#333"/><line x1="694" y1="319" x2="706" y2="319" stroke="#c0392b"/>
  <text x="710" y="336">16</text><text x="710" y="322" fill="#c0392b">+5</text>
  <text x="360" y="398" fill="#333">Box bottom = 16 (bottom panel) + ≈5 = ≈21 above the carcass underside</text>

  <!-- ================= 2. FRONT SECTION, 4x ================= -->
  <text x="20" y="440" font-size="14" font-weight="600">2. Front section through the left bottom corner, 4 : 1 (face removed)</text>
  <!-- px = 60 + 4x ; py = 900 - 4z -->
  <!-- carcass side x0..16 z0..110 -->
  <rect x="60" y="460" width="64" height="440" fill="#f4f2ed" stroke="#777"/>
  <text x="66" y="478" fill="#444">side 16</text>
  <!-- bottom x16..170 z0..16 -->
  <rect x="124" y="836" width="616" height="64" fill="#d9d6cf" stroke="#777"/>
  <text x="520" y="874" fill="#444">bottom 16, between the sides</text>
  <!-- outer rail x16..28.7 z16..61 -->
  <rect x="124" y="656" width="50.8" height="180" fill="#b7c9db" stroke="#3f5f80"/>
  <!-- inner member inside, x21..28.7, z21..56 -->
  <rect x="144" y="676" width="30.8" height="140" fill="#6f8fb0" stroke="#2f4a66"/>
  <text x="112" y="646" fill="#2f4a66">rail 12.7</text>
  <!-- drawer side x29.5..45.5, z21..110 -->
  <rect x="178" y="460" width="64" height="356" fill="#ece5d6" stroke="#6b6254"/>
  <text x="182" y="478" fill="#6b6254">drawer side 16</text>
  <!-- base: groove 8 deep into side, engagement 6 → base from x=39.5 ; z 37..40 -->
  <rect x="218" y="740" width="522" height="12" fill="#bfae8f" stroke="#6b5a3e"/>
  <text x="300" y="734" fill="#6b5a3e">3 mm base: groove 8 deep, 6 engaged, 16 up from the drawer side bottom</text>
  <!-- play annotation -->
  <text x="176" y="630" fill="#555" font-size="11">0.8 play</text>

  <!-- width chain -->
  <line x1="60" y1="930" x2="242" y2="930" stroke="#333"/>
  <line x1="60" y1="922" x2="60" y2="938" stroke="#333"/>
  <line x1="124" y1="922" x2="124" y2="938" stroke="#333"/>
  <line x1="178" y1="922" x2="178" y2="938" stroke="#333"/>
  <line x1="242" y1="922" x2="242" y2="938" stroke="#333"/>
  <text x="84" y="952">16</text><text x="136" y="952" font-weight="600">13.5</text><text x="200" y="952">16</text>

  <!-- height chain -->
  <line x1="40" y1="900" x2="40" y2="816" stroke="#333"/>
  <line x1="32" y1="900" x2="48" y2="900" stroke="#333"/>
  <line x1="32" y1="836" x2="48" y2="836" stroke="#333"/>
  <line x1="32" y1="816" x2="48" y2="816" stroke="#c0392b"/>
  <text x="8" y="872">16</text><text x="8" y="830" fill="#c0392b">≈5</text>
  <line x1="190" y1="836" x2="400" y2="836" stroke="none"/>
  <text x="270" y="672" fill="#3f5f80">outer rail 45 high on the carcass side, standing on the bottom panel</text>
  <text x="270" y="690" fill="#c0392b">inner member centred in it: drawer side lifted ≈5 (= (45 − 35) / 2, measure it)</text>

  <text x="20" y="982" fill="#333">Width: box outside = opening − 27 (13.5 each side). With 16 sides, front/back = internal width − 59, which is what the app already cuts.</text>
  <text x="20" y="1000" fill="#333">Length: box = runner length (450); the runner is the longest that leaves ≥ 40 behind it. Full extension: travel = runner length.</text>
</svg>
