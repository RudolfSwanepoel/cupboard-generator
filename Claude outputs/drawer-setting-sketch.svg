<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" width="720" height="860" font-family="Segoe UI, Arial, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="860" fill="#ffffff"/>

  <!-- ============ SIDE VIEW (1 px = 1 mm), front on the left ============ -->
  <text x="20" y="22" font-size="15" font-weight="600">1. Side view: bottom drawer, looking at the inside of the left carcass side (front on the left)</text>

  <!-- carcass side panel, behind -->
  <rect x="60" y="30" width="560" height="300" fill="#f4f2ed" stroke="#b9b5ac"/>
  <text x="440" y="50" fill="#8a867d">carcass side (behind)</text>
  <!-- carcass bottom panel -->
  <rect x="60" y="314" width="560" height="16" fill="#d9d6cf" stroke="#777"/>
  <text x="470" y="346" fill="#444">bottom panel 16</text>

  <!-- drawer side -->
  <rect x="60" y="154" width="500" height="160" fill="#ece5d6" stroke="#6b6254"/>
  <text x="240" y="190" fill="#6b6254">drawer side (box)</text>

  <!-- runner outer sleeve on carcass -->
  <rect x="60" y="269" width="500" height="45" fill="#a9bdd1" fill-opacity="0.75" stroke="#3f5f80"/>
  <text x="250" y="264" fill="#2f4a66">runner outer sleeve, 45 high, on the carcass side in the bottom corner</text>
  <!-- inner sleeve on drawer side -->
  <rect x="64" y="292" width="496" height="22" fill="#5d7fa3" stroke="#2f4a66"/>
  <text x="250" y="307" fill="#ffffff">inner sleeve, flush with the bottom of the drawer side</text>

  <!-- drawer face -->
  <rect x="44" y="130" width="16" height="200" fill="#c9b79c" stroke="#6b5a3e"/>
  <text x="14" y="122" fill="#6b5a3e">face (16)</text>

  <!-- dims -->
  <line x1="30" y1="330" x2="30" y2="314" stroke="#c0392b"/>
  <line x1="24" y1="330" x2="44" y2="330" stroke="#c0392b"/>
  <line x1="24" y1="314" x2="60" y2="314" stroke="#c0392b" stroke-dasharray="3 2"/>
  <text x="2" y="326" fill="#c0392b" font-weight="600">16</text>
  <text x="60" y="372" fill="#c0392b">Face bottom is flush with the carcass bottom (Q4, confirm). The box bottom sits on top of the bottom panel,</text>
  <text x="60" y="388" fill="#c0392b">so it is 16 above the face bottom. The runner height (45) sets the lowest the box can go.</text>
  <line x1="60" y1="130" x2="60" y2="112" stroke="#333"/>
  <text x="66" y="110" fill="#333">carcass front edge = box front ("basically flush")</text>
  <line x1="60" y1="300" x2="64" y2="300" stroke="#c0392b"/>
  <text x="64" y="408" fill="#c0392b">Inner sleeve sits a little behind the box front so the face closes fully: ___ mm? (I have assumed ~3 mm)</text>

  <!-- ============ FRONT SECTION (1 mm = 3 px), left corner ============ -->
  <text x="20" y="450" font-size="15" font-weight="600">2. Front section through the left bottom corner (enlarged 3x)</text>
  <!-- z=0 at y=800 -->
  <!-- bottom panel, full width -->
  <rect x="60" y="752" width="600" height="48" fill="#d9d6cf" stroke="#777"/>
  <text x="420" y="782" fill="#444">carcass bottom 16</text>
  <!-- carcass side standing on the bottom? show side from z0 up -->
  <rect x="12" y="470" width="48" height="330" fill="#f4f2ed" stroke="#777"/>
  <text x="14" y="465" fill="#444">side 16</text>
  <!-- runner in the gap: 13.5 mm = 40.5 px, from z16 to z61 -->
  <rect x="60" y="617" width="40.5" height="135" fill="#a9bdd1" stroke="#3f5f80"/>
  <text x="62" y="610" fill="#2f4a66">13.5</text>
  <!-- drawer side from z16 up -->
  <rect x="100.5" y="500" width="48" height="252" fill="#ece5d6" stroke="#6b6254"/>
  <text x="104" y="494" fill="#6b6254">drawer side 16</text>
  <!-- drawer base in groove: 3mm base at 16 up from drawer bottom, groove 8 deep -->
  <rect x="124.5" y="692" width="535" height="9" fill="#bfae8f" stroke="#6b5a3e"/>
  <text x="300" y="686" fill="#6b5a3e">3 mm base in its groove, 16 up from the bottom of the drawer side</text>

  <!-- dimension chain -->
  <line x1="12" y1="830" x2="148.5" y2="830" stroke="#333"/>
  <line x1="12" y1="824" x2="12" y2="836" stroke="#333"/>
  <line x1="60" y1="824" x2="60" y2="836" stroke="#333"/>
  <line x1="100.5" y1="824" x2="100.5" y2="836" stroke="#333"/>
  <line x1="148.5" y1="824" x2="148.5" y2="836" stroke="#333"/>
  <text x="26" y="850">16</text><text x="66" y="850">13.5</text><text x="113" y="850">16</text>
  <text x="180" y="834" fill="#333">Box outside width = carcass inside width − 2 × 13.5 (what the cut sizes already assume)</text>
</svg>
