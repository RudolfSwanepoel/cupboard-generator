    </tr>${drawerOpen(c, i) ? drawerSubRow(c, i, d, 4) : ""}`;
  }).join("");
  return `<div class="dblk" data-dblk="stack"><h4>The stack</h4>
    <span class="dhelp">${esc(DHELP.stack)}</span>
    <table class="rows dstack">
    <colgroup><col class="c-n"><col class="c-face"><col class="c-box"><col class="c-off"><col class="c-end"></colgroup>
    <thead><tr><th class="n">#</th><th>Face height</th><th>Box height</th>
      <th title="${esc(DTIP.offset)}">Offset</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="5" class="note">No drawers yet — add one.</td></tr>`}</tbody></table>
    <div class="dtot" id="dtot" data-slot="1"></div>
    <div class="presets">
      <button data-preset="equal">Equal</button>
      <button data-preset="graduated">Graduated</button>
      <button id="dadd">+ Drawer</button>
    </div></div>`;
}

// Inner drawers: the same table with Height (the box bottom above the carcass
// underside) in place of Offset; a count that puts every height back on the
// equal spacing from the bottom (ruled 28 September 2026). The face is the
// box's own size, read off the engine (room.drawer_layout).
function drawerInnerStackHTML(c) {
  const g = drawerGeom(c);
  const lay = {};
  ((g && g.drawer_layout) || []).forEach((u) => { lay[u.n] = u; });
  const rows = c.drawers.map((d, i) => {
    const u = lay[i + 1];
    return `<tr title="${esc(drawerRowTip(c, i))}">
      ${drawerNumCell(c, i, d)}
      <td><input type="number" step="1" data-d="${i}" data-dk="z" value="${isSet(d.z) ? d.z : ""}"
           title="where this box's bottom stands above the carcass underside"></td>
      <td><input type="number" step="1" data-d="${i}" data-dk="box_height"
           value="${isSet(d.box_height) ? d.box_height : ""}" title="box side height — the face is the same height"></td>
      <td class="note mono" data-innerread="${i}" title="the face (width × height) and the box top, off the engine">${
        u ? `${u.face_w} × ${u.face[1] - u.face[0]} · top ${u.box[5]}` : "…"}</td>
      ${drawerEndCell(c, i)}
    </tr>${drawerOpen(c, i) ? drawerSubRow(c, i, d, 4) : ""}`;
  }).join("");
  return `<div class="dblk" data-dblk="stack"><h4>The stack</h4>
    <div class="drow"><label>Number of drawers</label>
      <input type="number" step="1" min="0" data-dcount="1" value="${c.drawers.length}"
             title="changing it puts every height back on the equal spacing"></div>
    <table class="rows dstack">
    <colgroup><col class="c-n"><col class="c-face"><col class="c-box"><col class="c-read"><col class="c-end"></colgroup>
    <thead><tr><th class="n">#</th><th title="box bottom above the carcass underside">Height</th>
      <th>Box height</th><th title="the face, width × height, and the box top">Face</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="presets"><button id="dadd">+ Drawer</button></div></div>`;
}

function renderDrawers() {
  const box = slot($("drawerbox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const inner = c.drawers.length > 0 && c.drawers.every((d) => d.inner);
  box.innerHTML = drawerSetupHTML(c) + (inner ? drawerInnerStackHTML(c) : drawerStackHTML(c));
  refreshEdging();
  if (!inner) solveStack();
}

// Re-pointing a cabinet at another runner can move its drawer lines (a depth
// that now takes 400 or 550): the engine says which first, as unticking does.
async function changeRunner(c, to, sel) {
  const pre = await post("/api/runner-swap", {job: S.job, to: to, cabinets: [c.number]});
  if (!pre || !pre.ok) { toast((pre && pre.error) || "no reply", true); sel.value = c.runner || ""; return; }
  if (pre.error_after) { toast(pre.error_after, true); sel.value = c.runner || ""; return; }
  if (pre.moves.length) {
    const lines = pre.moves.map((m) => `    ${m.label}   ${m.role}   ` +
      (m.before ? `${m.before[0]} x ${m.before[1]}` : "—") + "  ->  " +
      (m.after ? `${m.after[0]} x ${m.after[1]}` : "—")).join("\n");
    const ok = window.confirm(`Moving cabinet ${c.number} onto ${to} changes ` +
      `${pre.moves.length} drawer line${pre.moves.length === 1 ? "" : "s"}:\n\n${lines}\n\n` +
      `That is a design change: the drawer boxes are sized off the runner. No ` +
      `designation is renamed. Go ahead?`);
    if (!ok) { sel.value = c.runner || ""; return; }
  }
  c.runner = to;
  renderDrawers();
  schedule();
}

// A section default changed: a drawer whose own value was the OLD section
// value was not saying it differs — it hands back to the section, so the
// section control moves it too. What a drawer chose differently stays.
function drawerSectionSet(c, field, value) {
  const def = drawerDefaults(c);
  const own = Object.keys(DRAWER_SECTION_OF).find((k) => DRAWER_SECTION_OF[k] === field);
  const was = own ? def[own] : undefined;
  c[field] = value;
  if (own) c.drawers.forEach((d) => { if (isSet(d[own]) && d[own] === was) d[own] = null; });
}

let solveSeq = 0;

async function solveStack() {
  const c = S.job.cabinets[S.sel];
  if (!c) return;
  const seq = ++solveSeq;
  const rowsOf = () => c.drawers.map((d) => {
    const mode = d.mode || "fixed";
    return {mode: mode,
            value: mode === "share" ? (d.share === undefined ? 1 : d.share)
                                    : d.face_height};
  });
  const rows = rowsOf();
  const r = await post("/api/drawer-solve", {
    height: c.height,
    door_height: c.doors ? (c.door_height || 0) : 0,
    rows: rows,
  });
  if (seq !== solveSeq) return;          // a newer stack is already being solved
  if (!r.ok) { toast(r.error, true); return; }
  // The stack changed while this was being solved — a divider dragged in the
  // elevation writes two Fixed rows, and the press that started it selected
  // the cabinet, which asked for this solve of the rows as they WERE. Writing
  // this answer back would put the old heights over the new ones (found 28
  // September 2026, when the divider drag moved to Room -> Elevation). The
  // compute that change scheduled solves the stack as it now stands.
  if (JSON.stringify(rowsOf()) !== JSON.stringify(rows)) return;

  // What is ordered is still a list of heights: the engine's, written straight
  // in. Only a height that actually MOVED schedules another compute. It used to
  // schedule one every time, and since every compute re-renders the drawer table
  // and every render re-solves the stack, a drawer cabinet sitting untouched on
  // screen computed about three times a second for ever — rebuilding all 59
  // controls each time, and lighting the unsaved-changes marker on a job nobody
  // had edited.
  let moved = false;
  r.heights.forEach((h, i) => {
    if (c.drawers[i] && c.drawers[i].face_height !== h) {
      c.drawers[i].face_height = h;
      moved = true;
    }
  });
  document.querySelectorAll("#drawerbox [data-mm]").forEach((td) => {
    td.textContent = r.heights[+td.dataset.mm];
  });
  // an Auto box follows its face: its "≤" is the engine's, on the next compute

  const tot = $("dtot");
  if (tot) {
    const over = r.left < 0 || r.heights.some((h) => h <= 0);
    tot.innerHTML =
      `<span>opening <b>${r.opening}</b></span><span class="sep">·</span>` +
      `<span>faces + gaps <b>${r.used}</b></span><span class="sep">·</span>` +
      `<span class="${over ? "over" : ""}">left <b>${r.left}</b></span>` +
      (over ? `<span class="over">the fixed faces over-run the opening —
               export is blocked until they fit</span>` : "");
  }
  if (moved) schedule();
}

async function applyPreset(which) {
  const c = S.job.cabinets[S.sel];
  if (!c.drawers.length) { toast("Add a face first.", true); return; }
  const r = await post("/api/drawer-preset", {count: c.drawers.length, preset: which});
  if (!r.ok) { toast(r.error, true); return; }
  c.drawers.forEach((d, i) => { d.mode = "share"; d.share = r.shares[i]; });
  renderDrawers();
}

/* ---------- supports -------------------------------------------------------
   A support is a cross rail spanning the internal width (W-32 x 100, code 04)
   that ties the two sides together. Since 27 September 2026 a row has a TYPE —
   Front and Top Rear (flat, across the top of a base unit, one or none each)
   and Back (upright in the cavity behind the backing, any number) — and says
   edge by edge which of its four edges are banded. The engine places each one
   (`room.support_layout`) and the 3D view draws it; the editor shows the
   engine's answer for every figure here and works out none of them.

   A cabinet whose rows predate the types — the three old numbers, or rows
   without a type — is shown AS QUOTED and cut exactly as it always was. Nothing
   converts it; the Re-enter button is Rudolf's explicit act, and the cut list
   follows the new form from then on. */

const SUPPORT_LABEL = {front: "Front-edged", white: "White-edged", none: "No edge"};

const SUPPORT_TYPE_HINT = {
  front: "Flat, across the top front of a base unit: top flush with the sides, front " +
         "flush with their fronts. Not on a carcass with a top panel.",
  top_rear: "Flat, across the top back of a base unit: its rear edge against the " +
            "backing's front face, or flush with the back of the sides where there is " +
            "no backing. Not on a carcass with a top panel.",
  back: "Upright in the 16 mm cavity, flush with the back of the sides. Back 1 hangs " +
        "under whatever is at the top back, Back 2 stands on the bottom panel, the " +
        "rest are spaced evenly between them. One alone is Back 1.",
};
const SUPPORT_EDGE_LABEL = {
  front: {front: "Front edge", rear: "Rear edge", left: "Left end", right: "Right end"},
  top_rear: {front: "Front edge", rear: "Rear edge", left: "Left end", right: "Right end"},
  back: {front: "Inner edge", rear: "Outer edge", left: "Left end", right: "Right end"},
};
// What one long edge means on each type — the server's rule, said in words.
const SUPPORT_LONG_HINT = {
  front: "1 is the front edge",
  top_rear: "1 is the front edge",
  back: "1 faces into the cabinet: down on Back 1, up on the rest",
};

function supportsTyped(c) {
  return !!(c.support_rows && c.support_rows.length && c.support_rows.every((r) => r.type));
}

// The typed rows in cut-list order. A Front and a Top Rear block always has a
// row to write into (made up at qty 0 where missing); a Back is a row of its
// own, one per support, added and removed outright, so there is none to make
// up. The sort is stable, so Backs keep their order. Only called on a typed
// cabinet.
function typedSupportRows(c) {
  const types = S.def.support_types || ["front", "top_rear", "back"];
  const rows = c.support_rows;
  for (const t of types) {
    if (t !== "back" && !rows.some((r) => r.type === t)) {
      rows.push({type: t, qty: 0, edge: "none", cut_board: c.carcass_board || "",
                 board: c.carcass_board || "", kind: "",
                 edges: (S.def.support_default_edges || ["front"]).slice()});
    }
  }
  rows.sort((a, b) => types.indexOf(a.type) - types.indexOf(b.type));
  return rows;
}

// The long edges and ends a row's STORED edges band, read off the list as it
// stands — which edge a count means is not decided here.
function supportCounts(row) {
  const longs = S.def.support_long_edges || ["front", "rear"];
  const have = Array.isArray(row.edges) ? row.edges : (S.def.support_default_edges || ["front"]);
  const l = have.filter((n) => longs.indexOf(n) >= 0).length;
  return [l, have.length - l];
}

// A count changed: the server says which edges that is, and the row stores them.
async function supportEdgesFor(row, long, short) {
  const r = await post("/api/support-edges", {long: long, short: short});
  if (!r || !r.ok) { if (r) toast(r.error, true); return; }
  row.edges = r.edges;
  renderSupports();
  schedule();
}

// + Back support: a row of its own with the engine's defaults (27 September
// 2026) — cut from the carcass, that board's own edging kind, no edge ticked.
async function addBackSupport() {
  const c = S.job.cabinets[S.sel];
  const r = await post("/api/support-new", {job: S.job, index: S.sel, type: "back", count: 1});
  if (!r || !r.rows) return;
  c.support_rows.push(r.rows[0]);
  renderSupports();
  schedule();
}

function renderSupports() {
  const box = slot($("supportbox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const fromEngine = (g && g.supports) || [];
  const keys = (S.res && S.res.boards) || [];
  const allKinds = S.def.edging_kinds || ["pvc", "1mm", "2mm"];
  const pre = S.def.edging_prefix || {};
  const typeLabel = S.def.support_type_label || {front: "Top Front", top_rear: "Top Rear", back: "Back"};

  // A row is edged in a board and one of the kinds THAT board offers on the
  // Boards tab — there is no edging name stated here. What the rail is CUT
  // FROM and what colour its edging is are two separate questions.
  const cutSel = (r, i) => {
    const eff = r.eff_cut_board || c.carcass_board || "";
    const usable = keys.filter((k) => !boardIsThin(k));
    const lost = eff && usable.indexOf(eff) < 0;
    return `<select data-sup="${i}" data-sk="cut_board" title="what the rail is cut from">
      ${lost ? `<option value="${esc(eff)}" selected>${esc(eff)} (${
        keys.indexOf(eff) < 0 ? "not selected" : "3 mm"})</option>` : ""}
      ${usable.map((k) => `<option value="${esc(k)}"${k === eff ? " selected" : ""}>${
        esc(k)}</option>`).join("")}</select>`;
  };
  const kindSel = (r, i) => {
    const colour = r.eff_board || "";
    const kind = r.eff_kind || "";
    const offered = allKinds.filter((k) => boardOffers(colour, k));
    const lost = kind && offered.indexOf(kind) < 0;
    return `<select data-sup="${i}" data-sk="kind" title="how thick, or none">
      <option value=""${kind ? "" : " selected"}>not edged</option>
      ${lost ? `<option value="${esc(kind)}" selected>${esc(pre[kind] || kind)} (not offered)</option>` : ""}
      ${offered.map((k) => `<option value="${esc(k)}"${k === kind ? " selected" : ""}>${
        esc(pre[k] || k)}</option>`).join("")}</select>`;
  };
  const colourSel = (r, i) => {
    const kind = r.eff_kind || "";
    const colour = r.eff_board || "";
    const usable = kind ? keys.filter((k) => boardOffers(k, kind)) : keys.slice();
    const lost = colour && usable.indexOf(colour) < 0;
    return `<select data-sup="${i}" data-sk="board" title="what colour the edging is"
      ${kind ? "" : "disabled"}>
      ${lost ? `<option value="${esc(colour)}" selected>${esc(edgeLabel(colour))} (not offered)</option>` : ""}
      ${usable.map((k) => `<option value="${esc(k)}"${k === colour ? " selected" : ""}>${
        esc(edgeLabel(k))}</option>`).join("")}</select>`;
  };

  if (!supportsTyped(c)) {
    // AS QUOTED: read-only, exactly what the engine cuts. The rows are the
    // engine's resolution of what is stored (or of the three old numbers).
    const migrated = !(c.support_rows && c.support_rows.length);
    const body = fromEngine.map((r, i) => `<tr>
        <td class="n">${i + 1}</td>
        <td>${esc(r.eff_cut_board || "")}</td>
        <td>${esc(r.eff_kind ? (pre[r.eff_kind] || r.eff_kind) : "not edged")}</td>
        <td>${esc(r.eff_kind ? edgeLabel(r.eff_board || "") : "")}</td>
        <td>${r.qty}</td>
        <td class="note" data-suprow="${i}"></td>
      </tr>`).join("");
    const total = fromEngine.reduce((a, r) => a + (r.qty || 0), 0);
    const offered = (g && g.support_types_offered) || [];
    const drawn = (g && g.support_layout) || [];
    const drawnAs = drawn.length
      ? drawn.map((u) => typeLabel[u.type] + (u.type === "back" ? " " + u.n : "")).join(", ")
      : "";
    box.innerHTML = `<table class="rows asquoted">
      <colgroup><col style="width:16px"><col style="width:104px"><col style="width:74px">
        <col style="width:104px"><col style="width:38px"><col style="width:150px"></colgroup>
      <thead><tr><th class="n">#</th><th>Support Material</th><th>Edging Material</th><th>Edging Colour</th>
        <th>Qty</th><th>Ordered as</th></tr></thead><tbody>${body ||
        `<tr><td colspan="6" class="note">No supports.</td></tr>`}</tbody></table>
      <div class="dtot"><span>total <b>${total}</b> support${total === 1 ? "" : "s"}, as quoted</span>
        ${migrated ? `<span class="note">from the old
          ${c.supports}/${c.edged_supports}/${c.white_supports} numbers</span>` : ""}</div>
      ${drawnAs ? `<p class="drawn">Drawn in 3D as ${esc(drawnAs)} — the legacy placing rule.
        The cut list is exactly what it always was.</p>` : ""}
      ${offered.length ? `<div class="presets"><button id="supretype"
          title="Rewrite these rows as Top Front / Top Rear / Back. The cut list follows the new form from then on.">
          Re-enter as ${offered.map((t) => typeLabel[t]).join(" / ")}</button></div>` : ""}
      <p class="hint">These rows were written before supports had a type. They are cut and
        edged exactly as this job was quoted, and nothing here changes them. Re-enter them
        in the new form to place, edge and draw each one — then check the Ordered as lines.</p>`;
    refreshSupports();
    return;
  }

  // TYPED: a Front block, a Top Rear block, and one block per Back support —
  // every one with its own cut board, edging and per-edge ticks (27 September
  // 2026, replacing one Back block with one edging for all of them).
  const rows = typedSupportRows(c);
  const offered = (g && g.support_types_offered) || (S.def.support_types || []);
  const drawn = (g && g.support_layout) || [];
  let backAt = 0;                       // Back n counts across the rows, by qty
  const blocks = rows.map((row) => {
    const i = c.support_rows.indexOf(row);
    const e = fromEngine[i] || {};
    // read from the row's own fields the moment it is touched, so the controls
    // are right before the next compute lands; the engine's answer otherwise
    const r = {qty: row.qty, eff_cut_board: row.cut_board || e.eff_cut_board || c.carcass_board || "",
               eff_kind: row.kind || "", eff_board: row.board || e.eff_board || row.cut_board || "",
               eff_edges: Array.isArray(row.edges) ? row.edges
                          : (e.eff_edges || S.def.support_default_edges || ["front"]),
               name: e.name};
    const off = offered.indexOf(row.type) < 0;
    const isBack = row.type === "back";
    const on = isBack || (row.qty || 0) > 0;
    // A Back row is Back n (or n–m when the row is several identical ones, as
    // a re-entered legacy row can be); the count follows the layout's order.
    let title = typeLabel[row.type] || row.type;
    let mine = drawn.filter((u) => u.type === row.type);
    if (isBack) {
      const q = Math.max(row.qty || 0, 0);
      const first = backAt + 1, last = backAt + q;
      backAt += q;
      title = q > 1 ? `Back ${first}–${last}` : q === 1 ? `Back ${first}` : "Back (none)";
      mine = mine.filter((u) => u.n >= first && u.n <= last);
    }
    const control = isBack
      ? `<input type="number" step="1" min="0" data-sup="${i}" data-sk="qty" value="${row.qty || 0}"
           ${off ? "disabled" : ""} title="how many identical supports this row is">`
      : `<input type="checkbox" data-sup="${i}" data-sk="on" ${on ? "checked" : ""}
           ${off ? "disabled" : ""}>`;
    const remove = isBack
      ? `<button type="button" class="mini" data-supdel="${i}" title="remove this Back support">×</button>`
      : "";
    const at = mine.length
      ? (isBack
          ? `in the cavity y ${mine[0].y0}–${mine[0].y1}; ` +
            mine.map((u) => `Back ${u.n} z ${u.z0}–${u.z1}`).join(", ")
          : `y ${mine[0].y0}–${mine[0].y1}, z ${mine[0].z0}–${mine[0].z1}`) +
        " (from the front face and the underside of the sides)"
      : "";
    const counts = supportCounts(row);
    const countSel = (which, v) => `<select data-sup="${i}" data-sk="${which}"
        ${r.eff_kind ? "" : "disabled"} title="how many ${which === "long" ? "long edges" : "ends"} are banded">${
      [0, 1, 2].map((n) => `<option value="${n}"${n === v ? " selected" : ""}>${n}</option>`).join("")}</select>`;
    // a stored edge set that is not the canonical one for its counts is kept
    // and drawn as stored (the engine says which), until a count is changed
    const stale = e.edges_canonical === false &&
      JSON.stringify(e.edges || null) === JSON.stringify(row.edges === undefined ? null : row.edges);
    const odd = stale
      ? `<p class="drawn">Stored as ${esc(r.eff_edges.map((n) =>
          (SUPPORT_EDGE_LABEL[row.type] || {})[n] || n).join(" + ").toLowerCase())} — kept and
          drawn as stored; changing a count sets the standard edges for it.</p>` : "";
    const detail = on && !off ? `<div class="grid">
        <div class="f"><label>Support Material</label>${cutSel(r, i)}</div>
        <div class="f"><label>Edging Material</label>${kindSel(r, i)}</div>
        <div class="f"><label>Edging Colour</label>${colourSel(r, i)}</div>
        <div class="f"><label>Ordered as</label><span class="note" data-suprow="${i}"></span></div>
        <div class="f"><label>Long edges banded</label>${countSel("long", counts[0])}
          <span class="note">${esc(SUPPORT_LONG_HINT[row.type] || "")}</span></div>
        <div class="f"><label>Short edges banded</label>${countSel("short", counts[1])}
          <span class="note">1 is the left end</span></div>
      </div>
      ${odd}
      ${at ? `<p class="drawn">Drawn at ${esc(at)}.</p>` : ""}` : "";
    const offNote = off
      ? `<p class="off">Not on this carcass — it has a top panel and takes Back supports
           only.${on ? " The stored one stays in the job file and is not cut." : ""}</p>`
      : "";
    // the Back hint once, over the first Back block, not on every one
    const hint = isBack && backAt - Math.max(row.qty || 0, 0) === 0
      ? SUPPORT_TYPE_HINT.back : isBack ? "" : (SUPPORT_TYPE_HINT[row.type] || "");
    return `<div class="supblock${off ? " isoff" : ""}${isBack ? " isback" : ""}">
      <h4><label class="tick">${control}${esc(title)}</label>
        <span class="note">${esc(hint)}</span>${remove}</h4>
      ${offNote}${detail}</div>`;
  }).join("");

  const total = rows.filter((r) => offered.indexOf(r.type) >= 0)
                    .reduce((a, r) => a + (r.qty || 0), 0);
  const backOff = offered.indexOf("back") < 0;
  const anyBack = rows.some((r) => r.type === "back");
  box.innerHTML = `${blocks}
    ${anyBack ? "" : `<div class="supblock isback"><h4>Back (none)
      <span class="note">${esc(SUPPORT_TYPE_HINT.back)}</span></h4></div>`}
    <div class="presets"><button id="supadd" type="button" ${backOff ? "disabled" : ""}
      title="one more Back support, with its own edging">+ Back support</button></div>
    <div class="dtot"><span>total <b>${total}</b> support${total === 1 ? "" : "s"}</span></div>
    <p class="hint">Each support says its <b>Support Material</b> — what it is cut from —
      and, separately, its <b>Edging Material</b> (a kind the colour board offers on the
      <b>Boards</b> tab), its <b>Edging Colour</b>, and how many long and short edges get
      it. A new Back support starts in its cut board's own edging with no edges banded,
      so it is unedged until one is. Tape is drawn inside the finished
      size and moves nothing. Nothing here states an edging name.</p>`;
  refreshSupports();
}


// "Ordered as" is the engine's answer for that row, and is only ever read back
// — never worked out here. Its own function because after a compute the only
// things that update are the refresh* calls.
function refreshSupports() {
  const c = S.sel !== null && S.job.cabinets[S.sel];
  if (!c) return;
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const rows = (g && g.supports) || [];
  const pre = S.def.edging_prefix || {};
  document.querySelectorAll("#editor [data-suprow]").forEach((td) => {
    const r = rows[+td.dataset.suprow];
    if (!r) { td.textContent = "…"; td.style.color = ""; return; }
    const eff = r.eff_board || "";
    const kind = r.eff_kind || "";
    const wanted = kind && eff && !boardOffers(eff, kind);
    const counts = r.edge_counts || [];
    // the same words as a panel's line: "PVC WHITE on 1 long + 1 short edges"
    const banded = [];
    if (counts[0]) banded.push(`${counts[0]} long`);
    if (counts[1]) banded.push(`${counts[1]} short`);
    const where = r.name && r.type && banded.length
      ? ` on ${banded.join(" + ")} edge${counts[0] + counts[1] === 1 ? "" : "s"}` : "";
    const none = r.type && counts.length && !counts[0] && !counts[1];
    td.textContent = none
      ? `not edged — no edges banded${r.name ? ` (${r.name} when one is)` : ""}`
      : r.name
      ? r.name + where + (r.legacy ? "  (as quoted)" : "")
      : wanted ? `${pre[kind] || kind} not offered by ${eff}`
      : "not edged";
    td.style.color = (!r.name && wanted) ? "var(--crit)" : "";
  });
}

// Rudolf's explicit act: the legacy rows become Front / Top Rear / Back, placed
// exactly as the legacy drawing rule placed them — on a base unit one
// front-edged rail is the Front and the rest are Backs; on a carcass with a top,
// all Backs. Every legacy row becomes a typed row OF ITS OWN, keeping its qty
// and exactly what the engine resolved it to be cut from and edged in, so the
// cut list and the cost do not move (ruled 27 September 2026 — a Back block
// with one edging for every Back folded edgings away, and that is gone). The
// rows come from /api/support-reenter; the browser writes them and works out
// nothing. The old numbers are left where they are; nothing reads them once
// typed rows exist.
async function reenterSupports() {
  const c = S.job.cabinets[S.sel];
  const r = await post("/api/support-reenter", {job: S.job, index: S.sel});
  if (!r || !r.rows) return;
  c.support_rows = r.rows;
  const labels = S.def.support_type_label || {};
  toast(`Supports re-entered as ${r.types.join(", ") || "none"} — each keeps its own cut board ` +
        `and edging, so the cut list is what it was; check the Ordered as lines. ` +
        `Each Back support now has an edging of its own` +
        ((r.offered || []).indexOf("top_rear") >= 0 ? `; a ${labels.top_rear || "Top Rear"} is not guessed — tick it if wanted.` : "."));
  renderSupports();
  schedule();
}

// The editor's Save (27 September 2026): a refresh, never a write. It computes
// now rather than after the debounce, rebuilds the editor outright, and redraws
// every place the cabinet appears — the Cabinets tab's 3D, the list, the
// summary strip, the current tab (plan, elevation, cut list, nesting,
// validation) and the 3D view, each fetched at once when showing and marked
// stale otherwise so it catches up the moment it is shown. The top-bar Save
// writes the job file.
async function saveRefresh() {
  clearTimeout(computeTimer);
  S.selRendered = -2;
  await compute();
  S.sceneStale = true;
  if (S.tab === "view3d" && V3D) { clearTimeout(sceneTimer); sceneTimer = null; fetchScene(); }
  else if (S.tab !== "view3d") refreshScene();
}

/* ---------- boards, per section --------------------------------------------
   The boards are chosen once, in Structure: what shows, what the back is cut
   from, and what the box is cut from. Doors and Drawers may each take a board
   of their own, and default to Structure's when they do not.

   Edging is one control per section — a thickness and a colour — and the colour
   is a board, so the name is still generated from that board's token. A board
   name can never reach a real order as a tape (D6 / W10). The name shown beside
   the two dropdowns is always the engine's answer, never one built here.      */

// Whether a board is the 3 mm backing sheet. The answer is the engine's, carried
// on the material record — the browser does not decide what counts as thin.
function boardIsThin(key) {
  return !!(((S.res && S.res.materials) || {})[key] || {}).thin;
}

// A board the cabinet must name. Offers the project's boards and nothing else —
// the library is chosen from on the Boards tab.
//
// `want` filters by what the board physically can be: "thick" for anything built
// from a sheet (carcass, exterior, door leaf, drawer face, drawer box), "thin"
// for the backing. A stored value that fails the rule is never dropped — it is
// still shown, flagged, and the validator reports it.
function boardSel(c, key, label, hint, want) {
  const mats = (S.res && S.res.materials) || {};
  const all = (S.res && S.res.boards) || Object.keys(mats);
  const keys = !want ? all
    : all.filter((k) => want === "thin" ? boardIsThin(k) : !boardIsThin(k));
  const row = (k) => `<option value="${esc(k)}"${k === c[key] ? " selected" : ""}>${
    esc(k)} — ${esc((mats[k] || {}).board || k)}${
    (mats[k] || {}).thickness && mats[k].thickness !== 16
      ? " · " + mats[k].thickness + "mm" : ""}</option>`;
  const stored = c[key];
  const missing = keys.indexOf(stored) < 0;
  const why = !missing ? ""
    : all.indexOf(stored) < 0 ? " (not selected)"
    : want === "thin" ? " (not a 3 mm sheet)" : " (3 mm — too thin for this)";
  return `<div class="f wide">
      <label>${esc(label)}</label>
      <select data-k="${key}" data-t="text">${
        missing
          ? `<option value="${esc(stored)}" selected>${esc(stored || "—")}${why}</option>`
          : ""}${keys.map(row).join("")}${
        !keys.length && !missing
          ? `<option value="" selected>— no ${want === "thin" ? "3 mm" : "16 mm"} board in this project —</option>`
          : ""}</select>
      <span class="note">${esc(hint)}${missing && all.indexOf(stored) >= 0
        ? ` <b style="color:var(--crit)">Kept as stored; the validator reports it.</b>` : ""}</span></div>`;
}


// What a board in this project offers. The answer is the Boards record's, read
// back off /api/compute — the browser never decides what a board can be edged in.
function boardOffers(key, kind) {
  const m = ((S.res && S.res.materials) || {})[key] || {};
  const offered = m.edging_kinds || [];
  return offered.indexOf(kind) >= 0;
}

function anyBoardOffers(kind) {
  return ((S.res && S.res.boards) || []).some((k) => boardOffers(k, kind));
}

// What an Edging Colour dropdown shows for a board: its Edging Name off the
// Boards tab, the very text the order writes after the kind, with the id in
// brackets where two project boards share one — "WHITE (WHITEMEL)". The server
// works the label out (edging_label); the stored value is still the board id
// (28 September 2026).
function edgeLabel(key) {
  const m = ((S.res && S.res.materials) || {})[key] || {};
  return m.edging_label || key || "";
}

// One edging control: how thick, and what colour. 'which' is "door", "drawer"
// (the faces) or "drawer_box" (the box sides and fronts, 29 September 2026) —
// the cabinet fields are `<which>_edge_kind` / `<which>_edge_board`. `opts`:
// `kinds` offered, a `label`, a `help` line, and `quiet` — the resolved name in
// the control's tooltip rather than printed beside it (the Drawers section).
// Both dropdowns are filtered by the Boards tab: a kind no board offers is not
// listed, and the colour list holds only boards that offer the chosen kind. A
// stored choice that is no longer offered is never silently changed — it stays
// shown, flagged, and the validator blocks the export.
function edgingHTML(c, which, opts) {
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const e = (g && g.edging && g.edging[which]) || {};
  const keys = (S.res && S.res.boards) || [];
  const all = (opts && opts.kinds) || S.def.exterior_tapes || ["1mm", "2mm"];
  const kind = c[which + "_edge_kind"] || e.kind || "2mm";
  const board = c[which + "_edge_board"] || e.board || c.exterior_board;
  const pre = S.def.edging_prefix || {};

  // Nothing in the project can be edged at all: say what to do, rather than
  // offering two dropdowns that cannot produce a name.
  if (!all.some(anyBoardOffers)) {
    return `<div class="tape"><label>${esc((opts && opts.label) || "Edging")}</label>
      <span class="note">No board in this project has edging — tick
      <b>Has Edging</b> on a board in the Boards tab.</span></div>`;
  }

  const kinds = all.filter(anyBoardOffers);
  const kindLost = kinds.indexOf(kind) < 0;
  const colourKeys = keys.filter((k) => boardOffers(k, kind));
  const boardLost = colourKeys.indexOf(board) < 0;
  const label = (opts && opts.label) || "Edging";
  const quiet = !!(opts && opts.quiet);
  const kindText = (k) => quiet ? (pre[k] || k) : k;
  const tip = e.name || (kindLost || boardLost ? `${pre[kind] || kind} not offered by ${board || "that board"}`
                                               : "no edging");

  return `<div class="tape${quiet ? " drow" : ""}"${quiet ? ` data-edgetip="${which}" title="${esc(tip)}"` : ""}>
      <label>${esc(label)}</label>
      <div class="leaf">
        <select data-edge="${which}" data-ek="kind" title="how thick">${
          kindLost ? `<option value="${esc(kind)}" selected>${esc(kindText(kind))} (not offered)</option>` : ""
          }${kinds.map((k) =>
          `<option value="${esc(k)}"${k === kind ? " selected" : ""}>${esc(kindText(k))}</option>`
          ).join("")}</select>
        <select data-edge="${which}" data-ek="board" title="what colour">${
          boardLost ? `<option value="${esc(board)}" selected>${esc(edgeLabel(board) || "—")} (not offered)</option>` : ""
          }${colourKeys.map((k) =>
          `<option value="${esc(k)}"${k === board ? " selected" : ""}>${
            esc(edgeLabel(k))}</option>`).join("")}</select>
        ${quiet ? "" : `<b data-edgename="${which}" class="${e.name ? "" : (kindLost || boardLost ? "over" : "off")}">${
          esc(tip)}</b>`}
      </div>
      ${opts && opts.help ? `<span class="dhelp">${esc(opts.help)}</span>` : ""}
      ${(kindLost || boardLost) ? `<span class="note" style="color:var(--crit)">
        This cabinet still asks for an edging its board no longer offers. It is kept
        exactly as it was stored — tick it on the board in the Boards tab, or choose
        another here. The export is blocked until one of those is done.</span>` : ""}
    </div>`;
}

/* ---------- Panel design ---------------------------------------------------
   An independent panel: one part, cut and numbered on its own, not part of any
   cupboard. What is typed here is a board, which way up the panel stands, its
   two FINISHED extents and its edging; everything else about it - which extent
   becomes the cut list's Length, whether the grain locks it, what the edging is
   called - is the engine's answer, read back. The preview line at the bottom is
   engine.panel_of's own, not one assembled here.                            */

// The empty record, exactly as cabinetgen.model.PanelSpec defaults it. The
// server makes one too, on the next compute; this is only so the controls have
// something to write into before that lands.
function blankPanel() {
  return {board: "", orientation: "upright", a: 0, b: 0, grain_along: "b",
          edge_kind: "", edge_board: "", edge_long: 0, edge_short: 0,
          attached_to: null, at_x: 0, at_y: 0, at_z: 0};
}

// Whether a panel is fixed to a cabinet (28 September 2026), and to which.
function attachedTo(c) {
  const n = c && c.panel && c.panel.attached_to;
  return (n === null || n === undefined || n === "") ? null : +n;
}
function attachedOf(number) {
  return S.job.cabinets.filter((x) => x.kind === "panel" && attachedTo(x) === number);
}

function panelOf(c) {
  if (!c.panel) c.panel = blankPanel();
  return c.panel;
}

// A small picture of the panel standing the way the option means, against a
// stretch of wall. Drawn rather than described because "upright, side-on" is
// two words that mean nothing until you see it.
const ORIENT_ICON = {
  upright: `<svg viewBox="0 0 34 26" width="34" height="26" aria-hidden="true">
      <path d="M2 4 H32" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
      <rect x="8" y="6" width="18" height="16" fill="currentColor" opacity=".8"/>
    </svg>`,
  flat: `<svg viewBox="0 0 34 26" width="34" height="26" aria-hidden="true">
      <path d="M2 4 H32" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
      <rect x="8" y="12" width="18" height="4" fill="currentColor" opacity=".8"/>
    </svg>`,
  end: `<svg viewBox="0 0 34 26" width="34" height="26" aria-hidden="true">
      <path d="M2 4 H32" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
      <rect x="15" y="6" width="4" height="16" fill="currentColor" opacity=".8"/>
    </svg>`,
};

function renderPanel() {
  const box = slot($("panelbox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const info = (g && g.panel) || null;
  const p = panelOf(c);
  const keys = (S.res && S.res.boards) || [];
  const mats = (S.res && S.res.materials) || {};
  const orients = S.def.panel_orientations || [];
  const here = orients.find((o) => o.key === p.orientation) || orients[0] || {};
  const allKinds = S.def.edging_kinds || ["pvc", "1mm", "2mm"];
  const pre = S.def.edging_prefix || {};

  if (!keys.length) {
    box.innerHTML = `<p class="off">This project has no boards yet. Tick one into
      it on the <b>Boards</b> tab before choosing what this panel is cut from.</p>`;
    return;
  }

  // A panel may be any thickness - a 3 mm back panel cut to size is a perfectly
  // good panel - so unlike every carcass dropdown this one filters nothing.
  const lost = p.board && keys.indexOf(p.board) < 0;
  const boardSelHTML = `<div class="f wide"><label>Board</label>
      <select data-pk="board">
        <option value=""${p.board ? "" : " selected"}>— pick a board —</option>
        ${lost ? `<option value="${esc(p.board)}" selected>${esc(p.board)} (not selected)</option>` : ""}
        ${keys.map((k) => `<option value="${esc(k)}"${k === p.board ? " selected" : ""}>${
          esc(k)} — ${esc((mats[k] || {}).board || k)}${
          (mats[k] || {}).thickness ? " · " + mats[k].thickness + "mm" : ""}</option>`).join("")}
      </select>
      <span class="note">any thickness — a panel is one board, not a carcass</span></div>`;

  const orientHTML = `<div class="f wide"><label>Orientation</label>
      <div class="orients">${orients.map((o) => `<label class="orient${
        o.key === p.orientation ? " on" : ""}" title="${esc(o.hint)}">
        <input type="radio" name="porient" data-pk="orientation" data-po="${esc(o.key)}"
               value="${esc(o.key)}"${o.key === p.orientation ? " checked" : ""}>
        ${ORIENT_ICON[o.key] || ""}<span>${esc(o.name)}</span></label>`).join("")}</div>
      <span class="note">${esc(here.hint || "")}</span></div>`;

  const grained = !!((mats[p.board] || {}).grain === "grain");
  const grainHTML = grained
    ? `<div class="f wide"><label>Grain runs along</label>
         <select data-pk="grain_along">
           <option value="a"${p.grain_along === "a" ? " selected" : ""}>${
             esc(here.a || "a")}</option>
           <option value="b"${p.grain_along === "a" ? "" : " selected"}>${
             esc(here.b || "b")}</option>
         </select>
         <span class="note">The cut list's <b>Length</b> IS the grain direction, so
           this is what decides which size is the length — and the panel is locked,
           the nester cannot turn it.</span></div>`
    : `<div class="f wide"><label>Grain runs along</label>
         <p class="off">${p.board
           ? esc(p.board) + " is a plain board — it has no direction, so the nester is free to turn this panel."
           : "Pick a board first."}</p></div>`;

  // Edging: the kinds THIS board offers, and a colour from the boards that
  // offer the chosen kind. Nothing here states an edging name.
  const offered = allKinds.filter((k) => boardOffers(p.board, k));
  const colour = p.edge_board || p.board;
  const kindLost = p.edge_kind && offered.indexOf(p.edge_kind) < 0;
  const colourKeys = p.edge_kind ? keys.filter((k) => boardOffers(k, p.edge_kind)) : keys.slice();
  const colourLost = p.edge_kind && colour && colourKeys.indexOf(colour) < 0;
  const bandSel = (which, v) => `<select data-pk="edge_${which}">${
    [0, 1, 2].map((n) => `<option value="${n}"${n === (+v || 0) ? " selected" : ""}>${n}</option>`).join("")
    }</select>`;

  const edgeHTML = (!offered.length && !p.edge_kind)
    ? `<div class="tape"><label>Edging</label><span class="note">${p.board
        ? "<b>" + esc(p.board) + "</b> has no edging on the Boards tab, so there is none to put on this panel."
        : "Pick a board first."}</span></div>`
    : `<div class="tape">
        <label>Edging</label>
        <div class="leaf">
          <select data-pk="edge_kind" title="how thick, or none">
            <option value=""${p.edge_kind ? "" : " selected"}>not edged</option>
            ${kindLost ? `<option value="${esc(p.edge_kind)}" selected>${
              esc(pre[p.edge_kind] || p.edge_kind)} (not offered)</option>` : ""}
            ${offered.map((k) => `<option value="${esc(k)}"${
              k === p.edge_kind ? " selected" : ""}>${esc(pre[k] || k)}</option>`).join("")}
          </select>
          <select data-pk="edge_board" title="what colour" ${p.edge_kind ? "" : "disabled"}>
            <option value=""${p.edge_board ? "" : " selected"}>(${esc(p.board ? edgeLabel(p.board) : "—")})</option>
            ${colourLost ? `<option value="${esc(colour)}" selected>${
              esc(edgeLabel(colour))} (not offered)</option>` : ""}
            ${colourKeys.map((k) => `<option value="${esc(k)}"${
              k === p.edge_board ? " selected" : ""}>${esc(edgeLabel(k))}</option>`).join("")}
          </select>
          <b data-paneledge="1" class="${(info && info.line.edge_material) ? "" : "off"}">${
            esc((info && info.line.edge_material) || "no edging")}</b>
        </div>
        <div class="grid">
          <div class="f"><label>Long edges banded</label>${bandSel("long", p.edge_long)}
            <span class="note">the two longer edges</span></div>
          <div class="f"><label>Short edges banded</label>${bandSel("short", p.edge_short)}
            <span class="note">the two shorter edges</span></div>
        </div>
        ${(kindLost || colourLost) ? `<span class="note" style="color:var(--crit)">
          This panel asks for an edging its board does not offer. It is kept exactly
          as stored — tick that kind on the board in the Boards tab, or choose another
          here. The export is blocked until one of those is done.</span>` : ""}
      </div>`;

  // The cut-list line, as the engine makes it. Not assembled here.
  const line = info && info.line;
  const banded = [];
  if (line && line.edge_material) {
    if (+p.edge_long) banded.push(`${p.edge_long} long`);
    if (+p.edge_short) banded.push(`${p.edge_short} short`);
  }
  const preview = !line ? "…"
    : [`<b>${esc(line.label)}</b>`,
       esc(line.material || "no board"),
       `${line.length} × ${line.width}`,
       line.grain
         ? `grain along the ${esc(info.length_is === "a"
             ? (here.a_short || "a") : (here.b_short || "b"))}, locked`
         : "no grain — free to turn",
       line.edge_material
         ? `${esc(line.edge_material)} on ${banded.join(" + ")} edge${
             (+p.edge_long + +p.edge_short) === 1 ? "" : "s"}`
         : "no edging",
      ].join("  ·  ");

  box.innerHTML = `<div class="grid">
      ${boardSelHTML}
      ${orientHTML}
      <div class="f"><label>${esc(here.a || "Size a")}</label>
        <input type="number" step="1" min="0" data-pk="a" value="${+p.a || 0}"></div>
      <div class="f"><label>${esc(here.b || "Size b")}</label>
        <input type="number" step="1" min="0" data-pk="b" value="${+p.b || 0}"></div>
      ${grainHTML}
    </div>
    ${edgeHTML}
    ${attachHTML(c, p, info)}
    <p class="hint">Cut list line: <span class="mono" data-panelline="1">${preview}</span></p>
    <div class="presets"><button id="paneldup">Duplicate this panel</button></div>
    <p class="hint">A bulkhead is several panels — a front, an underside and an end
      cap each side. <b>Duplicate</b> gives the next free number and copies everything
      but the placement, so the set can be typed once and adjusted.</p>`;
}

/* ---------- attached panels (28 September 2026) ---------------------------
   A panel fixed to a cabinet: it carries the cabinet's number and three
   offsets in the cabinet's own frame, typed here and nowhere else. Where that
   puts it in the room is the engine's answer, read back (`placed_at`); the
   browser works out no position, and attaching or detaching goes through the
   server so the panel does not move when the link changes.              */
function attachHTML(c, p, info) {
  const host = attachedTo(c);
  const cabs = S.job.cabinets.filter((x) => x.kind !== "panel");
  if (host === null) {
    if (!cabs.length) return "";
    return `<div class="tape"><label>Attached to</label>
      <div class="leaf">
        <span class="note">standalone — it stands where it is put</span>
        <select id="pattach" title="the cabinet to fix this panel to">
          <option value="">— attach to cabinet —</option>
          ${cabs.map((x) => `<option value="${x.number}">${x.number}${x.note ? " · " + esc(x.note) : ""}</option>`).join("")}
        </select>
        <button id="pattachgo">Attach</button>
      </div>
      <span class="note">Attaching keeps its number and, if it is placed, where it stands:
        its offsets are worked out from there. From then on it moves with the cabinet.</span>
    </div>`;
  }
  const ok = !info || info.host_ok !== false;
  const at = info && info.placed_at;
  const where = !ok
    ? `<span class="note" style="color:var(--crit)">cabinet ${host} is not in this job — detach
         the panel, or attach it to another cabinet</span>`
    : at ? `<span class="note">stands on wall ${esc(at.wall)} at x ${at.x}, ${at.y} mm off the
         wall, underside at ${at.z} mm — the engine's answer, and it moves with cabinet ${host}</span>`
         : `<span class="note">cabinet ${host} is not placed yet, so neither is this panel</span>`;
  const f = (k, label, note) => `<div class="f"><label>${label}</label>
      <input type="number" step="1" data-pk="${k}" value="${+p[k] || 0}"><span class="note">${note}</span></div>`;
  return `<div class="tape"><label>Attached to</label>
    <div class="leaf">
      <b>cabinet ${host}</b>
      <button id="phost" title="select the cabinet">Show cabinet</button>
      <button id="pdetach" title="make it a standalone panel, standing where it stands">Detach</button>
    </div>
    <div class="grid">
      ${f("at_x", "X across", "from the cabinet's left side to the panel's left; negative is beside it")}
      ${f("at_y", "Y from the front", "from the front face of the sides towards the back; negative stands proud")}
      ${f("at_z", "Z up", "from the underside of the sides to the panel's underside")}
    </div>
    ${where}
  </div>`;
}

// The list on a cabinet of the panels fixed to it, and the button that adds one.
function renderAttached() {
  const box = slot($("attachedbox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const list = (g && g.attached) || attachedOf(c.number).map((x) => ({
    number: x.number, orientation: (x.panel || {}).orientation, board: (x.panel || {}).board,
    a: (x.panel || {}).a, b: (x.panel || {}).b, at_x: (x.panel || {}).at_x,
    at_y: (x.panel || {}).at_y, at_z: (x.panel || {}).at_z, label: ""}));
  const orients = S.def.panel_orientations || [];
  const oname = (k) => ((orients.find((o) => o.key === k) || {}).name || k || "");
  const rows = list.map((q) => `<tr>
      <td class="n">${q.number}</td><td>${esc(q.label || "")}</td>
      <td>${esc(q.board || "—")}</td><td>${esc(oname(q.orientation))}</td>
      <td class="n">${q.a} × ${q.b}</td>
      <td class="n">${q.at_x} / ${q.at_y} / ${q.at_z}</td>
      <td><button data-showpanel="${q.number}">Edit</button></td>
    </tr>`).join("");
  box.innerHTML = `${list.length ? `<table class="rows"><thead><tr>
      <th class="n">#</th><th>Line</th><th>Board</th><th>Orientation</th>
      <th class="n">Size</th><th class="n">X / Y / Z</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>`
    : `<p class="off">No panels are fixed to this cabinet.</p>`}
    <div class="presets"><button id="padd">+ Panel on this cabinet</button></div>
    <p class="hint">An end panel to start with — side-on, in the exterior board,
      the carcass depth plus the exposed-end allowance, against the left side. Its
      board, size, orientation, edging and offsets are edited on the panel itself.
      Each is its own numbered line on the cut list.</p>`;
}

async function addAttachedPanel() {
  const r = await post("/api/panel-new-attached", {job: S.job, index: S.sel});
  if (!r.ok) { toast(r.error, true); return; }
  S.job.cabinets.push(r.cabinet);
  placesSig = null;
  selectCabinet(S.job.cabinets.length - 1, {isolate: false});
  schedule(); renderList();
}

// Attaching and detaching are the server's: the offsets that keep the panel
// where it stands, or the placement that does, come back and are written in.
async function attachPanel(i, to) {
  const c = S.job.cabinets[i];
  const r = await post("/api/panel-attach", {job: S.job, cabinet: c.number, to: to});
  if (!r.ok) { toast(r.error, true); return; }
  c.panel = r.panel;
  S.job.placements = places().filter((p) => p.cabinet !== c.number);
  placesSig = null;
  schedule(); renderList();
}

async function detachPanels(payload) {
  const r = await post("/api/panel-detach", Object.assign({job: S.job}, payload));
  if (!r.ok) { toast(r.error, true); return false; }
  r.panels.forEach((q) => {
    const c = S.job.cabinets.find((x) => x.number === q.number);
    if (c) c.panel = q.panel;
  });
  const keep = places().filter((p) => !r.placements.some((q) => q.cabinet === p.cabinet));
  S.job.placements = keep.concat(r.placements.map((q) => Object.assign({y: 0}, q)));
  placesSig = null;
  return true;
}

// The support rows a new cabinet starts with are the engine's, per kind
// (28 September 2026). They follow the kind while they are still untouched:
// a cabinet made as tall and then made base gets the base defaults, but a
// row anyone has edited, and every stored cabinet, is left exactly alone.
// The rows as they count: the qty-0 Front and Top Rear rows the Supports block
// makes up to have something to write into (`typedSupportRows`) cut nothing
// and are not an edit, so they are left out of the signature.
function rowsSig(c) {
  return JSON.stringify((c.support_rows || []).filter((r) => r.type === "back" || (r.qty || 0) > 0));
}
function noteFreshRows(c) {
  if (!S.freshRows) S.freshRows = new Map();
  S.freshRows.set(c.number, rowsSig(c));
}
async function redefaultSupports(c) {
  if (!S.freshRows || S.freshRows.get(c.number) !== rowsSig(c)) return;
  const i = S.job.cabinets.indexOf(c);
  if (i < 0) return;
  const r = await post("/api/support-defaults", {job: S.job, index: i});
  if (!r.ok || S.job.cabinets[i] !== c) return;
  if (S.freshRows.get(c.number) !== rowsSig(c)) return;   // edited meanwhile
  c.support_rows = r.rows;
  noteFreshRows(c);
  renderSupports();
  schedule();
}

/* ---------- Structure ------------------------------------------------------
   What the cabinet is cut from, how the back is fixed, and what is inside it.
   The three boards come first because nothing else can be decided until they
   are. Dividers are in the app but not working — they are shown greyed and
   told so, rather than quietly doing nothing.                               */

function renderStructure() {
  const box = slot($("structurebox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const keys = (S.res && S.res.boards) || [];
  if (!keys.length) {
    box.innerHTML = `<p class="off">This project has no boards yet. Tick one into
      it on the <b>Boards</b> tab before choosing what this cabinet is cut from.</p>`;
    return;
  }
  // A mitre or an ell is a different construction, not a box with a different
  // outline. Its back IS its two melamine wall panels, so there is no 3 mm
  // backing board and nothing to groove it into; and its shelves are the two
  // kinds in the Corner Unit section, because its interior is not a rectangle
  // and a straight shelf size would be wrong in the unsafe direction. A BLIND
  // corner is a straight box and none of this applies to it.
  const shaped = cornerShaped(c);
  // The back board is only cut when there is a back, or a drawer on a grooved
  // 3 mm base. Nothing on this cabinet uses it otherwise, so it is not asked for.
  // The engine's answer (Cabinet.needs_back_board) — a drawer's bottom can
  // follow the Drawers section's since 29 September 2026, so it is not read
  // off the rows here.
  const gb = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const usesBack = !shaped && (gb && gb.needs_back_board !== undefined ? gb.needs_back_board
    : (c.back !== "none" || (tickOn(c, "has_drawers") &&
       (c.drawers || []).some((d) => (d.base || c.drawer_base || "board") === "board"))));
  // "three" is no longer offered for a new cabinet (27 September 2026), but a
  // job that carries it still reads and cuts as it did: the stored value is
  // shown beside the two on offer rather than silently replaced.
  const backs = (S.def.backs || ["four", "none"]).slice();
  if (c.back && backs.indexOf(c.back) < 0) backs.push(c.back);
  const legacyBacks = S.def.backs_legacy || ["three"];
  const std = S.def.standard || {};

  box.innerHTML = `<div class="grid">
      ${boardSel(c, "exterior_board", "Exterior board",
                 "doors, drawer faces and anything else that shows", "thick")}
      ${usesBack
        ? boardSel(c, "back_board", "Backing board",
                   "the back panel, and a drawer base grooved out of the same sheet",
                   "thin")
        : `<div class="f wide"><label>Backing board</label>
             <p class="off">Nothing on this cabinet is cut from it — no back, and no
             drawer on a grooved base.</p></div>`}
      ${boardSel(c, "carcass_board", "Carcass board",
                 "sides, top, bottom, supports and shelves", "thick")}
      ${shaped
        ? `<div class="f wide"><label>Back fixing</label>
             <p class="off">A corner unit's back is its two melamine wall panels,
             one wrapping the other. There is no 3 mm backing board and nothing to
             groove it into, so this is not asked. What is in the job file stays
             there.</p></div>`
        : `<div class="f wide"><label>Back fixing</label>
        <select data-k="back" data-t="sel:backs">${backs.map((b) =>
          `<option value="${esc(b)}"${b === c.back ? " selected" : ""}>${
            esc(BACK_LABEL[b] || b)}${legacyBacks.indexOf(b) >= 0
              ? " (as quoted \u2014 no longer offered)" : ""}</option>`).join("")}</select>
        <span class="note">what the backing board is grooved into, and whether one
        is cut at all</span></div>`}
      ${shaped
        ? `<div class="f wide"><label>Shelves</label>
             <p class="off">A corner unit's shelves are the arm shelf and the mitred
             shelf, both in <b>Corner Unit</b> below — its inside is not a rectangle,
             so a straight shelf size would not fit it.</p></div>`
        : `<div class="f"><label>Shelves</label>
        <input type="number" step="1" min="0" data-k="shelves" data-t="int"
               value="${c.shelves || 0}">
        <span class="note">Adjustable — they sit on shelf pegs and can be moved up
        or down. Cut ${std.shelf_gap_adjustable} mm clear of the back so they
        lift out.</span></div>
      <div class="f"><label>Fixed shelves</label>
        <input type="number" step="1" min="0" data-k="fixed_shelves" data-t="int"
               value="${c.fixed_shelves || 0}">
        <span class="note">Permanently fixed in place — they do not move. Cut
        ${std.shelf_gap_fixed} mm clear of the back, so a little deeper.</span></div>`}
      ${unavailableField("Shelf width", c.shelf_width,
        "Greyed out: a shelf width only means something once a divider splits " +
        "the inside into bays, and dividers are not available yet.")}
      ${unavailableField("Dividers", c.divider_count,
        "a divider cannot be positioned yet")}
      ${unavailableField("Divider height", c.divider_height,
        "a divider cannot be positioned yet")}
    </div>`;
}

// The edging names in force are the engine's answer, so they are re-read rather
// than recomputed whenever a compute comes back for the cabinet on screen.
function refreshEdging() {
  const c = S.sel !== null && S.job.cabinets[S.sel];
  const g = c && S.res && S.res.geometry && S.res.geometry[String(c.number)];
  if (!g || !g.edging) return;
  // "no edging" is grey and is not a fault — it is what a board with Has Edging
  // off is supposed to say. Red is kept for a kind the board does not offer,
  // which the validator is blocking the export over.
  const c2 = c || {};
  document.querySelectorAll("#editor [data-edgename]").forEach((b) => {
    const which = b.dataset.edgename;
    const e = g.edging[which] || {};
    if (e.name) { b.textContent = e.name; b.className = ""; return; }
    const kind = c2[which + "_edge_kind"] || e.kind || "";
    const board = c2[which + "_edge_board"] || e.board || c2.exterior_board || "";
    const wanted = kind && board && !boardOffers(board, kind);
    b.textContent = wanted
      ? `${(S.def.edging_prefix || {})[kind] || kind} not offered by ${board}`
      : "no edging";
    b.className = wanted ? "over" : "off";
  });
  document.querySelectorAll("#editor [data-edgetip]").forEach((el) => {
    const e = g.edging[el.dataset.edgetip] || {};
    if (e.name) el.title = e.name;
  });
  const boxEdge = document.querySelector("#editor [data-boxedge]");
  if (boxEdge) boxEdge.textContent = (g.edging.drawer_box || {}).name || "no edging";
  const rows = (g.edging.drawer_box || {}).rows || [];
  document.querySelectorAll("#editor [data-boxedgerow]").forEach((b) => {
    const name = rows[+b.dataset.boxedgerow];
    b.textContent = name || "PVC not offered";
    b.className = name ? "" : "over";
  });
}

/* ---------- the board library ----------------------------------------------
   boards.json lives in the repo, so both machines see the same boards. It is a
   library, not a job: a project selects from it, and selecting copies the
   record into the job. That copy is the price capture — editing a board here
   changes what the next job is quoted at and never what an existing one was.

   Edging names are generated from one token per board, for all three
   thicknesses. The token is its own field rather than the board's name because
   edging names are decided per order, and a long board description should not
   reach a real order as an edging name. */

S.lib = null;          // the library as /api/boards last returned it
S.libEdit = null;      // the board being edited, or null
S.libSwap = null;      // the swap being set up, or null — the two share the panel

const GRAIN_LABEL = {grain: "Grain", plain: "Plain"};

async function renderBoardsTab() {
  const r = await post("/api/boards", {});
  if (!r.ok) { toast(r.error, true); return; }
  S.lib = r;
  drawBoards();
}

function drawBoards() {

  ["bf-tape", "bf-name"].forEach((id) => $(id).addEventListener("input", refreshEdgingForm));
  $("bf-hasedging").addEventListener("change", refreshEdgingForm);
  kindBoxes().forEach((x) => x.addEventListener("change", refreshEdgingForm));

  refreshColour();

/* The board picture. Two ways in and one answer: whichever is used, the SERVER
   copies the file into Pictures/ and hands back the relative path to store, so
   nothing machine-specific reaches boards.json — which is shared through git.

   Browse… is pywebview's native Open dialog, opened by /api/pick-picture on the
   desktop window. There is no window under --no-window or in the browser, so
   that reply says `no_window` and the hidden file input takes over; both arrive
   at /api/drop-picture, which is also where a drop lands. A drop gives us the
   file's CONTENTS and no path — WebView2 does not expose File.path and
   pywebview 6.2.1 has no file-drop event — so the bytes are what is sent.     */
/* Board pictures are supplied with the grain running VERTICALLY (ruled 22 Sept
   2026): that is what lets a drawing turn the tile onto each panel's length
   direction through 0 or 90 degrees rather than working an angle out of a
   photograph. checkGrain is what says so as a picture arrives.

   The SAMPLING is here and the VERDICT is not. Decoding a JPEG is the one thing
   the browser can do that the app cannot — it has a decoder and the app has no
   third-party dependency — so it draws the picture into a small canvas, which
   area-averages it, and sends the luminance up. /api/picture-grain reaches the
   answer, through cabinetgen.pictures, so there is one answer to the question.
   Nothing here decides anything.

   It WARNS and never blocks: the picture is already in Pictures/ by this point
   and stays there, which is the app's bargain everywhere but a critical.       */
const GRAIN_GRID = 64;

async function checkGrain(url, note) {
  let grid;
  try {
    const img = new Image();
    img.crossOrigin = "anonymous";
    await new Promise((ok, bad) => {
      img.onload = ok;
      img.onerror = () => bad(new Error("the picture would not load"));
      img.src = url;
    });
    const cv = document.createElement("canvas");
    cv.width = cv.height = GRAIN_GRID;
    const cx = cv.getContext("2d", {willReadFrequently: true});
    // drawImage onto a small canvas area-averages, which is what makes the
    // measurement steady: point-sampling a 1135-wide photo aliases the grain
    // away and the direction stops being readable at all.
    cx.drawImage(img, 0, 0, GRAIN_GRID, GRAIN_GRID);
    const px = cx.getImageData(0, 0, GRAIN_GRID, GRAIN_GRID).data;
    grid = [];
    for (let y = 0; y < GRAIN_GRID; y++) {
      const row = [];
      for (let x = 0; x < GRAIN_GRID; x++) {
        const o = (y * GRAIN_GRID + x) * 4;
        row.push(0.2126 * px[o] + 0.7152 * px[o + 1] + 0.0722 * px[o + 2]);
      }
      grid.push(row);
    }
  } catch (e) {
    return;                       // nothing to say: it is an advisory, not a gate
  }
  const r = await post("/api/picture-grain", {grid: grid});
  const v = r && r.grain;
  if (!v || !v.checked || v.ok) return;   // vertical, or no texture to have a way
  toast(v.message, true);
  if (note) {
    note.insertAdjacentHTML("beforeend",
      ' <b class="bad">' + esc(v.message) + "</b>");
  }
}

function wirePicture() {
  const drop = $("bf-drop"), field = $("bf-picture"), note = $("bf-picnote");
  if (!drop || !field) return;

  const settle = (r) => {
    if (!r || !r.ok) {
      if (r && r.cancelled) return;              // closing the dialog is not a fault
      toast((r && r.error) || "the picture could not be read", true);
      return;
    }
    field.value = r.picture;
    S.libEdit.picture = r.picture;
    S.libEdit.picture_url = r.url;
    S.libEdit.picture_ok = true;
    const old = $("bf-picpreview");
    const img = document.createElement("img");
    img.id = "bf-picpreview";
    img.className = "picpreview";
    img.alt = "";
    img.src = r.url + (r.url.indexOf("data:") === 0 ? "" : "?t=" + Date.now());
    old.replaceWith(img);
    drop.classList.remove("empty");
    note.textContent = "copied into " + ((S.def && S.def.pictures_dir) || "Pictures") +
      "/ as " + r.name + " — stored relative to the project, so it works on " +
      "both machines. Save the board to keep it.";
    // Both ways in end here, so the grain is asked about once, whichever it was.
    checkGrain(img.src, note);
  };

  const sendBytes = (file) => {
    const fr = new FileReader();
    fr.onload = async () => {
      settle(await post("/api/drop-picture",
                        {name: file.name, data: String(fr.result)}));
    };
    fr.onerror = () => toast("that file could not be read", true);
    fr.readAsDataURL(file);
  };

  $("bf-picbrowse").addEventListener("click", async () => {
    const r = await post("/api/pick-picture", {});
    if (r && r.no_window) { $("bf-picfile").click(); return; }
    settle(r);
  });
  $("bf-picfile").addEventListener("change", (e) => {
    if (e.target.files && e.target.files[0]) sendBytes(e.target.files[0]);
    e.target.value = "";                      // so the same file can be picked twice
  });
  $("bf-picclear").addEventListener("click", () => {
    field.value = "";
    S.libEdit.picture = "";
    S.libEdit.picture_url = "";
    S.libEdit.picture_ok = false;
    const span = document.createElement("span");
    span.id = "bf-picpreview";
    span.className = "picpreview none";
    $("bf-picpreview").replaceWith(span);
    drop.classList.add("empty");
    note.textContent = "no picture. Save the board to keep it that way.";
  });

  // The drop itself. dragover has to be prevented or the page navigates to the
  // file instead of handing it over, which is the browser default.
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => {
    e.preventDefault();
    e.stopPropagation();
    drop.classList.add("over");
  }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => {
    e.preventDefault();
    e.stopPropagation();
    drop.classList.remove("over");
  }));
  drop.addEventListener("drop", (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) sendBytes(f);
    else toast("nothing to take from that drop — drop an image file", true);
  });
}

$("boards").addEventListener("click", async (e) => {
  const edit = e.target.closest("[data-bedit]");
  if (edit) {
    S.libSwap = null;
    S.libEdit = Object.assign({}, S.lib.boards.find((b) => b.id === edit.dataset.bedit));
    drawBoardPanel();
    $("boardedit").scrollIntoView({block: "nearest"});
    return;
  }
  if (e.target.id === "bnew") {
    S.libSwap = null;
    // A new board starts with Has Edging OFF and nothing ticked: the record-level
    // "all three" default is only how data written before the tickbox reads, not
    // a guess about a board somebody is adding now.
    S.libEdit = {id: "", name: "", tape: "", thickness: 16, grain: "plain",
                 price: 0, picture: "", has_edging: false, edging_kinds: [],
                 colour: ""};
    drawBoardPanel();
    return;
  }
  if (e.target.id === "sw-cancel") { S.libSwap = null; drawBoardPanel(); return; }
  if (e.target.id === "sw-go") {
    const from = e.target.dataset.from;
    const to = $("sw-to").value;
    S.libSwap = null;
    drawBoardPanel();
    swapBoard(from, to);
    return;
  }
  const del = e.target.closest("[data-bdel]");
  if (del) {
    const b = S.lib.boards.find((x) => x.id === del.dataset.bdel);
    if (!window.confirm(`Remove ${b.name} from the library?\n\n` +
        `Jobs that already use it keep their own copy, so nothing they were ` +
        `quoted changes — but you could not select it again.`)) return;
    const r = await post("/api/board-delete", {id: del.dataset.bdel});
    if (!r.ok) { toast(r.error, true); return; }
    S.libEdit = null;
    renderBoardsTab();
    return;
  }
  const swap = e.target.closest("[data-bswap]");
  if (swap) {
    const others = (S.lib.boards || []).filter((b) => b.id !== swap.dataset.bswap);
    S.libEdit = null;
    S.libSwap = {from: swap.dataset.bswap, to: others.length ? others[0].id : ""};
    drawBoardPanel();
    $("boardedit").scrollIntoView({block: "nearest"});
  }
});

/* Saving a board: the library, and — only when the id changes — the project on
   screen. A SAVED job keeps its own copy of every board it selected under the id
   it was selected with, so nothing already quoted moves whatever is done here.
   The project open on the Cabinets tab is a live edit, so it comes along, and it
   is named before anything is written. No panel designation changes: a panel
   keeps its name and changes what it is cut from.                            */
$("boards").addEventListener("click", async (e) => {
  if (e.target.id === "bf-cancel") { S.libEdit = null; drawBoardPanel(); return; }
  if (e.target.id !== "bf-save") return;
  const from = S.libEdit.id || "";
  const board = {
    id: $("bf-id").value.trim().toUpperCase(),
    name: $("bf-name").value.trim(),
    tape: $("bf-tape").value.trim(),
    thickness: parseInt($("bf-thickness").value, 10),
    grain: $("bf-grain").value,
    price: parseFloat($("bf-price").value) || 0,
    picture: $("bf-picture").value.trim(),
    has_edging: $("bf-hasedging").checked,
    // Kept whether or not Has Edging is on: unticking stops anything reading
    // them, it does not throw them away (the house pattern).
    edging_kinds: Array.from(document.querySelectorAll("[data-bfkind]"))
      .filter((x) => x.checked).map((x) => x.dataset.bfkind),
    colour: $("bf-colour").value.trim(),
  };

  // The same three rules the server enforces, said here first so the answer is
  // under the field rather than in a toast after a round trip.
  if (board.has_edging && !board.tape) {
    toast("Has Edging is ticked, so the board needs an edging name — the name the " +
          "edging is ordered under, e.g. WHITE", true);
    return;
  }
  if (board.has_edging && !board.edging_kinds.length) {
    toast("Has Edging is ticked, so tick at least one of PVC, 1mm, 2mm — or untick " +
          "Has Edging", true);
    return;
  }
  if (board.colour && !/^#?([0-9a-fA-F]{6}|[0-9a-fA-F]{3})$/.test(board.colour)) {
    toast("The colour must be a hex value like #b4835a, or left empty for no " +
          "colour set", true);
    return;
  }

  if (from && board.id && board.id !== from) {
    const cabs = S.job.cabinets.filter((c) =>
      [c.carcass_board, c.exterior_board, c.back_board, c.drawer_carcass_board,
       c.drawer_face_board, c.door_edge_board, c.drawer_edge_board]
        .concat(c.door_boards || [])
        .concat((c.drawers || []).map((d) => d.box_board))
        .concat((c.drawers || []).map((d) => d.face_board))
        .concat((c.drawers || []).map((d) => d.box_edge_board))
        .indexOf(from) >= 0).map((c) => c.number);
    const ok = window.confirm(
      `Rename ${from} to ${board.id}?\n\n` +
      `Saved job files keep their own copy of this board under ${from} — they were ` +
      `quoted with it, and nothing they were quoted changes.\n\n` +
      (cabs.length
        ? `The project open here does move: cabinet${cabs.length === 1 ? "" : "s"} ` +
          `${cabs.join(", ")} will be cut from ${board.id} instead. No panel ` +
          `designation changes — a panel keeps its name and changes what it is ` +
          `cut from.\n\n`
        : `No cabinet in the project open here is cut from it.\n\n`) +
      `Rename it?`);
    if (!ok) return;
  }

  const r = await post("/api/board-save",
                       {board: board, from: from, job: S.job});
  if (!r.ok) { toast(r.error, true); return; }
  if (r.job) {
    S.job = r.job;
    S.selRendered = -2;
    await compute();
  }
  toast((r.renamed
    ? `Renamed ${r.from} to ${r.id}.` +
      (r.kept_by.length
        ? ` ${r.kept_by.join(", ")} ${r.kept_by.length === 1 ? "keeps its" : "keep their"}` +
          ` own copy under ${r.from}.` : "")
    : "Saved " + board.name + " to the library.") +
    ((r.refreshed || []).length
      ? ` The project open here now uses its new details` +
        ` (its quoted price is kept).` : ""));
  S.libEdit = null;
  renderBoardsTab();
});

// Ticking a board into the project copies its record — price included.

/* ---------- the runner library (Catalogue -> Runners) ------------------------
   hardware.json in the repo, beside boards.json, with the same bargain: a
   project selects a runner and the record is copied into the job, price per
   pair and all — that copy is the price capture. Everything a runner drives
   (box width, box length, the "no runner fits" critical, the 3D) is the
   engine's reading of the record the cabinet names; nothing here sizes a
   drawer. A cabinet saved before the catalogue hangs on the built-in legacy
   record (350 / 450 / 500), which is kept as quoted and never offered. */

S.rlib = null;         // the library as /api/runners last returned it
S.rEdit = null;        // the runner being edited, or null

const runnerMoney = (v) => "R " + (+v || 0).toLocaleString("en-ZA",
  {minimumFractionDigits: 2, maximumFractionDigits: 2});

async function renderRunnersTab() {
  const r = await post("/api/runners", {});
  if (!r.ok) { toast(r.error, true); return; }
  S.rlib = r;
  drawRunners();
}

function extText(x) {
  return x === "full" || !x ? "full" : Math.round(+x * 100) + " %";
}

function drawRunners() {
  const r = S.rlib;
  if (!r) { $("runners").innerHTML = ""; return; }
  const chosen = (S.res && S.res.runners) || Object.keys(S.job.runners || {});
  const hw = (S.res && S.res.hardware) || [];
  const pairsOf = (id) => hw.filter((h) => h.id === id).reduce((a, h) => a + h.pairs, 0);
  const rows = r.runners.map((x) => {
    const inJob = chosen.indexOf(x.id) >= 0;
    const pairs = pairsOf(x.id);
    return `<tr>
      <td><input type="checkbox" data-rpick="${esc(x.id)}" ${inJob ? "checked" : ""}
           style="width:auto" title="use this runner in this project"></td>
      <td><b>${esc(x.name)}</b><div class="note">id ${esc(x.id)}${x.supplier ? " · " + esc(x.supplier) : ""}${
        x.sku ? " · SKU " + esc(x.sku) : ""} · ${esc(x.type)}</div></td>
      <td class="n">${x.height} · ${x.side_clearance}<div class="note">inner ${x.inner_h} × ${x.inner_t}${
        (x.estimated || []).length ? ` <span class="over" title="not stated on the record: the estimate (height − 8, 6 thick) is read until the record is edited and saved">estimated: confirm</span>` : ""}</div></td>
      <td class="note" style="max-width:150px;white-space:normal">${(x.lengths || []).join(" · ")}</td>
      <td>${extText(x.extension)}${x.capacity_kg ? `<div class="note">${x.capacity_kg} kg</div>` : ""}</td>
      <td class="n">${runnerMoney(x.price)}</td>
      <td class="note">${inJob ? (pairs ? `${pairs} pair${pairs === 1 ? "" : "s"}` : "selected, no drawers on it")
                               : ""}</td>
      <td class="note">${(x.used_by || []).length ? x.used_by.map(esc).join(", ")
                          : `<span class="note">no saved job</span>`}</td>
      <td>
        <button data-redit="${esc(x.id)}">Edit</button>
        ${inJob ? `<button data-rswap="${esc(x.id)}" title="hang every drawer cabinet in this project on this runner">Use for all drawers</button>` : ""}
        <button data-rdel="${esc(x.id)}" title="remove from the library">Del</button>
      </td></tr>`;
  }).join("");

  const legacy = hw.filter((h) => !h.id);
  const lg = S.def.legacy_runner || {};
  const pill = chosen.length
    ? `<span class="pill ok">${chosen.length} runner${chosen.length === 1 ? "" : "s"} in this project</span>`
    : `<span class="pill">no runner selected — a new cabinet takes the ${esc(S.def.runner_seed || "seed")} runner</span>`;
  const cost = hw.filter((h) => h.id && h.pairs).map((h) =>
    `${esc(h.id)}: ${h.pairs} pair${h.pairs === 1 ? "" : "s"} × ${runnerMoney(h.price)} = <b>${runnerMoney(h.total)}</b>`).join(" · ");
  $("runners").innerHTML = `
    <div class="matline" style="border-bottom:1px solid var(--line)">
      ${pill}
      <span class="note">Ticking a runner copies it into this project at today's price
      per pair. Editing a runner here never changes a job already quoted.</span>
      <span class="grow"></span>
      <button id="rnew" class="primary">Add runner</button>
    </div>
    <div class="scroll"><table><thead><tr>
      <th title="use in this project">Use</th><th>Runner</th>
      <th class="n" title="the outer rail's height, and the clearance each side between carcass side and box side, mm">Height · clear.</th>
      <th>Lengths</th><th>Extension</th>
      <th class="n">Price / pair</th><th>In this project</th><th>Used by saved jobs</th><th></th>
    </tr></thead><tbody>${rows ||
      `<tr><td colspan="9" class="empty">The library is empty. Add a runner.</td></tr>`}</tbody></table></div>
    ${legacy.length ? `<div class="matline" style="border-top:1px solid var(--line)">
      <span class="pill">legacy</span>
      <span class="note">Cabinet${legacy[0].cabinets.length === 1 ? "" : "s"}
      ${legacy[0].cabinets.join(", ")} (${legacy[0].pairs} pair${legacy[0].pairs === 1 ? "" : "s"})
      hang on <b>${esc(lg.name || "legacy runners")}</b> — ${(lg.lengths || []).join(" / ")},
      ${lg.side_clearance} a side — as they were quoted. It is never offered for a new
      cabinet; re-point them with <b>Use for all drawers</b> or in each cabinet's Drawers
      section, and you are shown which drawer lines move first.</span></div>` : ""}
    ${cost ? `<div class="matline"><span class="note">Runners in this project: ${cost}.
      Bought from the supplier, so not in the Plazaboard estimate.</span></div>` : ""}
    <p class="note" style="padding:8px 12px 12px;max-width:86ch">
      The library is <b>${esc(r.path)}</b> in the repo, so it syncs with the code.
      A drawer's box is sized off its runner: its <b>length</b> is the longest length
      the runner offers that leaves ${(S.def.standard || {}).runner_clearance || 40} mm
      behind it in the carcass, and its <b>width</b> is the opening less the runner's
      clearance each side. <b>Lift</b> is how far the drawer side's bottom sits above
      the rail's; <b>setback</b> how far the inner member starts behind the box front.
      Only side-mount ball-bearing runners are built; soft-close and undermount need a
      spec sheet first.</p>
    <div id="runneredit"></div>`;
  drawRunnerEditor();
}

  const est = x.estimated || [];
  const num = (id, label, v, step, note, req) => `<div class="f${miss.indexOf(id) >= 0 ? " bad" : ""}">
