    // Repainted once the engine has answered, not before: the note being
    // cleared is the engine's report of the override, so painting now would
    // show it again off the reply that still carried it.
    schedule();
    return;
  }
  const rm = e.target.closest("[data-drm]");
  if (rm) {
    S.job.cabinets[S.sel].drawers.splice(+rm.dataset.drm, 1);
    renderDrawers();
    return;
  }
  const suprm = e.target.closest("[data-suprm]");
  if (suprm) {
    supportRows().splice(+suprm.dataset.suprm, 1);
    renderSupports();
    schedule();
    return;
  }
  if (e.target.id === "supadd") {
    // A new row is cut from the carcass board and not edged, which is the
    // plainest support there is. Both are changed in the row itself.
    supportRows().push({edge: "none", qty: 1,
                        cut_board: (S.job.cabinets[S.sel] || {}).carcass_board || "",
                        board: "", kind: ""});
    renderSupports();
    schedule();
    return;
  }
  const pre = e.target.closest("[data-preset]");
  if (pre) { applyPreset(pre.dataset.preset); return; }
  if (e.target.id === "dadd") {
    const c = S.job.cabinets[S.sel];
    const std = S.def.standard || {};
    c.drawers.push({face_height: 0, box_height: std.box_height_default,
                    base: (S.def.bases || ["board"])[0], mode: "share", share: 1,
                    box_board: null, face_board: null});
    renderDrawers();
  }
});

/* ---------- doors ----------------------------------------------------------
   One or two leaves and no more: a pair hangs from its outer edges, left and
   right, and that is not a choice (ruled 18 September 2026). A single door is
   the choice. Each leaf names the board it is cut from — two leaves of
   different boards come out as two cut-list lines — and the section carries one
   edging control of its own: how thick, and what colour.

   The side beside each row is the engine's own answer, the one the plan swings
   from and the elevation draws, so the two can never drift apart.           */

/* ---------- the Corner Unit section -----------------------------------------
   Three types, and each asks for its own measurements. EVERY dimension a corner
   unit has is entered here, which is the whole reason Size is greyed above: a
   new user should never have to hunt for where a number goes.

   Nothing here works out a dimension. The derived figures - the blank, the
   mitre legs, the inner span, the door width, an arm shelf's maximum depth -
   all arrive on `geometry.corner` from /api/compute. */

// Six small plan pictures of what each type looks like with its corner at the
// right-hand end and at the left. Fixed drawings of the idea, not a scaled view
// of these measurements: nothing is computed here and nothing reads a dimension
// back off them. Wall A runs across the top; the return wall is the short one.
const CORNER_ICONS = {
  "mitre-R": `<path class="wall" d="M4,7 H60 M59,7 V40"/>
              <polygon class="box" points="30,8 58,8 58,36 42,36 30,24"/>
              <line class="front" x1="30" y1="24" x2="42" y2="36"/>`,
  "mitre-L": `<path class="wall" d="M4,7 H60 M5,7 V40"/>
              <polygon class="box" points="34,8 6,8 6,36 22,36 34,24"/>
              <line class="front" x1="34" y1="24" x2="22" y2="36"/>`,
  "ell-R":   `<path class="wall" d="M4,7 H60 M59,7 V40"/>
              <polygon class="box" points="30,8 58,8 58,36 42,36 42,24 30,24"/>
              <polyline class="front" points="30,24 42,24 42,36"/>`,
  "ell-L":   `<path class="wall" d="M4,7 H60 M5,7 V40"/>
              <polygon class="box" points="34,8 6,8 6,36 22,36 22,24 34,24"/>
              <polyline class="front" points="34,24 22,24 22,36"/>`,
  "blind-R": `<path class="wall" d="M4,7 H60 M59,7 V40"/>
              <rect class="box" x="24" y="8" width="34" height="20"/>
              <rect class="blindp" x="46" y="26" width="12" height="4"/>
              <line class="front" x1="24" y1="28" x2="46" y2="28"/>`,
  "blind-L": `<path class="wall" d="M4,7 H60 M5,7 V40"/>
              <rect class="box" x="6" y="8" width="34" height="20"/>
              <rect class="blindp" x="6" y="26" width="12" height="4"/>
              <line class="front" x1="18" y1="28" x2="40" y2="28"/>`,
};

function cornerIcon(kind, hand) {
  const art = CORNER_ICONS[kind + "-" + hand] || "";
  return `<svg viewBox="0 0 64 44" aria-hidden="true">${art}</svg>`;
}

// One number field in the Corner Unit grid. The same data-k / data-t contract
// every other field uses, so the editor's one input handler stores it.
function cornerNum(key, label, value, note, wide, problem) {
  return `<div class="f${wide ? " wide" : ""}"><label>${esc(label)}</label>
    <input type="number" step="1" min="0" data-k="${key}" data-t="opt"
           class="${problem ? "bad" : ""}"
           value="${value === null || value === undefined ? "" : value}"
           placeholder="enter mm">
    ${problem ? `<span class="prob">${esc(problem)}</span>` : ""}
    ${note ? `<span class="note">${note}</span>` : ""}</div>`;
}

// The blind panel's own two choices: what it is cut from, and how thick the one
// edge it carries is (ruled 22 September 2026). Both are "follow" by default -
// the exterior board, so the strip beside the door matches the doors, and the
// doors' edging thickness. The kind list is what that board OFFERS, read back
// off /api/compute like every other edging control; the browser decides none of
// it, and the name shown beside the two is the engine's.
function blindPanelHTML(c, info) {
  const mats = (S.res && S.res.materials) || {};
  const keys = (S.res && S.res.boards) || [];
  const pre = S.def.edging_prefix || {};
  const chosen = c.blind_board || "";
  const board = info.blind_board || c.exterior_board || "";
  const kind = info.blind_edge_kind || "2mm";
  const all = S.def.exterior_tapes || ["1mm", "2mm"];
  const offers = (mats[board] || {}).edging_kinds || [];
  const kinds = all.filter((k) => offers.indexOf(k) >= 0);
  const kindLost = c.blind_edge_kind && kinds.indexOf(c.blind_edge_kind) < 0;
  const name = info.blind_edge_name || "";
  return `<div class="f wide"><label>Blind panel board</label>
      <select data-k="blind_board" data-t="text">
        <option value=""${chosen ? "" : " selected"}>exterior board (${
          esc(c.exterior_board || "\u2014")})</option>
        ${chosen && boardIsThin(chosen)
          ? `<option value="${esc(chosen)}" selected>${esc(chosen)} (3 mm \u2014 too thin for a panel)</option>`
          : ""}
        ${keys.filter((k) => !boardIsThin(k)).map((k) =>
          `<option value="${esc(k)}"${k === chosen ? " selected" : ""}>${esc(k)} \u2014 ${
            esc((mats[k] || {}).board || k)}</option>`).join("")}
      </select>
      <span class="note">The strip beside the door is seen from the room, so it
      follows the doors unless you say otherwise.</span></div>
    <div class="f wide"><label>Blind panel edging</label>
      <select data-k="blind_edge_kind" data-t="optext">
        <option value=""${c.blind_edge_kind ? "" : " selected"}>follows the doors (${
          esc(pre[kind] || kind)})</option>
        ${kindLost ? `<option value="${esc(c.blind_edge_kind)}" selected>${
          esc(pre[c.blind_edge_kind] || c.blind_edge_kind)} (not offered by ${
          esc(board || "that board")})</option>` : ""}
        ${kinds.map((k) => `<option value="${esc(k)}"${
          k === c.blind_edge_kind ? " selected" : ""}>${esc(pre[k] || k)}</option>`).join("")}
      </select>
      <span class="note">One edge only \u2014 the vertical one facing the opening,
      which is what you rub past reaching in. ${name
        ? `Ordered as <b>${esc(name)}</b>.`
        : `<b style="color:var(--crit)">${esc(pre[kind] || kind)} is not offered by ${
            esc(board || "that board")} \u2014 tick it on the Boards tab.</b>`}</span></div>`;
}

/* The unit drawn to scale in plan, off the outline the ENGINE derived, with
   each measurement lettered the same as the field it comes from. Nothing is
   computed here but where to put a label: every corner point is the engine's.
   Wall A runs across the top, the room is below it, and the runs the unit
   meets are drawn dashed so "open end = depth of the run it meets" is visible
   rather than a sentence to decode.                                        */
const CORNER_EDGES = {
  "mitre-R": {a: [0, 1], b: [1, 2], fb: [2, 3], fa: [4, 0], front: [[3, 4]]},
  "mitre-L": {b: [0, 1], a: [1, 2], fa: [2, 3], front: [[3, 4]], fb: [4, 0]},
  "ell-R":   {a: [0, 1], b: [1, 2], fb: [2, 3], front: [[3, 4], [4, 5]], fa: [5, 0]},
  "ell-L":   {b: [0, 1], a: [1, 2], fa: [2, 3], front: [[3, 4], [4, 5]], fb: [5, 0]},
};
const CORNER_LETTER = {a: "A", b: "B", fa: "C", fb: "D"};

function cornerDiagram(c, g, info) {
  const kind = info.kind, hand = info.hand === "L" ? "L" : "R";
  let pts, edges, doorTxt = [];
  const blind = kind === "blind";
  if (blind) {
    // Every span here is the engine's (room.blind_spans, off /api/compute): the
    // flush panel sits INSIDE the carcass one board in from the corner, and the
    // overlay door laps onto its face. Nothing about that layout is worked out
    // in the browser.
    const sp = info.spans;
    if (!g || !g.footprint || !(c.width > 0) || !(c.depth > 0) || !sp) return "";
    const W = g.width, D = g.depth, B = c.blind_width || 0;
    pts = [[0, 0], [W, 0], [W, D], [0, D]];
    return drawDiagram(pts, W, D, hand, {blind: sp.blind, door: sp.door,
      side: sp.side,
      D, W, B, doorW: info.door_width, opening: info.opening});
  }
  if (!g || g.source !== "corner" || !g.footprint) return "";
  pts = g.footprint;
  edges = CORNER_EDGES[kind + "-" + hand];
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return drawDiagram(pts, Math.max(...xs), Math.max(...ys), hand,
    {edges, fa: c.face_a, fb: c.face_b, a: c.arm_a, b: c.arm_b, kind,
     doors: g.doors || [], mitre: g.mitre_deg});
}

function drawDiagram(pts, W, D, hand, o) {
  const pad = Math.max(W, D) * 0.34;
  const ghost = Math.max(W, D) * 0.45;            // how much of each run to show
  const vx0 = -pad, vy0 = -pad * 0.55, vw = W + 2 * pad, vh = D + pad * 1.9;
  const k = Math.max(W, D) / 260;                 // one screen pixel, in mm
  const fs = 15 * k, sw = 1.4 * k;
  const P = (p) => `${p[0]},${p[1]}`;
  const cornerX = hand === "R" ? W : 0;
  const out = [];
  // the walls: A across the top, the return wall down the corner end
  out.push(`<line x1="${hand === "R" ? -ghost - pad * 0.2 : 0}" y1="0"
    x2="${hand === "R" ? W : W + ghost + pad * 0.2}" y2="0" stroke="var(--ink)" stroke-width="${3 * k}"/>`);
  out.push(`<line x1="${cornerX}" y1="0" x2="${cornerX}" y2="${D + ghost + pad * 0.3}"
    stroke="var(--ink)" stroke-width="${3 * k}"/>`);
  out.push(`<text x="${hand === "R" ? -ghost : W + ghost}" y="${-6 * k}" font-size="${fs}"
    text-anchor="${hand === "R" ? "start" : "end"}" fill="var(--muted)">this wall</text>`);
  out.push(`<text x="${cornerX + (hand === "R" ? 6 : -6) * k}" y="${D + ghost}" font-size="${fs}"
    text-anchor="${hand === "R" ? "start" : "end"}" fill="var(--muted)">return wall</text>`);
  const dash = `stroke="var(--rule)" stroke-dasharray="${5 * k} ${4 * k}" fill="none" stroke-width="${sw}"`;
  if (o.blind) {
    // the run on the return wall stands in front of the blind panel
    const rx = hand === "R" ? o.W - o.D : 0;
    out.push(`<rect x="${rx}" y="${o.D}" width="${o.D}" height="${ghost}" ${dash}/>`);
    out.push(`<text x="${rx + o.D / 2}" y="${o.D + ghost / 2}" font-size="${fs * 0.85}"
      text-anchor="middle" fill="var(--muted)">return run</text>`);
    out.push(`<polygon points="${pts.map(P).join(" ")}" fill="var(--carc)" stroke="var(--ink)" stroke-width="${sw}"/>`);
    const [b0, b1] = o.blind, [d0, d1] = o.door, [s0, s1] = o.side;
    // Every position ALONG the wall is the engine's, to the millimetre. Only the
    // depth each part is drawn at is exaggerated — a 16 mm board is three pixels
    // at plan scale and would say nothing — so both are drawn `th` deep and the
    // front line at y = D is what they are read against: the flush panel behind
    // it, the overlay door in front of it. That is the one thing this drawing is
    // about, and the depth is dimensioned in words beside it, never off a rect.
    const th = 18 * k;
    out.push(`<rect x="${s0}" y="${o.D - th}" width="${s1 - s0}" height="${th}"
      fill="var(--carc)" stroke="var(--ink)" stroke-width="${sw * 0.7}"/>`);
    if (o.B) out.push(`<rect x="${b0}" y="${o.D - th}" width="${b1 - b0}" height="${th}"
      fill="var(--rule)" stroke="var(--ink)" stroke-width="${sw}"/>`);
    // and the door in front of the box, lapping onto the panel's face
    out.push(`<rect x="${d0}" y="${o.D}" width="${Math.max(d1 - d0, 0)}" height="${th}"
      fill="var(--door)" stroke="var(--ink)" stroke-width="${sw * 0.7}"/>`);
    out.push(label(o.W / 2, -14 * k, `W ${o.W}`, fs));
    out.push(label(hand === "R" ? -30 * k : o.W + 30 * k, o.D / 2, `depth ${o.D}`, fs));
    // the panel's label goes on the strip the door does not cover
    const sh0 = hand === "R" ? Math.max(b0, d1) : b0;
    const sh1 = hand === "R" ? b1 : Math.min(b1, d0);
    if (o.B) out.push(label((sh0 + sh1) / 2, o.D - 34 * k, `blind panel ${o.B}`, fs));
    if (o.doorW) out.push(label((d0 + d1) / 2, o.D + 34 * k, `door ${o.doorW}`, fs));
  } else {
    // the two runs this unit meets, dashed, at the open ends' depths
    if (o.fa) {
      const x = hand === "R" ? -ghost : W;
      out.push(`<rect x="${x}" y="0" width="${ghost}" height="${o.fa}" ${dash}/>`);
      out.push(`<text x="${x + ghost / 2}" y="${o.fa / 2}" font-size="${fs * 0.85}"
        text-anchor="middle" fill="var(--muted)">next run</text>`);
    }
    if (o.fb) {
      const x = hand === "R" ? W - o.fb : 0;
      out.push(`<rect x="${x}" y="${D}" width="${o.fb}" height="${ghost}" ${dash}/>`);
      out.push(`<text x="${x + o.fb / 2}" y="${D + ghost / 2}" font-size="${fs * 0.85}"
        text-anchor="middle" fill="var(--muted)">next run</text>`);
    }
    out.push(`<polygon points="${pts.map(P).join(" ")}" fill="var(--carc)" stroke="var(--ink)" stroke-width="${sw}"/>`);
    // the door face(s) in the door colour, thick
    (o.edges.front || []).forEach(([i, j], n) => {
      const p = pts[i], q = pts[j];
      out.push(`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"
        stroke="#3d8a8a" stroke-width="${5 * k}"/>`);
      const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      const txt = o.kind === "mitre"
        ? `door ${o.doors[0] || ""}${o.mitre !== null && o.mitre !== undefined ? " \u00b7 " + Math.abs(o.mitre) + "\u00b0" : ""}`
        : "face " + (n + 1);
      out.push(label(mx + (hand === "R" ? -34 : 34) * k, my + 20 * k, txt, fs));
    });
    // each measurement, lettered like its field
    ["a", "b", "fa", "fb"].forEach((key) => {
      const e = o.edges[key];
      if (!e) return;
      const p = pts[e[0]], q = pts[e[1]];
      let mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      // pushed off the edge, away from the box
      if (key === "a") my -= 14 * k;
      if (key === "b") mx += (hand === "R" ? 34 : -34) * k;
      if (key === "fa") mx += (hand === "R" ? 38 : -38) * k;
      if (key === "fb") my += 16 * k;
      out.push(label(mx, my, `${CORNER_LETTER[key]} ${o[key]}`, fs, true));
    });
  }
  return `<div class="cdiag"><svg viewBox="${vx0} ${vy0} ${vw} ${vh}"
    xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">${out.join("")}</svg></div>`;
}

function label(x, y, text, fs, bold) {
  return `<text x="${x}" y="${y}" font-size="${fs}" text-anchor="middle"
    dominant-baseline="middle" fill="var(--ink)"${bold ? ' font-weight="700"' : ""}
    paint-order="stroke" stroke="var(--panel)" stroke-width="${fs * 0.35}">${esc(text)}</text>`;
}

/* What follows a change to a corner unit, so the operator is not left to do
   arithmetic the app can do.

   1. Choosing Mitre or Ell with nothing measured yet fills in a starting shape:
      both open ends at the depth the cabinet already had (the depth of the runs
      it meets, which is what they are), and both lengths 350 longer - the
      proportions of cabinet 7, the one corner unit actually built. Every figure
      is shown in its field and in the drawing, and is overtyped as measured.
   2. A corner unit stands IN a corner. Whenever its type, hand or length along
      the wall changes, a placed unit is moved into the corner its hand names:
      right-hand end at the wall's end, or left-hand end at the wall's start. It
      used to be left wherever it was, and the operator had to work out
      "wall length minus arm" to put it there by hand.                        */
const CORNER_REACH_KEYS = {corner_style: 1, corner_hand: 1, arm_a: 1, width: 1,
                           corner_unit: 1};
function cornerFollowUp(c, k) {
  if (!(k in CORNER_REACH_KEYS)) return;
  const on = c.corner_unit !== false && !!c.corner_style;
  if (!on) return;
  if (k === "corner_style" && (c.corner_style === "mitre" || c.corner_style === "ell")
      && [c.arm_a, c.arm_b, c.face_a, c.face_b].every((v) => !(v > 0))) {
    const d = c.depth > 0 ? c.depth : 500;
    c.face_a = d; c.face_b = d; c.arm_a = d + 350; c.arm_b = d + 350;
  }
  // A mitre or a blind corner is a unit with a door - the blind one by
  // definition. Choosing the type turns doors on; the operator can still turn
  // them off on a mitre.
  if (k === "corner_style" && (c.corner_style === "mitre" || c.corner_style === "blind")
      && c.has_doors !== true) {
    c.has_doors = true;
    if (!((c.doors || 0) > 0)) c.doors = 1;
  }
  const reach = c.corner_style === "blind" ? c.width : c.arm_a;
  if (!(reach > 0)) return;
  const p = places().find((q) => q.cabinet === c.number);
  const rm = S.job.room;
  if (!p || !rm) return;
  const w = (rm.walls || []).find((x) => x.id === p.wall);
  if (!w) return;
  const x = c.corner_hand === "L" ? 0 : Math.max(0, w.length - reach);
  if (p.x !== x) {
    p.x = x;
    placesSig = null;
    toast(`Cabinet ${c.number} moved into the ${c.corner_hand === "L" ? "start" : "end"} ` +
          `corner of wall ${p.wall} (x = ${x}).`);
  }
}

function renderCorner() {
  const box = slot($("cornerbox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const info = cornerInfo(c) || {};
  const kind = info.kind || "";
  const types = S.def.corner_types || [];
  const hands = S.def.corner_hands || [];

  const typeRow = `<div class="f wide"><label>Type</label>
    <select data-k="corner_style" data-t="sel:corner_styles">
      <option value=""${c.corner_style ? "" : " selected"}>\u2014 choose \u2014</option>
      ${types.map((t) => `<option value="${esc(t.key)}"${
        t.key === c.corner_style ? " selected" : ""}>${esc(t.name)}</option>`).join("")}
    </select>
    ${kind ? `<span class="note">${esc(
      (types.find((t) => t.key === kind) || {}).hint || "")}</span>` : ""}</div>`;

  if (!kind) {
    // Ticking the box and leaving the type blank used to do nothing at all, and
    // say nothing about it. This is that silence, ended.
    box.innerHTML = `<div class="grid">${typeRow}</div>
      <p class="off">Choose a corner type.</p>`;
    return;
  }

  const handRow = `<div class="f wide"><label>Hand</label>
    <div class="hands">${hands.map((h) => `
      <label class="handopt${info.hand === h.key ? " on" : ""}">
        <input type="radio" name="cornerhand" data-k="corner_hand" data-t="text"
               value="${esc(h.key)}"${info.hand === h.key ? " checked" : ""}>
        ${cornerIcon(kind, h.key)}<b>${esc(h.name)}</b>
        <span>${esc(h.hint)}</span></label>`).join("")}</div>
    <span class="note">Which end of the unit stands in the corner, as you face
    it standing in the room.</span></div>`;

  const prob = info.problems || {};
  let fields;
  if (kind === "blind") {
    fields = cornerNum("width", "Carcass width", c.width,
                       "the box itself, blind panel and door together", false, prob.width) +
             cornerNum("height", "Height", c.height, "", false, prob.height) +
             cornerNum("depth", "Depth", c.depth, "", false, prob.depth) +
             cornerNum("blind_width", "Blind panel width", c.blind_width,
                       "cut at exactly this \u2014 it has to cover the run on the return wall",
                       false, prob.blind_width) +
             blindPanelHTML(c, info);
  } else {
    fields = cornerNum("arm_a", "A \u2014 length along this wall", c.arm_a,
                       "wall to the unit's open end", false, prob.arm_a) +
             cornerNum("arm_b", "B \u2014 length along the return wall", c.arm_b,
                       "", false, prob.arm_b) +
             cornerNum("face_a", "C \u2014 open end on this wall", c.face_a,
                       "= depth of the cupboards beside it on this wall", false, prob.face_a) +
             cornerNum("face_b", "D \u2014 open end on the return wall", c.face_b,
                       "= depth of the cupboards on the return wall", false, prob.face_b) +
             cornerNum("height", "Height", c.height, "", false, prob.height);
  }
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const diagram = cornerDiagram(c, g, info);

  let extra = "";
  if (kind === "mitre") {
    const max = info.arm_shelf_max;
    const armOpts = [["a", "Arm A \u2014 along this wall"],
                     ["b", "Arm B \u2014 along the return wall"]];
    extra = `<div class="grid">
      <div class="f"><label>Arm shelves</label>
        <input type="number" step="1" min="0" data-k="arm_shelves" data-t="int"
               value="${c.arm_shelves || 0}">
        <span class="note">A rectangle running along one arm, behind the
        mitre${info.arm_shelf_length ? `. ${info.arm_shelf_length} mm long` : ""}.</span></div>
      <div class="f"><label>Arm</label>
        <select data-k="arm_shelf_arm" data-t="sel:corner_arms">${armOpts.map(([k, n]) =>
          `<option value="${k}"${(c.arm_shelf_arm || "a") === k ? " selected" : ""}>${
            esc(n)}</option>`).join("")}</select></div>
      <div class="f"><label>Arm shelf depth</label>
        <input type="number" step="1" min="0" data-k="arm_shelf_depth" data-t="opt"
               value="${c.arm_shelf_depth === null || c.arm_shelf_depth === undefined
                        ? "" : c.arm_shelf_depth}"
               placeholder="${max === null || max === undefined ? "auto" : max}">
        <span class="note">${max === null || max === undefined ? "" :
          `Maximum <b>${max} mm</b> \u2014 the deepest that clears both the closed door
           (${info.shelf_clear} mm) and the hinge plate (${info.hinge_clearance} mm),
           rounded down to 5. Blank takes the maximum; more than it is a critical.`}</span></div>
      <div class="f"><label>Mitred shelves</label>
        <input type="number" step="1" min="0" data-k="mitred_shelves" data-t="int"
               value="${c.mitred_shelves || 0}">
        <span class="note">The same square blank as the top and bottom, mitred on
        site${info.shelf_legs ? `: legs ${info.shelf_legs[0]} and ${info.shelf_legs[1]}`
             : ""}.</span></div>
      ${cornerNum("corner_door_width", "Door width override", c.corner_door_width,
        info.door_width ? `blank derives ${info.door_width} mm from the arms` : "",
        true)}
    </div>`;
  }

  box.innerHTML = `<div class="grid">${typeRow}${handRow}</div>${diagram}
    <div class="grid">${fields}</div>${extra}
    <p class="note" id="cornerreadout"></p>`;
}


function renderDoors() {
  const box = slot($("doorbox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const mats = (S.res && S.res.materials) || {};
  const keys = (S.res && S.res.boards) || [];
  // A blind corner has exactly one door, at the far end from the blind panel.
  // That is a ruling, not a default: the unit exists to hold one door clear of
  // the return run. Its own `doors` count stays in the job file and is not read.
  const blind = cornerKind(c) === "blind";
  const have = blind ? 1 : (c.doors || 1);
  const n = Math.max(1, have);
  const counts = [1, 2];
  if (have > 2) counts.push(have);      // a job file written before the limit
  const sides = (g && g.hinges) || [];
  const widths = (g && g.doors) || [];

  const leaves = [];
  for (let i = 0; i < n; i++) {
    const side = sides[i] || (n >= 2 ? (i === 0 ? "L" : "R") : "L");
    const chosen = (c.door_boards || [])[i] || "";
    leaves.push(`<div class="leaf">
      <b>Leaf ${i + 1}</b>
      <span class="note">${widths[i] || "?"} wide</span>
      ${n === 1
        ? `<select data-leaf="0" class="hinge">
             <option value="L"${side === "L" ? " selected" : ""}>hinged left</option>
             <option value="R"${side === "R" ? " selected" : ""}>hinged right</option>
           </select>`
        : `<span class="note hinge">hinged ${side === "L" ? "left" : "right"}</span>`}
      <select data-dboard="${i}" title="what this leaf is cut from">
        <option value=""${chosen ? "" : " selected"}>exterior board (${
          esc(c.exterior_board || "—")})</option>
        ${chosen && boardIsThin(chosen)
          ? `<option value="${esc(chosen)}" selected>${esc(chosen)} (3 mm — too thin for a door)</option>`
          : ""}
        ${keys.filter((k) => !boardIsThin(k)).map((k) =>
          `<option value="${esc(k)}"${k === chosen ? " selected" : ""}>${
          esc(k)}</option>`).join("")}
      </select>
    </div>`);
  }

  // Which board is in effect, said in words: the exterior one, and any leaf
  // that has been given a board of its own instead.
  const named = (k) => k ? k + ((mats[k] || {}).board ? " — " + mats[k].board : "") : "—";
  const own = [];
  for (let i = 0; i < n; i++) {
    const k = (c.door_boards || [])[i];
    if (k && k !== c.exterior_board) own.push(`Leaf ${i + 1} is cut from ${named(k)} instead.`);
  }
  const stale = have > 2
    ? `<p class="hint" style="color:var(--warn)">This job was saved with ${have} doors on
       one cabinet. A cabinet takes 1 or 2 now — pick one. Until you do, it is cut as
       ${have}, exactly as it was saved.</p>` : "";
  box.innerHTML = `<div class="grid">
      ${blind
        ? `<div class="f"><label>How many</label>
             <input value="1" disabled>
             <span class="note">A blind corner has one door, always.</span></div>`
        : `<div class="f"><label>How many</label>
        <select data-k="doors" data-t="int">${counts.map((k) =>
          `<option value="${k}"${k === have ? " selected" : ""}>${k}</option>`).join("")}</select></div>`}
      <div class="f"><label>Door height</label>
        <input type="number" step="1" data-k="door_height" data-t="opt" placeholder="auto"
               value="${c.door_height === null || c.door_height === undefined
                        ? "" : c.door_height}"></div>
    </div>
    ${stale}
    ${leaves.join("")}
    <p class="hint">${n === 2
      ? "A pair is fixed: left leaf hinged left, right leaf hinged right. "
      : n === 1 ? "One door: choose which side its hinges are on — the handle goes on the other side. " : ""}External board
      is <b>${esc(named(c.exterior_board))}</b>.${own.length ? " " + esc(own.join(" ")) : ""}</p>
    ${edgingHTML(c, "door")}
    <div class="swing" id="swingnote"></div>`;
  refreshSwing();
}

// The swing check the server just ran, read back. It re-runs on every change,
// because every change goes through /api/compute.
function refreshSwing() {
  const el = $("swingnote");
  const c = S.sel !== null && S.job.cabinets[S.sel];
  if (!el || !c || !S.res) return;
  const rm = S.res.room;
  if (!rm) {
    el.className = "swing";
    el.textContent = "No room yet, so there is nothing for a door to foul — " +
                     "the swing check needs a plan to run against.";
    return;
  }
  const bad = (rm.clashes || []).filter((x) => x.cabinet === c.number && x.kind === "door");
  el.className = "swing " + (bad.length ? "bad" : "ok");
  el.textContent = bad.length
    ? "Door swing fouls " + bad.map((x) => x.against).join(", ")
    : "Door swing checked and clear.";
}

/* ---------- drawer faces: one row per face, Share or Fixed -----------------
   Fixed rows take their millimetres. The gaps come from the standard, never
   typed per drawer. Whatever is left is split among the Share rows in
   proportion to their share numbers — and every one of those numbers is
   drawers.divide's, fetched, not worked out here.                           */

function renderDrawers() {
  const box = slot($("drawerbox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const std = S.def.standard || {};
  const keys = (S.res && S.res.boards) || [];
  // What a drawer follows when it names no board of its own: the box the
  // Carcass board and the face the Exterior board, both from Structure (or the
  // cabinet-wide choice an older job file may still carry).
  const boxDefault = c.drawer_carcass_board || c.carcass_board || "";
  const faceDefault = c.drawer_face_board || c.exterior_board || "";
  // A drawer box and a drawer face are both built from a sheet, so the 3 mm
  // backing is not offered. One already stored stays, flagged.
  const boardCell = (i, dk, v, follows, what) => `<td><select data-d="${i}"
      data-dk="${dk}" title="${esc(what)} — blank follows Structure (${esc(follows || "—")})">
      <option value=""${v ? "" : " selected"}>(${esc(follows || "—")})</option>
      ${v && boardIsThin(v)
        ? `<option value="${esc(v)}" selected>${esc(v)} (3 mm — too thin)</option>` : ""}
      ${keys.filter((k) => !boardIsThin(k)).map((k) =>
        `<option value="${esc(k)}"${k === v ? " selected" : ""}>${
        esc(k)}</option>`).join("")}</select></td>`;

  const rows = c.drawers.map((d, i) => {
    const share = (d.mode || "fixed") === "share";
    const val = share ? (d.share === undefined ? 1 : d.share) : d.face_height;
    return `<tr>
      <td class="n">${i + 1}</td>
      <td><select data-d="${i}" data-dk="mode">
        <option value="share"${share ? " selected" : ""}>Share</option>
        <option value="fixed"${share ? "" : " selected"}>Fixed</option></select></td>
      <td><input type="number" step="${share ? "0.1" : "1"}" data-d="${i}"
           data-dk="${share ? "share" : "face_height"}" value="${val}"></td>
      <td class="n mono" data-mm="${i}">${d.face_height}</td>
      <td><input type="number" step="1" data-d="${i}" data-dk="box_height"
           value="${d.box_height}"></td>
      <td><select data-d="${i}" data-dk="base">${(S.def.bases || []).map((b) =>
        `<option${b === d.base ? " selected" : ""}>${esc(b)}</option>`).join("")}</select></td>
      ${boardCell(i, "box_board", d.box_board || "", boxDefault,
                  "what this drawer's box is cut from: sides, front, and a melamine base")}
      ${boardCell(i, "face_board", d.face_board || "", faceDefault,
                  "what this drawer's face is cut from")}
      <td><button data-drm="${i}" title="Remove this face">x</button></td>
    </tr>`;
  }).join("");

  box.innerHTML = `<table class="rows">
    <colgroup><col class="c-n"><col class="c-mode"><col class="c-val"><col class="c-mm">
      <col class="c-box"><col class="c-base"><col class="c-mat"><col class="c-mat">
      <col class="c-rm"></colgroup>
    <thead><tr>
      <th class="n">#</th><th>Mode</th><th>Value</th><th class="n">mm</th>
      <th title="box side height">Box h</th><th>Base</th>
      <th title="box material">Box mat.</th><th title="face material">Face mat.</th><th></th>
    </tr></thead><tbody>${rows ||
      `<tr><td colspan="9" class="note">No faces yet — add one.</td></tr>`}</tbody></table>
    <div class="dtot" id="dtot"></div>
    <div class="presets">
      <button data-preset="equal">Equal</button>
      <button data-preset="graduated">Graduated</button>
      <button id="dadd">+ Face</button>
    </div>
    <p class="hint">Listed top to bottom. The ${std.stack_gap} mm gap between faces
      comes from the standard and is never typed per drawer. Drag the join between
      two faces in the elevation to pin just those two at the heights you drag to.
      <b>Base</b> is how the drawer bottom is held: <b>board</b> is the 3 mm sheet
      grooved into all four panels, <b>melamine</b> a 16 mm one housed between
      them. <b>Box mat.</b> and <b>Face mat.</b> are per drawer: left in brackets,
      the box follows the Carcass board (${esc(boxDefault || "—")}) and the face the
      Exterior board (${esc(faceDefault || "—")}); pick a board on one row to give
      just that drawer a different finish.</p>
    ${edgingHTML(c, "drawer")}
    <p class="hint">Each box is edged in PVC in its own box material's colour —
      <b data-boxedge="1">—</b> for the default. It follows the box and is not
      chosen here.</p>`;
  refreshEdging();
  solveStack();
}

let solveSeq = 0;

async function solveStack() {
  const c = S.job.cabinets[S.sel];
  if (!c) return;
  const seq = ++solveSeq;
  const r = await post("/api/drawer-solve", {
    height: c.height,
    door_height: c.doors ? (c.door_height || 0) : 0,
    rows: c.drawers.map((d) => {
      const mode = d.mode || "fixed";
      return {mode: mode,
              value: mode === "share" ? (d.share === undefined ? 1 : d.share)
                                      : d.face_height};
    }),
  });
  if (seq !== solveSeq) return;          // a newer stack is already being solved
  if (!r.ok) { toast(r.error, true); return; }

  // What is ordered is still a list of heights: the engine's, written straight
  // in. Only a height that actually MOVED schedules another compute. It used to
  // schedule one every time, and since every compute re-renders the drawer table
  // and every render re-solves the stack, a drawer cabinet sitting untouched on
  // screen computed about three times a second for ever — rebuilding all 59
  // controls each time, and lighting the unsaved-changes marker on a job nobody
  // had edited.
  let moved = false;
  r.heights.forEach((h, i) => {
    if (c.drawers[i] && c.drawers[i].face_height !== h) {
      c.drawers[i].face_height = h;
      moved = true;
    }
  });
  document.querySelectorAll("#drawerbox [data-mm]").forEach((td) => {
    td.textContent = r.heights[+td.dataset.mm];
  });
  const tot = $("dtot");
  if (tot) {
    const over = r.left < 0 || r.heights.some((h) => h <= 0);
    tot.innerHTML =
      `<span>opening <b>${r.opening}</b></span>` +
      `<span>faces + gaps <b>${r.used}</b></span>` +
      `<span class="${over ? "over" : ""}">remainder <b>${r.left}</b></span>` +
      (over ? `<span class="over">the fixed faces over-run the opening —
               export is blocked until they fit</span>` : "");
  }
  if (moved) schedule();
}

async function applyPreset(which) {
  const c = S.job.cabinets[S.sel];
  if (!c.drawers.length) { toast("Add a face first.", true); return; }
  const r = await post("/api/drawer-preset", {count: c.drawers.length, preset: which});
  if (!r.ok) { toast(r.error, true); return; }
  c.drawers.forEach((d, i) => { d.mode = "share"; d.share = r.shares[i]; });
  renderDrawers();
}

/* ---------- supports -------------------------------------------------------
   A support is a cross rail spanning the internal width (W-32 x 100, code 04)
   that ties the two sides together. Rows, not a total with two subsets taken
   off it: the old model let edged + white exceed the total and the plain count
   went negative in silence. The total here is the sum of the rows, and nothing
   subtracts. A cabinet that predates the rows shows what its three numbers
   migrate to, which is what the engine resolved, not what the browser guessed. */

const SUPPORT_LABEL = {front: "Front-edged", white: "White-edged", none: "No edge"};

function renderSupports() {
  const box = slot($("supportbox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const edges = S.def.support_edges || ["none", "front", "white"];

  // With no rows of its own, show what the engine migrated the old numbers to.
  const own = c.support_rows && c.support_rows.length ? c.support_rows : null;
  const fromEngine = (g && g.supports) || [];
  const migrated = !own;

  // Every row carries what it RESOLVES to, so the three dropdowns can be built
  // without the browser working any of it out. A row that has been touched says
  // so by carrying `cut_board`, and is then read from its own fields — which is
  // what makes the controls correct immediately, before the next compute lands.
  // An untouched row is read from the engine's answer for it.
  const rows = (own || fromEngine).map((r, i) => {
    const e = fromEngine[i] || {};
    if (!own) return e;
    if (!r.cut_board) return Object.assign({}, e, {qty: r.qty});
    return {qty: r.qty, edge: r.edge, board: r.board, kind: r.kind,
            cut_board: r.cut_board,
            eff_cut_board: r.cut_board,
            eff_kind: r.kind || "",
            eff_board: r.board || r.cut_board,
            name: e.name, legacy: false};
  });


  const keys = (S.res && S.res.boards) || [];
  const allKinds = S.def.edging_kinds || ["pvc", "1mm", "2mm"];
  const pre = S.def.edging_prefix || {};

  // A row is edged in a board and one of the kinds THAT board offers on the
  // Boards tab — there is no edging name stated here. A row that still carries
  // only the old `edge` is shown at what it resolves to, and keeps it until it
  // is edited.
  // A support row asks two separate questions, and they used to be one: what the
  // rail is CUT FROM, and what colour its edging is. A single Board column meant
  // picking the white board to get a white edge also read as asking for a white
  // rail. Cut from defaults to the carcass board (what the engine has always
  // cut a support from); the edging colour defaults to the cut-from board's own.
  const cutCellFor = (r, i) => {
    const eff = r.eff_cut_board || c.carcass_board || "";
    const usable = keys.filter((k) => !boardIsThin(k));
    const lost = eff && usable.indexOf(eff) < 0;
    return `<td><select data-sup="${i}" data-sk="cut_board" title="what the rail is cut from">
      ${lost ? `<option value="${esc(eff)}" selected>${esc(eff)} (${
        keys.indexOf(eff) < 0 ? "not selected" : "3 mm"})</option>` : ""}
      ${usable.map((k) => `<option value="${esc(k)}"${k === eff ? " selected" : ""}>${
        esc(k)}</option>`).join("")}</select></td>`;
  };

  const kindCellFor = (r, i) => {
    const colour = r.eff_board || "";
    const kind = r.eff_kind || "";
    // only the kinds the COLOUR board offers, plus "not edged"
    const offered = allKinds.filter((k) => boardOffers(colour, k));
    const lost = kind && offered.indexOf(kind) < 0;
    return `<td><select data-sup="${i}" data-sk="kind" title="how thick, or none">
      <option value=""${kind ? "" : " selected"}>not edged</option>
      ${lost ? `<option value="${esc(kind)}" selected>${esc(pre[kind] || kind)} (not offered)</option>` : ""}
      ${offered.map((k) => `<option value="${esc(k)}"${k === kind ? " selected" : ""}>${
        esc(pre[k] || k)}</option>`).join("")}</select></td>`;
  };

  const colourCellFor = (r, i) => {
    const kind = r.eff_kind || "";
    const colour = r.eff_board || "";
    // only boards that offer the chosen kind; with no kind there is nothing to
    // constrain it, so the whole project is offered
    const usable = kind ? keys.filter((k) => boardOffers(k, kind)) : keys.slice();
    const lost = colour && usable.indexOf(colour) < 0;
    return `<td><select data-sup="${i}" data-sk="board" title="what colour the edging is"
      ${kind ? "" : "disabled"}>
      ${lost ? `<option value="${esc(colour)}" selected>${esc(colour)} (not offered)</option>` : ""}
      ${usable.map((k) => `<option value="${esc(k)}"${k === colour ? " selected" : ""}>${
        esc(k)}</option>`).join("")}</select></td>`;
  };

  const body = rows.map((r, i) => `<tr>
      <td class="n">${i + 1}</td>
      ${cutCellFor(r, i)}
      ${kindCellFor(r, i)}
      ${colourCellFor(r, i)}
      <td><input type="number" step="1" min="0" data-sup="${i}" data-sk="qty"
           value="${r.qty}"></td>
      <td class="note" data-suprow="${i}"></td>
      <td><button data-suprm="${i}" title="Remove this row">x</button></td>
    </tr>`).join("");

  const total = rows.reduce((a, r) => a + (r.qty || 0), 0);
  const anyLegacy = rows.some((r) => r.legacy);
  box.innerHTML = `<table class="rows">
    <colgroup><col style="width:16px"><col style="width:104px"><col style="width:74px">
      <col style="width:104px"><col style="width:38px"><col style="width:132px">
      <col style="width:22px"></colgroup>
    <thead><tr><th class="n">#</th><th>Cut from</th><th>Edging</th><th>Colour</th>
      <th>Qty</th><th>Ordered as</th><th></th>
    </tr></thead><tbody>${body ||
      `<tr><td colspan="7" class="note">No supports.</td></tr>`}</tbody></table>
    <div class="dtot"><span>total <b>${total}</b> support${total === 1 ? "" : "s"}</span>
      ${migrated ? `<span class="note">migrated from the old
        ${c.supports}/${c.edged_supports}/${c.white_supports} numbers — edit to keep
        it as rows</span>` : ""}</div>
    <div class="presets"><button id="supadd">+ Support row</button></div>
    <p class="hint">A support row says what the rail is <b>cut from</b> and, separately,
      what its edging is — a kind the colour board offers on the <b>Boards</b> tab, in
      any project board that offers it. Nothing here states an edging name.
      ${anyLegacy ? `A row marked <b>(as quoted)</b> was written before these controls:
      it is cut from the carcass board and edged exactly as that job was quoted —
      front-edged in the exterior board's colour, white-edged in the white board's.
      Changing it here makes it the cabinet's own.` : ""}</p>`;
  refreshSupports();
}


// "Ordered as" is the engine's answer for that row, and is only ever read back
// — never worked out here. It is its own function because `renderEditor` leaves
// the DOM alone when the selection has not changed (rebuilding it would take the
// caret out of the field being typed into), so after a compute the only things
// that update are the refresh* calls. Without this one the column kept whatever
// the PREVIOUS compute said, which is how a row showing board WHITEMEL and PVC
// still read "not edged".
function refreshSupports() {
  const c = S.sel !== null && S.job.cabinets[S.sel];
  if (!c) return;
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const rows = (g && g.supports) || [];
  const pre = S.def.edging_prefix || {};
  document.querySelectorAll("#editor [data-suprow]").forEach((td) => {
    const r = rows[+td.dataset.suprow];
    if (!r) { td.textContent = "…"; td.style.color = ""; return; }
    const eff = r.eff_board || "";
    const kind = r.eff_kind || "";
    const wanted = kind && eff && !boardOffers(eff, kind);
    td.textContent = r.name
      ? r.name + (r.legacy ? "  (as quoted)" : "")
      : wanted ? `${pre[kind] || kind} not offered by ${eff}`
      : "not edged";
    td.style.color = (!r.name && wanted) ? "var(--crit)" : "";
  });
}

// Any edit to the rows writes them out in full, so the migrated reading becomes
// the cabinet's own the first time it is touched. The legacy numbers are left
// exactly where they are; nothing reads them once rows exist.
function supportRows() {
  const c = S.job.cabinets[S.sel];
  if (!(c.support_rows && c.support_rows.length)) {
    const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
    // Touching a migrated cabinet writes its rows out at exactly what they were
    // resolving to — cut board, edging kind and edging colour — so the first
    // edit cannot silently move what the other rows are cut from or edged in.
    c.support_rows = ((g && g.supports) || []).map((r) => ({
      edge: r.edge, qty: r.qty,
      cut_board: r.eff_cut_board || "",
      board: r.eff_board || "", kind: r.eff_kind || ""}));
  }
  return c.support_rows;
}

/* ---------- boards, per section --------------------------------------------
   The boards are chosen once, in Structure: what shows, what the back is cut
   from, and what the box is cut from. Doors and Drawers may each take a board
   of their own, and default to Structure's when they do not.

   Edging is one control per section — a thickness and a colour — and the colour
   is a board, so the name is still generated from that board's token. A board
   name can never reach a real order as a tape (D6 / W10). The name shown beside
   the two dropdowns is always the engine's answer, never one built here.      */

// Whether a board is the 3 mm backing sheet. The answer is the engine's, carried
// on the material record — the browser does not decide what counts as thin.
function boardIsThin(key) {
  return !!(((S.res && S.res.materials) || {})[key] || {}).thin;
}

// A board the cabinet must name. Offers the project's boards and nothing else —
// the library is chosen from on the Boards tab.
//
// `want` filters by what the board physically can be: "thick" for anything built
// from a sheet (carcass, exterior, door leaf, drawer face, drawer box), "thin"
// for the backing. A stored value that fails the rule is never dropped — it is
// still shown, flagged, and the validator reports it.
function boardSel(c, key, label, hint, want) {
  const mats = (S.res && S.res.materials) || {};
  const all = (S.res && S.res.boards) || Object.keys(mats);
  const keys = !want ? all
    : all.filter((k) => want === "thin" ? boardIsThin(k) : !boardIsThin(k));
  const row = (k) => `<option value="${esc(k)}"${k === c[key] ? " selected" : ""}>${
    esc(k)} — ${esc((mats[k] || {}).board || k)}${
    (mats[k] || {}).thickness && mats[k].thickness !== 16
      ? " · " + mats[k].thickness + "mm" : ""}</option>`;
  const stored = c[key];
  const missing = keys.indexOf(stored) < 0;
  const why = !missing ? ""
    : all.indexOf(stored) < 0 ? " (not selected)"
    : want === "thin" ? " (not a 3 mm sheet)" : " (3 mm — too thin for this)";
  return `<div class="f wide">
      <label>${esc(label)}</label>
      <select data-k="${key}" data-t="text">${
        missing
          ? `<option value="${esc(stored)}" selected>${esc(stored || "—")}${why}</option>`
          : ""}${keys.map(row).join("")}${
        !keys.length && !missing
          ? `<option value="" selected>— no ${want === "thin" ? "3 mm" : "16 mm"} board in this project —</option>`
          : ""}</select>
      <span class="note">${esc(hint)}${missing && all.indexOf(stored) >= 0
        ? ` <b style="color:var(--crit)">Kept as stored; the validator reports it.</b>` : ""}</span></div>`;
}


// What a board in this project offers. The answer is the Boards record's, read
// back off /api/compute — the browser never decides what a board can be edged in.
function boardOffers(key, kind) {
  const m = ((S.res && S.res.materials) || {})[key] || {};
  const offered = m.edging_kinds || [];
  return offered.indexOf(kind) >= 0;
}

function anyBoardOffers(kind) {
  return ((S.res && S.res.boards) || []).some((k) => boardOffers(k, kind));
}

// One edging control: how thick, and what colour. 'which' is "door" or "drawer".
// Both dropdowns are filtered by the Boards tab: a kind no board offers is not
// listed, and the colour list holds only boards that offer the chosen kind. A
// stored choice that is no longer offered is never silently changed — it stays
// shown, flagged, and the validator blocks the export.
function edgingHTML(c, which, opts) {
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const e = (g && g.edging && g.edging[which]) || {};
  const mats = (S.res && S.res.materials) || {};
  const keys = (S.res && S.res.boards) || [];
  const all = (opts && opts.kinds) || S.def.exterior_tapes || ["1mm", "2mm"];
  const kind = c[which + "_edge_kind"] || e.kind || "2mm";
  const board = c[which + "_edge_board"] || e.board || c.exterior_board;
  const override = g && g.edge_override;
  const pre = S.def.edging_prefix || {};

  // Nothing in the project can be edged at all: say what to do, rather than
  // offering two dropdowns that cannot produce a name.
  if (!all.some(anyBoardOffers)) {
    return `<div class="tape"><label>Edging</label>
      <span class="note">No board in this project has edging — tick
      <b>Has Edging</b> on a board in the Boards tab.</span></div>`;
  }

  const kinds = all.filter(anyBoardOffers);
  const kindLost = kinds.indexOf(kind) < 0;
  const colourKeys = keys.filter((k) => boardOffers(k, kind));
  const boardLost = colourKeys.indexOf(board) < 0;

  return `<div class="tape">
      <label>Edging</label>
      <div class="leaf">
        <select data-edge="${which}" data-ek="kind" title="how thick">${
          kindLost ? `<option value="${esc(kind)}" selected>${esc(kind)} (not offered)</option>` : ""
          }${kinds.map((k) =>
          `<option value="${esc(k)}"${k === kind ? " selected" : ""}>${esc(k)}</option>`
          ).join("")}</select>
        <select data-edge="${which}" data-ek="board" title="what colour">${
          boardLost ? `<option value="${esc(board)}" selected>${esc(board || "—")} (not offered)</option>` : ""
          }${colourKeys.map((k) =>
          `<option value="${esc(k)}"${k === board ? " selected" : ""}>${esc(k)} — ${
            esc((mats[k] || {}).board || k)}</option>`).join("")}</select>
        <b data-edgename="${which}" class="${e.name ? "" : (kindLost || boardLost ? "over" : "off")}">${
          esc(e.name || (kindLost || boardLost
            ? `${pre[kind] || kind} not offered by ${board || "that board"}`
            : "no edging"))}</b>
      </div>
      ${(kindLost || boardLost) ? `<span class="note" style="color:var(--crit)">
        This cabinet still asks for an edging its board no longer offers. It is kept
        exactly as it was stored — tick it on the board in the Boards tab, or choose
        another here. The export is blocked until one of those is done.</span>` : ""}
      ${override ? `<span class="note">This job file names the edging outright as
        <b>${esc(override)}</b>, and that still wins over the two choices above.
        <button data-clearedge="1">Clear it</button></span>` : ""}
    </div>`;
}

/* ---------- Panel design ---------------------------------------------------
   An independent panel: one part, cut and numbered on its own, not part of any
   cupboard. What is typed here is a board, which way up the panel stands, its
   two FINISHED extents and its edging; everything else about it - which extent
   becomes the cut list's Length, whether the grain locks it, what the edging is
   called - is the engine's answer, read back. The preview line at the bottom is
   engine.panel_of's own, not one assembled here.                            */

// The empty record, exactly as cabinetgen.model.PanelSpec defaults it. The
// server makes one too, on the next compute; this is only so the controls have
// something to write into before that lands.
function blankPanel() {
  return {board: "", orientation: "upright", a: 0, b: 0, grain_along: "b",
          edge_kind: "", edge_board: "", edge_long: 0, edge_short: 0};
}

function panelOf(c) {
  if (!c.panel) c.panel = blankPanel();
  return c.panel;
}

// A small picture of the panel standing the way the option means, against a
// stretch of wall. Drawn rather than described because "upright, side-on" is
// two words that mean nothing until you see it.
const ORIENT_ICON = {
  upright: `<svg viewBox="0 0 34 26" width="34" height="26" aria-hidden="true">
      <path d="M2 4 H32" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
      <rect x="8" y="6" width="18" height="16" fill="currentColor" opacity=".8"/>
    </svg>`,
  flat: `<svg viewBox="0 0 34 26" width="34" height="26" aria-hidden="true">
      <path d="M2 4 H32" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
      <rect x="8" y="12" width="18" height="4" fill="currentColor" opacity=".8"/>
    </svg>`,
  end: `<svg viewBox="0 0 34 26" width="34" height="26" aria-hidden="true">
      <path d="M2 4 H32" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
      <rect x="15" y="6" width="4" height="16" fill="currentColor" opacity=".8"/>
    </svg>`,
};

function renderPanel() {
  const box = slot($("panelbox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const info = (g && g.panel) || null;
  const p = panelOf(c);
  const keys = (S.res && S.res.boards) || [];
  const mats = (S.res && S.res.materials) || {};
  const orients = S.def.panel_orientations || [];
  const here = orients.find((o) => o.key === p.orientation) || orients[0] || {};
  const allKinds = S.def.edging_kinds || ["pvc", "1mm", "2mm"];
  const pre = S.def.edging_prefix || {};

  if (!keys.length) {
    box.innerHTML = `<p class="off">This project has no boards yet. Tick one into
      it on the <b>Boards</b> tab before choosing what this panel is cut from.</p>`;
    return;
  }

  // A panel may be any thickness - a 3 mm back panel cut to size is a perfectly
  // good panel - so unlike every carcass dropdown this one filters nothing.
  const lost = p.board && keys.indexOf(p.board) < 0;
  const boardSelHTML = `<div class="f wide"><label>Board</label>
      <select data-pk="board">
        <option value=""${p.board ? "" : " selected"}>— pick a board —</option>
        ${lost ? `<option value="${esc(p.board)}" selected>${esc(p.board)} (not selected)</option>` : ""}
        ${keys.map((k) => `<option value="${esc(k)}"${k === p.board ? " selected" : ""}>${
          esc(k)} — ${esc((mats[k] || {}).board || k)}${
          (mats[k] || {}).thickness ? " · " + mats[k].thickness + "mm" : ""}</option>`).join("")}
      </select>
      <span class="note">any thickness — a panel is one board, not a carcass</span></div>`;

  const orientHTML = `<div class="f wide"><label>Orientation</label>
      <div class="orients">${orients.map((o) => `<label class="orient${
        o.key === p.orientation ? " on" : ""}" title="${esc(o.hint)}">
        <input type="radio" name="porient" data-pk="orientation" data-po="${esc(o.key)}"
               value="${esc(o.key)}"${o.key === p.orientation ? " checked" : ""}>
        ${ORIENT_ICON[o.key] || ""}<span>${esc(o.name)}</span></label>`).join("")}</div>
      <span class="note">${esc(here.hint || "")}</span></div>`;

  const grained = !!((mats[p.board] || {}).grain === "grain");
  const grainHTML = grained
    ? `<div class="f wide"><label>Grain runs along</label>
         <select data-pk="grain_along">
           <option value="a"${p.grain_along === "a" ? " selected" : ""}>${
             esc(here.a || "a")}</option>
           <option value="b"${p.grain_along === "a" ? "" : " selected"}>${
             esc(here.b || "b")}</option>
         </select>
         <span class="note">The cut list's <b>Length</b> IS the grain direction, so
           this is what decides which size is the length — and the panel is locked,
           the nester cannot turn it.</span></div>`
    : `<div class="f wide"><label>Grain runs along</label>
         <p class="off">${p.board
           ? esc(p.board) + " is a plain board — it has no direction, so the nester is free to turn this panel."
           : "Pick a board first."}</p></div>`;

  // Edging: the kinds THIS board offers, and a colour from the boards that
  // offer the chosen kind. Nothing here states an edging name.
  const offered = allKinds.filter((k) => boardOffers(p.board, k));
  const colour = p.edge_board || p.board;
  const kindLost = p.edge_kind && offered.indexOf(p.edge_kind) < 0;
  const colourKeys = p.edge_kind ? keys.filter((k) => boardOffers(k, p.edge_kind)) : keys.slice();
  const colourLost = p.edge_kind && colour && colourKeys.indexOf(colour) < 0;
  const bandSel = (which, v) => `<select data-pk="edge_${which}">${
    [0, 1, 2].map((n) => `<option value="${n}"${n === (+v || 0) ? " selected" : ""}>${n}</option>`).join("")
    }</select>`;

  const edgeHTML = (!offered.length && !p.edge_kind)
    ? `<div class="tape"><label>Edging</label><span class="note">${p.board
        ? "<b>" + esc(p.board) + "</b> has no edging on the Boards tab, so there is none to put on this panel."
        : "Pick a board first."}</span></div>`
    : `<div class="tape">
        <label>Edging</label>
        <div class="leaf">
          <select data-pk="edge_kind" title="how thick, or none">
            <option value=""${p.edge_kind ? "" : " selected"}>not edged</option>
            ${kindLost ? `<option value="${esc(p.edge_kind)}" selected>${
              esc(pre[p.edge_kind] || p.edge_kind)} (not offered)</option>` : ""}
            ${offered.map((k) => `<option value="${esc(k)}"${
              k === p.edge_kind ? " selected" : ""}>${esc(pre[k] || k)}</option>`).join("")}
          </select>
          <select data-pk="edge_board" title="what colour" ${p.edge_kind ? "" : "disabled"}>
            <option value=""${p.edge_board ? "" : " selected"}>(${esc(p.board || "—")})</option>
            ${colourLost ? `<option value="${esc(colour)}" selected>${
              esc(colour)} (not offered)</option>` : ""}
            ${colourKeys.map((k) => `<option value="${esc(k)}"${
              k === p.edge_board ? " selected" : ""}>${esc(k)}</option>`).join("")}
          </select>
          <b data-paneledge="1" class="${(info && info.line.edge_material) ? "" : "off"}">${
            esc((info && info.line.edge_material) || "no edging")}</b>
        </div>
        <div class="grid">
          <div class="f"><label>Long edges banded</label>${bandSel("long", p.edge_long)}
            <span class="note">the two longer edges</span></div>
          <div class="f"><label>Short edges banded</label>${bandSel("short", p.edge_short)}
            <span class="note">the two shorter edges</span></div>
        </div>
        ${(kindLost || colourLost) ? `<span class="note" style="color:var(--crit)">
          This panel asks for an edging its board does not offer. It is kept exactly
          as stored — tick that kind on the board in the Boards tab, or choose another
          here. The export is blocked until one of those is done.</span>` : ""}
      </div>`;

  // The cut-list line, as the engine makes it. Not assembled here.
  const line = info && info.line;
  const banded = [];
  if (line && line.edge_material) {
    if (+p.edge_long) banded.push(`${p.edge_long} long`);
    if (+p.edge_short) banded.push(`${p.edge_short} short`);
  }
  const preview = !line ? "…"
    : [`<b>${esc(line.label)}</b>`,
       esc(line.material || "no board"),
       `${line.length} × ${line.width}`,
       line.grain
         ? `grain along the ${esc(info.length_is === "a"
             ? (here.a_short || "a") : (here.b_short || "b"))}, locked`
         : "no grain — free to turn",
       line.edge_material
         ? `${esc(line.edge_material)} on ${banded.join(" + ")} edge${
             (+p.edge_long + +p.edge_short) === 1 ? "" : "s"}`
         : "no edging",
      ].join("  ·  ");

  box.innerHTML = `<div class="grid">
      ${boardSelHTML}
      ${orientHTML}
      <div class="f"><label>${esc(here.a || "Size a")}</label>
        <input type="number" step="1" min="0" data-pk="a" value="${+p.a || 0}"></div>
      <div class="f"><label>${esc(here.b || "Size b")}</label>
        <input type="number" step="1" min="0" data-pk="b" value="${+p.b || 0}"></div>
      ${grainHTML}
    </div>
    ${edgeHTML}
    <p class="hint">Cut list line: <span class="mono" data-panelline="1">${preview}</span></p>
    <div class="presets"><button id="paneldup">Duplicate this panel</button></div>
    <p class="hint">A bulkhead is several panels — a front, an underside and an end
      cap each side. <b>Duplicate</b> gives the next free number and copies everything
      but the placement, so the set can be typed once and adjusted.</p>`;
}

/* ---------- Structure ------------------------------------------------------
   What the cabinet is cut from, how the back is fixed, and what is inside it.
   The three boards come first because nothing else can be decided until they
   are. Dividers are in the app but not working — they are shown greyed and
   told so, rather than quietly doing nothing.                               */

function renderStructure() {
  const box = slot($("structurebox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const keys = (S.res && S.res.boards) || [];
  if (!keys.length) {
    box.innerHTML = `<p class="off">This project has no boards yet. Tick one into
      it on the <b>Boards</b> tab before choosing what this cabinet is cut from.</p>`;
    return;
  }
  // A mitre or an ell is a different construction, not a box with a different
  // outline. Its back IS its two melamine wall panels, so there is no 3 mm
  // backing board and nothing to groove it into; and its shelves are the two
  // kinds in the Corner Unit section, because its interior is not a rectangle
  // and a straight shelf size would be wrong in the unsafe direction. A BLIND
  // corner is a straight box and none of this applies to it.
  const shaped = cornerShaped(c);
  // The back board is only cut when there is a back, or a drawer on a grooved
  // 3 mm base. Nothing on this cabinet uses it otherwise, so it is not asked for.
  const usesBack = !shaped && (c.back !== "none" ||
    (tickOn(c, "has_drawers") && (c.drawers || []).some((d) => d.base === "board")));
  const backs = S.def.backs || ["four", "three", "none"];
  const std = S.def.standard || {};

  box.innerHTML = `<div class="grid">
      ${boardSel(c, "exterior_board", "Exterior board",
                 "doors, drawer faces and anything else that shows", "thick")}
      ${usesBack
        ? boardSel(c, "back_board", "Backing board",
                   "the back panel, and a drawer base grooved out of the same sheet",
                   "thin")
        : `<div class="f wide"><label>Backing board</label>
             <p class="off">Nothing on this cabinet is cut from it — no back, and no
             drawer on a grooved base.</p></div>`}
      ${boardSel(c, "carcass_board", "Carcass board",
                 "sides, top, bottom, supports and shelves", "thick")}
      ${shaped
        ? `<div class="f wide"><label>Back fixing</label>
             <p class="off">A corner unit's back is its two melamine wall panels,
             one wrapping the other. There is no 3 mm backing board and nothing to
             groove it into, so this is not asked. What is in the job file stays
             there.</p></div>`
        : `<div class="f wide"><label>Back fixing</label>
        <select data-k="back" data-t="sel:backs">${backs.map((b) =>
          `<option value="${esc(b)}"${b === c.back ? " selected" : ""}>${
            esc(BACK_LABEL[b] || b)}</option>`).join("")}</select>
        <span class="note">what the backing board is grooved into, and whether one
        is cut at all</span></div>`}
      ${shaped
        ? `<div class="f wide"><label>Shelves</label>
             <p class="off">A corner unit's shelves are the arm shelf and the mitred
             shelf, both in <b>Corner Unit</b> below — its inside is not a rectangle,
             so a straight shelf size would not fit it.</p></div>`
        : `<div class="f"><label>Shelves</label>
        <input type="number" step="1" min="0" data-k="shelves" data-t="int"
               value="${c.shelves || 0}">
        <span class="note">Adjustable — they sit on shelf pegs and can be moved up
        or down. Cut ${std.shelf_gap_adjustable} mm clear of the back so they
        lift out.</span></div>
      <div class="f"><label>Fixed shelves</label>
        <input type="number" step="1" min="0" data-k="fixed_shelves" data-t="int"
               value="${c.fixed_shelves || 0}">
        <span class="note">Permanently fixed in place — they do not move. Cut
        ${std.shelf_gap_fixed} mm clear of the back, so a little deeper.</span></div>`}
      ${unavailableField("Shelf width", c.shelf_width,
        "Greyed out: a shelf width only means something once a divider splits " +
        "the inside into bays, and dividers are not available yet.")}
      ${unavailableField("Dividers", c.divider_count,
        "a divider cannot be positioned yet")}
      ${unavailableField("Divider height", c.divider_height,
        "a divider cannot be positioned yet")}
    </div>`;
}

// The edging names in force are the engine's answer, so they are re-read rather
// than recomputed whenever a compute comes back for the cabinet on screen.
function refreshEdging() {
  const c = S.sel !== null && S.job.cabinets[S.sel];
  const g = c && S.res && S.res.geometry && S.res.geometry[String(c.number)];
  if (!g || !g.edging) return;
  // "no edging" is grey and is not a fault — it is what a board with Has Edging
  // off is supposed to say. Red is kept for a kind the board does not offer,
  // which the validator is blocking the export over.
  const c2 = c || {};
  document.querySelectorAll("#editor [data-edgename]").forEach((b) => {
    const which = b.dataset.edgename;
    const e = g.edging[which] || {};
    if (e.name) { b.textContent = e.name; b.className = ""; return; }
    const kind = c2[which + "_edge_kind"] || e.kind || "";
    const board = c2[which + "_edge_board"] || e.board || c2.exterior_board || "";
    const wanted = kind && board && !boardOffers(board, kind);
    b.textContent = wanted
      ? `${(S.def.edging_prefix || {})[kind] || kind} not offered by ${board}`
      : "no edging";
    b.className = wanted ? "over" : "off";
  });
  const boxEdge = document.querySelector("#editor [data-boxedge]");
  if (boxEdge) boxEdge.textContent = (g.edging.drawer_box || {}).name || "no edging";
}

/* ---------- the board library ----------------------------------------------
   boards.json lives in the repo, so both machines see the same boards. It is a
   library, not a job: a project selects from it, and selecting copies the
   record into the job. That copy is the price capture — editing a board here
   changes what the next job is quoted at and never what an existing one was.

   Edging names are generated from one token per board, for all three
   thicknesses. The token is its own field rather than the board's name because
   edging names are decided per order, and a long board description should not
   reach a real order as an edging name. */

S.lib = null;          // the library as /api/boards last returned it
S.libEdit = null;      // the board being edited, or null
S.libSwap = null;      // the swap being set up, or null — the two share the panel

const GRAIN_LABEL = {grain: "Grain", plain: "Plain"};

async function renderBoardsTab() {
  const r = await post("/api/boards", {});

  S.lib = r;
  drawBoards();
}

function drawBoards() {
  const r = S.lib;

  const rows = r.boards.map((b) => {

    </tr></thead><tbody>${rows ||
      `<tr><td colspan="9" class="empty">The library is empty. Add a board.</td></tr>`
    }</tbody></table></div>
    ${bad}
    <p class="note" style="padding:8px 12px 12px;max-width:86ch">
      The library is <b>${esc(S.lib.path)}</b> in the repo, so it syncs with the code.

  drawBoardPanel();

      ? "no colour set — drawn neutral, and the legend says so"

  };
  ["bf-tape", "bf-name"].forEach((id) => $(id).addEventListener("input", refreshEdgingForm));
  $("bf-hasedging").addEventListener("change", refreshEdgingForm);
  kindBoxes().forEach((x) => x.addEventListener("change", refreshEdgingForm));
  $("bf-colour").addEventListener("input", refreshColour);
  $("bf-colourpick").addEventListener("input", () => {
    $("bf-colour").value = $("bf-colourpick").value;
    refreshColour();
  });
  $("bf-colourclear").addEventListener("click", () => {
    $("bf-colour").value = "";
    refreshColour();
  });
  wirePicture();
  refreshEdgingForm();
  refreshColour();
}

/* The board picture. Two ways in and one answer: whichever is used, the SERVER
   copies the file into Pictures/ and hands back the relative path to store, so
   nothing machine-specific reaches boards.json — which is shared through git.

   Browse… is pywebview's native Open dialog, opened by /api/pick-picture on the
   desktop window. There is no window under --no-window or in the browser, so
   that reply says `no_window` and the hidden file input takes over; both arrive
   at /api/drop-picture, which is also where a drop lands. A drop gives us the
   file's CONTENTS and no path — WebView2 does not expose File.path and
   pywebview 6.2.1 has no file-drop event — so the bytes are what is sent.     */
/* Board pictures are supplied with the grain running VERTICALLY (ruled 22 Sept
   2026): that is what lets a drawing turn the tile onto each panel's length
   direction through 0 or 90 degrees rather than working an angle out of a
   photograph. checkGrain is what says so as a picture arrives.

   The SAMPLING is here and the VERDICT is not. Decoding a JPEG is the one thing
   the browser can do that the app cannot — it has a decoder and the app has no
   third-party dependency — so it draws the picture into a small canvas, which
   area-averages it, and sends the luminance up. /api/picture-grain reaches the
   answer, through cabinetgen.pictures, so there is one answer to the question.
   Nothing here decides anything.

   It WARNS and never blocks: the picture is already in Pictures/ by this point
   and stays there, which is the app's bargain everywhere but a critical.       */
const GRAIN_GRID = 64;

async function checkGrain(url, note) {
  let grid;
  try {
    const img = new Image();
    img.crossOrigin = "anonymous";
    await new Promise((ok, bad) => {
      img.onload = ok;
      img.onerror = () => bad(new Error("the picture would not load"));
      img.src = url;
    });
    const cv = document.createElement("canvas");
    cv.width = cv.height = GRAIN_GRID;
    const cx = cv.getContext("2d", {willReadFrequently: true});
    // drawImage onto a small canvas area-averages, which is what makes the
    // measurement steady: point-sampling a 1135-wide photo aliases the grain
    // away and the direction stops being readable at all.
    cx.drawImage(img, 0, 0, GRAIN_GRID, GRAIN_GRID);
    const px = cx.getImageData(0, 0, GRAIN_GRID, GRAIN_GRID).data;
    grid = [];
    for (let y = 0; y < GRAIN_GRID; y++) {
      const row = [];
      for (let x = 0; x < GRAIN_GRID; x++) {
        const o = (y * GRAIN_GRID + x) * 4;
        row.push(0.2126 * px[o] + 0.7152 * px[o + 1] + 0.0722 * px[o + 2]);
      }
      grid.push(row);
    }
  } catch (e) {
    return;                       // nothing to say: it is an advisory, not a gate
  }
  const r = await post("/api/picture-grain", {grid: grid});
  const v = r && r.grain;
  if (!v || !v.checked || v.ok) return;   // vertical, or no texture to have a way
  toast(v.message, true);
  if (note) {
    note.insertAdjacentHTML("beforeend",
      ' <b class="bad">' + esc(v.message) + "</b>");
  }
}

function wirePicture() {
  const drop = $("bf-drop"), field = $("bf-picture"), note = $("bf-picnote");
  if (!drop || !field) return;

  const settle = (r) => {
    if (!r || !r.ok) {
      if (r && r.cancelled) return;              // closing the dialog is not a fault
      toast((r && r.error) || "the picture could not be read", true);
      return;
    }
    field.value = r.picture;
    S.libEdit.picture = r.picture;
    S.libEdit.picture_url = r.url;
    S.libEdit.picture_ok = true;
    const old = $("bf-picpreview");
    const img = document.createElement("img");
    img.id = "bf-picpreview";
    img.className = "picpreview";
    img.alt = "";
    img.src = r.url + (r.url.indexOf("data:") === 0 ? "" : "?t=" + Date.now());
    old.replaceWith(img);
    drop.classList.remove("empty");
    note.textContent = "copied into " + ((S.def && S.def.pictures_dir) || "Pictures") +
      "/ as " + r.name + " — stored relative to the project, so it works on " +
      "both machines. Save the board to keep it.";
    // Both ways in end here, so the grain is asked about once, whichever it was.
    checkGrain(img.src, note);
  };

  const sendBytes = (file) => {
    const fr = new FileReader();
    fr.onload = async () => {
      settle(await post("/api/drop-picture",
                        {name: file.name, data: String(fr.result)}));
    };
    fr.onerror = () => toast("that file could not be read", true);
    fr.readAsDataURL(file);
  };

  $("bf-picbrowse").addEventListener("click", async () => {
    const r = await post("/api/pick-picture", {});
    if (r && r.no_window) { $("bf-picfile").click(); return; }
    settle(r);
  });
  $("bf-picfile").addEventListener("change", (e) => {
    if (e.target.files && e.target.files[0]) sendBytes(e.target.files[0]);
    e.target.value = "";                      // so the same file can be picked twice
  });
  $("bf-picclear").addEventListener("click", () => {
    field.value = "";
    S.libEdit.picture = "";
    S.libEdit.picture_url = "";
    S.libEdit.picture_ok = false;
    const span = document.createElement("span");
    span.id = "bf-picpreview";
    span.className = "picpreview none";
    $("bf-picpreview").replaceWith(span);
    drop.classList.add("empty");
    note.textContent = "no picture. Save the board to keep it that way.";
  });

  // The drop itself. dragover has to be prevented or the page navigates to the
  // file instead of handing it over, which is the browser default.
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => {
    e.preventDefault();
    e.stopPropagation();
    drop.classList.add("over");
  }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => {
    e.preventDefault();
    e.stopPropagation();
    drop.classList.remove("over");
  }));
  drop.addEventListener("drop", (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) sendBytes(f);
    else toast("nothing to take from that drop — drop an image file", true);
  });
}

function drawSwapPicker() {
  const box = $("boardedit");
  const sw = S.libSwap;
  if (!box || !sw) return;
  const others = (S.lib.boards || []).filter((b) => b.id !== sw.from);
  if (!others.length) {
    box.innerHTML = `<div class="card" style="margin:12px"><div class="body">
      <p class="note">The library has no other board to swap to.</p>
      <div class="presets"><button id="sw-cancel">Close</button></div></div></div>`;
    return;
  }
  box.innerHTML = `<div class="card" style="margin:12px">
    <h2>Swap ${esc(sw.from)} across this project</h2>
    <div class="body">
      <div class="f wide"><label>Swap it for</label>
        <div class="leaf">
          <span class="swatch${others.find((b) => b.id === sw.to) &&
            others.find((b) => b.id === sw.to).colour ? "" : " none"}" id="sw-swatch"
            style="${(others.find((b) => b.id === sw.to) || {}).colour
              ? "background:" + esc((others.find((b) => b.id === sw.to) || {}).colour)
              : ""}"></span>
          <select id="sw-to">${others.map((b) =>
            `<option value="${esc(b.id)}"${b.id === sw.to ? " selected" : ""}>${
              esc(b.id)} — ${esc(b.name)}${b.colour ? "" : " (no colour set)"}</option>`
            ).join("")}</select>
        </div></div>
      <div class="presets">
        <button id="sw-go" class="primary" data-from="${esc(sw.from)}">Show me what changes</button>
        <button id="sw-cancel">Cancel</button>
      </div>
      <p class="note" style="margin-top:8px;max-width:78ch">
        Nothing is written until the change has been shown: which cabinets, which
        panels, and what it does to the board count and the cost. No designation
        changes — a panel keeps its name and changes what it is cut from.</p>
    </div></div>`;
