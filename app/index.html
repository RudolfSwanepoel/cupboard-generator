             value="${v === null || v === undefined ? "" : v}"
             ${type === "opt" ? 'placeholder="auto"' : ""}>`;
  }
  return `<div class="f${type === "poly" ? " wide" : ""}"><label>${esc(label)}</label>${input}</div>`;
}

function sectionHTML(c, sec) {
  // A section this corner type does not have at all. Its tickbox goes with it:
  // offering "Has drawers" on a mitre would be offering a choice that is not
  // one. Nothing is emptied, exactly as an unticked section is not emptied.
  const gone = cornerOff(c, sec.key);
  const on = sec.toggle ? tickOn(c, sec.toggle) : true;
  const tick = sec.toggle && !gone
    ? `<label class="tick"><input type="checkbox" data-tick="${sec.toggle}"
         ${on ? "checked" : ""}>${esc(sec.tick)}</label>` : "";
  const hint = sec.hint && !gone ? `<p class="hint">${esc(sec.hint)}</p>` : "";
  let body;
  if (gone) {
    body = `<p class="off">${esc(gone)} Whatever is in the job file stays there,
            so changing the corner type back brings it all with it.</p>`;
  } else if (sec.toggle && !on) {
    body = `<p class="off">Off — nothing is built from it. What you typed stays in
            the job file, so ticking it back brings it all with it.</p>`;
  } else {
    body = (sec.fields.length
            ? `<div class="grid">${sec.fields.map((f) => fieldHTML(c, f, sec)).join("")}</div>`
            : "") + (sec.slot ? `<div id="${sec.slot}" data-slot="1"></div>` : "");
  }
  return `<div class="sec s-${sec.key}"><h3>${esc(sec.name)}${tick}</h3>${hint}${body}</div>`;
}

// The engine's reading of the selected cabinet — off its panels, not its labels.
function refreshGeometryReadout() {
  const el = $("geomreadout");
  const c = S.sel !== null && S.job.cabinets[S.sel];
  if (!c || !S.res || !S.res.geometry) return;
  const g = S.res.geometry[String(c.number)];
  refreshCornerReadout(c, g);
  if (!el) return;
  if (!g) { el.textContent = ""; return; }
  if (cornerBroken(c)) {
    el.textContent = "No shape yet \u2014 finish the Corner Unit measurements above.";
    return;
  }
  const how = g.source === "corner"
      ? "corner unit, derived from its arm/face measurements" +
        (g.mitre_deg !== null ? `; mitre ${g.mitre_deg}°` : "") +
        `; front face${g.face_lengths.length > 1 ? "s" : ""} ${g.face_lengths.join(" + ")} mm` +
        (g.doors.length ? `, door${g.doors.length > 1 ? "s" : ""} ${g.doors.join(" + ")}` : "")
    : g.source === "outline" ? `outline as entered, ${g.points} points`
    : g.source === "panels" ? "rectangle its panels make"
    : "declared width — its panels give none";
  el.textContent = `Checks use ${g.width} × ${g.depth}, ${g.height} high (${how}).`;
}

// What this corner unit actually comes out as. Every figure is the engine's,
// read back off /api/compute - the browser adds nothing to it but the words.
function refreshCornerReadout(c, g) {
  const el = $("cornerreadout");
  if (!el) return;
  const k = g && g.corner;
  if (!k || !k.kind) { el.textContent = ""; return; }
  if (k.problems && Object.keys(k.problems).length) {
    el.innerHTML = `<span class="cfix">Fix the field${
      Object.keys(k.problems).length > 1 ? "s" : ""} marked in red above.</span>
      Until the measurements make a shape, this unit is not drawn and nothing is cut for it.`;
    return;
  }
  if (k.kind === "mitre") {
    const parts = [`Cuts ${g.width} \u00d7 ${g.depth}, ${g.height} high`];
    if (k.mitred_shelves || k.arm_shelves) {
      parts[0] += `, blank ${k.blank ? k.blank.join(" \u00d7 ") : "\u2014"}`;
    }
    if (g.mitre_deg !== null && g.mitre_deg !== undefined) {
      parts.push(`mitre ${g.mitre_deg}\u00b0`);
    }
    if (g.face_lengths && g.face_lengths.length) {
      parts.push(`front face ${g.face_lengths.join(" + ")} mm`);
    }
    if (k.inner_span) {
      parts.push(`door cut to the ${k.inner_span} mm inner span \u2192 ${k.door_width} mm`);
    }
    el.textContent = parts.join("; ") + ".";
  } else if (k.kind === "ell") {
    el.textContent = g.face_lengths && g.face_lengths.length
      ? `Cuts ${g.width} \u00d7 ${g.depth}, ${g.height} high; front faces ` +
        `${g.face_lengths.join(" + ")} mm. Shape only \u2014 an ell cuts no panels yet.`
      : "Shape only \u2014 an ell cuts no panels yet.";
  } else if (k.kind === "blind") {
    el.textContent = k.opening === null || k.opening === undefined
      ? `W ${c.width}, and no blind panel width yet.`
      : `W ${c.width}, blind ${k.blind_width} \u2192 opening ${k.opening}, ` +
        `door ${k.door_width}` +
        (k.blind_height ? `; blind panel ${k.blind_height} \u00d7 ${k.blind_width}` +
          (k.blind_edge_name ? `, one edge in ${k.blind_edge_name}` : "") : "") + ".";
  } else {
    el.textContent = "";
  }
}

/* ---------- painting, instead of rebuilding ---------------------------------
   The editor has to be rebuilt from the job on every compute, or a dropdown
   keeps the options the library had when its section was last built — that is
   how "Ordered as" went stale, and it was never only that one.

   But rebuilding it with innerHTML threw away 49 of the editor's 59 controls on
   every compute. A native dropdown belongs to the DOM node it was opened on, so
   replacing that node closes it; the caret, the hover and the scroll go with it.
   Measured on Test.json cabinet 4: every control in Structure, Drawers and
   Supports was a new object after each compute, and the focused <select> was no
   longer in the document at all.

   So the new HTML is still built in full, and then APPLIED to the DOM that is
   already there. A node that has not changed is left exactly as it is; a value
   that has changed is written into the control in place; only a control that has
   genuinely changed shape — or gone — is replaced. Two rules make that safe:

   - A focused control is never touched: not its options, not its value. Focus
     is what an open dropdown is, and it is also what is being typed into. It
     catches up the moment focus leaves it (the focusout listener below).
   - A slot div belongs to its own render function. sectionHTML emits it empty,
     and wiping what renderStructure and the rest put there would defeat the lot.

   Nothing in the editor attaches a listener to a control — they are all
   delegated on #editor — so reusing a node cannot stack a second handler on it. */

const VALUE_TAGS = {INPUT: 1, SELECT: 1, TEXTAREA: 1};

function paint(box, html) {
  if (!box) return;
  if (!box.firstChild) { box.innerHTML = html; return; }
  const next = document.createElement("div");
  next.innerHTML = html;
  morphChildren(box, next);
}

function morphChildren(dst, src) {
  const want = src.childNodes;
  for (let i = 0; i < want.length; i++) {
    const b = want[i];
    const a = dst.childNodes[i];
    if (!a) { dst.appendChild(document.importNode(b, true)); continue; }
    if (!alike(a, b)) { dst.replaceChild(document.importNode(b, true), a); continue; }
    morphNode(a, b);
  }
  while (dst.childNodes.length > want.length) dst.removeChild(dst.lastChild);
}

// Two nodes are the same thing when they are the same sort of node in the same
// place. A control is told apart by what NAMES it as well, so a rebuild that
// reorders rows replaces the control rather than quietly re-pointing it at
// another row — a drawer's board landing on the wrong drawer would be a wrong
// cut list, which is worse than a flicker.
function alike(a, b) {
  if (a.nodeType !== b.nodeType) return false;
  if (a.nodeType !== 1) return true;
  if (a.tagName !== b.tagName) return false;
  if ((a.id || "") !== (b.id || "")) return false;
  // Two DIVs of different kinds — the issue list and the editor body, one
  // section and another's slot — are not the same thing, so one is never
  // morphed into the other (that is what threw the dock's scroll away).
  if (a.tagName === "DIV" && (a.classList[0] || "") !== (b.classList[0] || "")) return false;
  if (!VALUE_TAGS[a.tagName]) return true;
  return controlKey(a) === controlKey(b);
}

function controlKey(el) {
  const d = el.dataset || {};
  return ["sup", "sk", "d", "dk", "k", "dboard", "edge", "ek", "leaf", "tick",
          "t", "pk", "po", "dsec", "dtype", "dcount", "runner"]
    .map((a) => (d[a] === undefined ? "" : d[a])).concat(el.type || "").join("|");
}

function morphNode(a, b) {
  if (a.nodeType !== 1) {
    if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
    return;
  }
  // open, or being typed into. Only a control with a VALUE: a focused button
  // (the one just clicked — differs…, a lock, Auto) still takes its new label.
  if (a === document.activeElement && VALUE_TAGS[a.tagName]) return;
  syncAttrs(a, b);
  if (a.dataset.slot !== undefined) return;      // its render function owns it
  if (a.tagName === "SELECT") { morphSelect(a, b); return; }
  morphChildren(a, b);
  if (a.tagName === "INPUT" || a.tagName === "TEXTAREA") morphValue(a, b);
}

function syncAttrs(a, b) {
  for (let i = a.attributes.length - 1; i >= 0; i--) {
    const n = a.attributes[i].name;
    if (!b.hasAttribute(n)) a.removeAttribute(n);
  }
  for (let i = 0; i < b.attributes.length; i++) {
    const at = b.attributes[i];
    if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  }
}

// A control's value is a property, not an attribute, the moment anything has
// typed into it — so the attribute is synced above and the property here.
function morphValue(a, b) {
  if (a.type === "checkbox" || a.type === "radio") {
    const on = b.hasAttribute("checked");
    if (a.checked !== on) a.checked = on;
    return;
  }
  const v = b.getAttribute("value");
  if (v !== null && a.value !== v) a.value = v;
}

// The options are morphed like any other children, so the <select> itself is
// never replaced and an open list is never yanked out from under the pointer.
function morphSelect(a, b) {
  morphChildren(a, b);
  const want = pickedValue(b);
  if (want !== null && a.value !== want) a.value = want;
}

// A stand-in for a section's element, whose `innerHTML =` paints instead of
// rebuilding. Each render function goes on writing its whole section as one
// template literal — which is how they read best — and the DOM underneath is
// updated in place.
function slot(el) {
  if (!el) return null;
  return {el: el, set innerHTML(html) { paint(el, html); }};
}

function pickedValue(sel) {
  const opts = sel.options;
  for (let i = 0; i < opts.length; i++) {
    if (opts[i].hasAttribute("selected")) return opts[i].value;
  }
  return opts.length ? opts[0].value : null;
}

// The whole editor, every time. What that costs is one HTML string; what it
// buys is that no control can still be offering what the library said an edit
// ago. `paint` is what stops it being a rebuild — see above.
function renderEditor() {
  const box = $("editor");
  if (S.sel === null || S.sel === undefined || !S.job.cabinets[S.sel]) {
    box.innerHTML = `<h2>Cabinet</h2><div class="empty">Select a cabinet in the drawing or the list.</div>`;
    S.selRendered = -2;
    return;
  }

  const c = S.job.cabinets[S.sel];
  const sets = SECTIONS.filter((sec) => !sec.when || sec.when(c))
    .map((sec) => sectionHTML(c, sec)).join("");
  // This cabinet's own criticals and warnings, one line each, at the top of
  // the dock (F4). They come from the compute reply; clicking one opens the
  // Validation tab. Nothing is decided here.
  const own = cabinetIssues(c.number);
  // The container is there even when empty (29 September 2026): the editor's
  // children must not shift by one when the first issue appears, or the paint
  // pairs the old body with the new issue list and rebuilds every section
  // under the operator — the dock "jumped" on Equal and on size changes.
  const issues = `<div class="dockissues">${own.map((i) =>
    `<div class="${i.level === "critical" && i.accepted ? "accepted" : i.level}" data-goto="validation">${
      i.level === "critical" ? (i.accepted ? "accepted" : "critical") : "warning"} — ${esc(i.message)}</div>`).join("")}</div>`;

  const bespoke = c.template === "none"
    ? `<div class="bespoke"><b>Bespoke cabinet.</b> The template generates nothing;
       its ${c.bespoke.length} panel${c.bespoke.length === 1 ? " is" : "s are"} specified
       by hand in the job file. Size and finish fields above do not drive them.</div>` : "";

  // Save (27 September 2026): a REFRESH, not a write. The top-bar Save is
  // what writes the job file. This one computes now rather than after the
  // debounce and redraws every place the cabinet appears — see saveRefresh.
  const html = `<h2>Cabinet ${c.number}<button class="edsave" id="edsave"
      title="Recompute now and redraw everything this cabinet appears in. Does not write the job file — the top-bar Save does that.">Save</button></h2>${
      issues}<div class="body">${sets}${bespoke}</div>`;

  // A different cabinet is a different editor and there is nothing on screen
  // worth protecting, so it is built outright. The same cabinet is painted over
  // what is already there.
  if (S.selRendered !== S.sel) {
    box.innerHTML = html;
    S.selRendered = S.sel;
    renderSections();
    return;
  }
  // The same cabinet: painted over what is there, and the dock does not move.
  // The control being used (the focused one — a button just pressed, a field
  // being typed in) stays where it was on screen; with none, the scroll does.
  keepPlace(box, () => { paint(box, html); renderSections(); });
}

function renderSections() {
  renderStructure();
  renderCorner();
  renderDoors();
  renderDrawers();
  renderSupports();
  renderAttached();
  renderPanel();
  refreshGeometryReadout();
  refreshSwing();
  refreshEdging();
  refreshSupports();
}

// What names a control well enough to find it again if a repaint replaced it.
function placeKey(el) {
  if (el.id) return "#" + CSS.escape(el.id);
  const attrs = Object.keys(el.dataset || {}).map((k) =>
    `[data-${k.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase())}="${CSS.escape(el.dataset[k])}"]`).join("");
  return attrs ? el.tagName.toLowerCase() + attrs : null;
}

// Run `fn` (a repaint of `box`) without moving what the operator is looking at.
function keepPlace(box, fn) {
  const top = box.scrollTop;
  const a = document.activeElement;
  const held = a && a !== box && box.contains(a) ? a : null;
  const key = held && placeKey(held);
  const y = held && held.getBoundingClientRect().top;
  fn();
  box.scrollTop = top;
  if (!held) return;
  const now = held.isConnected ? held : (key && box.querySelector(key));
  if (now) box.scrollTop += now.getBoundingClientRect().top - y;
}

// A control that had focus was skipped by the paint — that is the rule that
// keeps an open dropdown open and the caret where it was. Paint again once
// focus has left it, so it cannot sit there offering options the Boards tab has
// moved on from.
let repaintTimer = null;
$("editor").addEventListener("focusout", () => {
  clearTimeout(repaintTimer);
  repaintTimer = setTimeout(() => {
    if (S.sel !== null && S.sel === S.selRendered) renderEditor();
  }, 120);
});

$("editor").addEventListener("input", (e) => {
  const c = S.job.cabinets[S.sel];
  if (!c) return;

  // a panel field. The record is one object, so it is written into rather than
  // onto the cabinet, and every figure the editor SHOWS still comes back from
  // the engine on the next compute.
  const pk = e.target.dataset.pk;
  if (pk !== undefined) {
    const p = panelOf(c);
    const v = e.target.value;
    if (["a", "b", "edge_long", "edge_short", "at_x", "at_y", "at_z"].indexOf(pk) >= 0) {
      p[pk] = parseInt(v, 10) || 0;
    } else {
      p[pk] = v;
      // A kind the new colour board does not offer is not quietly kept: the
      // board is what offers edging, so the colour follows the board it is on.
      if (pk === "edge_kind" && !v) p.edge_board = "";
    }
    schedule();
    return;
  }

  // which board one door leaf is cut from; "" hands it back to the exterior board
  const dboard = e.target.dataset.dboard;
  if (dboard !== undefined) {
    const n = +dboard;
    if (!Array.isArray(c.door_boards)) c.door_boards = [];
    while (c.door_boards.length <= n) c.door_boards.push("");
    c.door_boards[n] = e.target.value;
    schedule();
    return;
  }

  // edging: a thickness and a colour, per section. "" on either hands that half
  // back to the cabinet, and the name beside them is always the engine's.
  const edge = e.target.dataset.edge;
  if (edge !== undefined) {
    const field = edge + "_edge_" + e.target.dataset.ek;
    if (edge === "drawer_box") {
      // the section's box edging: drawers whose own choice was the old section
      // value follow it (they were not saying they differ)
      drawerSectionSet(c, field, e.target.value || null);
      renderDrawers();
    } else {
      c[field] = e.target.value || null;
    }
    schedule();
    return;
  }

  const leaf = e.target.dataset.leaf;
  if (leaf !== undefined) {
    const n = +leaf;
    if (!Array.isArray(c.door_hinges)) c.door_hinges = [];
    while (c.door_hinges.length <= n) c.door_hinges.push("");
    c.door_hinges[n] = e.target.value;      // "" hands it back to the default rule
    schedule();                // the side shown beside it is the engine's answer
    return;
  }

  const k = e.target.dataset.k;
  if (k === "kind" && e.target.value === "panel" && !isPanelCab(c)) {
    // Turning a cupboard into a panel hides every cupboard section at once, so
    // it is said out loud first. Nothing is emptied - the same bargain as the
    // tickboxes - and picking a cupboard kind again brings it all back, which
    // is why this asks only in this direction.
    const has = [];
    if ((c.doors || 0) > 0 && c.has_doors !== false) has.push(`${c.doors} door(s)`);
    if ((c.drawers || []).length && c.has_drawers !== false) {
      has.push(`${c.drawers.length} drawer face(s)`);
    }
    if ((c.support_rows || []).length) has.push(`${c.support_rows.length} support row(s)`);
    if ((c.shelves || 0) + (c.fixed_shelves || 0)) {
      has.push(`${(c.shelves || 0) + (c.fixed_shelves || 0)} shelves`);
    }
    if ((c.bespoke || []).length) has.push(`${c.bespoke.length} hand-specified panel(s)`);
    if (has.length) {
      const ok = window.confirm(
        `Cabinet ${c.number} becomes a single panel.\n\n` +
        `It is built from its Panel design only, so these stop being cut:\n\n` +
        `    ${has.join("\n    ")}\n\n` +
        `Nothing is thrown away \u2014 every one of them stays in the job file exactly ` +
        `as it is, and picking a cupboard kind again brings it all back unchanged. ` +
        `The number does not change.\n\nMake it a panel?`);
      if (!ok) { e.target.value = c.kind; return; }
    }
  }
  if (k) {
    // The number is applied when the field is finished with, not per keystroke:
    // everything that names the cabinet by number has to move with it, and typing
    // 12 passes through 1, which is another cabinet's. See the change handler.
    if (k === "number") return;
    const t = e.target.dataset.t;
    const raw = e.target.value;
    if (t === "text" || t.startsWith("sel:")) c[k] = raw;
    // a board that may be left to follow the one chosen in Structure
    else if (t === "optext") c[k] = raw === "" ? null : raw;
    // data entry only: pairs of numbers as typed; the engine reads the shape
    else if (t === "poly") c[k] = raw.trim() === "" ? []
      : raw.trim().split(/[\s;]+/).map((pt) => pt.split(",").map((n) => parseInt(n, 10)))
          .filter((pt) => pt.length === 2 && pt.every((n) => !isNaN(n)));
    else if (t === "opt") c[k] = raw === "" ? null : parseInt(raw, 10);
    else c[k] = raw === "" ? 0 : parseInt(raw, 10);
    cornerFollowUp(c, k);
    if (k === "kind" || k === "corner_style") redefaultSupports(c);
    // A board decides materials and edging, and the door count decides how many
    // leaf rows there are. Both used to force the whole editor to be rebuilt;
    // the compute that follows repaints every section off the reply, which is
    // the same answer without throwing the controls away.
    schedule();
    return;
  }

  const tape = e.target.dataset.tape;
  if (tape !== undefined) {
    // "" is not a tape name: it means hand it back to the boards
    c[tape] = e.target.value === "" ? null : e.target.value;
    schedule();                 // the value beside it is the engine's answer
    return;
  }

  const sup = e.target.dataset.sup;
  if (sup !== undefined) {
    const rows = c.support_rows || [];     // typed rows: the only ones with controls
    const sk = e.target.dataset.sk;
    const row = rows[+sup];
    if (sk === "qty") {
      row.qty = Math.max(parseInt(e.target.value, 10) || 0, 0);
      renderSupports();
    } else if (sk === "on") {
      // a Front or a Top Rear is one or none
      row.qty = e.target.checked ? 1 : 0;
      renderSupports();
    } else if (sk === "long" || sk === "short") {
      // how many long edges and ends are banded, as Panel design asks it. WHICH
      // edges a count means is the server's rule (/api/support-edges); the
      // list it hands back is what is stored, so a row that was not canonical
      // for its counts becomes canonical here — the note under it said so.
      const have = supportCounts(row);
      const want = {long: have[0], short: have[1]};
      want[sk] = +e.target.value || 0;
      supportEdgesFor(row, want.long, want.short);
      return;
    } else if (sk === "cut_board") {
      // What the rail is cut from. If the edging colour was only following the
      // cut board, it follows it here too; a colour chosen outright stays.
      const followed = !row.board || row.board === row.cut_board;
      row.cut_board = e.target.value;
      if (followed) row.board = row.cut_board;
      if (row.kind && !boardOffers(row.board, row.kind)) row.kind = "";
      renderSupports();
    } else if (sk === "board") {
      row.board = e.target.value;
      // the colour board no longer offers what this row asked for: drop the kind
      // rather than order an edging that board does not have
      if (row.kind && !boardOffers(row.board, row.kind)) row.kind = "";
      renderSupports();
    } else if (sk === "kind") {
      row.kind = e.target.value;
      // a kind with no colour board yet takes the board the rail is cut from —
      // its own edging, which is the answer that needs no second thought
      if (row.kind && !row.board) row.board = row.cut_board || c.carcass_board || "";
      if (row.kind && row.board && !boardOffers(row.board, row.kind)) {
        const fit = ((S.res && S.res.boards) || []).find((k) => boardOffers(k, row.kind));
        if (fit) row.board = fit;
      }
      renderSupports();
    }
    schedule();
    return;
  }

  // a Drawers section default (29 September 2026): blank follows Structure;
  // the Bottom's 'board' is the default and is stored as nothing
  const sec = e.target.dataset.dsec;
  if (sec !== undefined) {
    const v = e.target.value || null;
    drawerSectionSet(c, sec, sec === "drawer_base" && v === "board" ? null : v);
    renderDrawers();
    schedule();
    return;
  }

  const i = e.target.dataset.d;
  if (i === undefined) return;
  const d = c.drawers[+i];
  const dk = e.target.dataset.dk;
  // "" is not a board, a bottom or an edging: it hands this drawer back to the
  // section. A drawer's sub-row changes nothing in the stack.
  if (DRAWER_OVERRIDES.indexOf(dk) >= 0) {
    d[dk] = e.target.value || null;
    renderDrawers();
    schedule();
    return;
  }
  if (dk === "share") d.share = parseFloat(e.target.value) || 0;
  // blank is the default offset (21): stored as nothing, not as 0
  else if (dk === "offset") d.offset = e.target.value === "" ? null : (parseInt(e.target.value, 10) || 0);
  // blank is Auto (29 September 2026): the tallest box that fits its face
  else if (dk === "box_height") d.box_height = e.target.value === "" ? null : (parseInt(e.target.value, 10) || 0);
  else d[dk] = parseInt(e.target.value, 10) || 0;
  // an inner drawer is outside the face stack: nothing to solve, only compute
  if (d.inner) { schedule(); return; }
  // a box height or an offset moves no face, so the solve below would not
  // compute: the engine's checks and the tallest-box figure still have to
  if (dk === "box_height" || dk === "offset") { renderDrawers(); schedule(); return; }
  solveStack();
});

/* ---------- the two tickboxes ---------------------------------------------
   Unticking never empties anything: the drawer list and the corner
   measurements stay in the job file exactly as they were, so ticking the box
   again brings the section back whole. What unticking can do is take panels
   off the cut list, and that is never silent — the engine is asked which
   designations would go, and they are named before anything happens. A
   designation is only ever removed, never renamed and never reused.         */

/* Renumbering a cabinet. Everything in the job that names it by number moves
   with it — its wall placement, the gap choices either side of it, the plinth
   run it starts, and its own hand-specified panels — otherwise its placement is
   left naming a cabinet that no longer exists, which is a critical the Room tab
   cannot clear. Two cabinets cannot share a number, so a taken one is refused
   rather than merging their placements. */
$("editor").addEventListener("change", (e) => {
  if (e.target.dataset.k !== "number") return;
  const c = S.job.cabinets[S.sel];
  if (!c) return;
  const from = c.number;
  const to = parseInt(e.target.value, 10);
  if (!(to > 0)) {
    toast("A cabinet number is a whole number, 1 or more.", true);
    e.target.value = from;
    return;
  }
  if (to === from) { e.target.value = from; return; }
  if (S.job.cabinets.some((x) => x !== c && x.number === to)) {
    toast(`Cabinet ${to} already exists — two cabinets cannot share a number.`, true);
    e.target.value = from;
    return;
  }
  c.number = to;
  c.bespoke.forEach((p) => { p.cabinet = to; });
  places().forEach((p) => { if (p.cabinet === from) p.cabinet = to; });
  (S.job.gaps || []).forEach((g) => {
    if (g.after === from) g.after = to;
    if (g.before === from) g.before = to;
  });
  (S.job.plinths || []).forEach((p) => { if (p.first === from) p.first = to; });
  placesSig = null; gapsSig = null; plinthSig = null;
  schedule(); renderList();
});

$("editor").addEventListener("change", (e) => {
  if (!e.target.dataset.runner) return;
  const c = S.job.cabinets[S.sel];
  if (!c) return;
  if (e.target.value === (c.runner || "")) return;
  changeRunner(c, e.target.value, e.target);
});

$("editor").addEventListener("click", (e) => {
  if (e.target.id === "druncat") openCatalogue("runners");
});

$("editor").addEventListener("change", async (e) => {
  const key = e.target.dataset.tick;
  if (key === undefined) return;
  const c = S.job.cabinets[S.sel];
  if (!c) return;
  const on = e.target.checked;

  if (!on) {
    const r = await post("/api/what-if",
                         {job: S.job, cabinet: c.number, set: {[key]: false}});
    if (!r.ok) { toast(r.error, true); e.target.checked = true; return; }
    if (r.removed.length) {
      const n = r.removed.length;
      const qty = r.removed.reduce((a, x) => a + x.qty, 0);
      const lines = r.removed.map((x) =>
        `    ${x.label}   ${x.role}   ${x.length} x ${x.width}  x${x.qty}`).join("\n");
      const ok = window.confirm(
        `Turning this off removes ${n} cut-list line${n === 1 ? "" : "s"} ` +
        `(${qty} panel${qty === 1 ? "" : "s"}) from cabinet ${c.number}:\n\n${lines}\n\n` +
        `Everything you typed stays in the job file, so ticking it back restores ` +
        `these unchanged. No designation is renamed or reused — these are removed, ` +
        `not renumbered.\n\nRemove them?`);
      if (!ok) { e.target.checked = true; return; }
    }
  }

  c[key] = on;
  if (key === "corner_unit" && on) cornerFollowUp(c, "corner_unit");
  // A cabinet saved with no doors has a count of 0, and ticking the box must
  // not show "1" while building nothing: it gets the one door it is showing.
  if (key === "has_doors" && on && !((c.doors || 0) > 0)) c.doors = 1;
  renderEditor();
  schedule();
});

$("editor").addEventListener("click", (e) => {
  // Duplicate, from the Panel design section. The same path the cabinet table's
  // Dup takes: the next free number from the engine, everything copied but the
  // placement - a panel is put where it is put, so a copy is not.
  if (e.target.closest("#paneldup")) {
    dupCabinet(S.sel);
    return;
  }
  if (e.target.id === "padd") { addAttachedPanel(); return; }
  if (e.target.id === "pattachgo") {
    const sel = $("pattach");
    const to = sel && parseInt(sel.value, 10);
    if (!to) { toast("Pick the cabinet to attach this panel to.", true); return; }
    attachPanel(S.sel, to);
    return;
  }
  if (e.target.id === "pdetach") {
    const c = S.job.cabinets[S.sel];
    detachPanels({cabinet: c.number}).then((ok) => { if (ok) { schedule(); renderList(); } });
    return;
  }
  if (e.target.id === "phost") {
    const host = attachedTo(S.job.cabinets[S.sel]);
    const i = S.job.cabinets.findIndex((x) => x.number === host);
    if (i >= 0) { selectCabinet(i); renderList(); refreshPlan(); }
    return;
  }
  const sp = e.target.closest("[data-showpanel]");
  if (sp) {
    const i = S.job.cabinets.findIndex((x) => x.number === +sp.dataset.showpanel);
    if (i >= 0) { selectCabinet(i, {isolate: false}); renderList(); }
    return;
  }
  const lock = e.target.closest("[data-dlock]");
  if (lock) {
    // locked = Fixed at the height it has now; unlocked = Share, weight 1
    // unless it had one — the same mode / share / face_height as ever
    const d = S.job.cabinets[S.sel].drawers[+lock.dataset.dlock];
    if ((d.mode || "fixed") === "share") d.mode = "fixed";
    else { d.mode = "share"; if (!(d.share > 0)) d.share = 1; }
    renderDrawers();
    return;
  }
  const au = e.target.closest("[data-dauto]");
  if (au) {
    S.job.cabinets[S.sel].drawers[+au.dataset.dauto].box_height = null;
    renderDrawers();
    schedule();
    return;
  }
  const diff = e.target.closest("[data-ddiff]");
  if (diff) {
    const c = S.job.cabinets[S.sel];
    const k = +diff.dataset.ddiff;
    const key = c.number + ":" + k;
    if (drawerOpen(c, k)) {
      // "same as section": every override on this drawer handed back
      const had = drawerDiffers(c, c.drawers[k]);
      DRAWER_OVERRIDES.forEach((f) => { c.drawers[k][f] = null; });
      delete S.dOpen[key];
      if (had) schedule();
    } else {
      S.dOpen[key] = true;
    }
    renderDrawers();
    return;
  }
  const rm = e.target.closest("[data-drm]");
  if (rm) {
    const c = S.job.cabinets[S.sel];
    const wasInner = c.drawers.length && c.drawers.every((d) => d.inner);
    c.drawers.splice(+rm.dataset.drm, 1);
    // an opened sub-row belongs to the drawer, not to its place in the list
    Object.keys(S.dOpen).forEach((k) => { if (k.indexOf(c.number + ":") === 0) delete S.dOpen[k]; });
    // the count changed: inner heights go back to the auto spacing (ruled)
    if (wasInner) { setInner(c, true, c.drawers.length); return; }
    renderDrawers();
    return;
  }
  if (e.target.id === "supretype") { reenterSupports(); return; }
  if (e.target.id === "supadd") { addBackSupport(); return; }
  const sdel = e.target.closest("[data-supdel]");
  if (sdel) {
    S.job.cabinets[S.sel].support_rows.splice(+sdel.dataset.supdel, 1);
    renderSupports();
    schedule();
    return;
  }
  if (e.target.id === "edsave") { saveRefresh(); return; }
  const pre = e.target.closest("[data-preset]");
  if (pre) { applyPreset(pre.dataset.preset); return; }
  if (e.target.id === "dadd") {
    const c = S.job.cabinets[S.sel];
    // inner: one more, and every height back on the equal spacing (ruled)
    if (c.drawers.length && c.drawers.every((d) => d.inner)) {
      setInner(c, true, c.drawers.length + 1);
      return;
    }
    // a new face shares what is left, its box Auto and everything else the
    // section's (29 September 2026)
    c.drawers.push({face_height: 0, box_height: null, base: null, mode: "share", share: 1,
                    box_board: null, face_board: null});
    renderDrawers();
  }
});

/* ---------- doors ----------------------------------------------------------
   One or two leaves and no more: a pair hangs from its outer edges, left and
   right, and that is not a choice (ruled 18 September 2026). A single door is
   the choice. Each leaf names the board it is cut from — two leaves of
   different boards come out as two cut-list lines — and the section carries one
   edging control of its own: how thick, and what colour.

   The side beside each row is the engine's own answer, the one the plan swings
   from and the elevation draws, so the two can never drift apart.           */

/* ---------- the Corner Unit section -----------------------------------------
   Three types, and each asks for its own measurements. EVERY dimension a corner
   unit has is entered here, which is the whole reason Size is greyed above: a
   new user should never have to hunt for where a number goes.

   Nothing here works out a dimension. The derived figures - the blank, the
   mitre legs, the inner span, the door width, an arm shelf's maximum depth -
   all arrive on `geometry.corner` from /api/compute. */

// Six small plan pictures of what each type looks like with its corner at the
// right-hand end and at the left. Fixed drawings of the idea, not a scaled view
// of these measurements: nothing is computed here and nothing reads a dimension
// back off them. Wall A runs across the top; the return wall is the short one.
const CORNER_ICONS = {
  "mitre-R": `<path class="wall" d="M4,7 H60 M59,7 V40"/>
              <polygon class="box" points="30,8 58,8 58,36 42,36 30,24"/>
              <line class="front" x1="30" y1="24" x2="42" y2="36"/>`,
  "mitre-L": `<path class="wall" d="M4,7 H60 M5,7 V40"/>
              <polygon class="box" points="34,8 6,8 6,36 22,36 34,24"/>
              <line class="front" x1="34" y1="24" x2="22" y2="36"/>`,
  "ell-R":   `<path class="wall" d="M4,7 H60 M59,7 V40"/>
              <polygon class="box" points="30,8 58,8 58,36 42,36 42,24 30,24"/>
              <polyline class="front" points="30,24 42,24 42,36"/>`,
  "ell-L":   `<path class="wall" d="M4,7 H60 M5,7 V40"/>
              <polygon class="box" points="34,8 6,8 6,36 22,36 22,24 34,24"/>
              <polyline class="front" points="34,24 22,24 22,36"/>`,
  "blind-R": `<path class="wall" d="M4,7 H60 M59,7 V40"/>
              <rect class="box" x="24" y="8" width="34" height="20"/>
              <rect class="blindp" x="46" y="26" width="12" height="4"/>
              <line class="front" x1="24" y1="28" x2="46" y2="28"/>`,
  "blind-L": `<path class="wall" d="M4,7 H60 M5,7 V40"/>
              <rect class="box" x="6" y="8" width="34" height="20"/>
              <rect class="blindp" x="6" y="26" width="12" height="4"/>
              <line class="front" x1="18" y1="28" x2="40" y2="28"/>`,
};

function cornerIcon(kind, hand) {
  const art = CORNER_ICONS[kind + "-" + hand] || "";
  return `<svg viewBox="0 0 64 44" aria-hidden="true">${art}</svg>`;
}

// One number field in the Corner Unit grid. The same data-k / data-t contract
// every other field uses, so the editor's one input handler stores it.
function cornerNum(key, label, value, note, wide, problem) {
  return `<div class="f${wide ? " wide" : ""}"><label>${esc(label)}</label>
    <input type="number" step="1" min="0" data-k="${key}" data-t="opt"
           class="${problem ? "bad" : ""}"
           value="${value === null || value === undefined ? "" : value}"
           placeholder="enter mm">
    ${problem ? `<span class="prob">${esc(problem)}</span>` : ""}
    ${note ? `<span class="note">${note}</span>` : ""}</div>`;
}

// The blind panel's own two choices: what it is cut from, and how thick the one
// edge it carries is (ruled 22 September 2026). Both are "follow" by default -
// the exterior board, so the strip beside the door matches the doors, and the
// doors' edging thickness. The kind list is what that board OFFERS, read back
// off /api/compute like every other edging control; the browser decides none of
// it, and the name shown beside the two is the engine's.
function blindPanelHTML(c, info) {
  const mats = (S.res && S.res.materials) || {};
  const keys = (S.res && S.res.boards) || [];
  const pre = S.def.edging_prefix || {};
  const chosen = c.blind_board || "";
  const board = info.blind_board || c.exterior_board || "";
  const kind = info.blind_edge_kind || "2mm";
  const all = S.def.exterior_tapes || ["1mm", "2mm"];
  const offers = (mats[board] || {}).edging_kinds || [];
  const kinds = all.filter((k) => offers.indexOf(k) >= 0);
  const kindLost = c.blind_edge_kind && kinds.indexOf(c.blind_edge_kind) < 0;
  const name = info.blind_edge_name || "";
  return `<div class="f wide"><label>Blind panel board</label>
      <select data-k="blind_board" data-t="text">
        <option value=""${chosen ? "" : " selected"}>exterior board (${
          esc(c.exterior_board || "\u2014")})</option>
        ${chosen && boardIsThin(chosen)
          ? `<option value="${esc(chosen)}" selected>${esc(chosen)} (3 mm \u2014 too thin for a panel)</option>`
          : ""}
        ${keys.filter((k) => !boardIsThin(k)).map((k) =>
          `<option value="${esc(k)}"${k === chosen ? " selected" : ""}>${esc(k)} \u2014 ${
            esc((mats[k] || {}).board || k)}</option>`).join("")}
      </select>
      <span class="note">The strip beside the door is seen from the room, so it
      follows the doors unless you say otherwise.</span></div>
    <div class="f wide"><label>Blind panel edging</label>
      <select data-k="blind_edge_kind" data-t="optext">
        <option value=""${c.blind_edge_kind ? "" : " selected"}>follows the doors (${
          esc(pre[kind] || kind)})</option>
        ${kindLost ? `<option value="${esc(c.blind_edge_kind)}" selected>${
          esc(pre[c.blind_edge_kind] || c.blind_edge_kind)} (not offered by ${
          esc(board || "that board")})</option>` : ""}
        ${kinds.map((k) => `<option value="${esc(k)}"${
          k === c.blind_edge_kind ? " selected" : ""}>${esc(pre[k] || k)}</option>`).join("")}
      </select>
      <span class="note">One edge only \u2014 the vertical one facing the opening,
      which is what you rub past reaching in. ${name
        ? `Ordered as <b>${esc(name)}</b>.`
        : `<b style="color:var(--crit)">${esc(pre[kind] || kind)} is not offered by ${
            esc(board || "that board")} \u2014 tick it on the Boards tab.</b>`}</span></div>`;
}

/* The unit drawn to scale in plan, off the outline the ENGINE derived, with
   each measurement lettered the same as the field it comes from. Nothing is
   computed here but where to put a label: every corner point is the engine's.
   Wall A runs across the top, the room is below it, and the runs the unit
   meets are drawn dashed so "open end = depth of the run it meets" is visible
   rather than a sentence to decode.                                        */
const CORNER_EDGES = {
  "mitre-R": {a: [0, 1], b: [1, 2], fb: [2, 3], fa: [4, 0], front: [[3, 4]]},
  "mitre-L": {b: [0, 1], a: [1, 2], fa: [2, 3], front: [[3, 4]], fb: [4, 0]},
  "ell-R":   {a: [0, 1], b: [1, 2], fb: [2, 3], front: [[3, 4], [4, 5]], fa: [5, 0]},
  "ell-L":   {b: [0, 1], a: [1, 2], fa: [2, 3], front: [[3, 4], [4, 5]], fb: [5, 0]},
};
const CORNER_LETTER = {a: "A", b: "B", fa: "C", fb: "D"};

function cornerDiagram(c, g, info) {
  const kind = info.kind, hand = info.hand === "L" ? "L" : "R";
  let pts, edges, doorTxt = [];
  const blind = kind === "blind";
  if (blind) {
    // Every span here is the engine's (room.blind_spans, off /api/compute): the
    // flush panel sits INSIDE the carcass one board in from the corner, and the
    // overlay door laps onto its face. Nothing about that layout is worked out
    // in the browser.
    const sp = info.spans;
    if (!g || !g.footprint || !(c.width > 0) || !(c.depth > 0) || !sp) return "";
    const W = g.width, D = g.depth, B = c.blind_width || 0;
    pts = [[0, 0], [W, 0], [W, D], [0, D]];
    return drawDiagram(pts, W, D, hand, {blind: sp.blind, door: sp.door,
      side: sp.side,
      D, W, B, doorW: info.door_width, opening: info.opening});
  }
  if (!g || g.source !== "corner" || !g.footprint) return "";
  pts = g.footprint;
  edges = CORNER_EDGES[kind + "-" + hand];
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return drawDiagram(pts, Math.max(...xs), Math.max(...ys), hand,
    {edges, fa: c.face_a, fb: c.face_b, a: c.arm_a, b: c.arm_b, kind,
     doors: g.doors || [], mitre: g.mitre_deg});
}

function drawDiagram(pts, W, D, hand, o) {
  const pad = Math.max(W, D) * 0.34;
  const ghost = Math.max(W, D) * 0.45;            // how much of each run to show
  const vx0 = -pad, vy0 = -pad * 0.55, vw = W + 2 * pad, vh = D + pad * 1.9;
  const k = Math.max(W, D) / 260;                 // one screen pixel, in mm
  const fs = 15 * k, sw = 1.4 * k;
  const P = (p) => `${p[0]},${p[1]}`;
  const cornerX = hand === "R" ? W : 0;
  const out = [];
  // the walls: A across the top, the return wall down the corner end
  out.push(`<line x1="${hand === "R" ? -ghost - pad * 0.2 : 0}" y1="0"
    x2="${hand === "R" ? W : W + ghost + pad * 0.2}" y2="0" stroke="var(--ink)" stroke-width="${3 * k}"/>`);
  out.push(`<line x1="${cornerX}" y1="0" x2="${cornerX}" y2="${D + ghost + pad * 0.3}"
    stroke="var(--ink)" stroke-width="${3 * k}"/>`);
  out.push(`<text x="${hand === "R" ? -ghost : W + ghost}" y="${-6 * k}" font-size="${fs}"
    text-anchor="${hand === "R" ? "start" : "end"}" fill="var(--muted)">this wall</text>`);
  out.push(`<text x="${cornerX + (hand === "R" ? 6 : -6) * k}" y="${D + ghost}" font-size="${fs}"
    text-anchor="${hand === "R" ? "start" : "end"}" fill="var(--muted)">return wall</text>`);
  const dash = `stroke="var(--rule)" stroke-dasharray="${5 * k} ${4 * k}" fill="none" stroke-width="${sw}"`;
  if (o.blind) {
    // the run on the return wall stands in front of the blind panel
    const rx = hand === "R" ? o.W - o.D : 0;
    out.push(`<rect x="${rx}" y="${o.D}" width="${o.D}" height="${ghost}" ${dash}/>`);
    out.push(`<text x="${rx + o.D / 2}" y="${o.D + ghost / 2}" font-size="${fs * 0.85}"
      text-anchor="middle" fill="var(--muted)">return run</text>`);
    out.push(`<polygon points="${pts.map(P).join(" ")}" fill="var(--carc)" stroke="var(--ink)" stroke-width="${sw}"/>`);
    const [b0, b1] = o.blind, [d0, d1] = o.door, [s0, s1] = o.side;
    // Every position ALONG the wall is the engine's, to the millimetre. Only the
    // depth each part is drawn at is exaggerated — a 16 mm board is three pixels
    // at plan scale and would say nothing — so both are drawn `th` deep and the
    // front line at y = D is what they are read against: the flush panel behind
    // it, the overlay door in front of it. That is the one thing this drawing is
    // about, and the depth is dimensioned in words beside it, never off a rect.
    const th = 18 * k;
    out.push(`<rect x="${s0}" y="${o.D - th}" width="${s1 - s0}" height="${th}"
      fill="var(--carc)" stroke="var(--ink)" stroke-width="${sw * 0.7}"/>`);
    if (o.B) out.push(`<rect x="${b0}" y="${o.D - th}" width="${b1 - b0}" height="${th}"
      fill="var(--rule)" stroke="var(--ink)" stroke-width="${sw}"/>`);
    // and the door in front of the box, lapping onto the panel's face
    out.push(`<rect x="${d0}" y="${o.D}" width="${Math.max(d1 - d0, 0)}" height="${th}"
      fill="var(--door)" stroke="var(--ink)" stroke-width="${sw * 0.7}"/>`);
    out.push(label(o.W / 2, -14 * k, `W ${o.W}`, fs));
    out.push(label(hand === "R" ? -30 * k : o.W + 30 * k, o.D / 2, `depth ${o.D}`, fs));
    // the panel's label goes on the strip the door does not cover
    const sh0 = hand === "R" ? Math.max(b0, d1) : b0;
    const sh1 = hand === "R" ? b1 : Math.min(b1, d0);
    if (o.B) out.push(label((sh0 + sh1) / 2, o.D - 34 * k, `blind panel ${o.B}`, fs));
    if (o.doorW) out.push(label((d0 + d1) / 2, o.D + 34 * k, `door ${o.doorW}`, fs));
  } else {
    // the two runs this unit meets, dashed, at the open ends' depths
    if (o.fa) {
      const x = hand === "R" ? -ghost : W;
      out.push(`<rect x="${x}" y="0" width="${ghost}" height="${o.fa}" ${dash}/>`);
      out.push(`<text x="${x + ghost / 2}" y="${o.fa / 2}" font-size="${fs * 0.85}"
        text-anchor="middle" fill="var(--muted)">next run</text>`);
    }
    if (o.fb) {
      const x = hand === "R" ? W - o.fb : 0;
      out.push(`<rect x="${x}" y="${D}" width="${o.fb}" height="${ghost}" ${dash}/>`);
      out.push(`<text x="${x + o.fb / 2}" y="${D + ghost / 2}" font-size="${fs * 0.85}"
        text-anchor="middle" fill="var(--muted)">next run</text>`);
    }
    out.push(`<polygon points="${pts.map(P).join(" ")}" fill="var(--carc)" stroke="var(--ink)" stroke-width="${sw}"/>`);
    // the door face(s) in the door colour, thick
    (o.edges.front || []).forEach(([i, j], n) => {
      const p = pts[i], q = pts[j];
      out.push(`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"
        stroke="#3d8a8a" stroke-width="${5 * k}"/>`);
      const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      const txt = o.kind === "mitre"
        ? `door ${o.doors[0] || ""}${o.mitre !== null && o.mitre !== undefined ? " \u00b7 " + Math.abs(o.mitre) + "\u00b0" : ""}`
        : "face " + (n + 1);
      out.push(label(mx + (hand === "R" ? -34 : 34) * k, my + 20 * k, txt, fs));
    });
    // each measurement, lettered like its field
    ["a", "b", "fa", "fb"].forEach((key) => {
      const e = o.edges[key];
      if (!e) return;
      const p = pts[e[0]], q = pts[e[1]];
      let mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      // pushed off the edge, away from the box
      if (key === "a") my -= 14 * k;
      if (key === "b") mx += (hand === "R" ? 34 : -34) * k;
      if (key === "fa") mx += (hand === "R" ? 38 : -38) * k;
      if (key === "fb") my += 16 * k;
      out.push(label(mx, my, `${CORNER_LETTER[key]} ${o[key]}`, fs, true));
    });
  }
  return `<div class="cdiag"><svg viewBox="${vx0} ${vy0} ${vw} ${vh}"
    xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">${out.join("")}</svg></div>`;
}

function label(x, y, text, fs, bold) {
  return `<text x="${x}" y="${y}" font-size="${fs}" text-anchor="middle"
    dominant-baseline="middle" fill="var(--ink)"${bold ? ' font-weight="700"' : ""}
    paint-order="stroke" stroke="var(--panel)" stroke-width="${fs * 0.35}">${esc(text)}</text>`;
}

/* What follows a change to a corner unit, so the operator is not left to do
   arithmetic the app can do.

   1. Choosing Mitre or Ell with nothing measured yet fills in a starting shape:
      both open ends at the depth the cabinet already had (the depth of the runs
      it meets, which is what they are), and both lengths 350 longer - the
      proportions of cabinet 7, the one corner unit actually built. Every figure
      is shown in its field and in the drawing, and is overtyped as measured.
   2. A corner unit stands IN a corner. Whenever its type, hand or length along
      the wall changes, a placed unit is moved into the corner its hand names:
      right-hand end at the wall's end, or left-hand end at the wall's start. It
      used to be left wherever it was, and the operator had to work out
      "wall length minus arm" to put it there by hand.                        */
const CORNER_REACH_KEYS = {corner_style: 1, corner_hand: 1, arm_a: 1, width: 1,
                           corner_unit: 1};
function cornerFollowUp(c, k) {
  if (!(k in CORNER_REACH_KEYS)) return;
  const on = c.corner_unit !== false && !!c.corner_style;
  if (!on) return;
  if (k === "corner_style" && (c.corner_style === "mitre" || c.corner_style === "ell")
      && [c.arm_a, c.arm_b, c.face_a, c.face_b].every((v) => !(v > 0))) {
    const d = c.depth > 0 ? c.depth : 500;
    c.face_a = d; c.face_b = d; c.arm_a = d + 350; c.arm_b = d + 350;
  }
  // A mitre or a blind corner is a unit with a door - the blind one by
  // definition. Choosing the type turns doors on; the operator can still turn
  // them off on a mitre.
  if (k === "corner_style" && (c.corner_style === "mitre" || c.corner_style === "blind")
      && c.has_doors !== true) {
    c.has_doors = true;
    if (!((c.doors || 0) > 0)) c.doors = 1;
  }
  const reach = c.corner_style === "blind" ? c.width : c.arm_a;
  if (!(reach > 0)) return;
  const p = places().find((q) => q.cabinet === c.number);
  const rm = S.job.room;
  if (!p || !rm) return;
  const w = (rm.walls || []).find((x) => x.id === p.wall);
  if (!w) return;
  const x = c.corner_hand === "L" ? 0 : Math.max(0, w.length - reach);
  if (p.x !== x) {
    p.x = x;
    placesSig = null;
    toast(`Cabinet ${c.number} moved into the ${c.corner_hand === "L" ? "start" : "end"} ` +
          `corner of wall ${p.wall} (x = ${x}).`);
  }
}

function renderCorner() {
  const box = slot($("cornerbox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const info = cornerInfo(c) || {};
  const kind = info.kind || "";
  const types = S.def.corner_types || [];
  const hands = S.def.corner_hands || [];

  const typeRow = `<div class="f wide"><label>Type</label>
    <select data-k="corner_style" data-t="sel:corner_styles">
      <option value=""${c.corner_style ? "" : " selected"}>\u2014 choose \u2014</option>
      ${types.map((t) => `<option value="${esc(t.key)}"${
        t.key === c.corner_style ? " selected" : ""}>${esc(t.name)}</option>`).join("")}
    </select>
    ${kind ? `<span class="note">${esc(
      (types.find((t) => t.key === kind) || {}).hint || "")}</span>` : ""}</div>`;

  if (!kind) {
    // Ticking the box and leaving the type blank used to do nothing at all, and
    // say nothing about it. This is that silence, ended.
    box.innerHTML = `<div class="grid">${typeRow}</div>
      <p class="off">Choose a corner type.</p>`;
    return;
  }

  const handRow = `<div class="f wide"><label>Hand</label>
    <div class="hands">${hands.map((h) => `
      <label class="handopt${info.hand === h.key ? " on" : ""}">
        <input type="radio" name="cornerhand" data-k="corner_hand" data-t="text"
               value="${esc(h.key)}"${info.hand === h.key ? " checked" : ""}>
        ${cornerIcon(kind, h.key)}<b>${esc(h.name)}</b>
        <span>${esc(h.hint)}</span></label>`).join("")}</div>
    <span class="note">Which end of the unit stands in the corner, as you face
    it standing in the room.</span></div>`;

  const prob = info.problems || {};
  let fields;
  if (kind === "blind") {
    fields = cornerNum("width", "Carcass width", c.width,
                       "the box itself, blind panel and door together", false, prob.width) +
             cornerNum("height", "Height", c.height, "", false, prob.height) +
             cornerNum("depth", "Depth", c.depth, "", false, prob.depth) +
             cornerNum("blind_width", "Blind panel width", c.blind_width,
                       "cut at exactly this \u2014 it has to cover the run on the return wall",
                       false, prob.blind_width) +
             blindPanelHTML(c, info);
  } else {
    fields = cornerNum("arm_a", "A \u2014 length along this wall", c.arm_a,
                       "wall to the unit's open end", false, prob.arm_a) +
             cornerNum("arm_b", "B \u2014 length along the return wall", c.arm_b,
                       "", false, prob.arm_b) +
             cornerNum("face_a", "C \u2014 open end on this wall", c.face_a,
                       "= depth of the cupboards beside it on this wall", false, prob.face_a) +
             cornerNum("face_b", "D \u2014 open end on the return wall", c.face_b,
                       "= depth of the cupboards on the return wall", false, prob.face_b) +
             cornerNum("height", "Height", c.height, "", false, prob.height);
  }
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const diagram = cornerDiagram(c, g, info);

  let extra = "";
  if (kind === "mitre") {
    const max = info.arm_shelf_max;
    const armOpts = [["a", "Arm A \u2014 along this wall"],
                     ["b", "Arm B \u2014 along the return wall"]];
    extra = `<div class="grid">
      <div class="f"><label>Arm shelves</label>
        <input type="number" step="1" min="0" data-k="arm_shelves" data-t="int"
               value="${c.arm_shelves || 0}">
        <span class="note">A rectangle running along one arm, behind the
        mitre${info.arm_shelf_length ? `. ${info.arm_shelf_length} mm long` : ""}.</span></div>
      <div class="f"><label>Arm</label>
        <select data-k="arm_shelf_arm" data-t="sel:corner_arms">${armOpts.map(([k, n]) =>
          `<option value="${k}"${(c.arm_shelf_arm || "a") === k ? " selected" : ""}>${
            esc(n)}</option>`).join("")}</select></div>
      <div class="f"><label>Arm shelf depth</label>
        <input type="number" step="1" min="0" data-k="arm_shelf_depth" data-t="opt"
               value="${c.arm_shelf_depth === null || c.arm_shelf_depth === undefined
                        ? "" : c.arm_shelf_depth}"
               placeholder="${max === null || max === undefined ? "auto" : max}">
        <span class="note">${max === null || max === undefined ? "" :
          `Maximum <b>${max} mm</b> \u2014 the deepest that clears both the closed door
           (${info.shelf_clear} mm) and the hinge plate (${info.hinge_clearance} mm),
           rounded down to 5. Blank takes the maximum; more than it is a critical.`}</span></div>
      <div class="f"><label>Mitred shelves</label>
        <input type="number" step="1" min="0" data-k="mitred_shelves" data-t="int"
               value="${c.mitred_shelves || 0}">
        <span class="note">The same square blank as the top and bottom, mitred on
        site${info.shelf_legs ? `: legs ${info.shelf_legs[0]} and ${info.shelf_legs[1]}`
             : ""}.</span></div>
      ${cornerNum("corner_door_width", "Door width override", c.corner_door_width,
        info.door_width ? `blank derives ${info.door_width} mm from the arms` : "",
        true)}
    </div>`;
  }

  box.innerHTML = `<div class="grid">${typeRow}${handRow}</div>${diagram}
    <div class="grid">${fields}</div>${extra}
    <p class="note" id="cornerreadout"></p>`;
}


function renderDoors() {
  const box = slot($("doorbox"));
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const mats = (S.res && S.res.materials) || {};
  const keys = (S.res && S.res.boards) || [];
  // A blind corner has exactly one door, at the far end from the blind panel.
  // That is a ruling, not a default: the unit exists to hold one door clear of
  // the return run. Its own `doors` count stays in the job file and is not read.
  const blind = cornerKind(c) === "blind";
  const have = blind ? 1 : (c.doors || 1);
  const n = Math.max(1, have);
  const counts = [1, 2];
  if (have > 2) counts.push(have);      // a job file written before the limit
  const sides = (g && g.hinges) || [];
  const widths = (g && g.doors) || [];

  const leaves = [];
  for (let i = 0; i < n; i++) {
    const side = sides[i] || (n >= 2 ? (i === 0 ? "L" : "R") : "L");
    const chosen = (c.door_boards || [])[i] || "";
    leaves.push(`<div class="leaf">
      <b>Leaf ${i + 1}</b>
      <span class="note">${widths[i] || "?"} wide</span>
      ${n === 1
        ? `<select data-leaf="0" class="hinge">
             <option value="L"${side === "L" ? " selected" : ""}>hinged left</option>
             <option value="R"${side === "R" ? " selected" : ""}>hinged right</option>
           </select>`
        : `<span class="note hinge">hinged ${side === "L" ? "left" : "right"}</span>`}
      <select data-dboard="${i}" title="what this leaf is cut from">
        <option value=""${chosen ? "" : " selected"}>exterior board (${
          esc(c.exterior_board || "—")})</option>
        ${chosen && boardIsThin(chosen)
          ? `<option value="${esc(chosen)}" selected>${esc(chosen)} (3 mm — too thin for a door)</option>`
          : ""}
        ${keys.filter((k) => !boardIsThin(k)).map((k) =>
          `<option value="${esc(k)}"${k === chosen ? " selected" : ""}>${
          esc(k)}</option>`).join("")}
      </select>
    </div>`);
  }

  // Which board is in effect, said in words: the exterior one, and any leaf
  // that has been given a board of its own instead.
  const named = (k) => k ? k + ((mats[k] || {}).board ? " — " + mats[k].board : "") : "—";
  const own = [];
  for (let i = 0; i < n; i++) {
    const k = (c.door_boards || [])[i];
    if (k && k !== c.exterior_board) own.push(`Leaf ${i + 1} is cut from ${named(k)} instead.`);
  }
  const stale = have > 2
    ? `<p class="hint" style="color:var(--warn)">This job was saved with ${have} doors on
       one cabinet. A cabinet takes 1 or 2 now — pick one. Until you do, it is cut as
       ${have}, exactly as it was saved.</p>` : "";
  box.innerHTML = `<div class="grid">
      ${blind
        ? `<div class="f"><label>How many</label>
             <input value="1" disabled>
             <span class="note">A blind corner has one door, always.</span></div>`
        : `<div class="f"><label>How many</label>
        <select data-k="doors" data-t="int">${counts.map((k) =>
          `<option value="${k}"${k === have ? " selected" : ""}>${k}</option>`).join("")}</select></div>`}
      <div class="f"><label>Door height</label>
        <input type="number" step="1" data-k="door_height" data-t="opt" placeholder="auto"
               value="${c.door_height === null || c.door_height === undefined
                        ? "" : c.door_height}"></div>
    </div>
    ${stale}
    ${leaves.join("")}
    <p class="hint">${n === 2
      ? "A pair is fixed: left leaf hinged left, right leaf hinged right. "
      : n === 1 ? "One door: choose which side its hinges are on — the handle goes on the other side. " : ""}External board
      is <b>${esc(named(c.exterior_board))}</b>.${own.length ? " " + esc(own.join(" ")) : ""}</p>
    ${edgingHTML(c, "door")}
    <div class="swing" id="swingnote"></div>`;
  refreshSwing();
}

// The swing check the server just ran, read back. It re-runs on every change,
// because every change goes through /api/compute.
function refreshSwing() {
  const el = $("swingnote");
  const c = S.sel !== null && S.job.cabinets[S.sel];
  if (!el || !c || !S.res) return;
  const rm = S.res.room;
  if (!rm) {
    el.className = "swing";
    el.textContent = "No room yet, so there is nothing for a door to foul — " +
                     "the swing check needs a plan to run against.";
    return;
  }
  const bad = (rm.clashes || []).filter((x) => x.cabinet === c.number && x.kind === "door");
  el.className = "swing " + (bad.length ? "bad" : "ok");
  el.textContent = bad.length
    ? "Door swing fouls " + bad.map((x) => x.against).join(", ")
    : "Door swing checked and clear.";
}

/* ---------- drawer faces: one row per face, Share or Fixed -----------------
   Fixed rows take their millimetres. The gaps come from the standard, never
   typed per drawer. Whatever is left is split among the Share rows in
   proportion to their share numbers — and every one of those numbers is
   drawers.divide's, fetched, not worked out here.                           */

// Inner or outer: the whole cabinet's drawers, one or the other (ruled 28
// September 2026). The server writes the list — for inner, every height back
// on the equal spacing from the bottom (`room.inner_drawer_z`) — and the
// browser works out no height.
async function setInner(c, inner, count) {
  const idx = S.job.cabinets.indexOf(c);
  const r = await post("/api/inner-drawers", {job: S.job, index: idx, inner: inner,
                                              count: count});
  if (!r || !r.ok) { toast((r && r.error) || "no reply", true); renderDrawers(); return; }
  c.drawers = r.drawers;
  if (inner && !((c.doors || 0) > 0 && c.has_doors !== false))
    toast("Inner drawers sit behind a door — tick Has doors on this cabinet.", true);
  renderDrawers();
  schedule();
}

$("editor").addEventListener("change", (e) => {
  const c = S.sel !== null && S.job.cabinets[S.sel];
  if (!c) return;
  if (e.target.dataset.dtype !== undefined) {
    setInner(c, e.target.value === "inner", Math.max(c.drawers.length, 1));
  } else if (e.target.dataset.dcount !== undefined) {
    const n = Math.max(parseInt(e.target.value, 10) || 0, 0);
    if (n !== c.drawers.length) setInner(c, true, n);
  }
});

/* ---------- the Drawers section (redone 29 September 2026) ----------------
   Brief `drawers-section-redo-brief-2026-09-29.md`. Three blocks in the
   Drawers tint: SETUP (type, runner, bottom, the two boards, the two edgings),
   the STACK (one row per face: face height with its lock, box height with its
   Auto, offset) and, per drawer, a "differs…" sub-row holding what that one
   drawer does differently from the section. Every figure is the engine's —
   the face heights from /api/drawer-solve, the tallest box and the runner's
   length and travel from /api/compute; the browser works none of them out. */

const DRAWER_BASE_LABEL = {board: "3 mm grooved sheet", melamine: "16 mm housed melamine"};
// What a drawer's "differs…" sub-row can set; null in each follows the section.
const DRAWER_OVERRIDES = ["box_board", "face_board", "base", "box_edge_board", "box_edge_kind"];
// The section default each override falls back to (Cabinet fields).
const DRAWER_SECTION_OF = {box_board: "drawer_carcass_board", face_board: "drawer_face_board",
                           base: "drawer_base", box_edge_board: "drawer_box_edge_board",
                           box_edge_kind: "drawer_box_edge_kind"};
// The wording, verbatim from the brief (Part 5).
const DHELP = {
  type: "Outer: the faces show on the front. Inner: the drawers sit behind a door " +
        "and each face is the size of its box.",
  runner: "Sets the box length and width, how far it pulls out and where it sits. " +
          "All figures come from the catalogue record.",
  legacy: "Quoted on the old lengths and cut exactly as quoted. Pick a catalogue runner " +
          "to update it; the drawer lines that change are listed before anything moves.",
  base: "3 mm sheet grooved into all four sides (the backing board), or 16 mm melamine " +
        "housed between them.",
  boards: "Every drawer in this cabinet, unless its row says it differs.",
  boxedge: "The top edge of the box sides and fronts.",
  faceedge: "All four edges of every face.",
  stack: "Faces are set out from the bottom: 2 mm between faces, 3 mm under the top. " +
         "Type a height, or unlock a row to let the app share out what is left. Box: " +
         "Auto is the tallest that fits in its face. Offset: the box bottom above the " +
         "face bottom; 21 is the bottom panel plus the runner's lift, and the bottom " +
         "drawer cannot go lower.",
};
const DTIP = {
  offset: "Box bottom above its face's bottom, mm",
  max: "Tallest box that fits this face at this offset",
  lock: "Locked: height as typed. Unlocked: shared out of what the fixed rows leave",
};

S.dOpen = {};          // "<cabinet number>:<drawer index>" -> a sub-row opened by hand

function drawerGeom(c) {
  return S.res && S.res.geometry && S.res.geometry[String(c.number)];
}

// The section's defaults as the engine resolves them (drawer_defaults on
// /api/compute), with the same fallbacks while no compute has landed yet.
function drawerDefaults(c) {
  const g = drawerGeom(c);
  return (g && g.drawer_defaults) || {
    box_board: c.drawer_carcass_board || c.carcass_board || "",
    face_board: c.drawer_face_board || c.exterior_board || "",
    box_edge_board: c.drawer_box_edge_board || c.exterior_board || "",
    box_edge_kind: c.drawer_box_edge_kind || "pvc",
    base: c.drawer_base || "board"};
}

function isSet(v) { return v !== null && v !== undefined && v !== ""; }

// A drawer differs from the section when it names something of its own. A
// typed bottom the same as the section's is not a difference: every drawer
// saved before the section had a Bottom carries one ('board').
function drawerDiffers(c, d) {
  const def = drawerDefaults(c);
  return DRAWER_OVERRIDES.some((k) => isSet(d[k]) && !(k === "base" && d[k] === def.base));
}

function drawerOpen(c, i) {
  return drawerDiffers(c, c.drawers[i]) || !!S.dOpen[c.number + ":" + i];
}

// A board dropdown off the project's boards. A drawer box and face are both
// built from a sheet, so the 3 mm backing is not offered; one stored stays,
// flagged. Blank follows whatever `follows` says.
function drawerBoardSelect(attrs, v, follows, what) {
  const keys = (S.res && S.res.boards) || [];
  return `<select ${attrs} title="${esc(what)}">
      <option value=""${v ? "" : " selected"}>(${esc(follows || "—")})</option>
      ${v && boardIsThin(v)
        ? `<option value="${esc(v)}" selected>${esc(v)} (3 mm — too thin)</option>` : ""}
      ${keys.filter((k) => !boardIsThin(k)).map((k) =>
        `<option value="${esc(k)}"${k === v ? " selected" : ""}>${esc(k)}</option>`).join("")}</select>`;
}

function drawerTypeHTML(c) {
  const inner = c.drawers.length > 0 && c.drawers.every((d) => d.inner);
  const mixed = c.drawers.some((d) => d.inner) && !inner;
  return `<div class="drow"><label>Drawer type</label>
      <select data-dtype="1" title="faces on the front, or drawers behind the door">
        <option value="outer"${inner ? "" : " selected"}>Outer</option>
        <option value="inner"${inner ? " selected" : ""}>Inner</option>
      </select>
      ${mixed ? `<span class="note over">inner and outer drawers are mixed on this
        cabinet — pick one; the export is blocked until then</span>` : ""}
      <span class="dhelp">${esc(DHELP.type)}</span></div>`;
}

// The runner the drawers hang on: one of the project's selected runners, by id,
// and ONE status line — the engine's length, box and travel, never worked out
// here. A cabinet naming none is on the legacy lengths it was quoted on.
function runnerHTML(c) {
  const g = drawerGeom(c);
  const info = (g && g.runner) || {};
  const ids = (S.res && S.res.runners) || Object.keys(S.job.runners || {});
  const recs = (S.res && S.res.runner_records) || S.job.runners || {};
  const cur = c.runner || "";
  const legacy = S.def.legacy_runner || {};
  const opts = [];
  if (!cur) opts.push(`<option value="" selected>${esc(legacy.name || "Legacy runners")}</option>`);
  if (cur && ids.indexOf(cur) < 0) opts.push(`<option value="${esc(cur)}" selected>${
    esc(cur)} (not selected into this project)</option>`);
  ids.forEach((k) => opts.push(`<option value="${esc(k)}"${k === cur ? " selected" : ""}>${
    esc((recs[k] || {}).name || k)}</option>`));
  let status = "";
  if (!cur) status = `Legacy lengths (${(legacy.lengths || []).join(" / ")}), as quoted`;
  else if (info.length) status = `${esc(info.short || info.name || cur)} · ${info.length} long · box ${
    info.length} × ${info.box_width} · pulls out ${info.travel}`;
  else if (info.length === null && c.drawers && c.drawers.length)
    status = `<span class="over">no length on this runner fits ${c.depth} deep</span>`;
  return `<div class="drow"><label>Runner</label>
      <div class="leaf"><select data-runner="1" title="the runner these drawers hang on">
        ${opts.join("")}</select>
        <button type="button" class="mini" id="druncat" title="the runner library">Catalogue…</button></div>
      <span class="dstatus mono" data-runread="1">${status}</span>
      <span class="dhelp">${esc(cur ? DHELP.runner : DHELP.legacy)}</span></div>`;
}

function drawerSetupHTML(c) {
  const base = c.drawer_base || "board";
  return `<div class="dblk" data-dblk="setup"><h4>Setup</h4>
    ${drawerTypeHTML(c)}
    ${runnerHTML(c)}
    <div class="drow"><label>Bottom</label>
      <select data-dsec="drawer_base" title="how every drawer's bottom is held">${
        (S.def.bases || ["board", "melamine"]).map((b) =>
          `<option value="${esc(b)}"${b === base ? " selected" : ""}>${
          esc(DRAWER_BASE_LABEL[b] || b)}</option>`).join("")}</select>
      <span class="dhelp">${esc(DHELP.base)}</span></div>
    <div class="drow"><label>Box board · Face board</label>
      <div class="pair">
        ${drawerBoardSelect('data-dsec="drawer_carcass_board"', c.drawer_carcass_board || "",
          "Carcass: " + (c.carcass_board || "—"), "what every drawer's box is cut from")}
        ${drawerBoardSelect('data-dsec="drawer_face_board"', c.drawer_face_board || "",
          "Exterior: " + (c.exterior_board || "—"), "what every drawer's face is cut from")}
      </div>
      <span class="dhelp">${esc(DHELP.boards)}</span></div>
    ${edgingHTML(c, "drawer_box", {kinds: ["pvc", "1mm", "2mm"], label: "Box edging",
                                   help: DHELP.boxedge, quiet: true})}
    ${edgingHTML(c, "drawer", {label: "Face edging", help: DHELP.faceedge, quiet: true})}
  </div>`;
}

// The kinds a box edging dropdown offers for one board, blank = the section's.
function boxEdgeKinds(board) {
  return ["pvc", "1mm", "2mm"].filter((k) => boardOffers(board, k));
}

function kindLabel(k) {
  return (S.def.edging_prefix || {})[k] || k;
}

// The sub-row under a drawer that differs: its own box board, face board,
// bottom and box edging. Blank is the section's. A face's edging stays the
// section's (ruled so it matches Doors).
function drawerSubRow(c, i, d, span) {
  const def = drawerDefaults(c);
  const board = d.box_edge_board || def.box_edge_board;
  const kind = d.box_edge_kind || def.box_edge_kind;
  const colourKeys = ((S.res && S.res.boards) || []).filter((k) => boardOffers(k, kind));
  const bLost = d.box_edge_board && colourKeys.indexOf(d.box_edge_board) < 0;
  const kinds = boxEdgeKinds(board);
  const kLost = d.box_edge_kind && kinds.indexOf(d.box_edge_kind) < 0;
  return `<tr class="dsub" data-dsub="${i}"><td></td><td colspan="${span}"><div class="dsubgrid">
      <label>Box board ${drawerBoardSelect(`data-d="${i}" data-dk="box_board"`, d.box_board || "",
        "section: " + (def.box_board || "—"), "what this drawer's box is cut from")}</label>
      <label>Face board ${drawerBoardSelect(`data-d="${i}" data-dk="face_board"`, d.face_board || "",
        "section: " + (def.face_board || "—"), "what this drawer's face is cut from")}</label>
      <label>Bottom <select data-d="${i}" data-dk="base" title="how this drawer's bottom is held">
        <option value=""${isSet(d.base) ? "" : " selected"}>(section: ${
          esc(DRAWER_BASE_LABEL[def.base] || def.base)})</option>
        ${(S.def.bases || ["board", "melamine"]).map((b) =>
          `<option value="${esc(b)}"${b === d.base ? " selected" : ""}>${
          esc(DRAWER_BASE_LABEL[b] || b)}</option>`).join("")}</select></label>
      <label>Box edging <span class="leaf">
        <select data-d="${i}" data-dk="box_edge_kind" title="how thick this drawer's box edging is">
          <option value=""${d.box_edge_kind ? "" : " selected"}>(section: ${esc(kindLabel(def.box_edge_kind))})</option>
          ${kLost ? `<option value="${esc(d.box_edge_kind)}" selected>${esc(kindLabel(d.box_edge_kind))} (not offered)</option>` : ""}
          ${kinds.map((k) => `<option value="${esc(k)}"${k === d.box_edge_kind ? " selected" : ""}>${
            esc(kindLabel(k))}</option>`).join("")}</select>
        <select data-d="${i}" data-dk="box_edge_board" title="the colour of this drawer's box edging">
          <option value=""${d.box_edge_board ? "" : " selected"}>(section: ${esc(edgeLabel(def.box_edge_board) || "—")})</option>
          ${bLost ? `<option value="${esc(d.box_edge_board)}" selected>${esc(edgeLabel(d.box_edge_board))} (not offered)</option>` : ""}
          ${colourKeys.map((k) => `<option value="${esc(k)}"${k === d.box_edge_board ? " selected" : ""}>${
            esc(edgeLabel(k))}</option>`).join("")}</select></span></label>
    </div></td></tr>`;
}

// What a row's tooltip says it is edged in: the engine's names, as everywhere.
function drawerRowTip(c, i) {
  const g = drawerGeom(c);
  const e = (g && g.edging) || {};
  const box = ((e.drawer_box || {}).rows || [])[i];
  const face = (e.drawer || {}).name;
  return `Box edging: ${box || "none"} · Face edging: ${face || "none"}`;
}

function drawerNumCell(c, i, d) {
  return `<td class="n">${i + 1}${drawerDiffers(c, d)
    ? `<span class="ddot" title="this drawer differs from the section">●</span>` : ""}</td>`;
}

function drawerEndCell(c, i) {
  const open = drawerOpen(c, i);
  return `<td class="dend"><button type="button" class="dlink" data-ddiff="${i}"
      title="${open ? "hand every choice on this drawer back to the section" : "give this drawer a board, bottom or edging of its own"}">${
      open ? "same as section" : "differs…"}</button><button type="button" class="mini" data-drm="${i}"
      title="Remove this drawer">×</button></td>`;
}

function drawerStackHTML(c) {
  const g = drawerGeom(c);
  const lay = {};
  ((g && g.drawer_layout) || []).forEach((u) => { lay[u.n] = u; });
  const rise = (g && g.drawer_rise) || 21;
  const rows = c.drawers.map((d, i) => {
    const share = (d.mode || "fixed") === "share";
    const u = lay[i + 1];
    const auto = !isSet(d.box_height);
    const over = u && !u.inner && (u.box[5] > u.face[1] || u.box[4] < u.face[0]);
    const max = u ? u.max_box : "";
    const face = share
      ? `<span class="mono dmm" data-mm="${i}" title="shared out of what the fixed rows leave">${d.face_height}</span>
         <input type="number" step="0.1" min="0" class="dshare" data-d="${i}" data-dk="share"
           value="${d.share === undefined || d.share === null ? 1 : d.share}" title="share weight">`
      : `<input type="number" step="1" data-d="${i}" data-dk="face_height" value="${d.face_height}">`;
    const boxCell = auto
      ? `<input type="number" step="1" class="dbox" data-d="${i}" data-dk="box_height" value=""
           placeholder="Auto (≤${max})" title="${esc(DTIP.max)} — type a height to fix it">`
      : `<input type="number" step="1" class="dbox" data-d="${i}" data-dk="box_height"
           value="${d.box_height}"><span class="note mono${over ? " over" : ""}" data-maxbox="${i}"
           title="${esc(DTIP.max)}">≤${max}</span><button type="button" class="mini dautob"
           data-dauto="${i}" title="Auto: the tallest box that fits this face">Auto</button>`;
    return `<tr title="${esc(drawerRowTip(c, i))}">
      ${drawerNumCell(c, i, d)}
      <td><div class="dface"><button type="button" class="dlock${share ? "" : " on"}"
          data-dlock="${i}" title="${esc(DTIP.lock)}">${share ? "🔓" : "🔒"}</button>${face}</div></td>
      <td><div class="dboxc">${boxCell}</div></td>
      <td><input type="number" step="1" data-d="${i}" data-dk="offset"
           value="${isSet(d.offset) ? d.offset : ""}" placeholder="${rise}" title="${esc(DTIP.offset)}"></td>
