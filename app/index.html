<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupboardApp</title>
<!-- The 3D view's libraries, vendored under app/vendor/ and served by the app
     itself, so the 3D tab works with the network off. three.js 0.186.0
     (three.module.js imports ./three.core.js beside it) and camera-controls
     3.1.2. The map has to be here, before any module is imported. -->
<script type="importmap">
{"imports": {"three": "/vendor/three/three.module.js",
             "camera-controls": "/vendor/camera-controls/camera-controls.module.js"}}
</script>
<style>
  /* ---------- the one palette ------------------------------------------
     Session 2 of the UI restructure (28 Sept 2026): styling only. Every
     colour the page uses is a token here — the drawings' inks first, which
     the elevation and nest SVGs share and which do not move, then the page
     chrome. Board colours and pictures in a drawing are data and never come
     through here. */
  :root{
    /* the elevation and nest SVGs already use these — the page matches them */
    --ink:#191c1a; --muted:#767e78; --rule:#aab1a9; --faint:#d3d7d0;
    --carc:#f2f3f0; --door:#dceaea; --face:#f5ebd6;
    --bg:#f3f4f1; --panel:#fff; --line:#e3e5e0;
    --crit:#a4303f; --warn:#8a6d1f; --ok:#2f6b4f;
    /* page chrome (Session 2) */
    --ink-2:#2e3330;                 /* a pressed dark button */
    --surface:#f8f9f7;               /* card headers, table heads, the strip */
    --surface-2:#eceeea;             /* a hovered row, a pressed control */
    --viewport:#eef0ec;              /* the 3D paper behind the canvas */
    --accent:#1f6fd0;                /* the selection, everywhere — the same blue view3d.js draws */
    --accent-ink:#fff;
    --accent-soft:#e6effb;
    --accent-line:#b7cdf0;
    --crit-soft:#f8e3e6; --warn-soft:#f7efd7; --ok-soft:#e0efe6; --info-soft:#eef0ed;
    --crit-line:#e2b8be; --warn-line:#e3d3a3; --ok-line:#b9d6c5;
    --r-s:5px; --r:8px; --r-l:11px;
    --shadow-1:0 1px 2px rgba(25,28,26,.05),0 1px 1px rgba(25,28,26,.03);
    --shadow-2:0 8px 24px rgba(25,28,26,.16),0 2px 6px rgba(25,28,26,.08);
    --focus:0 0 0 3px rgba(31,111,208,.22);
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    /* the editor's section tints — one coloured block per section */
    --sec-size:#e7eef5; --sec-size-line:#cfdce8;
    --sec-outline:#e5f0e7; --sec-outline-line:#c9ded0;
    --sec-structure:#f3efe2; --sec-structure-line:#e0d8c2;
    --sec-doors:#dceaee; --sec-doors-line:#c1dae0;
    --sec-drawers:#f7ead2; --sec-drawers-line:#e6d5b4;
    --sec-corner:#ece5f3; --sec-corner-line:#d7cbe5;
    --sec-supports:#eaeee9; --sec-supports-line:#d3dad1;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
  ::selection{background:var(--accent-soft)}

  /* ---------- controls -------------------------------------------------- */
  button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--faint);
         border-radius:6px;padding:4px 11px;cursor:pointer;line-height:1.35;
         box-shadow:var(--shadow-1);transition:background .12s,border-color .12s,box-shadow .12s}
  button:hover{background:var(--surface);border-color:var(--rule)}
  button:active{background:var(--surface-2);box-shadow:none}
  button:focus-visible{outline:none;box-shadow:var(--focus)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.primary:hover{background:#1a5fb4;border-color:#1a5fb4}
  button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  input,select{font:inherit;color:inherit;background:var(--panel);
               border:1px solid var(--faint);border-radius:6px;padding:4px 8px;width:100%;
               transition:border-color .12s,box-shadow .12s}
  input:hover,select:hover{border-color:var(--rule)}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus)}
  input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:auto;box-shadow:none}
  select{padding-right:6px}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--line);
        white-space:nowrap}
  th{font-weight:600;color:var(--muted);font-size:10.5px;text-transform:uppercase;
     letter-spacing:.05em;position:sticky;top:0;background:var(--surface);z-index:1;
     box-shadow:inset 0 -1px 0 var(--line)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom-color:transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--faint);border-radius:5px;border:2px solid transparent;
                            background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--rule);background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- header, summary strip, tab bar --------------------------- */
  header{display:flex;gap:8px;align-items:center;padding:9px 16px;
         background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:14.5px;margin:0 12px 0 0;font-weight:700;letter-spacing:.01em;
            display:flex;align-items:center;gap:8px}
  header h1::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--accent);
                    box-shadow:inset 3px -3px 0 rgba(255,255,255,.35)}
  header .grow{flex:1}
  header button{padding:5px 12px}
  #jobname{width:190px}
  .grain b{font-size:11px;text-transform:uppercase;letter-spacing:.3px}
  .grain{white-space:nowrap}
  .dirty{font-size:11px;font-weight:700;color:var(--crit);background:var(--crit-soft);
         border:1px solid var(--crit-line);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .dirty::before{content:"● ";font-size:9px}
  #joblist{width:170px}

  #strip{display:flex;gap:0;align-items:stretch;padding:0 16px;
         background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
  #strip .cell{display:flex;flex-direction:column;gap:1px;padding:8px 22px 8px 0;
               margin-right:22px;border-right:1px solid var(--line);justify-content:center}
  #strip .cell:last-child{border-right:none}
  #strip .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
            font-weight:600}
  #strip .v{font-size:15px;font-variant-numeric:tabular-nums;font-weight:500}
  .pill{border-radius:999px;padding:1px 9px;font-size:11.5px;display:inline-block;
        font-weight:600;line-height:1.5;background:var(--info-soft);color:var(--ink);
        border:1px solid transparent;white-space:nowrap}
  .pill.crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
  .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
  .pill.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
  /* colour AND a mark: a critical is never told from a warning by hue alone */
  .pill.crit::before{content:"✕ ";font-size:10px}
  .pill.warn::before{content:"▲ ";font-size:9.5px}
  .pill.ok::before{content:"✓ ";font-size:10.5px}

  nav{display:flex;gap:2px;padding:0 16px;background:var(--panel);
      border-bottom:1px solid var(--line)}
  nav button{border:none;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;
             padding:9px 15px;background:none;color:var(--muted);box-shadow:none;
             margin-bottom:-1px;font-weight:500}
  nav button:hover{background:var(--surface);color:var(--ink)}
  nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

  /* ---------- cards ----------------------------------------------------- */
  main{padding:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);
        margin-bottom:16px;box-shadow:var(--shadow-1)}
  .card>h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
           margin:0;padding:9px 14px;border-bottom:1px solid var(--line);font-weight:700;
           background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0}
  .card>h2 button{text-transform:none;letter-spacing:0;font-weight:500}
  .card>.body{padding:12px 14px}
  .scroll{overflow:auto}

  #cabwrap,.split{display:flex;gap:16px;align-items:flex-start}
  /* The elevation and the list stack on the left; the settings panel is a
     column of its own, starting level with the top of the drawing. */
  #cabmain{flex:1;min-width:0}
  #cabmain>.card:last-child{margin-bottom:0}
  #layers,#elevpick,.zoombar{float:right;margin-top:-3px;display:flex;gap:3px}
  #layers button,#elevpick button,.zoombar button{padding:2px 9px;font-size:11px;
                                  text-transform:none;letter-spacing:0;box-shadow:none}
  #elevpick .elevmode{display:flex;gap:3px;margin-left:10px;padding-left:10px;
                      border-left:1px solid var(--line)}
  #layers button.on,#elevpick button.on{background:var(--accent);color:var(--accent-ink);
                                        border-color:var(--accent)}
  .zoombar{margin-left:10px}
  .zoombar button{min-width:26px}
  #elevation svg,#plan svg{display:block}
  #elevation svg .epanel{cursor:grab}
  #elevation svg .epanel:hover .epan{stroke-width:2.6}
  #cablist{flex:1;min-width:0}

  /* ---------- the 3D tab -------------------------------------------------
     Toolbar over a three-column row — item list, viewport, dock — over a
     status line. The row takes whatever height the tab has, and the
     viewport takes whatever width the two side columns leave. */
  #v3d{display:flex;flex-direction:column;gap:8px;min-height:240px}
  .v3dbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-height:26px}
  .v3dbar button{padding:3px 10px;font-size:11.5px;box-shadow:none}
  .v3dbar button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  #v3dmain{display:flex;gap:8px;flex:1;min-height:0}
  .v3dview{flex:1;min-width:0;position:relative;background:var(--viewport);
           border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .v3dview canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
  .v3dview .v3dnote{position:absolute;left:0;right:0;top:0;padding:8px 12px;
                    font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);
                    pointer-events:none}
  #v3dstatus,#c3dstatus{font-size:11.5px;color:var(--muted);min-height:16px;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  /* The Cabinets tab's 3D (UI restructure, 28 Sept 2026): the one selected
     cabinet alone, the same view as the 3D tab's, over the cabinet list. */
  #cab3d{display:flex;flex-direction:column;gap:7px;padding:10px 14px 12px}
  #c3dview{flex:none;height:clamp(300px,48vh,560px)}
  #c3dview .v3dlegend{max-width:210px}
  #c3dview .v3dempty{position:absolute;inset:0;display:flex;align-items:center;
                     justify-content:center;color:var(--muted);text-align:center;padding:20px;
                     background:rgba(238,240,236,.92);z-index:4}
  #c3dview .v3dempty[hidden]{display:none}
  /* Room's two sub-tabs, and the slim list of what is not placed yet */
  .subtabs{display:inline-flex;gap:2px;margin:0 0 12px;background:var(--surface);
           border:1px solid var(--line);border-radius:999px;padding:3px}
  .subtabs button{border:none;border-radius:999px;padding:4px 16px;background:none;
                  color:var(--muted);box-shadow:none;font-weight:500}
  .subtabs button:hover{color:var(--ink)}
  .subtabs button.on{color:var(--ink);background:var(--panel);font-weight:600;
                     box-shadow:var(--shadow-1);border:1px solid var(--line)}
  .unplaced{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:11.5px;
            color:var(--muted);margin:0 0 10px;min-height:0}
  .unplaced:empty{display:none}
  .unplaced .upchip{border:1px dashed var(--rule);border-radius:999px;padding:2px 10px;
                    background:var(--panel);color:var(--ink);cursor:grab;user-select:none;
                    touch-action:none;font-weight:500}
  .unplaced .upchip:hover{background:var(--accent-soft);border-color:var(--accent-line);
                          border-style:solid}
  #updrag{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:#fff;
          font-size:11px;padding:3px 9px;border-radius:6px;white-space:nowrap;display:none;
          box-shadow:var(--shadow-2)}
  #editor .sec.flash{outline:2px solid var(--accent);outline-offset:1px}
  /* overlays inside the viewport: labels, dimension figures, the view cube,
     the legend, the help card; and the toolbar's dropdowns */
  .v3dview .v3dlabel{position:absolute;padding:1px 7px;border-radius:999px;
                     background:rgba(255,255,255,.94);border:1px solid var(--rule);
                     font-size:11px;font-weight:600;cursor:pointer;user-select:none;
                     line-height:14px;box-shadow:var(--shadow-1)}
  .v3dview .v3dlabel.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .v3dview .v3dbadge{position:absolute;width:16px;height:16px;line-height:14px;text-align:center;
                     border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;
                     border:1px solid transparent;color:#fff}
  .v3dview .v3dbadge.critical{background:var(--crit)}
  .v3dview .v3dbadge.warning{background:var(--warn)}
  .v3dview .v3dbadge.accepted{background:var(--rule)}
  .v3dview .v3ddim{position:absolute;transform:translate(-50%,-50%);font-size:11px;
                   color:var(--accent);background:rgba(255,255,255,.9);padding:0 5px;
                   border-radius:4px;pointer-events:none;white-space:nowrap;font-weight:600}
  .v3dview .v3dcube{position:absolute;right:10px;top:10px;cursor:pointer;touch-action:none}
  .v3dview .v3dlegend{position:absolute;right:10px;bottom:10px;max-width:280px;
                      background:rgba(255,255,255,.94);border:1px solid var(--line);
                      border-radius:var(--r);padding:7px 10px;font-size:11px;
                      box-shadow:var(--shadow-1)}
  .v3dlegend .hd{font-weight:600;display:flex;justify-content:space-between;gap:8px;
                 align-items:center}
  .v3dlegend .hd .tog{padding:0 6px;font-size:11px;line-height:14px;box-shadow:none}
  .v3dlegend.closed .rows,.v3dlegend.closed .nd{display:none}
  .v3dlegend .row{display:flex;gap:6px;align-items:center;margin-top:3px}
  .v3dlegend .sw{width:22px;height:14px;border:1px solid var(--rule);border-radius:3px;
                 display:inline-block;flex:none}
  .v3dlegend .nd{margin-top:5px;color:var(--muted)}
  .v3dview .v3dhelp{position:absolute;left:10px;top:10px;max-width:540px;
                    background:rgba(255,255,255,.96);border:1px solid var(--line);
                    border-radius:var(--r);padding:9px 11px;font-size:11.5px;line-height:1.5;
                    box-shadow:var(--shadow-2)}
  .v3dbar{position:relative}
  .v3dbar .v3dmenu{position:absolute;top:28px;z-index:20;background:var(--panel);
                   border:1px solid var(--line);border-radius:var(--r);padding:4px;
                   display:flex;flex-direction:column;min-width:190px;
                   box-shadow:var(--shadow-2)}
  .v3dbar .v3dmenu[hidden]{display:none}
  /* the box is made empty and unhidden, and filled on its first open: until
     then it drew as a stray pill under the toolbar (seen 28 Sept 2026) */
  .v3dbar .v3dmenu:empty{display:none}
  .v3dbar .v3dmenu button{text-align:left;border:none;background:none;padding:5px 9px;
                          font-size:11.5px;border-radius:5px}
  .v3dbar .v3dmenu button:hover{background:var(--surface-2)}
  .v3dbar .v3dmenu button.on{font-weight:700;color:var(--accent)}
  .v3dbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}

  /* ---------- the one editor and its dock ------------------------------- */
  #editor{width:560px;flex:none;position:sticky;top:10px;max-height:calc(100vh - 30px);
          overflow:auto}
  /* The docked editor (F4): a thin strip with a chevron on its left, the
     editor beside it; closed, only the strip. On the 3D tab it fills the
     tab's height instead of sticking to the page. */
  .dock{display:flex;flex:none;align-items:flex-start;gap:0}
  .dockstrip{width:18px;flex:none;align-self:stretch;display:flex;align-items:flex-start;
             justify-content:center;padding-top:8px;position:relative}
  .dockstrip::before{content:"";position:absolute;left:8px;top:34px;bottom:8px;width:1px;
                     background:var(--line);border-radius:1px}
  .dockstrip .docktog{padding:0;width:18px;height:18px;font-size:9px;line-height:16px;
                      border:1px solid var(--line);border-radius:999px;box-shadow:none;
                      background:var(--panel);color:var(--muted);cursor:pointer;
                      transition:transform .15s,background .12s,color .12s}
  .dockstrip .docktog:hover{background:var(--accent-soft);color:var(--accent);
                            border-color:var(--accent-line)}
  .dock.closed #editor{display:none}
  .dock.closed .docktog{transform:rotate(180deg)}
  .dock.closed .dockstrip::before{display:none}
  #roomwrap{display:flex;gap:16px;align-items:flex-start}
  #v3ddock{align-self:stretch;min-height:0}
  #v3ddock #editor{position:static;max-height:100%;height:100%;margin-top:0}
  #roomdock #editor{margin-top:0}
  #editor .dockissues{padding:8px 14px 0;font-size:11.5px}
  #editor .dockissues:empty{display:none}
  /* keepPlace holds the control in use still across a repaint; the browser's
     own scroll anchoring on top of it would move the dock twice */
  #editor{overflow-anchor:none}
  #editor .dockissues div{margin:2px 0;cursor:pointer;padding:3px 8px;border-radius:5px;
                          border:1px solid transparent}
  #editor .dockissues div:hover{border-color:var(--line);background:var(--surface)}
  #editor .dockissues .critical{color:var(--crit)}
  #editor .dockissues .warning{color:var(--warn)}
  #editor .dockissues .accepted{color:var(--muted)}
  #editor .dockissues .critical::before{content:"✕ ";font-weight:700;font-size:10px}
  #editor .dockissues .warning::before{content:"▲ ";font-weight:700;font-size:9.5px}
  #editor .dockissues .accepted::before{content:"✓ ";font-weight:700;font-size:10.5px}
  #plan .cab.sel{stroke:var(--accent) !important;stroke-width:2 !important}
  #elevation .ecabg.sel .ecab,#elevation .ecabg.sel .epan{stroke:var(--accent) !important;stroke-width:2.5 !important}
  #cutlist tr.flash td{background:var(--accent-soft)}
  /* the 3D tab's item list and part card */
  #v3dlist{width:190px;flex:none;font-size:11.5px;display:flex;flex-direction:column;
           min-height:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
           box-shadow:var(--shadow-1)}
  #v3dlist.closed{width:22px}
  #v3dlist .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;
               border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;
               letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surface);
               border-radius:var(--r) var(--r) 0 0}
  #v3dlist.closed .hd span,#v3dlist.closed .rows{display:none}
  #v3dlist .hd button{padding:0 4px;border:none;background:none;font-size:11px;box-shadow:none}
  #v3dlist .rows{overflow:auto;flex:1}
  #v3dlist .row{display:flex;gap:6px;align-items:center;padding:4px 9px;cursor:pointer;
                border-bottom:1px solid var(--line)}
  #v3dlist .row:hover{background:var(--surface)}
  #v3dlist .row.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  #v3dlist .row.off{color:var(--muted)}
  #v3dlist .row .n{width:22px;font-weight:600;text-align:right}
  #v3dlist .row .d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #v3dlist .row .eye{padding:0 4px;border:none;background:none;font-size:12px;opacity:.7;
                     box-shadow:none}
  #v3dlist .row.hidden3d .eye{opacity:.25}
  .v3dview .v3dcard{position:absolute;left:10px;bottom:10px;max-width:min(340px,calc(100% - 310px));
                    background:rgba(255,255,255,.96);border:1px solid var(--line);
                    border-radius:var(--r);padding:8px 11px;font-size:11.5px;line-height:1.45;
                    box-shadow:var(--shadow-2)}
  .v3dview .v3dcard b{font-size:12px}
  .v3dview .v3dcard .x{float:right;padding:0 5px;border:none;background:none;box-shadow:none}
  .v3dview .v3dcard button.go{margin-top:5px;padding:2px 9px;font-size:11px}
  .v3dview .v3dctx{position:absolute;z-index:30;background:var(--panel);border:1px solid var(--line);
                   border-radius:var(--r);padding:4px;display:flex;flex-direction:column;min-width:170px;
                   box-shadow:var(--shadow-2)}
  .v3dview .v3dctx button{text-align:left;border:none;background:none;padding:5px 9px;font-size:11.5px;
                          border-radius:5px;box-shadow:none}
  .v3dview .v3dctx button:hover{background:var(--surface-2)}
  .v3dview .v3dctx[hidden]{display:none}
  #cablist tr.sel td{background:var(--accent-soft)}
  #cablist tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  #cablist tbody tr{cursor:pointer}
  #cablist tbody tr:hover td{background:var(--surface)}
  #cablist tr.sel:hover td{background:var(--accent-soft)}

  fieldset{border:none;border-top:1px solid var(--line);margin:0;padding:10px 0 4px}
  fieldset:first-of-type{border-top:none;padding-top:0}
  legend{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
         padding:0;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:8px}
  .f{display:flex;flex-direction:column;gap:3px}
  .f label{font-size:11px;color:var(--muted);font-weight:500}
  .f.wide{grid-column:1/-1}

  /* One coloured block per section, so the eye finds Doors without reading.
     The tints are tokens: a section's colour is its own, and nowhere else. */
  .sec{border:1px solid var(--line);border-radius:var(--r);padding:9px 12px 11px;
       margin-bottom:10px}
  .sec>h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.01em;
          display:flex;align-items:center;gap:8px}
  .f .prob{display:block;color:var(--crit);font-size:11px;line-height:1.35;margin-top:2px;
           font-weight:500}
  .f .prob::before{content:"▲ ";font-size:9.5px}
  .f input.bad{border-color:var(--crit);background:var(--crit-soft)}
  .cdiag{margin:6px 0 4px;border:1px solid var(--line);border-radius:var(--r-s);
         background:var(--panel);padding:4px}
  .cdiag svg{display:block;width:100%;height:auto;max-height:260px}
  .cfix{color:var(--crit);font-weight:600}
  .sec>.hint{font-size:11px;color:var(--muted);margin:3px 0 0;line-height:1.35}
  .sec>.off{font-size:11.5px;color:var(--muted);margin:5px 0 0}
  .sec .tick{margin-left:auto;font-weight:400;font-size:11px;color:var(--muted);
             display:flex;align-items:center;gap:5px;cursor:pointer}
  .sec .tick input{width:auto;cursor:pointer}
  .sec .grid{margin-top:8px}
  .sec.s-size{background:var(--sec-size);border-color:var(--sec-size-line)}
  .sec.s-outline{background:var(--sec-outline);border-color:var(--sec-outline-line)}
  .sec.s-structure{background:var(--sec-structure);border-color:var(--sec-structure-line)}
  .sec.s-doors{background:var(--sec-doors);border-color:var(--sec-doors-line)}
  .sec.s-drawers{background:var(--sec-drawers);border-color:var(--sec-drawers-line)}
  .sec.s-corner{background:var(--sec-corner);border-color:var(--sec-corner-line)}
  .sec.s-supports{background:var(--sec-supports);border-color:var(--sec-supports-line)}
  .sec input,.sec select{background:rgba(255,255,255,.85)}
  .sec input:focus,.sec select:focus{background:var(--panel)}
  .supblock{border-top:1px solid var(--sec-supports-line);padding:6px 0 4px}
  .supblock:first-of-type{border-top:0}
  .supblock h4{margin:0;font-size:12px;display:flex;align-items:center;gap:8px}
  .supblock h4 input[type=number]{width:52px}
  .supblock.isoff h4{color:var(--muted)}
  .supblock .edges{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:11px}
  .supblock .edges label{display:flex;align-items:center;gap:3px}
  .supblock .drawn{font-size:11px;color:var(--muted);margin-top:4px}
  .supblock h4 .mini{margin-left:auto;padding:0 6px;line-height:16px;font-size:12px;box-shadow:none}
  .supblock.isback{border-top-style:dashed}
  #editor h2 .edsave{float:right;font-size:11px;padding:2px 10px}
  table.rows.asquoted td{color:var(--muted)}
  .unavail input,.unavail select{opacity:.5;background:var(--carc)}
  .unavail label{opacity:.65}
  .unavail .why{font-size:10.5px;color:var(--warn);font-style:italic}
  .leaf{display:flex;gap:6px;align-items:center;margin-top:4px}
  .leaf b{font-weight:600;min-width:74px}
  .leaf select{width:auto}
  .leaf .hinge{flex:none;min-width:136px}  /* so each leaf's board lines up */
  .swing{font-size:11.5px;margin-top:6px}
  .swing.bad{color:var(--warn)}
  .swing.bad::before{content:"▲ ";font-size:9.5px}
  .swing.ok{color:var(--ok)}
  .swing.ok::before{content:"✓ ";font-size:10.5px}
  .dtot{display:flex;gap:16px;align-items:baseline;margin-top:7px;
        font-variant-numeric:tabular-nums}
  .dtot .over{color:var(--crit);font-weight:700}
  .presets{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  /* the Boards tab's swatch, not a drawing legend's <rect class="swatch">,
     which this used to resize to 26 px and push over its own text */
  .swatch:not(rect){width:26px;height:26px;border-radius:5px;display:block;object-fit:cover;
          border:1px solid var(--rule);box-shadow:var(--shadow-1)}
  .swatch.none{background:repeating-linear-gradient(45deg,var(--carc),var(--carc) 4px,
               var(--panel) 4px,var(--panel) 8px)}
  /* The board picture: Browse…, or drop the image straight on it. A drop on
     this backend hands over the file's CONTENTS and no path, so the bytes go
     to the server and it copies them into Pictures/ — see cabinetgen/pictures.py. */
  .picdrop{display:flex;gap:10px;align-items:flex-start;margin-top:4px;padding:8px;
           border:1px dashed var(--rule);border-radius:var(--r)}
  .picdrop.empty{opacity:.92}
  .picdrop.over{border-color:var(--ok);border-style:solid;
                background:var(--ok-soft)}
  .picpreview{width:72px;height:72px;flex:0 0 auto;border-radius:6px;
              object-fit:cover;border:1px solid var(--rule);display:block}
  .picpreview.none{background:repeating-linear-gradient(45deg,var(--carc),var(--carc) 5px,
                   var(--panel) 5px,var(--panel) 10px)}
  .picdrop input[readonly]{opacity:.8}
  .note .bad{color:var(--crit)}
  header .grow,.matline .grow{flex:1}
  .orients{display:flex;gap:6px;flex-wrap:wrap}
  .orient{display:flex;align-items:center;gap:6px;padding:5px 8px;
          border:1px solid var(--rule);border-radius:var(--r);cursor:pointer;
          font-size:11px;line-height:1.15;max-width:170px;background:var(--panel)}
  .orient:hover{border-color:var(--accent-line)}
  .orient.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--focus)}
  .orient input{margin:0}
  .orient svg{flex:0 0 auto;color:var(--ink)}
  .tape{margin-top:8px}
  .tape>label{font-size:11px;color:var(--muted);display:block;font-weight:500}
  .tape .leaf{margin-top:2px}
  .tape .leaf select{flex:1;min-width:0}
  .tape .leaf b{min-width:96px;font-variant-numeric:tabular-nums}
  .tape .leaf b.over{color:var(--crit)}
  .req{color:var(--crit);font-weight:700}
  .f.bad input{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit-soft)}
  /* a board with no edging at all: grey, because that is a setting, not a fault */
  .tape .leaf b.off{color:var(--muted);font-weight:400}
  .tape .note{display:block;margin-top:2px;line-height:1.3}
  /* The Drawers section (redone 29 September 2026): Setup and the Stack as
     sub-headed blocks inside the Drawers tint, one help line under each
     control, and a five-column stack with room to breathe in the 560 column. */
  #drawerbox .dblk{margin:6px 0 0;padding:8px 10px 10px;border:1px solid var(--sec-drawers-line);
                   border-radius:var(--r-s);background:rgba(255,255,255,.38)}
  #drawerbox .dblk>h4{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.05em;
                      text-transform:uppercase;color:var(--muted)}
  #drawerbox .drow{margin:0 0 9px}
  #drawerbox .drow:last-child{margin-bottom:0}
  #drawerbox .drow>label,#drawerbox .tape>label{display:block;font-size:11.5px;font-weight:600;
                      color:var(--ink);margin:0 0 2px}
  #drawerbox .drow>select,#drawerbox .drow>input{width:auto;min-width:160px}
  #drawerbox .dhelp{display:block;font-size:11px;color:var(--muted);line-height:1.35;margin-top:3px}
  #drawerbox .dblk>.dhelp{margin:0 0 6px}
  #drawerbox .dstatus{display:block;font-size:11.5px;margin-top:3px;color:var(--ink)}
  #drawerbox .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #drawerbox .pair select{width:100%;min-width:0}
  #drawerbox .tape{margin:0 0 9px}
  #drawerbox table{table-layout:fixed}
  #drawerbox th,#drawerbox td{padding:3px 4px;font-size:12px;vertical-align:middle}
  #drawerbox th{background:transparent;box-shadow:none;position:static}
  #drawerbox input,#drawerbox select{padding:2px 4px}
  #drawerbox col.c-n{width:30px}
  #drawerbox col.c-face{width:150px}
  #drawerbox col.c-box{width:150px}
  #drawerbox col.c-off{width:62px}
  #drawerbox col.c-read{width:auto}
  #drawerbox col.c-end{width:auto}
  #drawerbox .ddot{color:var(--accent);margin-left:3px;font-size:9px;vertical-align:middle}
  #drawerbox .dface,#drawerbox .dboxc{display:flex;align-items:center;gap:4px}
  #drawerbox .dface input[data-dk="face_height"]{width:70px}
  #drawerbox .dmm{min-width:34px;color:var(--muted);text-align:right}
  #drawerbox .dshare{width:48px;font-size:11px}
  #drawerbox .dlock{flex:none;padding:0 3px;line-height:18px;font-size:12px;background:transparent;
                    border:1px solid transparent;box-shadow:none;opacity:.55}
  #drawerbox .dlock.on{opacity:1}
  #drawerbox .dlock:hover{border-color:var(--rule)}
  #drawerbox input.dbox{width:92px}
  #drawerbox .dboxc input.dbox:not(:placeholder-shown){width:54px}
  #drawerbox td [data-maxbox]{font-size:10.5px;color:var(--muted)}
  #drawerbox td [data-maxbox].over{color:var(--crit);font-weight:600}
  #drawerbox .dautob{padding:0 5px;line-height:16px;font-size:10.5px;box-shadow:none}
  #drawerbox td.dend{text-align:right;white-space:nowrap}
  #drawerbox .dlink{background:none;border:0;box-shadow:none;padding:0 4px;color:var(--accent);
                    font-size:11px;text-decoration:underline;cursor:pointer}
  #drawerbox td.dend .mini{padding:0 6px;line-height:16px;box-shadow:none}
  #drawerbox tr.dsub td{padding-top:0;border-top:none}
  #drawerbox .dsubgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;padding:6px 8px;
                       border-left:2px solid var(--accent-line);background:rgba(255,255,255,.55);
                       border-radius:0 var(--r-s) var(--r-s) 0}
  #drawerbox .dsubgrid>label{display:flex;flex-direction:column;gap:2px;font-size:11px;
                             color:var(--muted);font-weight:500}
  #drawerbox .dsubgrid select{width:100%;min-width:0}
  #drawerbox .dsubgrid .leaf{margin:0}
  #drawerbox .dtot .sep{color:var(--muted);margin:0 -8px}
  #elevation{position:relative}
  #elevation svg{user-select:none;-webkit-user-select:none}
  #elevation svg .ecabg{cursor:grab}
  #elevation svg .ecabg.erun{cursor:pointer}
  #elevation svg .ecabg:hover .ecab{stroke-width:2.2}
  #elevation svg .ecabg.dragging{cursor:grabbing;opacity:.6}
  #elevdrag{position:absolute;background:var(--ink);color:#fff;font-size:11px;
            padding:3px 8px;border-radius:6px;pointer-events:none;display:none;
            white-space:nowrap;z-index:5;box-shadow:var(--shadow-2)}
  #elevation svg .fdiv{cursor:ns-resize}
  #elevation svg .fdiv:hover{stroke-opacity:.9}
  .rows td,.rows th{padding:3px 5px}
  .rows th{background:transparent;box-shadow:none;position:static}
  .note{color:var(--muted);font-size:11.5px}
  .mono{font-variant-numeric:tabular-nums}
  .bespoke{background:var(--face);border:1px solid var(--rule);border-radius:var(--r-s);
           padding:7px 9px;font-size:12px;margin-top:8px}

  /* ---------- issues: colour AND a mark, never colour alone ------------- */
  .issue{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);
         align-items:baseline}
  .issue:last-child{border-bottom:none}
  .issue .lvl{flex:none;min-width:84px;font-size:10px;text-transform:uppercase;
              letter-spacing:.05em;font-weight:700;border-radius:999px;padding:1px 8px;
              text-align:center;background:var(--info-soft);color:var(--muted);line-height:1.6}
  .issue.critical .lvl{color:var(--crit);background:var(--crit-soft)}
  .issue.critical .lvl::before{content:"✕ "}
  .issue.warning .lvl{color:var(--warn);background:var(--warn-soft)}
  .issue.warning .lvl::before{content:"▲ ";font-size:9px}
  .issue .where{flex:none;width:70px;color:var(--muted);font-variant-numeric:tabular-nums}
  .issue .msg{flex:1}
  .issue .ref{flex:none;color:var(--muted);font-size:11px}
  .issue.accepted{color:var(--muted);background:var(--surface)}
  .issue.accepted .lvl{color:var(--ok);background:var(--ok-soft)}
  .issue.accepted .lvl::before{content:"✓ "}
  .issue .why{display:block;font-size:11.5px;margin-top:2px}
  .issue .acts{flex:none;display:flex;gap:6px;align-items:baseline}
  .acceptform{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .acceptform input{width:260px}
  .lapsenote{padding:7px 14px;border-bottom:1px solid var(--line);font-size:12px;
             color:var(--warn);background:var(--warn-soft)}
  .lapsenote::before{content:"▲ ";font-size:9.5px;font-weight:700}
  tr.hasissue td{background:var(--crit-soft)}
  .rowissue{font-size:11.5px;padding:2px 8px 5px 18px}
  .rowissue.critical{color:var(--crit)}
  .rowissue.critical::before{content:"✕ ";font-weight:700;font-size:10px}
  .rowissue.warning{color:var(--warn)}
  .rowissue.warning::before{content:"▲ ";font-weight:700;font-size:9.5px}

  .empty{padding:28px 14px;text-align:center;color:var(--muted);margin:10px;
         border:1px dashed var(--faint);border-radius:var(--r)}
  td.empty{border:none;margin:0}

  /* ---------- toasts, drag readouts, dialogs ---------------------------- */
  @keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #toast{position:fixed;right:16px;bottom:16px;max-width:520px;background:var(--ink);
         color:#fff;padding:10px 14px 10px 36px;border-radius:var(--r);display:none;
         white-space:pre-wrap;box-shadow:var(--shadow-2);z-index:9;line-height:1.45;
         animation:toastin .18s ease-out}
  #toast::before{content:"✓";position:absolute;left:13px;top:10px;font-weight:700;
                 color:#9fd7b6}
  #toast.bad{background:var(--crit)}
  #toast.bad::before{content:"✕";color:#fff}
  #plan svg .cab{cursor:grab}
  #plan svg .cab.dragging{cursor:grabbing}
  /* A label is drawn over the middle of its cabinet — exactly where a cabinet is
     grabbed — and a panel's number sits beside it, over the next cabinet. Text
     that took the press left dead spots where a drag did nothing (22 Sept 2026). */
  #plan svg text{pointer-events:none}
  #plan svg .front{transition:opacity .08s}
  #plan.showfronts svg .front{opacity:1 !important}
  #dragreadout{position:absolute;background:var(--ink);color:#fff;font-size:11px;
               padding:3px 8px;border-radius:6px;pointer-events:none;display:none;
               white-space:nowrap;z-index:5;box-shadow:var(--shadow-2)}
  #plan{position:relative}
  .sheetsvg{overflow:auto;border-top:1px solid var(--line);padding:10px 14px}
  .sheetsvg svg{display:block}
  .matline{display:flex;gap:18px;align-items:baseline;padding:9px 14px;flex-wrap:wrap}
  .matline b{font-size:14px}
  dialog{border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;min-width:300px;
         box-shadow:var(--shadow-2);color:var(--ink)}
  dialog::backdrop{background:rgba(25,28,26,.35)}
  /* The hand, as two small plan pictures. A corner unit is the one thing in
     this editor where a word ("left") is genuinely ambiguous until you see it,
     so the picture is the control and the word is the label. */
  .hands{display:flex;gap:6px;margin-top:4px}
  .handopt{flex:1;display:block;border:1px solid var(--rule);border-radius:var(--r);
           padding:6px 7px;cursor:pointer;font-size:11px;line-height:1.15;background:var(--panel)}
  .handopt:hover{border-color:var(--accent-line)}
  .handopt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--focus)}
  .handopt input{display:none}
  .handopt svg{display:block;width:100%;height:44px;color:var(--ink)}
  .handopt b{display:block;font-size:11.5px;margin-top:3px}
  .handopt span{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
  .handopt .wall{stroke:currentColor;stroke-width:2.5;opacity:.4;fill:none}
  .handopt .box{fill:var(--door);stroke:currentColor;stroke-width:1.2}
  .handopt .front{stroke:currentColor;stroke-width:2;fill:none}
  .handopt .blindp{fill:currentColor;opacity:.4}
  /* A field whose answer is typed somewhere else: greyed like an unavailable
     one, but showing the engine's real figure rather than nothing. */
  .derived input{opacity:.55;background:var(--carc)}
  .derived label{opacity:.7}
  .derived .why{font-size:10.5px;color:var(--muted);font-style:italic}

  /* ---------- narrowed ---------------------------------------------------
     The pywebview window opens at 1360 x 900. Narrowed past where a 560 px
     editor and a drawing fit side by side, the dock drops under the drawing
     with the editor full width; nothing else moves. */
  @media (max-width:1080px){
    #cabwrap,#roomwrap,#v3dmain{flex-wrap:wrap}
    .dock{width:100%}
    .dock #editor,#v3ddock #editor{width:auto;flex:1;position:static;max-height:none;height:auto}
    #v3dview{min-height:420px}
    .split{flex-wrap:wrap}
    .split>.card[style*="width:500px"]{width:100% !important}
  }
</style>
</head>
<body>

<header>
  <h1>CupboardApp</h1>
  <input id="jobname" placeholder="job name" title="job name">
  <button id="new">New</button>
  <button id="save">Save</button>
  <select id="joblist" title="saved jobs"></select>
  <button id="load">Load</button>
  <button id="jobdel" title="move the selected job to jobs/_deleted/">Delete</button>
  <span id="dirty" class="dirty" hidden>unsaved changes</span>
  <button id="fixture" title="the October 2025 wardrobe regression fixture">Oct 2025</button>
  <span class="grow"></span>
  <button id="export" class="primary">Export cut list</button>
</header>

<div id="strip"></div>

<nav>
  <button data-tab="catalogue" class="on">Catalogue</button>
  <button data-tab="cabinets">Cabinets</button>
  <button data-tab="room">Room</button>
  <button data-tab="view3d">3D view</button>
  <button data-tab="cutlist">Cut list</button>
  <button data-tab="nesting">Nesting</button>
  <button data-tab="validation">Validation</button>
</nav>

<main>
  <section id="tab-cabinets" hidden>
    <div id="cabwrap">
      <div id="cabmain">
        <!-- The selected cabinet alone in 3D (UI restructure, 28 Sept 2026):
             the same view as the 3D tab — app/view3d.js, its own instance — with
             its shelves, supports and attached panels, and no room. The wall
             elevations moved to Room -> Elevation. -->
        <div class="card" id="cab3dcard">
          <h2>3D <span id="c3dtitle" style="text-transform:none;letter-spacing:0"></span></h2>
          <div id="cab3d">
            <div id="c3dbar" class="v3dbar"></div>
            <div id="c3dview" class="v3dview"></div>
            <div id="c3dstatus"></div>
          </div>
        </div>
        <div class="card" id="cablist">
          <h2>Cabinets <button id="add" style="float:right;margin-top:-3px">Add cabinet</button></h2>
          <div class="scroll" id="cabtable"></div>
        </div>
      </div>
      <!-- The ONE editor. It is moved, never copied, into whichever tab's dock
           is showing (Cabinets, Room, 3D), so there is one thing that can be
           edited and nothing that can disagree with it. -->
      <div class="dock" id="cabdock"><div class="dockstrip"><button class="docktog" title="collapse the editor">&#x276F;</button></div>
        <div class="card" id="editor"></div></div>
    </div>
  </section>

  <!-- Catalogue (28 September 2026): the Boards tab, unchanged, as one of two
       sub-tabs, beside the runner library. Hinges and handles come later. -->
  <section id="tab-catalogue">
    <div class="subtabs" id="catsubs"><button data-catsub="boards" class="on">Boards</button><button
      data-catsub="runners">Runners</button></div>
    <div id="catboards">
      <div class="card"><h2>Board library</h2><div id="boards"></div></div>
    </div>
    <div id="catrunners" hidden>
      <div class="card"><h2>Runner library</h2><div id="runners"></div></div>
    </div>
  </section>

  <section id="tab-room" hidden>
    <div class="subtabs" id="roomsubs"><button data-roomsub="plan" class="on">Plan</button><button
      data-roomsub="elev">Elevation</button></div>
    <div id="roomwrap">
      <div id="roommain" style="flex:1;min-width:0">
        <div class="unplaced" id="unplaced-room"></div>
        <div class="card" id="plancard">
          <h2>Plan <span id="planzoombar" class="zoombar"><button data-zoom="0.8"
            title="zoom out">&minus;</button><button data-zoom="reset"
            id="planzoom" title="back to 100%">100%</button><button data-zoom="1.25"
            title="zoom in">+</button></span> <span id="layers"></span></h2>
          <div class="scroll" id="plan" style="padding:8px 12px"></div>
        </div>
        <!-- The wall elevations, moved here from the Cabinets tab unchanged
             (UI restructure, 28 Sept 2026). One wall face on; no Run. -->
        <div class="card" id="elevcard" hidden>
          <h2>Elevation <span id="elevzoombar" class="zoombar"><button data-zoom="0.8"
            title="zoom out">&minus;</button><button data-zoom="reset"
            id="elevzoom" title="back to 100%">100%</button><button data-zoom="1.25"
            title="zoom in">+</button></span> <span id="elevpick"></span></h2>
          <div class="scroll" id="elevation" style="padding:8px 12px"></div>
        </div>
      </div>
      <div class="dock" id="roomdock"><div class="dockstrip"><button class="docktog" title="collapse the editor">&#x276F;</button></div></div>
    </div>
    <div id="roomplanonly">
    <div class="split">
      <div class="card" style="flex:1;min-width:0">
        <h2>Walls</h2>
        <div id="room"></div>
      </div>
      <div class="card" style="width:500px;flex:none">
        <h2>Placements</h2>
        <div id="places"></div>
      </div>
    </div>
    <div class="split">
      <div class="card" style="flex:1;min-width:0">
        <h2>Gaps</h2>
        <div id="gaps"></div>
      </div>
      <div class="card" style="width:500px;flex:none">
        <h2>Plinth</h2>
        <div id="plinth"></div>
      </div>
    </div>
    </div>
  </section>

  <section id="tab-cutlist" hidden>
    <div class="card"><h2>Cut list</h2><div class="scroll" id="cutlist"></div></div>
  </section>

  <section id="tab-nesting" hidden>
    <div id="nesting"></div>
  </section>

  <section id="tab-validation" hidden>
    <div class="card"><h2>Validation</h2><div id="validation"></div></div>
  </section>

  <!-- The 3D view (Part F). The viewport fills the window below the tab bar
       and never makes the page scroll; the module app/view3d.js is loaded the
       first time this tab is opened, so start-up is untouched. -->
  <section id="tab-view3d" hidden>
    <div id="v3d">
      <div id="v3dbar" class="v3dbar"></div>
      <div class="unplaced" id="unplaced-3d" style="margin:0"></div>
      <div id="v3dmain">
        <div id="v3dlist"></div>
        <div id="v3dview" class="v3dview"></div>
        <div class="dock" id="v3ddock"><div class="dockstrip"><button class="docktog" title="collapse the editor">&#x276F;</button></div></div>
      </div>
      <div id="v3dstatus"></div>
    </div>
  </section>
</main>

<div id="toast"></div>
<div id="updrag"></div>
<!-- Export: which walls' elevations to write (UI restructure, 28 Sept 2026) -->
<dialog id="exportdlg">
  <form method="dialog">
    <b>Export cut list</b>
    <p class="note" style="margin:6px 0 8px">The Plazaboard CSVs, the sheet layouts and the
      plan are always written. Tick the walls whose elevations go with them.</p>
    <div id="exportwalls" style="display:flex;flex-direction:column;gap:4px;margin-bottom:12px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button value="cancel">Cancel</button>
      <button value="go" class="primary" id="exportgo">Export</button>
    </div>
  </form>
</dialog>

<script>
"use strict";

/* ---------- state ------------------------------------------------------- */

const S = {
  job: null,        // the job, exactly as store.py serialises it
  res: null,        // last /api/compute response
  sel: null,        // selected cabinet index
  selRendered: -2,  // which index the editor DOM currently shows
  dirty: false,     // edits are on screen that are not on disk
  tab: "catalogue", // a new job starts on Catalogue -> Boards: board selection drives everything
  def: null,        // /api/defaults
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s === null || s === undefined ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

async function post(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  return r.json();
}

let toastTimer = null;
function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.className = bad ? "bad" : "";
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, bad ? 9000 : 4000);
}

/* ---------- the job ----------------------------------------------------- */

// A new project starts with no boards at all. Nothing can be cut until one is
// selected from the library, which is the point — a cabinet has to be cut from
// something, and guessing which board that is has never ended well.
function blankJob() {
  return {name: "untitled", boards: [], materials: {}, cabinets: [], loose: [],
          placements: []};
}

/* The job's placements, always an array. A job saved with no room carries no
   `placements` key (store writes none, so the file round-trips), and neither
   does a job the server hands back after a board change — so every read goes
   through here rather than trusting the key to be there. Found 23 September
   2026: Add a room on a new job threw in renderPlaces and blanked the Room tab. */
function places() {
  if (!Array.isArray(S.job.placements)) S.job.placements = [];
  return S.job.placements;
}

function blankCabinet(number) {
  return {
    number: number, width: 600, height: 2400, depth: 500,
    kind: "tall", back: "four", template: "standard",
    // Typed from the start (27 September 2026), the rows for its kind (28
    // September 2026), filled in by /api/support-defaults once the boards are
    // chosen — cut from the carcass, in that board's own edging.
    support_rows: [],
    supports: 0, edged_supports: 0, white_supports: 0,
    shelves: 0, fixed_shelves: 0, shelf_width: null,
    divider_height: null, divider_count: 0,
    doors: 1, door_height: null, door_hinges: [], has_doors: null, door_boards: [],
    drawers: [], has_drawers: null,
    exposed_sides: 0,
    carcass_board: "", exterior_board: "", back_board: "", exterior_tape: "2mm",
    door_edge_kind: null, door_edge_board: null,
    drawer_edge_kind: null, drawer_edge_board: null,
    drawer_carcass_board: null, drawer_face_board: null,
    carcass_edge: null, door_edge: null, drawer_box_edge: null,
    bespoke: [], note: "", footprint: [],
    corner_style: "", arm_a: null, arm_b: null, face_a: null, face_b: null,
    corner_unit: null, corner_hand: "", blind_width: null,
    blind_board: "", blind_edge_kind: null,
    arm_shelves: 0, arm_shelf_arm: "a", arm_shelf_depth: null,
    mitred_shelves: 0, corner_door_width: null,
  };
}

/* ---------- compute ----------------------------------------------------- */

let computeTimer = null;
// Nothing reaches the disk until Save is pressed — a saved job is the price
// capture, so an experiment must not be able to move one by itself (ruled
// 20 September 2026). The marker is what makes "not saved yet" visible, and the
// browser asks before a reload or a close throws the edits away.
function markDirty(on) {
  S.dirty = !!on;
  const el = $("dirty");
  if (el) el.hidden = !S.dirty;
}

window.addEventListener("beforeunload", (e) => {
  if (!S.dirty) return;
  e.preventDefault();
  e.returnValue = "";
});

/* A file dropped anywhere but on the board-picture zone would otherwise make the
   window navigate to that file, which throws the whole app — and the unsaved
   job with it — away. The zone stops the event before this sees it.          */
["dragover", "drop"].forEach((ev) => window.addEventListener(ev, (e) => {
  e.preventDefault();
  if (ev === "drop" && e.dataTransfer && e.dataTransfer.files.length) {
    toast("drop a board picture on the picture box in the Boards tab", true);
  }
}));

// True when the edits should be thrown away: either there are none, or the
// operator said so. Asked before anything replaces the job on screen.
function okToDiscard(what) {
  if (!S.dirty) return true;
  return window.confirm(
    `${S.job.name || "This job"} has unsaved changes.\n\n` +
    `${what} will discard them. Save first if you want to keep them.\n\nDiscard?`);
}

function schedule() {
  markDirty(true);
  clearTimeout(computeTimer);
  computeTimer = setTimeout(compute, 180);
}

let computeSeq = 0;

async function compute() {
  S.job.name = $("jobname").value.trim() || "untitled";
  const seq = ++computeSeq;
  const res = await post("/api/compute", {job: S.job});
  if (seq !== computeSeq) return;   // a newer job is already being computed
  S.res = res;
  if (!res.ok) toast(res.error, true);
  dropLapsed(res.lapsed || []);
  renderStrip();
  if (S.tab === "catalogue" && S.catSub === "boards" && S.lib) drawBoards();
  if (S.tab === "catalogue" && S.catSub === "runners" && S.rlib) drawRunners();
  renderList();
  refreshScene();          // the 3D views catch up, now or when next shown
  renderTab();             // the wall elevation, where it is showing (Room -> Elevation)
}

/* ---------- accepted criticals --------------------------------------------
   A site-dependent critical can be accepted with a reason, and the export then
   goes ahead (ruled 22 September 2026; today the tip-up check alone). Which
   checks can be accepted, and the fingerprint an acceptance is stored with, are
   the engine's answers — `/api/accept` and `validate.ACCEPTABLE`. The browser
   stores what comes back and decides nothing.

   An acceptance lapses when what the check read has changed. The engine says
   which in `lapsed`; they are taken out of the job here and said out loud, and
   the critical blocks again.                                                 */

S.lapsedNotes = [];

function acceptances() {
  if (!Array.isArray(S.job.acceptances)) S.job.acceptances = [];
  return S.job.acceptances;
}

function dropLapsed(lapsed) {
  if (!lapsed.length) return;
  const gone = (a) => lapsed.some((l) => l.check === a.check && String(l.where) === String(a.where));
  S.job.acceptances = acceptances().filter((a) => !gone(a));
  if (!S.job.acceptances.length) delete S.job.acceptances;   // written only when present
  lapsed.forEach((l) => S.lapsedNotes.push(
    `Acceptance for ${l.where} (${l.check}) was cleared because the cabinet or the ` +
    `ceiling changed — it blocks again until it is looked at afresh.`));
  markDirty(true);
  toast(S.lapsedNotes.slice(-lapsed.length).join("\n"), true);
}

// A critical that still blocks: not accepted.
function blocksExport(i) { return i.level === "critical" && !i.accepted; }

/* ---------- summary strip ----------------------------------------------- */

function renderStrip() {
  const r = S.res;
  if (!r) { $("strip").innerHTML = ""; return; }
  const cells = [];
  const cell = (k, v) => cells.push(
    `<div class="cell"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`);

  const panels = Object.values(r.summary.materials)
    .reduce((a, m) => a + m.panels, 0);
  cell("Cabinets", S.job.cabinets.length);
  cell("Panels", panels);

  const mats = Object.keys(r.summary.materials).sort();
  const boards = mats.map((m) =>
    `${esc(m)}&nbsp;<b>${r.summary.materials[m].est_boards}</b>`).join(" &nbsp;·&nbsp; ");
  cell("Boards", boards || "—");

  cell("Pot holes", r.summary.potholes);
  cell("Estimated", "R&nbsp;" + (r.cost.total_incl_vat || 0)
    .toLocaleString("en-ZA", {minimumFractionDigits: 2, maximumFractionDigits: 2}));

  const crit = r.issues.filter(blocksExport).length;
  const took = r.issues.filter((i) => i.level === "critical" && i.accepted).length;
  const warn = r.issues.filter((i) => i.level !== "critical").length;
  let v;
  if (!r.ok) v = `<span class="pill crit">engine error</span>`;
  else if (crit) v = `<span class="pill crit">${crit} critical</span>` +
    (warn ? ` <span class="pill warn">${warn} warning${warn > 1 ? "s" : ""}</span>` : "");
  else if (warn) v = `<span class="pill warn">${warn} warning${warn > 1 ? "s" : ""}</span>`;
  else v = `<span class="pill ok">clear</span>`;
  if (r.ok && took) v += ` <span class="pill">${took} accepted</span>`;
  cell("Validation", v);

  $("strip").innerHTML = cells.join("");
  $("export").disabled = !r.ok || r.blocking;
  $("export").title = r.blocking
    ? "Blocked — criticals must be cleared first" : "Write the Plazaboard CSVs";
}

/* ---------- elevation --------------------------------------------------- */

// The wall shown face on, in Room -> Elevation. Always a wall: the side-by-side
// Run left the UI with the restructure (28 September 2026); with no room the
// view asks for one instead.
S.elev = null;
let elevSeq = 0;

// Line or Finish (23 Sept 2026). Both draw a wall's own cabinets the same; they
// differ only in the runs on the walls either side — grey outlines end on
// (Line), or what you would see of them from this wall, in their boards
// (Finish). A view setting and nothing more: not saved in the job, and it
// moves no geometry.
S.elevMode = "line";

async function renderElevation() {
  const rm = S.job.room;
  if (!rm || !rm.walls.length) {
    S.elev = null;
    $("elevpick").innerHTML = "";
    $("elevation").innerHTML = `<div class="empty">No room yet — the elevation draws
      a wall face on, so it needs one.<br><br><button id="elevaddroom">Add a room</button></div>`;
    return;
  }
  if (!rm.walls.some((w) => w.id === S.elev)) S.elev = rm.walls[0].id;
  const modes = `<span class="elevmode">` + [["line", "Line"], ["finish", "Finish"]]
    .map(([k, label]) => `<button data-elevmode="${k}" class="${
      S.elevMode === k ? "on" : ""}">${label}</button>`).join("") + `</span>`;
  $("elevpick").innerHTML = rm.walls.map((w) => `<button data-elev="${esc(w.id)}" class="${
    S.elev === w.id ? "on" : ""}">Wall ${esc(w.id)}</button>`).join("") + modes;
  const seq = ++elevSeq;
  const r = await post("/api/elevation", {job: S.job, wall: S.elev, mode: S.elevMode});
  if (seq !== elevSeq) return;             // a newer wall or job has been asked for
  if (!r.ok) { toast(r.error, true); return; }
  $("elevation").innerHTML = r.svg + `<div id="elevdrag"></div>`;
  applyZoom("elevation");
  markSelected();
}

// The settings panel starts level with the line under the 3D card's heading —
// the top of the drawing, not the top of the card that holds its heading. The
// heading's height depends on the font, so it is measured rather than typed in.
function alignEditor() {
  const card = document.querySelector("#cabmain > .card");
  const head = card && card.querySelector(":scope > h2");
  if (!head || $("tab-cabinets").hidden) return;
  const drop = Math.round(head.getBoundingClientRect().bottom -
                          card.getBoundingClientRect().top) - 1;
  $("editor").style.marginTop = Math.max(drop, 0) + "px";
}
window.addEventListener("resize", alignEditor);

$("elevpick").addEventListener("click", (e) => {
  const m = e.target.closest("[data-elevmode]");
  if (m) { S.elevMode = m.dataset.elevmode; renderElevation(); return; }
  const b = e.target.closest("[data-elev]");
  if (!b) return;
  S.elev = b.dataset.elev;
  renderElevation();
});

$("elevation").addEventListener("click", (e) => {
  if (e.target.id === "elevaddroom") addRoom();
});

/* ---------- Room: Plan | Elevation ------------------------------------------
   Two sub-tabs over one dock (UI restructure, 28 September 2026). Plan is the
   plan with the walls, placements, gaps and plinth under it, exactly as the
   Room tab was; Elevation is the wall views, moved here from the Cabinets tab.
   The one editor is docked beside whichever is showing. */

S.roomSub = "plan";

$("roomsubs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-roomsub]");
  if (!b || b.dataset.roomsub === S.roomSub) return;
  S.roomSub = b.dataset.roomsub;
  showRoomSub();
  renderTab();
});

function showRoomSub() {
  const plan = S.roomSub === "plan";
  document.querySelectorAll("#roomsubs [data-roomsub]").forEach((x) =>
    x.classList.toggle("on", x.dataset.roomsub === S.roomSub));
  $("plancard").hidden = !plan;
  $("roomplanonly").hidden = !plan;
  $("elevcard").hidden = plan;
}

/* ---------- Catalogue: Boards | Runners ---------------------------------------
   Two sub-tabs, the same pattern as Room's Plan | Elevation (28 September
   2026). Boards is the Boards tab exactly as it was; Runners is the runner
   library. Every jump that used to land on Boards lands on Catalogue -> Boards
   through `openCatalogue`. */

S.catSub = "boards";

$("catsubs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-catsub]");
  if (!b || b.dataset.catsub === S.catSub) return;
  S.catSub = b.dataset.catsub;
  showCatSub();
  renderTab();
});

function showCatSub() {
  document.querySelectorAll("#catsubs [data-catsub]").forEach((x) =>
    x.classList.toggle("on", x.dataset.catsub === S.catSub));
  $("catboards").hidden = S.catSub !== "boards";
  $("catrunners").hidden = S.catSub !== "runners";
}

function openCatalogue(sub) {
  S.catSub = sub || "boards";
  showCatSub();
  document.querySelector('nav [data-tab="catalogue"]').click();
}

/* ---------- cabinet list ------------------------------------------------ */

function frontsText(c) {
  const bits = [];
  // an unticked door count is still in the job file, but nothing is built from it
  const d = tickOn(c, "has_doors") ? (c.doors || 0) : 0;
  if (d) bits.push(d + (d > 1 ? " doors" : " door"));
  // an unticked stack is still in the job file, but nothing is built from it
  const n = tickOn(c, "has_drawers") ? (c.drawers || []).length : 0;
  if (n) bits.push(n + " drw");
  return bits.join(", ") || "—";
}

function renderList() {
  const rows = S.job.cabinets.map((c, i) => {
    const shelves = (c.shelves || 0) + (c.fixed_shelves || 0);
    // A panel's declared width, height and depth are labels: its real size is
    // its board and its two typed extents, so the table shows the engine's
    // figures for one. A cupboard still shows what it is being built to.
    const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
    const isP = !!(g && ((g.is_panel) || (g.corner && g.corner.kind)));
    const dash = g && g.corner && cornerBroken(c);
    const dim = (k) => dash ? "\u2014" : (isP ? g[k] : c[k]);
    return `<tr data-i="${i}" class="${i === S.sel ? "sel" : ""}">
      <td class="n">${c.number}</td>
      <td class="n">${dim("width")}</td><td class="n">${dim("height")}</td><td class="n">${dim("depth")}</td>
      <td>${esc(c.kind)}${g && g.corner && g.corner.kind ? " \u00b7 " + esc(g.corner.kind)
        + " " + (g.corner.hand === "L" ? "L" : "R") : ""}${
        attachedTo(c) !== null ? " \u00b7 on " + attachedTo(c) : ""}</td>
      <td>${esc(frontsText(c))}</td>
      <td class="n">${shelves || ""}</td>
      <td>${c.template === "none" ? "bespoke" : ""}</td>
      <td class="note">${esc(c.note || "")}</td>
      <td><button data-dup="${i}" title="Duplicate">Dup</button>
          <button data-del="${i}" title="Delete">Del</button></td>
    </tr>`;
  }).join("");

  slot($("cabtable")).innerHTML = S.job.cabinets.length ? `<table>
    <thead><tr><th class="n">#</th><th class="n">W</th><th class="n">H</th><th class="n">D</th>
      <th>Kind</th><th>Fronts</th><th class="n">Shv</th><th></th><th>Note</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`
    : `<div class="empty">No cabinets yet. <b>Add cabinet</b> to start,
       or load the Oct 2025 job to see a real one.</div>`;

  renderEditor();
}

// Copy the item at `i`, with the next free number from the engine. Everything
// comes with it EXCEPT its placement: a placement names a cabinet by number, so
// a copy has none and is put where it goes. That is what a bulkhead wants —
// four panels of the same description in four different places — and it is
// what the cabinet table's Dup has always done.
// Since 28 September 2026 the copy is the engine's (`/api/duplicate`): a
// cabinet's attached panels are copied with it, each with the next free number
// and the same offsets, fixed to the copy.
async function dupCabinet(i) {
  const src = S.job.cabinets[i];
  if (!src) return;
  const r = await post("/api/duplicate", {job: S.job, index: i});
  if (!r.ok) { toast(r.error, true); return; }
  S.job.cabinets.splice(i + 1, 0, ...r.cabinets);
  selectCabinet(i + 1);
  schedule(); renderList();
}

$("cabtable").addEventListener("click", async (e) => {
  const dup = e.target.closest("[data-dup]");
  if (dup) {
    await dupCabinet(+dup.dataset.dup);
    return;
  }
  const del = e.target.closest("[data-del]");
  if (del) {
    const i = +del.dataset.del;
    const victim = S.job.cabinets[i];
    // Its attached panels (28 September 2026): deleted with it, or left
    // standing where they are as standalone panels, numbers unchanged. The
    // question is only asked when there are any.
    const hung = victim && victim.kind !== "panel" ? attachedOf(victim.number) : [];
    let alsoGone = [];
    if (hung.length) {
      const also = window.confirm(
        `Cabinet ${victim.number} has ${hung.length} attached panel${hung.length === 1 ? "" : "s"} ` +
        `(${hung.map((x) => x.number).join(", ")}).\n\nAlso delete ` +
        `${hung.length === 1 ? "it" : "them"}?\n\nOK deletes the panel${hung.length === 1 ? "" : "s"} too. ` +
        `Cancel keeps ${hung.length === 1 ? "it" : "them"} as standalone panel${hung.length === 1 ? "" : "s"}, ` +
        `standing exactly where ${hung.length === 1 ? "it stands" : "they stand"} now, numbers unchanged.`);
      if (also) alsoGone = hung.map((x) => x.number);
      else if (!(await detachPanels({host: victim.number}))) return;
    }
    const gone = S.job.cabinets.splice(i, 1)[0];
    if (alsoGone.length) {
      S.job.cabinets = S.job.cabinets.filter((x) => alsoGone.indexOf(x.number) < 0);
      S.job.placements = places().filter((p) => alsoGone.indexOf(p.cabinet) < 0);
      if (S.isolate !== null && alsoGone.indexOf(S.isolate) >= 0) S.isolate = null;
      S.sel = null;
    }
    // Everything in the job that names the cabinet by number goes with it. A
    // placement left behind is a critical ("placement for a cabinet that does
    // not exist") that the Room tab cannot clear, since its table lists only
    // cabinets that exist. A gap or plinth choice that named it is just as dead.
    if (gone) {
      const n = gone.number;
      S.job.placements = places().filter((p) => p.cabinet !== n);
      S.job.gaps = (S.job.gaps || []).filter((g) => g.after !== n && g.before !== n);
      S.job.plinths = (S.job.plinths || []).filter((p) => p.first !== n);
      placesSig = null; gapsSig = null; plinthSig = null;
    }
    if (gone && S.isolate === gone.number) S.isolate = null;
    if (S.sel === i) S.sel = null;
    else if (S.sel > i) S.sel -= 1;
    schedule(); renderList();
    return;
  }
  const tr = e.target.closest("tr[data-i]");
  if (tr) { selectCabinet(+tr.dataset.i); renderList(); refreshPlan(); }
});

$("add").addEventListener("click", async () => {
  // Nothing can be chosen until a board is. Say exactly what is missing and
  // where to fix it, rather than making a cabinet out of nothing.
  const picked = (S.res && S.res.boards) || [];
  if (!picked.length) {
    toast("No board selected yet. A cabinet has to be cut from something — open " +
          "Catalogue -> Boards and tick at least one board into this project first.", true);
    openCatalogue("boards");
    return;
  }
  const r = await post("/api/next-number", {job: S.job});
  const fresh = blankCabinet(r.number);
  // A back is the thin sheet, so the thinnest selected board is the sensible
  // place to start. It is a starting point and not a rule — the dropdown is
  // right there, and the validator names the cabinet if it is wrong.
  const mats = (S.res && S.res.materials) || {};
  const thick = (k) => (mats[k] || {}).thickness || 999;
  fresh.back_board = picked.slice().sort((a, b) => thick(a) - thick(b))[0];
  // The carcass and what shows are both full-thickness boards, in selection
  // order: the first, and the last. The board the back is cut from is left out
  // of that — a 3 mm backing sheet is not a door, and offering it as one is how
  // a starting point becomes a wrong cut list nobody looked at twice.
  const full = picked.filter((k) => k !== fresh.back_board);
  const pool = full.length ? full : picked;
  fresh.carcass_board = pool[0];
  fresh.exterior_board = pool[pool.length - 1];
  fresh.has_doors = false;      // tick it on when this cabinet actually has doors
  // Its drawer runner (28 September 2026): the project's first, or — with none
  // selected — the Gelmar seed, copied into the project by the server so it is
  // priced like any selection. Never the legacy record.
  const rd = await post("/api/runner-default", {job: S.job});
  if (rd && rd.ok) {
    fresh.runner = rd.id;
    S.job.runners = rd.runners;
    if (rd.added) toast(`${rd.name} selected into this project for the drawers — ` +
                        `change it on Catalogue -> Runners.`);
  }
  // The support rows for its kind (28 September 2026): the engine's defaults,
  // not the browser's — base Front + Top Rear + 2 Backs, wall 3 Backs, tall 4,
  // each cut from the carcass in that board's own edging. They follow the
  // kind while untouched (`redefaultSupports`).
  const sr = await post("/api/support-defaults",
                        {job: Object.assign({}, S.job, {cabinets: [fresh]}), index: 0});
  fresh.support_rows = (sr && sr.rows) || [];
  noteFreshRows(fresh);
  S.job.cabinets.push(fresh);
  // P3: a new cabinet isolates itself. It has no placement yet, so there is
  // nothing to draw until a wall is picked for it in the Room tab — and the
  // moment there is, it is the one solid thing on the plan however much is
  // already sitting where `free_x` had to put it.
  selectCabinet(S.job.cabinets.length - 1);
  schedule(); renderList();
});

/* ---------- cabinet editor ---------------------------------------------- */

/* Seven sections, each in its own colour block, in the order a cabinet gets
   described: what it is, what shape it makes on the floor, what it is built from
   and what is inside it, what closes it, and what ties it together.

   Everything a section needs is in that section. The boards are chosen once, in
   Structure; Doors and Drawers each choose their own material and their own
   edging and say nothing about anyone else's. */
// Whether the selected item is an independent panel rather than a cupboard.
// The engine's answer where there is one; until the next compute lands, the
// kind that was just picked. It is a question about which controls to show,
// not about a dimension — every size a panel has still comes from the engine.
function isPanelCab(c) {
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  if (g && g.is_panel !== undefined) return !!g.is_panel;
  return c.kind === "panel";
}

const notPanel = (c) => !isPanelCab(c);

/* ---------- corner units ----------------------------------------------------
   The engine's reading of this cabinet's corner, read back. Every dimension in
   it was worked out in cabinetgen; the browser works out none of them, which is
   exactly what lets the Size fields be greyed and still show something true.
   Until the next compute lands, only the two things the operator has just
   clicked are known - the tick and the type - and that is all this falls back
   to. */
function cornerInfo(c) {
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  if (g && g.corner !== undefined) return g.corner;
  if (!tickOn(c, "corner_unit")) return null;
  return {ticked: true, kind: c.corner_style || "",
          hand: c.corner_hand === "L" ? "L" : "R", style: c.corner_style || ""};
}
function cornerTicked(c) { return !!cornerInfo(c); }
function cornerKind(c) { const k = cornerInfo(c); return (k && k.kind) || ""; }

// Mitre and ell derive their whole plan shape from the four measurements, so an
// entered outline is never read. A BLIND corner is a plain rectangle like any
// other cabinet and its outline IS read, so that one stays live.
function cornerShaped(c) {
  const k = cornerKind(c);
  return k === "mitre" || k === "ell";
}

// Where a dimension is really entered. It has to be obvious to somebody who has
// not read the code: a panel's sizes are in Panel design, a corner unit's are in
// Corner Unit, and Kind stays live either way because a corner can be top-hung,
// base or tall.
function sizeGrey(c, key) {
  if (!(key === "width" || key === "height" || key === "depth")) return "";
  if (isPanelCab(c)) return "Set in Panel design below";
  if (cornerTicked(c)) return "Set in Corner Unit below";
  return "";
}
function showPlanShape(c) {
  return notPanel(c) && (c.template === "none" || (c.footprint || []).length > 0);
}
function outlineGrey(c) {
  return cornerShaped(c)
    ? "Derived from the corner measurements \u2014 an entered outline is not read"
    : "";
}

// The engine's figure for a greyed dimension. A declared width on a corner unit
// or a panel is a label and no check reads it, so showing the declared one back
// would be showing the wrong number in a field that looks authoritative.
function derivedSize(c, key) {
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  if (!g) return null;
  if (cornerBroken(c)) return null;       // no shape yet, so no size to show
  return {width: g.width, height: g.height, depth: g.depth}[key];
}

// A corner unit whose measurements do not make a shape yet. Its sizes are shown
// as a dash rather than the declared figures, which were never its sizes.
function cornerBroken(c) {
  const info = cornerInfo(c);
  if (!info || !info.kind) return !!info;          // ticked, no type chosen
  return !!(info.problems && Object.keys(info.problems).length);
}

// A section this corner type does not have. Said rather than hidden - an option
// that silently does nothing is worse than one that explains itself, which is
// the rule the greyed divider controls already follow.
function cornerOff(c, key) {
  const k = cornerKind(c);
  if (!k) return "";
  if (key === "drawers") {
    return k === "blind"
      ? "No drawers in a blind corner \u2014 it is one door and a flush panel."
      : "No drawers in a mitre or an ell corner.";
  }
  if (key === "supports" && k !== "blind") {
    return "No supports on a corner unit (RULES W13). A mitre is braced by its " +
           "own top and bottom, which are cut whatever kind it is.";
  }
  return "";
}

const SECTIONS = [
  // Width, height and depth are greyed wherever they are entered somewhere
  // else, and each says where. Kind, Number and Note stay live throughout -
  // Kind because a corner unit can be top-hung, base or tall.
  {key: "size", name: "Size", grey: sizeGrey, fields: [
    ["width", "Width", "int"], ["height", "Height", "int"],
    ["depth", "Depth", "int"], ["kind", "Kind", "sel:kinds"],
    ["number", "Number", "int"], ["note", "Note", "text"]]},

  // Three types, each with its own measurements, and every dimension a corner
  // unit has is entered here - which is why Size is greyed above. It sits
  // directly under Size (moved 22 Sept 2026): "Set in Corner Unit below" has to
  // point at the very next thing on screen, not at a section four scrolls down.
  {key: "corner", name: "Corner Unit", toggle: "corner_unit", tick: "Corner unit",
   when: notPanel, slot: "cornerbox", fields: []},

  // A panel is one part, so it has one section: what it is cut from, which way
  // up it stands, its two finished sizes and its edging. The cupboard sections
  // below are hidden for it — hidden, not emptied: everything they hold stays
  // in the job file, so picking a cupboard kind again brings it all back.
  {key: "panel", name: "Panel design", slot: "panelbox", when: isPanelCab,
   hint: "An independent panel. It is not part of any cupboard, it is numbered " +
         "in the same series as the cabinets, and the sizes here are finished " +
         "cut sizes. Several of them make a bulkhead \u2014 a front, an underside " +
         "and an end cap each side \u2014 each its own numbered item.",
   fields: []},

  // Plan shape (29 September 2026, was Outline): offered only where it means
  // something — a hand-built (template "none") cabinet, or one that already
  // carries an outline. What it does is unchanged.
  {key: "outline", name: "Plan shape", when: showPlanShape, grey: outlineGrey,
   hint: "The cabinet's shape in plan, for a hand-built unit that is not a " +
         "rectangle. x along the wall, y out from it, in mm. Leave blank for " +
         "the rectangle its panels make.",
   fields: [["footprint", "Plan shape", "poly"]]},

  {key: "structure", name: "Structure", slot: "structurebox", when: notPanel,
   fields: []},

  {key: "doors", name: "Doors", slot: "doorbox", when: notPanel,
   toggle: "has_doors", tick: "Has doors", fields: []},

  {key: "drawers", name: "Drawers", slot: "drawerbox", when: notPanel,
   toggle: "has_drawers", tick: "Has drawers", fields: []},

  {key: "supports", name: "Supports", slot: "supportbox", when: notPanel,
   hint: "A support is a cross rail spanning the internal width, tying the two " +
         "sides together. Three kinds: a Top Front and a Top Rear across the top of a " +
         "base unit, and Back supports upright behind the backing. Each says its " +
         "Support Material, its Edging Material and Colour, and how many long and " +
         "short edges are banded.",
   fields: []},

  // Panels fixed to this cabinet (28 September 2026): listed here, made here,
  // and edited on the panel itself, where every panel's design lives.
  {key: "attached", name: "Attached panels", slot: "attachedbox", when: notPanel,
   hint: "Panels fixed to this cabinet — an end panel, a plinth end, a top. Each " +
         "is a Panel item with its own number and its own cut-list line, placed by " +
         "offsets in this cabinet's frame, and it moves with the cabinet.",
   fields: []},
];

// How the back is fixed, said in words rather than in a count of grooves.
const BACK_LABEL = {
  four: "Grooved in all round — sides, top and bottom",
  three: "Grooved into the sides and top — open under the bottom",
  none: "No back panel",
};

// Whether a tickbox is on. An explicit choice wins; failing that the engine's
// own answer is read back; failing that (a cabinet not yet computed) the same
// rule the model uses — a style, or a stack, that is already there.
function tickOn(c, key) {
  if (c[key] === true) return true;
  if (c[key] === false) return false;
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const read = {corner_unit: "corner_on", has_drawers: "drawers_on",
                has_doors: "doors_on"}[key];
  if (g && read && g[read] !== undefined) return !!g[read];
  if (key === "corner_unit") return !!c.corner_style;
  if (key === "has_doors") return (c.doors || 0) > 0;
  return (c.drawers || []).length > 0;
}

// A control that is in the app but not working yet. Shown, greyed, and told why
// — an option that silently does nothing is worse than one that says so.
// A blank or zero value is left empty so the placeholder shows; a real one (an
// older job that set it, and still cuts it) is shown, because hiding what is
// being cut would be worse than a greyed field.
function unavailableField(label, value, why) {
  const shown = value === null || value === undefined || value === 0 ? "" : value;
  return `<div class="f unavail"><label>${esc(label)}</label>
    <input value="${esc(shown)}" placeholder="function unavailable" disabled>
    <span class="why">${esc(why)}</span></div>`;
}

// A field whose answer is entered somewhere else. Greyed, and showing the
// ENGINE'S figure rather than the declared one: a declared width on a corner
// unit or a panel is a label and no check reads it, so echoing it back into a
// field that looks authoritative would be showing the wrong number.
function derivedField(label, value, why, wide) {
  const shown = value === null || value === undefined ? "" : value;
  return `<div class="f derived${wide ? " wide" : ""}"><label>${esc(label)}</label>
    <input value="${esc(shown)}" placeholder="\u2014" disabled>
    <span class="why">${esc(why)}</span>${
      wide ? `<span class="note" id="geomreadout"></span>` : ""}</div>`;
}

function fieldHTML(c, [key, label, type], sec) {
  const why = sec && sec.grey ? sec.grey(c, key) : "";
  if (why) {
    // The outline field carries the geometry readout, so a greyed one has to
    // keep it: a corner unit is precisely where that line is worth reading.
    return type === "poly"
      ? derivedField(label, (c[key] || []).map((pt) => pt[0] + "," + pt[1]).join("  "),
                     why, true)
      : derivedField(label, derivedSize(c, key), why);
  }
  const v = c[key];
  let input;
  if (type.startsWith("sel:")) {
    const opts = (S.def[type.slice(4)] || []).map((o) =>
      `<option value="${esc(o)}"${o === v ? " selected" : ""}>${esc(o)}</option>`).join("");
    input = `<select data-k="${key}" data-t="${type}">${opts}</select>`;
  } else if (type === "text") {
    input = `<input data-k="${key}" data-t="text" value="${esc(v)}">`;
  } else if (type === "poly") {
    const text = (v || []).map((pt) => pt[0] + "," + pt[1]).join("  ");
    input = `<input data-k="${key}" data-t="poly" value="${esc(text)}"
             placeholder="e.g. 0,834  850,834  850,0  0,0">
             <span class="note" id="geomreadout"></span>`;
  } else {
    input = `<input type="number" step="1" data-k="${key}" data-t="${type}"
