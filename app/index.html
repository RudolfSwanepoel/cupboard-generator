<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupboardApp</title>
<style>
  :root{
    /* the elevation and nest SVGs already use these — the page matches them */
    --ink:#191c1a; --muted:#767e78; --rule:#aab1a9; --faint:#d3d7d0;
    --carc:#f2f3f0; --door:#dceaea; --face:#f5ebd6;
    --bg:#fbfbfa; --panel:#fff; --line:#e3e5e0;
    --crit:#a4303f; --warn:#8a6d1f; --ok:#2f6b4f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
  button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--rule);
         border-radius:4px;padding:4px 10px;cursor:pointer}
  button:hover{background:var(--carc)}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.primary:hover{background:#333836}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select{font:inherit;color:inherit;background:var(--panel);
               border:1px solid var(--line);border-radius:4px;padding:3px 6px;width:100%}
  input:focus,select:focus{outline:2px solid var(--door);outline-offset:-1px;
                           border-color:var(--rule)}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);
        white-space:nowrap}
  th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;
     letter-spacing:.04em;position:sticky;top:0;background:var(--bg);z-index:1}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

  header{display:flex;gap:8px;align-items:center;padding:8px 14px;
         background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:14px;margin:0 10px 0 0;font-weight:700;letter-spacing:.02em}
  header .grow{flex:1}
  #jobname{width:190px}
  #joblist{width:170px}

  #strip{display:flex;gap:22px;align-items:center;padding:9px 14px;
         background:var(--carc);border-bottom:1px solid var(--line);flex-wrap:wrap}
  #strip .cell{display:flex;flex-direction:column;gap:1px}
  #strip .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  #strip .v{font-size:15px;font-variant-numeric:tabular-nums}
  .pill{border-radius:10px;padding:1px 8px;font-size:12px;display:inline-block}
  .pill.crit{background:#f6e0e3;color:var(--crit)}
  .pill.warn{background:#f6efd9;color:var(--warn)}
  .pill.ok{background:#dfeee6;color:var(--ok)}

  nav{display:flex;gap:2px;padding:0 14px;background:var(--panel);
      border-bottom:1px solid var(--line)}
  nav button{border:none;border-bottom:2px solid transparent;border-radius:0;
             padding:8px 14px;background:none;color:var(--muted)}
  nav button:hover{background:var(--carc)}
  nav button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

  main{padding:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
        margin-bottom:14px}
  .card>h2{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
           margin:0;padding:8px 12px;border-bottom:1px solid var(--line)}
  .card>.body{padding:10px 12px}
  .scroll{overflow:auto}

  #cabwrap,.split{display:flex;gap:14px;align-items:flex-start}
  /* The elevation and the list stack on the left; the settings panel is a
     column of its own, starting level with the top of the drawing. */
  #cabmain{flex:1;min-width:0}
  #cabmain>.card:last-child{margin-bottom:0}
  #layers,#elevpick{float:right;margin-top:-3px;display:flex;gap:3px}
  #layers button,#elevpick button{padding:2px 9px;font-size:11px;text-transform:none;
                                  letter-spacing:0}
  #layers button.on,#elevpick button.on{background:var(--ink);color:#fff;
                                        border-color:var(--ink)}
  #cablist{flex:1;min-width:0}
  #editor{width:560px;flex:none;position:sticky;top:10px;max-height:calc(100vh - 30px);
          overflow:auto}
  #cablist tr.sel td{background:var(--door)}
  #cablist tbody tr{cursor:pointer}
  #cablist tbody tr:hover td{background:var(--carc)}
  #cablist tr.sel:hover td{background:var(--door)}

  fieldset{border:none;border-top:1px solid var(--line);margin:0;padding:10px 0 4px}
  fieldset:first-of-type{border-top:none;padding-top:0}
  legend{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
         padding:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-top:7px}
  .f{display:flex;flex-direction:column;gap:2px}
  .f label{font-size:11px;color:var(--muted)}
  .f.wide{grid-column:1/-1}

  /* One coloured block per section, so the eye finds Doors without reading. */
  .sec{border:1px solid var(--line);border-radius:5px;padding:8px 10px 10px;
       margin-bottom:9px}
  .sec>h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.01em;
          display:flex;align-items:center;gap:8px}
  .sec>.hint{font-size:11px;color:var(--muted);margin:3px 0 0;line-height:1.35}
  .sec>.off{font-size:11.5px;color:var(--muted);margin:5px 0 0}
  .sec .tick{margin-left:auto;font-weight:400;font-size:11px;color:var(--muted);
             display:flex;align-items:center;gap:5px;cursor:pointer}
  .sec .tick input{width:auto;cursor:pointer}
  .sec .grid{margin-top:7px}
  .sec.s-size{background:#e7eef5;border-color:#cfdce8}
  .sec.s-outline{background:#e5f0e7;border-color:#c9ded0}
  .sec.s-structure{background:#f3efe2;border-color:#e0d8c2}
  .sec.s-doors{background:#dceaee;border-color:#c1dae0}
  .sec.s-drawers{background:#f7ead2;border-color:#e6d5b4}
  .sec.s-corner{background:#ece5f3;border-color:#d7cbe5}
  .sec.s-supports{background:#eaeee9;border-color:#d3dad1}
  .unavail input,.unavail select{opacity:.5;background:var(--carc)}
  .unavail label{opacity:.65}
  .unavail .why{font-size:10.5px;color:var(--warn);font-style:italic}
  .leaf{display:flex;gap:6px;align-items:center;margin-top:4px}
  .leaf b{font-weight:600;min-width:74px}
  .leaf select{width:auto}
  .leaf .hinge{flex:none;min-width:136px}  /* so each leaf's board lines up */
  .swing{font-size:11.5px;margin-top:6px}
  .swing.bad{color:var(--warn)}
  .swing.ok{color:var(--ok)}
  .dtot{display:flex;gap:16px;align-items:baseline;margin-top:7px;
        font-variant-numeric:tabular-nums}
  .dtot .over{color:var(--crit);font-weight:700}
  .presets{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .swatch{width:26px;height:26px;border-radius:3px;display:block;object-fit:cover;
          border:1px solid var(--rule)}
  .swatch.none{background:repeating-linear-gradient(45deg,var(--carc),var(--carc) 4px,
               var(--panel) 4px,var(--panel) 8px)}
  header .grow,.matline .grow{flex:1}
  .tape{margin-top:8px}
  .tape>label{font-size:11px;color:var(--muted);display:block}
  .tape .leaf{margin-top:2px}
  .tape .leaf select{flex:1;min-width:0}
  .tape .leaf b{min-width:96px;font-variant-numeric:tabular-nums}
  .tape .leaf b.over{color:var(--crit)}
  /* a board with no edging at all: grey, because that is a setting, not a fault */
  .tape .leaf b.off{color:var(--muted);font-weight:400}
  .tape .note{display:block;margin-top:2px;line-height:1.3}
  /* nine columns in a side panel (the settings column is 560 wide for them):
     let the numbers and board ids have the room, not the labels */
  #drawerbox table{table-layout:fixed}
  #drawerbox th,#drawerbox td{padding:2px 3px;font-size:11.5px}
  #drawerbox input,#drawerbox select{padding:2px 3px}
  #drawerbox col.c-n{width:18px}
  #drawerbox col.c-mode{width:56px}
  #drawerbox col.c-val{width:50px}
  #drawerbox col.c-mm{width:36px}
  #drawerbox col.c-box{width:50px}
  #drawerbox col.c-base{width:66px}
  #drawerbox col.c-mat{width:auto}
  #drawerbox col.c-rm{width:30px}
  #elevation{position:relative}
  #elevation svg{user-select:none;-webkit-user-select:none}
  #elevation svg .ecabg{cursor:grab}
  #elevation svg .ecabg:hover .ecab{stroke-width:2.2}
  #elevation svg .ecabg.dragging{cursor:grabbing;opacity:.6}
  #elevdrag{position:absolute;background:var(--ink);color:#fff;font-size:11px;
            padding:2px 7px;border-radius:3px;pointer-events:none;display:none;
            white-space:nowrap;z-index:5}
  #elevation svg .fdiv{cursor:ns-resize}
  #elevation svg .fdiv:hover{stroke-opacity:.9}
  .rows td,.rows th{padding:3px 5px}
  .note{color:var(--muted);font-size:11.5px}
  .mono{font-variant-numeric:tabular-nums}
  .bespoke{background:var(--face);border:1px solid var(--rule);border-radius:4px;
           padding:7px 9px;font-size:12px;margin-top:8px}

  .issue{display:flex;gap:9px;padding:6px 12px;border-bottom:1px solid var(--line);
         align-items:baseline}
  .issue .lvl{flex:none;width:64px;font-size:10.5px;text-transform:uppercase;
              letter-spacing:.04em;font-weight:700}
  .issue.critical .lvl{color:var(--crit)}
  .issue.warning .lvl{color:var(--warn)}
  .issue .where{flex:none;width:70px;color:var(--muted);font-variant-numeric:tabular-nums}
  .issue .msg{flex:1}
  .issue .ref{flex:none;color:var(--muted);font-size:11px}
  tr.hasissue td{background:#fdf6f7}
  .rowissue{font-size:11.5px;padding:2px 8px 5px 18px}
  .rowissue.critical{color:var(--crit)}
  .rowissue.warning{color:var(--warn)}

  .empty{padding:26px 12px;text-align:center;color:var(--muted)}
  #toast{position:fixed;right:14px;bottom:14px;max-width:520px;background:var(--ink);
         color:#fff;padding:9px 13px;border-radius:5px;display:none;white-space:pre-wrap;
         box-shadow:0 3px 14px rgba(0,0,0,.22);z-index:9}
  #toast.bad{background:var(--crit)}
  #plan svg .cab{cursor:grab}
  #plan svg .cab.dragging{cursor:grabbing}
  #plan svg .front{transition:opacity .08s}
  #plan.showfronts svg .front{opacity:1 !important}
  #dragreadout{position:absolute;background:var(--ink);color:#fff;font-size:11px;
               padding:2px 7px;border-radius:3px;pointer-events:none;display:none;
               white-space:nowrap;z-index:5}
  #plan{position:relative}
  .sheetsvg{overflow:auto;border-top:1px solid var(--line);padding:8px 12px}
  .sheetsvg svg{display:block}
  .matline{display:flex;gap:18px;align-items:baseline;padding:8px 12px;flex-wrap:wrap}
  .matline b{font-size:14px}
</style>
</head>
<body>

<header>
  <h1>CupboardApp</h1>
  <input id="jobname" placeholder="job name" title="job name">
  <button id="new">New</button>
  <button id="save">Save</button>
  <select id="joblist" title="saved jobs"></select>
  <button id="load">Load</button>
  <button id="fixture" title="the October 2025 wardrobe regression fixture">Oct 2025</button>
  <span class="grow"></span>
  <button id="export" class="primary">Export cut list</button>
</header>

<div id="strip"></div>

<nav>
  <button data-tab="cabinets" class="on">Cabinets</button>
  <button data-tab="boards">Boards</button>
  <button data-tab="room">Room</button>
  <button data-tab="cutlist">Cut list</button>
  <button data-tab="nesting">Nesting</button>
  <button data-tab="validation">Validation</button>
</nav>

<main>
  <section id="tab-cabinets">
    <div id="cabwrap">
      <div id="cabmain">
        <div class="card">
          <h2>Elevation <span id="elevpick"></span></h2>
          <div class="scroll" id="elevation" style="padding:8px 12px"></div>
        </div>
        <div class="card" id="cablist">
          <h2>Cabinets <button id="add" style="float:right;margin-top:-3px">Add cabinet</button></h2>
          <div class="scroll" id="cabtable"></div>
        </div>
      </div>
      <div class="card" id="editor"></div>
    </div>
  </section>

  <section id="tab-boards" hidden>
    <div class="card"><h2>Board library</h2><div id="boards"></div></div>
  </section>

  <section id="tab-room" hidden>
    <div class="card">
      <h2>Plan <span id="layers"></span></h2>
      <div class="scroll" id="plan" style="padding:8px 12px"></div>
    </div>
    <div class="split">
      <div class="card" style="flex:1;min-width:0">
        <h2>Walls</h2>
        <div id="room"></div>
      </div>
      <div class="card" style="width:500px;flex:none">
        <h2>Placements</h2>
        <div id="places"></div>
      </div>
    </div>
    <div class="split">
      <div class="card" style="flex:1;min-width:0">
        <h2>Gaps</h2>
        <div id="gaps"></div>
      </div>
      <div class="card" style="width:500px;flex:none">
        <h2>Plinth</h2>
        <div id="plinth"></div>
      </div>
    </div>
  </section>

  <section id="tab-cutlist" hidden>
    <div class="card"><h2>Cut list</h2><div class="scroll" id="cutlist"></div></div>
  </section>

  <section id="tab-nesting" hidden>
    <div id="nesting"></div>
  </section>

  <section id="tab-validation" hidden>
    <div class="card"><h2>Validation</h2><div id="validation"></div></div>
  </section>
</main>

<div id="toast"></div>

<script>
"use strict";

/* ---------- state ------------------------------------------------------- */

const S = {
  job: null,        // the job, exactly as store.py serialises it
  res: null,        // last /api/compute response
  sel: null,        // selected cabinet index
  selRendered: -2,  // which index the editor DOM currently shows
  tab: "cabinets",
  def: null,        // /api/defaults
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s === null || s === undefined ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

async function post(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  return r.json();
}

let toastTimer = null;
function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.className = bad ? "bad" : "";
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, bad ? 9000 : 4000);
}

/* ---------- the job ----------------------------------------------------- */

// A new project starts with no boards at all. Nothing can be cut until one is
// selected from the library, which is the point — a cabinet has to be cut from
// something, and guessing which board that is has never ended well.
function blankJob() {
  return {name: "untitled", boards: [], materials: {}, cabinets: [], loose: []};
}

function blankCabinet(number) {
  return {
    number: number, width: 600, height: 2400, depth: 500,
    kind: "tall", back: "four", template: "standard",
    support_rows: [{edge: "none", qty: 4}],
    supports: 4, edged_supports: 0, white_supports: 0,
    shelves: 0, fixed_shelves: 0, shelf_width: null,
    divider_height: null, divider_count: 0,
    doors: 1, door_height: null, door_hinges: [], has_doors: null, door_boards: [],
    drawers: [], has_drawers: null,
    exposed_sides: 0,
    carcass_board: "", exterior_board: "", back_board: "", exterior_tape: "2mm",
    door_edge_kind: null, door_edge_board: null,
    drawer_edge_kind: null, drawer_edge_board: null,
    drawer_carcass_board: null, drawer_face_board: null,
    carcass_edge: null, door_edge: null, drawer_box_edge: null,
    bespoke: [], note: "", footprint: [],
    corner_style: "", arm_a: null, arm_b: null, face_a: null, face_b: null,
    corner_unit: null,
  };
}

/* ---------- compute ----------------------------------------------------- */

let computeTimer = null;
function schedule() {
  clearTimeout(computeTimer);
  computeTimer = setTimeout(compute, 180);
}

let computeSeq = 0;

async function compute() {
  S.job.name = $("jobname").value.trim() || "untitled";
  const seq = ++computeSeq;
  const res = await post("/api/compute", {job: S.job});
  if (seq !== computeSeq) return;   // a newer job is already being computed
  S.res = res;
  if (!res.ok) toast(res.error, true);
  renderStrip();
  if (S.tab === "boards" && S.lib) drawBoards();
  renderElevation();
  renderList();
  renderTab();
}

/* ---------- summary strip ----------------------------------------------- */

function renderStrip() {
  const r = S.res;
  if (!r) { $("strip").innerHTML = ""; return; }
  const cells = [];
  const cell = (k, v) => cells.push(
    `<div class="cell"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`);

  const panels = Object.values(r.summary.materials)
    .reduce((a, m) => a + m.panels, 0);
  cell("Cabinets", S.job.cabinets.length);
  cell("Panels", panels);

  const mats = Object.keys(r.summary.materials).sort();
  const boards = mats.map((m) =>
    `${esc(m)}&nbsp;<b>${r.summary.materials[m].est_boards}</b>`).join(" &nbsp;·&nbsp; ");
  cell("Boards", boards || "—");

  cell("Pot holes", r.summary.potholes);
  cell("Estimated", "R&nbsp;" + (r.cost.total_incl_vat || 0)
    .toLocaleString("en-ZA", {minimumFractionDigits: 2, maximumFractionDigits: 2}));

  const crit = r.issues.filter((i) => i.level === "critical").length;
  const warn = r.issues.length - crit;
  let v;
  if (!r.ok) v = `<span class="pill crit">engine error</span>`;
  else if (crit) v = `<span class="pill crit">${crit} critical</span>` +
    (warn ? ` <span class="pill warn">${warn} warning${warn > 1 ? "s" : ""}</span>` : "");
  else if (warn) v = `<span class="pill warn">${warn} warning${warn > 1 ? "s" : ""}</span>`;
  else v = `<span class="pill ok">clear</span>`;
  cell("Validation", v);

  $("strip").innerHTML = cells.join("");
  $("export").disabled = !r.ok || r.blocking;
  $("export").title = r.blocking
    ? "Blocked — criticals must be cleared first" : "Write the Plazaboard CSVs";
}

/* ---------- elevation --------------------------------------------------- */

// null shows the whole job side by side; a wall id shows that wall face on.
S.elev = null;
let elevSeq = 0;

async function renderElevation() {
  const rm = S.job.room;
  if (!rm || !rm.walls.some((w) => w.id === S.elev)) S.elev = null;
  $("elevpick").innerHTML = rm && rm.walls.length
    ? [["", "Run"]].concat(rm.walls.map((w) => [w.id, "Wall " + w.id]))
        .map(([k, label]) => `<button data-elev="${esc(k)}" class="${
          (S.elev || "") === k ? "on" : ""}">${esc(label)}</button>`).join("")
    : "";
  alignEditor();
  if (S.elev === null) {
    $("elevation").innerHTML = ((S.res && S.res.elevation) || "")
      + `<div id="elevdrag"></div>`;
    return;
  }
  const seq = ++elevSeq;
  const r = await post("/api/elevation", {job: S.job, wall: S.elev});
  if (seq !== elevSeq) return;             // a newer wall or job has been asked for
  if (!r.ok) { toast(r.error, true); return; }
  $("elevation").innerHTML = r.svg + `<div id="elevdrag"></div>`;
}

// The settings panel starts level with the line under the Run / Wall buttons —
// the top of the drawing, not the top of the card that holds its heading. The
// heading's height depends on the font and on whether the buttons are there,
// so it is measured rather than typed in.
function alignEditor() {
  const card = document.querySelector("#cabmain > .card");
  const head = card && card.querySelector(":scope > h2");
  if (!head || $("tab-cabinets").hidden) return;
  const drop = Math.round(head.getBoundingClientRect().bottom -
                          card.getBoundingClientRect().top) - 1;
  $("editor").style.marginTop = Math.max(drop, 0) + "px";
}
window.addEventListener("resize", alignEditor);

$("elevpick").addEventListener("click", (e) => {
  const b = e.target.closest("[data-elev]");
  if (!b) return;
  S.elev = b.dataset.elev || null;
  renderElevation();
});

/* ---------- cabinet list ------------------------------------------------ */

function frontsText(c) {
  const bits = [];
  // an unticked door count is still in the job file, but nothing is built from it
  const d = tickOn(c, "has_doors") ? (c.doors || 0) : 0;
  if (d) bits.push(d + (d > 1 ? " doors" : " door"));
  // an unticked stack is still in the job file, but nothing is built from it
  const n = tickOn(c, "has_drawers") ? (c.drawers || []).length : 0;
  if (n) bits.push(n + " drw");
  return bits.join(", ") || "—";
}

function renderList() {
  const rows = S.job.cabinets.map((c, i) => {
    const shelves = (c.shelves || 0) + (c.fixed_shelves || 0);
    return `<tr data-i="${i}" class="${i === S.sel ? "sel" : ""}">
      <td class="n">${c.number}</td>
      <td class="n">${c.width}</td><td class="n">${c.height}</td><td class="n">${c.depth}</td>
      <td>${esc(c.kind)}</td>
      <td>${esc(frontsText(c))}</td>
      <td class="n">${shelves || ""}</td>
      <td>${c.template === "none" ? "bespoke" : ""}</td>
      <td class="note">${esc(c.note || "")}</td>
      <td><button data-dup="${i}" title="Duplicate">Dup</button>
          <button data-del="${i}" title="Delete">Del</button></td>
    </tr>`;
  }).join("");

  $("cabtable").innerHTML = S.job.cabinets.length ? `<table>
    <thead><tr><th class="n">#</th><th class="n">W</th><th class="n">H</th><th class="n">D</th>
      <th>Kind</th><th>Fronts</th><th class="n">Shv</th><th></th><th>Note</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`
    : `<div class="empty">No cabinets yet. <b>Add cabinet</b> to start,
       or load the Oct 2025 job to see a real one.</div>`;

  renderEditor();
}

$("cabtable").addEventListener("click", async (e) => {
  const dup = e.target.closest("[data-dup]");
  if (dup) {
    const i = +dup.dataset.dup;
    const copy = JSON.parse(JSON.stringify(S.job.cabinets[i]));
    const r = await post("/api/next-number", {job: S.job});
    copy.number = r.number;
    copy.bespoke.forEach((p) => { p.cabinet = copy.number; });
    S.job.cabinets.splice(i + 1, 0, copy);
    S.sel = i + 1;
    schedule(); renderList();
    return;
  }
  const del = e.target.closest("[data-del]");
  if (del) {
    const i = +del.dataset.del;
    const gone = S.job.cabinets.splice(i, 1)[0];
    // Everything in the job that names the cabinet by number goes with it. A
    // placement left behind is a critical ("placement for a cabinet that does
    // not exist") that the Room tab cannot clear, since its table lists only
    // cabinets that exist. A gap or plinth choice that named it is just as dead.
    if (gone) {
      const n = gone.number;
      S.job.placements = (S.job.placements || []).filter((p) => p.cabinet !== n);
      S.job.gaps = (S.job.gaps || []).filter((g) => g.after !== n && g.before !== n);
      S.job.plinths = (S.job.plinths || []).filter((p) => p.first !== n);
      placesSig = null; gapsSig = null; plinthSig = null;
    }
    if (S.sel === i) S.sel = null;
    else if (S.sel > i) S.sel -= 1;
    schedule(); renderList();
    return;
  }
  const tr = e.target.closest("tr[data-i]");
  if (tr) { S.sel = +tr.dataset.i; renderList(); }
});

$("add").addEventListener("click", async () => {
  // Nothing can be chosen until a board is. Say exactly what is missing and
  // where to fix it, rather than making a cabinet out of nothing.
  const picked = (S.res && S.res.boards) || [];
  if (!picked.length) {
    toast("No board selected yet. A cabinet has to be cut from something — open " +
          "the Boards tab and tick at least one board into this project first.", true);
    document.querySelector('nav [data-tab="boards"]').click();
    return;
  }
  const r = await post("/api/next-number", {job: S.job});
  const fresh = blankCabinet(r.number);
  // A back is the thin sheet, so the thinnest selected board is the sensible
  // place to start. It is a starting point and not a rule — the dropdown is
  // right there, and the validator names the cabinet if it is wrong.
  const mats = (S.res && S.res.materials) || {};
  const thick = (k) => (mats[k] || {}).thickness || 999;
  fresh.back_board = picked.slice().sort((a, b) => thick(a) - thick(b))[0];
  // The carcass and what shows are both full-thickness boards, in selection
  // order: the first, and the last. The board the back is cut from is left out
  // of that — a 3 mm backing sheet is not a door, and offering it as one is how
  // a starting point becomes a wrong cut list nobody looked at twice.
  const full = picked.filter((k) => k !== fresh.back_board);
  const pool = full.length ? full : picked;
  fresh.carcass_board = pool[0];
  fresh.exterior_board = pool[pool.length - 1];
  fresh.has_doors = false;      // tick it on when this cabinet actually has doors
  S.job.cabinets.push(fresh);
  S.sel = S.job.cabinets.length - 1;
  schedule(); renderList();
});

/* ---------- cabinet editor ---------------------------------------------- */

/* Seven sections, each in its own colour block, in the order a cabinet gets
   described: what it is, what shape it makes on the floor, what it is built from
   and what is inside it, what closes it, and what ties it together.

   Everything a section needs is in that section. The boards are chosen once, in
   Structure; Doors and Drawers each choose their own material and their own
   edging and say nothing about anyone else's. */
const SECTIONS = [
  {key: "size", name: "Size", fields: [
    ["width", "Width", "int"], ["height", "Height", "int"],
    ["depth", "Depth", "int"], ["kind", "Kind", "sel:kinds"],
    ["number", "Number", "int"], ["note", "Note", "text"]]},

  {key: "outline", name: "Outline",
   hint: "Actual plan shape, x along the wall, y out from the wall. " +
         "All geometry checks read this, not the declared width/depth.",
   fields: [["footprint", "Footprint outline", "poly"]]},

  {key: "structure", name: "Structure", slot: "structurebox", fields: []},

  {key: "doors", name: "Doors", slot: "doorbox",
   toggle: "has_doors", tick: "Has doors", fields: []},

  {key: "drawers", name: "Drawers", slot: "drawerbox",
   toggle: "has_drawers", tick: "Has drawers", fields: []},

  {key: "corner", name: "Corner Unit", toggle: "corner_unit", tick: "Corner unit",
   fields: [
    ["corner_style", "Style", "sel:corner_styles"],
    ["arm_a", "Arm A (along wall A)", "opt"],
    ["arm_b", "Arm B (along wall B)", "opt"],
    ["face_a", "Face A (open face, wall-A side)", "opt"],
    ["face_b", "Face B (open face, wall-B side)", "opt"]]},

  {key: "supports", name: "Supports", slot: "supportbox",
   hint: "A support is a cross rail spanning the internal width, tying the two " +
         "sides together. One row per kind; the total is the sum of the rows. " +
         "A front-edged one takes the carcass edging, which is PVC in the " +
         "exterior board's colour.",
   fields: []},
];

// How the back is fixed, said in words rather than in a count of grooves.
const BACK_LABEL = {
  four: "Grooved in all round — sides, top and bottom",
  three: "Grooved into the sides and top — open under the bottom",
  none: "No back panel",
};

// Whether a tickbox is on. An explicit choice wins; failing that the engine's
// own answer is read back; failing that (a cabinet not yet computed) the same
// rule the model uses — a style, or a stack, that is already there.
function tickOn(c, key) {
  if (c[key] === true) return true;
  if (c[key] === false) return false;
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const read = {corner_unit: "corner_on", has_drawers: "drawers_on",
                has_doors: "doors_on"}[key];
  if (g && read && g[read] !== undefined) return !!g[read];
  if (key === "corner_unit") return !!c.corner_style;
  if (key === "has_doors") return (c.doors || 0) > 0;
  return (c.drawers || []).length > 0;
}

// A control that is in the app but not working yet. Shown, greyed, and told why
// — an option that silently does nothing is worse than one that says so.
// A blank or zero value is left empty so the placeholder shows; a real one (an
// older job that set it, and still cuts it) is shown, because hiding what is
// being cut would be worse than a greyed field.
function unavailableField(label, value, why) {
  const shown = value === null || value === undefined || value === 0 ? "" : value;
  return `<div class="f unavail"><label>${esc(label)}</label>
    <input value="${esc(shown)}" placeholder="function unavailable" disabled>
    <span class="why">${esc(why)}</span></div>`;
}

function fieldHTML(c, [key, label, type]) {
  const v = c[key];
  let input;
  if (type.startsWith("sel:")) {
    const opts = (S.def[type.slice(4)] || []).map((o) =>
      `<option value="${esc(o)}"${o === v ? " selected" : ""}>${esc(o)}</option>`).join("");
    input = `<select data-k="${key}" data-t="${type}">${opts}</select>`;
  } else if (type === "text") {
    input = `<input data-k="${key}" data-t="text" value="${esc(v)}">`;
  } else if (type === "poly") {
    const text = (v || []).map((pt) => pt[0] + "," + pt[1]).join("  ");
    input = `<input data-k="${key}" data-t="poly" value="${esc(text)}"
             placeholder="e.g. 0,834  850,834  850,0  0,0">
             <span class="note" id="geomreadout"></span>`;
  } else {
    input = `<input type="number" step="1" data-k="${key}" data-t="${type}"
             value="${v === null || v === undefined ? "" : v}"
             ${type === "opt" ? 'placeholder="auto"' : ""}>`;
  }
  return `<div class="f${type === "poly" ? " wide" : ""}"><label>${esc(label)}</label>${input}</div>`;
}

function sectionHTML(c, sec) {
  const on = sec.toggle ? tickOn(c, sec.toggle) : true;
  const tick = sec.toggle
    ? `<label class="tick"><input type="checkbox" data-tick="${sec.toggle}"
         ${on ? "checked" : ""}>${esc(sec.tick)}</label>` : "";
  const hint = sec.hint ? `<p class="hint">${esc(sec.hint)}</p>` : "";
  let body;
  if (sec.toggle && !on) {
    body = `<p class="off">Off — nothing is built from it. What you typed stays in
            the job file, so ticking it back brings it all with it.</p>`;
  } else {
    body = (sec.fields.length
            ? `<div class="grid">${sec.fields.map((f) => fieldHTML(c, f)).join("")}</div>`
            : "") + (sec.slot ? `<div id="${sec.slot}"></div>` : "");
  }
  return `<div class="sec s-${sec.key}"><h3>${esc(sec.name)}${tick}</h3>${hint}${body}</div>`;
}

// The engine's reading of the selected cabinet — off its panels, not its labels.
function refreshGeometryReadout() {
  const el = $("geomreadout");
  const c = S.sel !== null && S.job.cabinets[S.sel];
  if (!el || !c || !S.res || !S.res.geometry) return;
  const g = S.res.geometry[String(c.number)];
  if (!g) { el.textContent = ""; return; }
  const how = g.source === "corner"
      ? "corner unit, derived from its arm/face measurements" +
        (g.mitre_deg !== null ? `; mitre ${g.mitre_deg}°` : "") +
        `; front face${g.face_lengths.length > 1 ? "s" : ""} ${g.face_lengths.join(" + ")} mm` +
        (g.doors.length ? `, door${g.doors.length > 1 ? "s" : ""} ${g.doors.join(" + ")}` : "")
    : g.source === "outline" ? `outline as entered, ${g.points} points`
    : g.source === "panels" ? "rectangle its panels make"
    : "declared width — its panels give none";
  el.textContent = `Checks use ${g.width} × ${g.depth}, ${g.height} high (${how}).`;
}

function renderEditor() {
  const box = $("editor");
  if (S.sel === null || S.sel === undefined || !S.job.cabinets[S.sel]) {
    box.innerHTML = `<h2>Cabinet</h2><div class="empty">Select a cabinet to edit it.</div>`;
    S.selRendered = -2;
    return;
  }
  // Already showing this cabinet: leave the DOM alone. Rebuilding it mid-edit
  // would take the caret out of whatever field is being typed into.
  if (S.selRendered === S.sel) {
    refreshGeometryReadout();
    refreshSwing();
    refreshEdging();
    refreshSupports();
    return;
  }
  S.selRendered = S.sel;

  const c = S.job.cabinets[S.sel];
  const sets = SECTIONS.map((sec) => sectionHTML(c, sec)).join("");

  const bespoke = c.template === "none"
    ? `<div class="bespoke"><b>Bespoke cabinet.</b> The template generates nothing;
       its ${c.bespoke.length} panel${c.bespoke.length === 1 ? " is" : "s are"} specified
       by hand in the job file. Size and finish fields above do not drive them.</div>` : "";

  box.innerHTML = `<h2>Cabinet ${c.number}</h2><div class="body">${sets}${bespoke}</div>`;
  renderStructure();
  renderDoors();
  renderDrawers();
  renderSupports();
  refreshGeometryReadout();
}

$("editor").addEventListener("input", (e) => {
  const c = S.job.cabinets[S.sel];
  if (!c) return;

  // which board one door leaf is cut from; "" hands it back to the exterior board
  const dboard = e.target.dataset.dboard;
  if (dboard !== undefined) {
    const n = +dboard;
    if (!Array.isArray(c.door_boards)) c.door_boards = [];
    while (c.door_boards.length <= n) c.door_boards.push("");
    c.door_boards[n] = e.target.value;
    S.selRendered = -2;
    schedule();
    return;
  }

  // edging: a thickness and a colour, per section. "" on either hands that half
  // back to the cabinet, and the name beside them is always the engine's.
  const edge = e.target.dataset.edge;
  if (edge !== undefined) {
    c[(edge === "door" ? "door_edge_" : "drawer_edge_") + e.target.dataset.ek] =
      e.target.value || null;
    S.selRendered = -2;
    schedule();
    return;
  }

  const leaf = e.target.dataset.leaf;
  if (leaf !== undefined) {
    const n = +leaf;
    if (!Array.isArray(c.door_hinges)) c.door_hinges = [];
    while (c.door_hinges.length <= n) c.door_hinges.push("");
    c.door_hinges[n] = e.target.value;      // "" hands it back to the default rule
    S.selRendered = -2;        // the side shown beside it is the engine's answer
    schedule();
    return;
  }

  const k = e.target.dataset.k;
  if (k) {
    // The number is applied when the field is finished with, not per keystroke:
    // everything that names the cabinet by number has to move with it, and typing
    // 12 passes through 1, which is another cabinet's. See the change handler.
    if (k === "number") return;
    const t = e.target.dataset.t;
    const raw = e.target.value;
    if (t === "text" || t.startsWith("sel:")) c[k] = raw;
    // a board that may be left to follow the one chosen in Structure
    else if (t === "optext") c[k] = raw === "" ? null : raw;
    // data entry only: pairs of numbers as typed; the engine reads the shape
    else if (t === "poly") c[k] = raw.trim() === "" ? []
      : raw.trim().split(/[\s;]+/).map((pt) => pt.split(",").map((n) => parseInt(n, 10)))
          .filter((pt) => pt.length === 2 && pt.every((n) => !isNaN(n)));
    else if (t === "opt") c[k] = raw === "" ? null : parseInt(raw, 10);
    else c[k] = raw === "" ? 0 : parseInt(raw, 10);
    // a board decides three tapes and two materials, so the section is rebuilt
    // a board decides materials and edging, and the door count decides how many
    // leaf rows there are, so the section is rebuilt rather than patched
    if (k === "carcass_board" || k === "exterior_board" || k === "back_board" ||
        k === "exterior_tape" || k === "back" || k === "doors" ||
        k === "drawer_carcass_board" || k === "drawer_face_board") {
      S.selRendered = -2;
    }
    schedule();
    return;
  }

  const tape = e.target.dataset.tape;
  if (tape !== undefined) {
    // "" is not a tape name: it means hand it back to the boards
    c[tape] = e.target.value === "" ? null : e.target.value;
    S.selRendered = -2;         // the value beside it is the engine's answer
    schedule();
    return;
  }

  const sup = e.target.dataset.sup;
  if (sup !== undefined) {
    const rows = supportRows();
    const sk = e.target.dataset.sk;
    const row = rows[+sup];
    if (sk === "qty") row.qty = Math.max(parseInt(e.target.value, 10) || 0, 0);
    else if (sk === "board") {
      row.board = e.target.value;
      // the board no longer offers what this row asked for: drop the kind rather
      // than order an edging that board does not have
      if (row.kind && !boardOffers(row.board, row.kind)) row.kind = "";
      renderSupports();
    } else if (sk === "kind") {
      row.kind = e.target.value;
      if (!row.board) row.board = c.carcass_board || "";
      renderSupports();
    } else { row.edge = e.target.value; renderSupports(); }
    schedule();
    return;
  }

  const i = e.target.dataset.d;
  if (i === undefined) return;
  const d = c.drawers[+i];
  const dk = e.target.dataset.dk;
  if (dk === "mode") { d.mode = e.target.value; renderDrawers(); return; }
  if (dk === "base") d.base = e.target.value;
  // "" is not a board: it hands this drawer back to the cabinet's
  else if (dk === "box_board" || dk === "face_board") d[dk] = e.target.value || null;
  else if (dk === "share") d.share = parseFloat(e.target.value) || 0;
  else d[dk] = parseInt(e.target.value, 10) || 0;
  solveStack();
});

/* ---------- the two tickboxes ---------------------------------------------
   Unticking never empties anything: the drawer list and the corner
   measurements stay in the job file exactly as they were, so ticking the box
   again brings the section back whole. What unticking can do is take panels
   off the cut list, and that is never silent — the engine is asked which
   designations would go, and they are named before anything happens. A
   designation is only ever removed, never renamed and never reused.         */

/* Renumbering a cabinet. Everything in the job that names it by number moves
   with it — its wall placement, the gap choices either side of it, the plinth
   run it starts, and its own hand-specified panels — otherwise its placement is
   left naming a cabinet that no longer exists, which is a critical the Room tab
   cannot clear. Two cabinets cannot share a number, so a taken one is refused
   rather than merging their placements. */
$("editor").addEventListener("change", (e) => {
  if (e.target.dataset.k !== "number") return;
  const c = S.job.cabinets[S.sel];
  if (!c) return;
  const from = c.number;
  const to = parseInt(e.target.value, 10);
  if (!(to > 0)) {
    toast("A cabinet number is a whole number, 1 or more.", true);
    e.target.value = from;
    return;
  }
  if (to === from) { e.target.value = from; return; }
  if (S.job.cabinets.some((x) => x !== c && x.number === to)) {
    toast(`Cabinet ${to} already exists — two cabinets cannot share a number.`, true);
    e.target.value = from;
    return;
  }
  c.number = to;
  c.bespoke.forEach((p) => { p.cabinet = to; });
  (S.job.placements || []).forEach((p) => { if (p.cabinet === from) p.cabinet = to; });
  (S.job.gaps || []).forEach((g) => {
    if (g.after === from) g.after = to;
    if (g.before === from) g.before = to;
  });
  (S.job.plinths || []).forEach((p) => { if (p.first === from) p.first = to; });
  placesSig = null; gapsSig = null; plinthSig = null;
  S.selRendered = -2;
  schedule(); renderList();
});

$("editor").addEventListener("change", async (e) => {
  const key = e.target.dataset.tick;
  if (key === undefined) return;
  const c = S.job.cabinets[S.sel];
  if (!c) return;
  const on = e.target.checked;

  if (!on) {
    const r = await post("/api/what-if",
                         {job: S.job, cabinet: c.number, set: {[key]: false}});
    if (!r.ok) { toast(r.error, true); e.target.checked = true; return; }
    if (r.removed.length) {
      const n = r.removed.length;
      const qty = r.removed.reduce((a, x) => a + x.qty, 0);
      const lines = r.removed.map((x) =>
        `    ${x.label}   ${x.role}   ${x.length} x ${x.width}  x${x.qty}`).join("\n");
      const ok = window.confirm(
        `Turning this off removes ${n} cut-list line${n === 1 ? "" : "s"} ` +
        `(${qty} panel${qty === 1 ? "" : "s"}) from cabinet ${c.number}:\n\n${lines}\n\n` +
        `Everything you typed stays in the job file, so ticking it back restores ` +
        `these unchanged. No designation is renamed or reused — these are removed, ` +
        `not renumbered.\n\nRemove them?`);
      if (!ok) { e.target.checked = true; return; }
    }
  }

  c[key] = on;
  // A cabinet saved with no doors has a count of 0, and ticking the box must
  // not show "1" while building nothing: it gets the one door it is showing.
  if (key === "has_doors" && on && !((c.doors || 0) > 0)) c.doors = 1;
  S.selRendered = -2;
  renderEditor();
  schedule();
});

$("editor").addEventListener("click", (e) => {
  if (e.target.closest("[data-clearedge]")) {
    const c = S.job.cabinets[S.sel];
    c.door_edge = null;
    // Rebuilt once the engine has answered, not before: the note being cleared
    // is the engine's report of the override, so rebuilding now would show it
    // again off the reply that still carried it.
    S.selRendered = -2;
    schedule();
    return;
  }
  const rm = e.target.closest("[data-drm]");
  if (rm) {
    S.job.cabinets[S.sel].drawers.splice(+rm.dataset.drm, 1);
    renderDrawers();
    return;
  }
  const suprm = e.target.closest("[data-suprm]");
  if (suprm) {
    supportRows().splice(+suprm.dataset.suprm, 1);
    renderSupports();
    schedule();
    return;
  }
  if (e.target.id === "supadd") {
    supportRows().push({edge: "none", qty: 1});
    renderSupports();
    schedule();
    return;
  }
  const pre = e.target.closest("[data-preset]");
  if (pre) { applyPreset(pre.dataset.preset); return; }
  if (e.target.id === "dadd") {
    const c = S.job.cabinets[S.sel];
    const std = S.def.standard || {};
    c.drawers.push({face_height: 0, box_height: std.box_height_default,
                    base: (S.def.bases || ["board"])[0], mode: "share", share: 1,
                    box_board: null, face_board: null});
    renderDrawers();
  }
});

/* ---------- doors ----------------------------------------------------------
   One or two leaves and no more: a pair hangs from its outer edges, left and
   right, and that is not a choice (ruled 18 September 2026). A single door is
   the choice. Each leaf names the board it is cut from — two leaves of
   different boards come out as two cut-list lines — and the section carries one
   edging control of its own: how thick, and what colour.

   The side beside each row is the engine's own answer, the one the plan swings
   from and the elevation draws, so the two can never drift apart.           */

function renderDoors() {
  const box = $("doorbox");
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const mats = (S.res && S.res.materials) || {};
  const keys = (S.res && S.res.boards) || [];
  const have = c.doors || 1;
  const n = Math.max(1, have);
  const counts = [1, 2];
  if (have > 2) counts.push(have);      // a job file written before the limit
  const sides = (g && g.hinges) || [];
  const widths = (g && g.doors) || [];

  const leaves = [];
  for (let i = 0; i < n; i++) {
    const side = sides[i] || (n >= 2 ? (i === 0 ? "L" : "R") : "L");
    const chosen = (c.door_boards || [])[i] || "";
    leaves.push(`<div class="leaf">
      <b>Leaf ${i + 1}</b>
      <span class="note">${widths[i] || "?"} wide</span>
      ${n === 1
        ? `<select data-leaf="0" class="hinge">
             <option value="L"${side === "L" ? " selected" : ""}>hinged left</option>
             <option value="R"${side === "R" ? " selected" : ""}>hinged right</option>
           </select>`
        : `<span class="note hinge">hinged ${side === "L" ? "left" : "right"}</span>`}
      <select data-dboard="${i}" title="what this leaf is cut from">
        <option value=""${chosen ? "" : " selected"}>exterior board (${
          esc(c.exterior_board || "—")})</option>
        ${chosen && boardIsThin(chosen)
          ? `<option value="${esc(chosen)}" selected>${esc(chosen)} (3 mm — too thin for a door)</option>`
          : ""}
        ${keys.filter((k) => !boardIsThin(k)).map((k) =>
          `<option value="${esc(k)}"${k === chosen ? " selected" : ""}>${
          esc(k)}</option>`).join("")}
      </select>
    </div>`);
  }

  // Which board is in effect, said in words: the exterior one, and any leaf
  // that has been given a board of its own instead.
  const named = (k) => k ? k + ((mats[k] || {}).board ? " — " + mats[k].board : "") : "—";
  const own = [];
  for (let i = 0; i < n; i++) {
    const k = (c.door_boards || [])[i];
    if (k && k !== c.exterior_board) own.push(`Leaf ${i + 1} is cut from ${named(k)} instead.`);
  }
  const stale = have > 2
    ? `<p class="hint" style="color:var(--warn)">This job was saved with ${have} doors on
       one cabinet. A cabinet takes 1 or 2 now — pick one. Until you do, it is cut as
       ${have}, exactly as it was saved.</p>` : "";
  box.innerHTML = `<div class="grid">
      <div class="f"><label>How many</label>
        <select data-k="doors" data-t="int">${counts.map((k) =>
          `<option value="${k}"${k === have ? " selected" : ""}>${k}</option>`).join("")}</select></div>
      <div class="f"><label>Door height</label>
        <input type="number" step="1" data-k="door_height" data-t="opt" placeholder="auto"
               value="${c.door_height === null || c.door_height === undefined
                        ? "" : c.door_height}"></div>
    </div>
    ${stale}
    ${leaves.join("")}
    <p class="hint">${n === 2
      ? "A pair is fixed: left leaf hinged left, right leaf hinged right. "
      : n === 1 ? "One door: choose which side its hinges are on — the handle goes on the other side. " : ""}External board
      is <b>${esc(named(c.exterior_board))}</b>.${own.length ? " " + esc(own.join(" ")) : ""}</p>
    ${edgingHTML(c, "door")}
    <div class="swing" id="swingnote"></div>`;
  refreshSwing();
}

// The swing check the server just ran, read back. It re-runs on every change,
// because every change goes through /api/compute.
function refreshSwing() {
  const el = $("swingnote");
  const c = S.sel !== null && S.job.cabinets[S.sel];
  if (!el || !c || !S.res) return;
  const rm = S.res.room;
  if (!rm) {
    el.className = "swing";
    el.textContent = "No room yet, so there is nothing for a door to foul — " +
                     "the swing check needs a plan to run against.";
    return;
  }
  const bad = (rm.clashes || []).filter((x) => x.cabinet === c.number && x.kind === "door");
  el.className = "swing " + (bad.length ? "bad" : "ok");
  el.textContent = bad.length
    ? "Door swing fouls " + bad.map((x) => x.against).join(", ")
    : "Door swing checked and clear.";
}

/* ---------- drawer faces: one row per face, Share or Fixed -----------------
   Fixed rows take their millimetres. The gaps come from the standard, never
   typed per drawer. Whatever is left is split among the Share rows in
   proportion to their share numbers — and every one of those numbers is
   drawers.divide's, fetched, not worked out here.                           */

function renderDrawers() {
  const box = $("drawerbox");
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const std = S.def.standard || {};
  const keys = (S.res && S.res.boards) || [];
  // What a drawer follows when it names no board of its own: the box the
  // Carcass board and the face the Exterior board, both from Structure (or the
  // cabinet-wide choice an older job file may still carry).
  const boxDefault = c.drawer_carcass_board || c.carcass_board || "";
  const faceDefault = c.drawer_face_board || c.exterior_board || "";
  // A drawer box and a drawer face are both built from a sheet, so the 3 mm
  // backing is not offered. One already stored stays, flagged.
  const boardCell = (i, dk, v, follows, what) => `<td><select data-d="${i}"
      data-dk="${dk}" title="${esc(what)} — blank follows Structure (${esc(follows || "—")})">
      <option value=""${v ? "" : " selected"}>(${esc(follows || "—")})</option>
      ${v && boardIsThin(v)
        ? `<option value="${esc(v)}" selected>${esc(v)} (3 mm — too thin)</option>` : ""}
      ${keys.filter((k) => !boardIsThin(k)).map((k) =>
        `<option value="${esc(k)}"${k === v ? " selected" : ""}>${
        esc(k)}</option>`).join("")}</select></td>`;

  const rows = c.drawers.map((d, i) => {
    const share = (d.mode || "fixed") === "share";
    const val = share ? (d.share === undefined ? 1 : d.share) : d.face_height;
    return `<tr>
      <td class="n">${i + 1}</td>
      <td><select data-d="${i}" data-dk="mode">
        <option value="share"${share ? " selected" : ""}>Share</option>
        <option value="fixed"${share ? "" : " selected"}>Fixed</option></select></td>
      <td><input type="number" step="${share ? "0.1" : "1"}" data-d="${i}"
           data-dk="${share ? "share" : "face_height"}" value="${val}"></td>
      <td class="n mono" data-mm="${i}">${d.face_height}</td>
      <td><input type="number" step="1" data-d="${i}" data-dk="box_height"
           value="${d.box_height}"></td>
      <td><select data-d="${i}" data-dk="base">${(S.def.bases || []).map((b) =>
        `<option${b === d.base ? " selected" : ""}>${esc(b)}</option>`).join("")}</select></td>
      ${boardCell(i, "box_board", d.box_board || "", boxDefault,
                  "what this drawer's box is cut from: sides, front, and a melamine base")}
      ${boardCell(i, "face_board", d.face_board || "", faceDefault,
                  "what this drawer's face is cut from")}
      <td><button data-drm="${i}" title="Remove this face">x</button></td>
    </tr>`;
  }).join("");

  box.innerHTML = `<table class="rows">
    <colgroup><col class="c-n"><col class="c-mode"><col class="c-val"><col class="c-mm">
      <col class="c-box"><col class="c-base"><col class="c-mat"><col class="c-mat">
      <col class="c-rm"></colgroup>
    <thead><tr>
      <th class="n">#</th><th>Mode</th><th>Value</th><th class="n">mm</th>
      <th title="box side height">Box h</th><th>Base</th>
      <th title="box material">Box mat.</th><th title="face material">Face mat.</th><th></th>
    </tr></thead><tbody>${rows ||
      `<tr><td colspan="9" class="note">No faces yet — add one.</td></tr>`}</tbody></table>
    <div class="dtot" id="dtot"></div>
    <div class="presets">
      <button data-preset="equal">Equal</button>
      <button data-preset="graduated">Graduated</button>
      <button id="dadd">+ Face</button>
    </div>
    <p class="hint">Listed top to bottom. The ${std.stack_gap} mm gap between faces
      comes from the standard and is never typed per drawer. Drag the join between
      two faces in the elevation to pin just those two at the heights you drag to.
      <b>Base</b> is how the drawer bottom is held: <b>board</b> is the 3 mm sheet
      grooved into all four panels, <b>melamine</b> a 16 mm one housed between
      them. <b>Box mat.</b> and <b>Face mat.</b> are per drawer: left in brackets,
      the box follows the Carcass board (${esc(boxDefault || "—")}) and the face the
      Exterior board (${esc(faceDefault || "—")}); pick a board on one row to give
      just that drawer a different finish.</p>
    ${edgingHTML(c, "drawer")}
    <p class="hint">Each box is edged in PVC in its own box material's colour —
      <b data-boxedge="1">—</b> for the default. It follows the box and is not
      chosen here.</p>`;
  refreshEdging();
  solveStack();
}

let solveSeq = 0;

async function solveStack() {
  const c = S.job.cabinets[S.sel];
  if (!c) return;
  const seq = ++solveSeq;
  const r = await post("/api/drawer-solve", {
    height: c.height,
    door_height: c.doors ? (c.door_height || 0) : 0,
    rows: c.drawers.map((d) => {
      const mode = d.mode || "fixed";
      return {mode: mode,
              value: mode === "share" ? (d.share === undefined ? 1 : d.share)
                                      : d.face_height};
    }),
  });
  if (seq !== solveSeq) return;          // a newer stack is already being solved
  if (!r.ok) { toast(r.error, true); return; }

  // what is ordered is still a list of heights: the engine's, written straight in
  r.heights.forEach((h, i) => { if (c.drawers[i]) c.drawers[i].face_height = h; });
  document.querySelectorAll("#drawerbox [data-mm]").forEach((td) => {
    td.textContent = r.heights[+td.dataset.mm];
  });
  const tot = $("dtot");
  if (tot) {
    const over = r.left < 0 || r.heights.some((h) => h <= 0);
    tot.innerHTML =
      `<span>opening <b>${r.opening}</b></span>` +
      `<span>faces + gaps <b>${r.used}</b></span>` +
      `<span class="${over ? "over" : ""}">remainder <b>${r.left}</b></span>` +
      (over ? `<span class="over">the fixed faces over-run the opening —
               export is blocked until they fit</span>` : "");
  }
  schedule();
}

async function applyPreset(which) {
  const c = S.job.cabinets[S.sel];
  if (!c.drawers.length) { toast("Add a face first.", true); return; }
  const r = await post("/api/drawer-preset", {count: c.drawers.length, preset: which});
  if (!r.ok) { toast(r.error, true); return; }
  c.drawers.forEach((d, i) => { d.mode = "share"; d.share = r.shares[i]; });
  renderDrawers();
}

/* ---------- supports -------------------------------------------------------
   A support is a cross rail spanning the internal width (W-32 x 100, code 04)
   that ties the two sides together. Rows, not a total with two subsets taken
   off it: the old model let edged + white exceed the total and the plain count
   went negative in silence. The total here is the sum of the rows, and nothing
   subtracts. A cabinet that predates the rows shows what its three numbers
   migrate to, which is what the engine resolved, not what the browser guessed. */

const SUPPORT_LABEL = {front: "Front-edged", white: "White-edged", none: "No edge"};

function renderSupports() {
  const box = $("supportbox");
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const edges = S.def.support_edges || ["none", "front", "white"];

  // With no rows of its own, show what the engine migrated the old numbers to.
  const rows = c.support_rows && c.support_rows.length
    ? c.support_rows
    : ((g && g.supports) || []);
  const migrated = !(c.support_rows && c.support_rows.length);


  const keys = (S.res && S.res.boards) || [];
  const allKinds = S.def.edging_kinds || ["pvc", "1mm", "2mm"];
  const pre = S.def.edging_prefix || {};

  // A row is edged in a board and one of the kinds THAT board offers on the
  // Boards tab — there is no edging name stated here. A row that still carries
  // only the old `edge` is shown at what it resolves to, and keeps it until it
  // is edited.
  const boardCellFor = (r, i) => {
    const eff = r.eff_board || r.board || c.carcass_board || "";
    const lost = eff && keys.indexOf(eff) < 0;
    return `<td><select data-sup="${i}" data-sk="board">
      ${lost ? `<option value="${esc(eff)}" selected>${esc(eff)} (not selected)</option>` : ""}
      ${keys.map((k) => `<option value="${esc(k)}"${k === eff ? " selected" : ""}>${
        esc(k)}</option>`).join("")}</select></td>`;
  };
  const kindCellFor = (r, i) => {
    const eff = r.eff_board || r.board || c.carcass_board || "";
    const kind = r.eff_kind !== undefined ? r.eff_kind : (r.kind || "");
    const offered = allKinds.filter((k) => boardOffers(eff, k));
    const lost = kind && offered.indexOf(kind) < 0;
    return `<td><select data-sup="${i}" data-sk="kind">
      <option value=""${kind ? "" : " selected"}>not edged</option>
      ${lost ? `<option value="${esc(kind)}" selected>${esc(pre[kind] || kind)} (not offered)</option>` : ""}
      ${offered.map((k) => `<option value="${esc(k)}"${k === kind ? " selected" : ""}>${
        esc(pre[k] || k)}</option>`).join("")}</select></td>`;
  };

  const body = rows.map((r, i) => `<tr>
      <td class="n">${i + 1}</td>
      ${boardCellFor(r, i)}
      ${kindCellFor(r, i)}
      <td><input type="number" step="1" min="0" data-sup="${i}" data-sk="qty"
           value="${r.qty}"></td>
      <td class="note" data-suprow="${i}"></td>
      <td><button data-suprm="${i}" title="Remove this row">x</button></td>
    </tr>`).join("");

  const total = rows.reduce((a, r) => a + (r.qty || 0), 0);
  const anyLegacy = ((g && g.supports) || []).some((r) => r.legacy);
  box.innerHTML = `<table class="rows">
    <colgroup><col style="width:20px"><col style="width:132px"><col style="width:98px">
      <col style="width:44px"><col style="width:172px"><col style="width:24px"></colgroup>
    <thead><tr><th class="n">#</th><th>Board</th><th>Edging</th><th>Qty</th>
      <th>Ordered as</th><th></th>
    </tr></thead><tbody>${body ||
      `<tr><td colspan="6" class="note">No supports.</td></tr>`}</tbody></table>
    <div class="dtot"><span>total <b>${total}</b> support${total === 1 ? "" : "s"}</span>
      ${migrated ? `<span class="note">migrated from the old
        ${c.supports}/${c.edged_supports}/${c.white_supports} numbers — edit to keep
        it as rows</span>` : ""}</div>
    <div class="presets"><button id="supadd">+ Support row</button></div>
    <p class="hint">A support row is edged in a board and one of the kinds that
      board offers on the <b>Boards</b> tab — nothing here states an edging name.
      ${anyLegacy ? `A row marked <b>(as quoted)</b> was written before this control
      and is still edged exactly as that job was quoted; changing it here makes it
      the cabinet's own.` : ""}</p>`;
  refreshSupports();
}


// "Ordered as" is the engine's answer for that row, and is only ever read back
// — never worked out here. It is its own function because `renderEditor` leaves
// the DOM alone when the selection has not changed (rebuilding it would take the
// caret out of the field being typed into), so after a compute the only things
// that update are the refresh* calls. Without this one the column kept whatever
// the PREVIOUS compute said, which is how a row showing board WHITEMEL and PVC
// still read "not edged".
function refreshSupports() {
  const c = S.sel !== null && S.job.cabinets[S.sel];
  if (!c) return;
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const rows = (g && g.supports) || [];
  const pre = S.def.edging_prefix || {};
  document.querySelectorAll("#editor [data-suprow]").forEach((td) => {
    const r = rows[+td.dataset.suprow];
    if (!r) { td.textContent = "…"; td.style.color = ""; return; }
    const eff = r.eff_board || "";
    const kind = r.eff_kind || "";
    const wanted = kind && eff && !boardOffers(eff, kind);
    td.textContent = r.name
      ? r.name + (r.legacy ? "  (as quoted)" : "")
      : wanted ? `${pre[kind] || kind} not offered by ${eff}`
      : "not edged";
    td.style.color = (!r.name && wanted) ? "var(--crit)" : "";
  });
}

// Any edit to the rows writes them out in full, so the migrated reading becomes
// the cabinet's own the first time it is touched. The legacy numbers are left
// exactly where they are; nothing reads them once rows exist.
function supportRows() {
  const c = S.job.cabinets[S.sel];
  if (!(c.support_rows && c.support_rows.length)) {
    const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
    // Touching a migrated cabinet writes its rows out at exactly what they were
    // resolving to, board and kind included — so the first edit cannot silently
    // move what the other rows are edged in.
    c.support_rows = ((g && g.supports) || []).map((r) => ({
      edge: r.edge, qty: r.qty,
      board: r.eff_board || "", kind: r.eff_kind || ""}));
  }
  return c.support_rows;
}

/* ---------- boards, per section --------------------------------------------
   The boards are chosen once, in Structure: what shows, what the back is cut
   from, and what the box is cut from. Doors and Drawers may each take a board
   of their own, and default to Structure's when they do not.

   Edging is one control per section — a thickness and a colour — and the colour
   is a board, so the name is still generated from that board's token. A board
   name can never reach a real order as a tape (D6 / W10). The name shown beside
   the two dropdowns is always the engine's answer, never one built here.      */

// Whether a board is the 3 mm backing sheet. The answer is the engine's, carried
// on the material record — the browser does not decide what counts as thin.
function boardIsThin(key) {
  return !!(((S.res && S.res.materials) || {})[key] || {}).thin;
}

// A board the cabinet must name. Offers the project's boards and nothing else —
// the library is chosen from on the Boards tab.
//
// `want` filters by what the board physically can be: "thick" for anything built
// from a sheet (carcass, exterior, door leaf, drawer face, drawer box), "thin"
// for the backing. A stored value that fails the rule is never dropped — it is
// still shown, flagged, and the validator reports it.
function boardSel(c, key, label, hint, want) {
  const mats = (S.res && S.res.materials) || {};
  const all = (S.res && S.res.boards) || Object.keys(mats);
  const keys = !want ? all
    : all.filter((k) => want === "thin" ? boardIsThin(k) : !boardIsThin(k));
  const row = (k) => `<option value="${esc(k)}"${k === c[key] ? " selected" : ""}>${
    esc(k)} — ${esc((mats[k] || {}).board || k)}${
    (mats[k] || {}).thickness && mats[k].thickness !== 16
      ? " · " + mats[k].thickness + "mm" : ""}</option>`;
  const stored = c[key];
  const missing = keys.indexOf(stored) < 0;
  const why = !missing ? ""
    : all.indexOf(stored) < 0 ? " (not selected)"
    : want === "thin" ? " (not a 3 mm sheet)" : " (3 mm — too thin for this)";
  return `<div class="f wide">
      <label>${esc(label)}</label>
      <select data-k="${key}" data-t="text">${
        missing
          ? `<option value="${esc(stored)}" selected>${esc(stored || "—")}${why}</option>`
          : ""}${keys.map(row).join("")}${
        !keys.length && !missing
          ? `<option value="" selected>— no ${want === "thin" ? "3 mm" : "16 mm"} board in this project —</option>`
          : ""}</select>
      <span class="note">${esc(hint)}${missing && all.indexOf(stored) >= 0
        ? ` <b style="color:var(--crit)">Kept as stored; the validator reports it.</b>` : ""}</span></div>`;
}


// What a board in this project offers. The answer is the Boards record's, read
// back off /api/compute — the browser never decides what a board can be edged in.
function boardOffers(key, kind) {
  const m = ((S.res && S.res.materials) || {})[key] || {};
  const offered = m.edging_kinds || [];
  return offered.indexOf(kind) >= 0;
}

function anyBoardOffers(kind) {
  return ((S.res && S.res.boards) || []).some((k) => boardOffers(k, kind));
}

// One edging control: how thick, and what colour. 'which' is "door" or "drawer".
// Both dropdowns are filtered by the Boards tab: a kind no board offers is not
// listed, and the colour list holds only boards that offer the chosen kind. A
// stored choice that is no longer offered is never silently changed — it stays
// shown, flagged, and the validator blocks the export.
function edgingHTML(c, which, opts) {
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const e = (g && g.edging && g.edging[which]) || {};
  const mats = (S.res && S.res.materials) || {};
  const keys = (S.res && S.res.boards) || [];
  const all = (opts && opts.kinds) || S.def.exterior_tapes || ["1mm", "2mm"];
  const kind = c[which + "_edge_kind"] || e.kind || "2mm";
  const board = c[which + "_edge_board"] || e.board || c.exterior_board;
  const override = g && g.edge_override;
  const pre = S.def.edging_prefix || {};

  // Nothing in the project can be edged at all: say what to do, rather than
  // offering two dropdowns that cannot produce a name.
  if (!all.some(anyBoardOffers)) {
    return `<div class="tape"><label>Edging</label>
      <span class="note">No board in this project has edging — tick
      <b>Has Edging</b> on a board in the Boards tab.</span></div>`;
  }

  const kinds = all.filter(anyBoardOffers);
  const kindLost = kinds.indexOf(kind) < 0;
  const colourKeys = keys.filter((k) => boardOffers(k, kind));
  const boardLost = colourKeys.indexOf(board) < 0;

  return `<div class="tape">
      <label>Edging</label>
      <div class="leaf">
        <select data-edge="${which}" data-ek="kind" title="how thick">${
          kindLost ? `<option value="${esc(kind)}" selected>${esc(kind)} (not offered)</option>` : ""
          }${kinds.map((k) =>
          `<option value="${esc(k)}"${k === kind ? " selected" : ""}>${esc(k)}</option>`
          ).join("")}</select>
        <select data-edge="${which}" data-ek="board" title="what colour">${
          boardLost ? `<option value="${esc(board)}" selected>${esc(board || "—")} (not offered)</option>` : ""
          }${colourKeys.map((k) =>
          `<option value="${esc(k)}"${k === board ? " selected" : ""}>${esc(k)} — ${
            esc((mats[k] || {}).board || k)}</option>`).join("")}</select>
        <b data-edgename="${which}" class="${e.name ? "" : (kindLost || boardLost ? "over" : "off")}">${
          esc(e.name || (kindLost || boardLost
            ? `${pre[kind] || kind} not offered by ${board || "that board"}`
            : "no edging"))}</b>
      </div>
      ${(kindLost || boardLost) ? `<span class="note" style="color:var(--crit)">
        This cabinet still asks for an edging its board no longer offers. It is kept
        exactly as it was stored — tick it on the board in the Boards tab, or choose
        another here. The export is blocked until one of those is done.</span>` : ""}
      ${override ? `<span class="note">This job file names the edging outright as
        <b>${esc(override)}</b>, and that still wins over the two choices above.
        <button data-clearedge="1">Clear it</button></span>` : ""}
    </div>`;
}

/* ---------- Structure ------------------------------------------------------
   What the cabinet is cut from, how the back is fixed, and what is inside it.
   The three boards come first because nothing else can be decided until they
   are. Dividers are in the app but not working — they are shown greyed and
   told so, rather than quietly doing nothing.                               */

function renderStructure() {
  const box = $("structurebox");
  if (!box) return;
  const c = S.job.cabinets[S.sel];
  const keys = (S.res && S.res.boards) || [];
  if (!keys.length) {
    box.innerHTML = `<p class="off">This project has no boards yet. Tick one into
      it on the <b>Boards</b> tab before choosing what this cabinet is cut from.</p>`;
    return;
  }
  // The back board is only cut when there is a back, or a drawer on a grooved
  // 3 mm base. Nothing on this cabinet uses it otherwise, so it is not asked for.
  const usesBack = c.back !== "none" ||
    (tickOn(c, "has_drawers") && (c.drawers || []).some((d) => d.base === "board"));
  const backs = S.def.backs || ["four", "three", "none"];
  const std = S.def.standard || {};

  box.innerHTML = `<div class="grid">
      ${boardSel(c, "exterior_board", "Exterior board",
                 "doors, drawer faces and anything else that shows", "thick")}
      ${usesBack
        ? boardSel(c, "back_board", "Backing board",
                   "the back panel, and a drawer base grooved out of the same sheet",
                   "thin")
        : `<div class="f wide"><label>Backing board</label>
             <p class="off">Nothing on this cabinet is cut from it — no back, and no
             drawer on a grooved base.</p></div>`}
      ${boardSel(c, "carcass_board", "Carcass board",
                 "sides, top, bottom, supports and shelves", "thick")}
      <div class="f wide"><label>Back fixing</label>
        <select data-k="back" data-t="sel:backs">${backs.map((b) =>
          `<option value="${esc(b)}"${b === c.back ? " selected" : ""}>${
            esc(BACK_LABEL[b] || b)}</option>`).join("")}</select>
        <span class="note">what the backing board is grooved into, and whether one
        is cut at all</span></div>
      <div class="f"><label>Shelves</label>
        <input type="number" step="1" min="0" data-k="shelves" data-t="int"
               value="${c.shelves || 0}">
        <span class="note">Adjustable — they sit on shelf pegs and can be moved up
        or down. Cut ${std.shelf_gap_adjustable} mm clear of the back so they
        lift out.</span></div>
      <div class="f"><label>Fixed shelves</label>
        <input type="number" step="1" min="0" data-k="fixed_shelves" data-t="int"
               value="${c.fixed_shelves || 0}">
        <span class="note">Permanently fixed in place — they do not move. Cut
        ${std.shelf_gap_fixed} mm clear of the back, so a little deeper.</span></div>
      ${unavailableField("Shelf width", c.shelf_width,
        "Greyed out: a shelf width only means something once a divider splits " +
        "the inside into bays, and dividers are not available yet.")}
      ${unavailableField("Dividers", c.divider_count,
        "a divider cannot be positioned yet")}
      ${unavailableField("Divider height", c.divider_height,
        "a divider cannot be positioned yet")}
    </div>`;
}

// The edging names in force are the engine's answer, so they are re-read rather
// than recomputed whenever a compute comes back for the cabinet on screen.
function refreshEdging() {
  const c = S.sel !== null && S.job.cabinets[S.sel];
  const g = c && S.res && S.res.geometry && S.res.geometry[String(c.number)];
  if (!g || !g.edging) return;
  // "no edging" is grey and is not a fault — it is what a board with Has Edging
  // off is supposed to say. Red is kept for a kind the board does not offer,
  // which the validator is blocking the export over.
  const c2 = c || {};
  document.querySelectorAll("#editor [data-edgename]").forEach((b) => {
    const which = b.dataset.edgename;
    const e = g.edging[which] || {};
    if (e.name) { b.textContent = e.name; b.className = ""; return; }
    const kind = c2[which + "_edge_kind"] || e.kind || "";
    const board = c2[which + "_edge_board"] || e.board || c2.exterior_board || "";
    const wanted = kind && board && !boardOffers(board, kind);
    b.textContent = wanted
      ? `${(S.def.edging_prefix || {})[kind] || kind} not offered by ${board}`
      : "no edging";
    b.className = wanted ? "over" : "off";
  });
  const boxEdge = document.querySelector("#editor [data-boxedge]");
  if (boxEdge) boxEdge.textContent = (g.edging.drawer_box || {}).name || "no edging";
}

/* ---------- the board library ----------------------------------------------
   boards.json lives in the repo, so both machines see the same boards. It is a
   library, not a job: a project selects from it, and selecting copies the
   record into the job. That copy is the price capture — editing a board here
   changes what the next job is quoted at and never what an existing one was.

   Edging names are generated from one token per board, for all three
   thicknesses. The token is its own field rather than the board's name because
   edging names are decided per order, and a long board description should not
   reach a real order as an edging name. */

S.lib = null;          // the library as /api/boards last returned it
S.libEdit = null;      // the board being edited, or null
S.libSwap = null;      // the swap being set up, or null — the two share the panel

const GRAIN_LABEL = {grain: "Grain", plain: "Plain"};

async function renderBoardsTab() {
  const r = await post("/api/boards", {});
  if (!r.ok) { toast(r.error, true); return; }
  S.lib = r;
  drawBoards();
}

function drawBoards() {
  const r = S.lib;
  if (!r) { $("boards").innerHTML = ""; return; }
  const chosen = new Set((S.res && S.res.boards) || []);
  const std = S.def.standard || {};

  const rows = r.boards.map((b) => {
    const inJob = chosen.has(b.id);
    const used = b.used_by.length
      ? b.used_by.map(esc).join(", ")
      : `<span class="note">no saved job</span>`;
    const thick = b.thickness !== 16
      ? `<span class="pill warn">${b.thickness} mm</span>` : `${b.thickness} mm`;
    return `<tr>
      <td><input type="checkbox" data-pick="${esc(b.id)}" ${inJob ? "checked" : ""}
           style="width:auto" title="use this board in this project"></td>
      <td>${b.picture
            ? `<img src="${esc(b.picture)}" alt="" class="swatch">`
            : b.colour
              ? `<span class="swatch" style="background:${esc(b.colour)}"
                       title="${esc(b.colour)}"></span>`
              : `<span class="swatch none" title="no colour set"></span>`}</td>
      <td><b>${esc(b.name)}</b><div class="note">id ${esc(b.id)}</div></td>
      <td class="n">${thick}</td>
      <td>${esc(GRAIN_LABEL[b.grain] || b.grain)}</td>
      <td class="n">R&nbsp;${(b.price || 0).toLocaleString("en-ZA",
          {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
      <td class="note">${!(b.offered || []).length
            ? "—"
            : (b.offered || []).map((k) => esc(b.tapes[k])).join("<br>")}</td>
      <td class="note">${used}</td>
      <td>
        <button data-bedit="${esc(b.id)}">Edit</button>
        ${inJob ? `<button data-bswap="${esc(b.id)}" title="swap this board across the project">Swap</button>` : ""}
        <button data-bdel="${esc(b.id)}" title="remove from the library">Del</button>
      </td></tr>`;
  }).join("");

  const bad = r.unreadable.length
    ? `<div class="matline" style="border-top:1px solid var(--line)">
         <span class="pill crit">${r.unreadable.length} job${
           r.unreadable.length === 1 ? "" : "s"} could not be read</span>
         <span class="note">${r.unreadable.map((u) =>
           esc(u.job) + " — " + esc(u.error)).join(" · ")}</span>
       </div>` : "";

  const n = chosen.size;
  const guide = S.def.board_guideline || 5;
  const pill = n === 0
    ? `<span class="pill crit">no board selected — nothing can be cut yet</span>`
    : n > guide
      ? `<span class="pill warn">${n} boards — over the ${guide} a job usually wants</span>`
      : `<span class="pill ok">${n} board${n === 1 ? "" : "s"} in this project</span>`;

  $("boards").innerHTML = `
    <div class="matline" style="border-bottom:1px solid var(--line)">
      ${pill}
      <span class="note">Ticking a board copies it into this project at today's
      price. Editing a board here never changes a job that was already quoted.</span>
      <span class="grow"></span>
      <button id="bnew" class="primary">Add board</button>
    </div>
    <div class="scroll"><table><thead><tr>
      <th title="use in this project">Use</th><th></th><th>Board</th>
      <th class="n">Thick</th><th>Grain</th><th class="n">Last price</th>
      <th>Edging (PVC / 1mm / 2mm)</th><th>Used by saved jobs</th><th></th>
    </tr></thead><tbody>${rows ||
      `<tr><td colspan="9" class="empty">The library is empty. Add a board.</td></tr>`
    }</tbody></table></div>
    ${bad}
    <p class="note" style="padding:8px 12px 12px;max-width:86ch">
      The library is <b>${esc(S.lib.path)}</b> in the repo, so it syncs with the code.
      Edging names are generated from each board's edging token — one token,
      three thicknesses. A board's <b>Last price</b> is what the next project to select
      it will be quoted at; a project already quoted keeps the price it captured.
      ${std.board_t || 16} mm is assumed everywhere a carcass size is worked out,
      so a board of another thickness is flagged on every cabinet that uses it.</p>
    <div id="boardedit"></div>`;
  drawBoardPanel();
}

// One panel under the table, showing whichever of the two is open.
function drawBoardPanel() {
  if (S.libSwap) { drawSwapPicker(); return; }
  drawBoardEditor();
}

function drawBoardEditor() {
  const box = $("boardedit");
  if (!box) return;
  const b = S.libEdit;
  if (!b) { box.innerHTML = ""; return; }
  const thicknesses = (S.def.thicknesses || [16, 25]).slice();
  if (b.thickness && thicknesses.indexOf(b.thickness) < 0) thicknesses.push(b.thickness);
  box.innerHTML = `<div class="card" style="margin:12px">
    <h2>${b.id ? "Edit board — " + esc(b.id) : "New board"}</h2>
    <div class="body">
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="f"><label>ID</label>
          <input id="bf-id" value="${esc(b.id || "")}"
                 placeholder="${b.id ? "" : "from the name"}">
          <span class="note">the material name on every panel cut from it</span></div>
        <div class="f wide" style="grid-column:2/-1"><label>Name</label>
          <input id="bf-name" value="${esc(b.name || "")}"
                 placeholder="e.g. Brookhill Fusion Chip"></div>
        <div class="f"><label>Thickness</label>
          <select id="bf-thickness">${thicknesses.map((t) =>
            `<option value="${t}"${t === b.thickness ? " selected" : ""}>${t} mm</option>`
          ).join("")}</select></div>
        <div class="f"><label>Grain</label>
          <select id="bf-grain">${(S.def.grains || ["plain", "grain"]).map((g) =>
            `<option value="${esc(g)}"${g === b.grain ? " selected" : ""}>${
              esc(GRAIN_LABEL[g] || g)}</option>`).join("")}</select></div>
        <div class="f"><label>Last price (per board)</label>
          <input type="number" step="0.01" id="bf-price" value="${b.price || 0}"></div>
        <div class="f"><label>Colour</label>
          <div class="leaf">
            <input type="color" id="bf-colourpick" style="width:44px;padding:2px"
                   value="${esc(b.colour || S.def.no_colour || "#d9d6cf")}"
                   title="what this board looks like in the drawings">
            <input id="bf-colour" value="${esc(b.colour || "")}"
                   placeholder="#rrggbb — blank for no colour set">
            <button id="bf-colourclear" title="no colour set">Clear</button>
          </div>
          <span class="note" id="bf-colournote"></span></div>
        <div class="f wide" style="grid-column:2/-1"><label>Picture (optional)</label>
          <input id="bf-picture" value="${esc(b.picture || "")}"
                 placeholder="a file path or a data: URI — optional"></div>
      </div>

      <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
        <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="bf-hasedging" style="width:auto;cursor:pointer"
                 ${b.has_edging === false ? "" : "checked"}>
          <b>Has Edging</b></label>
        <p class="note" style="margin:4px 0 8px;max-width:78ch">Untick for a board that
          is never edged — the 3 mm backing sheet. Nothing about edging is then shown
          or ordered for it anywhere. What is ticked here is kept, so re-ticking
          restores it.</p>
      </div>
      <div id="bf-edgingblock">
        <div class="grid" style="grid-template-columns:repeat(3,1fr)">
          <div class="f wide"><label>Edging kinds offered</label>
            <div class="leaf">${(S.def.edging_kinds || ["pvc", "1mm", "2mm"]).map((k) =>
              `<label style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;cursor:pointer">
                 <input type="checkbox" data-bfkind="${esc(k)}"
                 style="width:auto;cursor:pointer" ${((b.edging_kinds || []).indexOf(k) >= 0)
                   ? "checked" : ""}>${esc((S.def.edging_prefix || {})[k] || k)}</label>`
              ).join("")}</div>
            <span class="note">Only the ticked kinds can be chosen anywhere in the
              app for this board.</span></div>
          <div class="f"><label>Edging name</label>
            <input id="bf-tape" value="${esc(b.tape || "")}"
                   placeholder="e.g. WHITE">
            <span class="note" id="bf-tapes"></span></div>
        </div>
      </div>
      <p class="note" id="bf-why" style="margin:6px 0 0;color:var(--crit)"></p>
      <div class="presets">
        <button id="bf-save" class="primary">Save to the library</button>
        <button id="bf-cancel">Cancel</button>
      </div>
      <p class="note" style="margin-top:8px;max-width:78ch">
        The edging name is the token the three edgings are generated from:
        <b>PVC &lt;token&gt;</b>, <b>1mm &lt;token&gt;</b>, <b>2mm &lt;token&gt;</b>.
        It is separate from the board's name on purpose: the edging name is
        whatever this order should say, not the board's full description.
