<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupboardApp</title>
<!-- The 3D view's libraries, vendored under app/vendor/ and served by the app
     itself, so the 3D tab works with the network off. three.js 0.186.0
     (three.module.js imports ./three.core.js beside it) and camera-controls
     3.1.2. The map has to be here, before any module is imported. -->
<script type="importmap">
{"imports": {"three": "/vendor/three/three.module.js",
             "camera-controls": "/vendor/camera-controls/camera-controls.module.js"}}
</script>
<style>
  :root{
    /* the elevation and nest SVGs already use these — the page matches them */
    --ink:#191c1a; --muted:#767e78; --rule:#aab1a9; --faint:#d3d7d0;
    --carc:#f2f3f0; --door:#dceaea; --face:#f5ebd6;
    --bg:#fbfbfa; --panel:#fff; --line:#e3e5e0;
    --crit:#a4303f; --warn:#8a6d1f; --ok:#2f6b4f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
  button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--rule);
         border-radius:4px;padding:4px 10px;cursor:pointer}
  button:hover{background:var(--carc)}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.primary:hover{background:#333836}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select{font:inherit;color:inherit;background:var(--panel);
               border:1px solid var(--line);border-radius:4px;padding:3px 6px;width:100%}
  input:focus,select:focus{outline:2px solid var(--door);outline-offset:-1px;
                           border-color:var(--rule)}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);
        white-space:nowrap}
  th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;
     letter-spacing:.04em;position:sticky;top:0;background:var(--bg);z-index:1}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

  header{display:flex;gap:8px;align-items:center;padding:8px 14px;
         background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:14px;margin:0 10px 0 0;font-weight:700;letter-spacing:.02em}
  header .grow{flex:1}
  #jobname{width:190px}
  .grain b{font-size:11px;text-transform:uppercase;letter-spacing:.3px}
  .grain{white-space:nowrap}
  .dirty{font-size:11.5px;font-weight:700;color:var(--crit);border:1px solid var(--crit);border-radius:3px;padding:2px 7px;white-space:nowrap}
  #joblist{width:170px}

  #strip{display:flex;gap:22px;align-items:center;padding:9px 14px;
         background:var(--carc);border-bottom:1px solid var(--line);flex-wrap:wrap}
  #strip .cell{display:flex;flex-direction:column;gap:1px}
  #strip .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  #strip .v{font-size:15px;font-variant-numeric:tabular-nums}
  .pill{border-radius:10px;padding:1px 8px;font-size:12px;display:inline-block}
  .pill.crit{background:#f6e0e3;color:var(--crit)}
  .pill.warn{background:#f6efd9;color:var(--warn)}
  .pill.ok{background:#dfeee6;color:var(--ok)}

  nav{display:flex;gap:2px;padding:0 14px;background:var(--panel);
      border-bottom:1px solid var(--line)}
  nav button{border:none;border-bottom:2px solid transparent;border-radius:0;
             padding:8px 14px;background:none;color:var(--muted)}
  nav button:hover{background:var(--carc)}
  nav button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

  main{padding:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
        margin-bottom:14px}
  .card>h2{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
           margin:0;padding:8px 12px;border-bottom:1px solid var(--line)}
  .card>.body{padding:10px 12px}
  .scroll{overflow:auto}

  #cabwrap,.split{display:flex;gap:14px;align-items:flex-start}
  /* The elevation and the list stack on the left; the settings panel is a
     column of its own, starting level with the top of the drawing. */
  #cabmain{flex:1;min-width:0}
  #cabmain>.card:last-child{margin-bottom:0}
  #layers,#elevpick,.zoombar{float:right;margin-top:-3px;display:flex;gap:3px}
  #layers button,#elevpick button,.zoombar button{padding:2px 9px;font-size:11px;
                                  text-transform:none;letter-spacing:0}
  #elevpick .elevmode{display:flex;gap:3px;margin-left:10px;padding-left:10px;
                      border-left:1px solid var(--line)}
  #layers button.on,#elevpick button.on{background:var(--ink);color:#fff;
                                        border-color:var(--ink)}
  .zoombar{margin-left:10px}
  .zoombar button{min-width:26px}
  #elevation svg,#plan svg{display:block}
  #elevation svg .epanel{cursor:grab}
  #elevation svg .epanel:hover .epan{stroke-width:2.6}
  #cablist{flex:1;min-width:0}

  /* The 3D tab: toolbar over a three-column row — item list, viewport, dock —
     over a status line. The row takes whatever height the tab has, and the
     viewport takes whatever width the two side columns leave. */
  #v3d{display:flex;flex-direction:column;gap:8px;min-height:240px}
  #v3dbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:24px}
  #v3dbar button{padding:2px 9px;font-size:11px}
  #v3dbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  #v3dmain{display:flex;gap:8px;flex:1;min-height:0}
  #v3dview{flex:1;min-width:0;position:relative;background:#eef0ec;
           border:1px solid var(--line);border-radius:6px;overflow:hidden}
  #v3dview canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
  #v3dview .v3dnote{position:absolute;left:0;right:0;top:0;padding:8px 12px;
                    font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);
                    pointer-events:none}
  #v3dstatus{font-size:11.5px;color:var(--muted);min-height:16px;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  /* overlays inside the viewport: labels, dimension figures, the view cube,
     the legend, the help card; and the toolbar's dropdowns */
  #v3dview .v3dlabel{position:absolute;padding:1px 6px;border-radius:9px;
                     background:rgba(255,255,255,.92);border:1px solid var(--rule);
                     font-size:11px;font-weight:600;cursor:pointer;user-select:none;
                     line-height:14px}
  #v3dview .v3dlabel.sel{background:#1f6fd0;color:#fff;border-color:#1f6fd0}
  #v3dview .v3dbadge{position:absolute;width:16px;height:16px;line-height:14px;text-align:center;
                     border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;
                     border:1px solid transparent;color:#fff}
  #v3dview .v3dbadge.critical{background:var(--crit)}
  #v3dview .v3dbadge.warning{background:var(--warn)}
  #v3dview .v3dbadge.accepted{background:var(--rule)}
  #v3dview .v3ddim{position:absolute;transform:translate(-50%,-50%);font-size:11px;
                   color:#1f6fd0;background:rgba(255,255,255,.88);padding:0 4px;
                   border-radius:3px;pointer-events:none;white-space:nowrap}
  #v3dview .v3dcube{position:absolute;right:10px;top:10px;cursor:pointer;touch-action:none}
  #v3dview .v3dlegend{position:absolute;right:10px;bottom:10px;max-width:280px;
                      background:rgba(255,255,255,.93);border:1px solid var(--line);
                      border-radius:5px;padding:6px 9px;font-size:11px}
  .v3dlegend .hd{font-weight:600;display:flex;justify-content:space-between;gap:8px;
                 align-items:center}
  .v3dlegend .hd .tog{padding:0 6px;font-size:11px;line-height:14px}
  .v3dlegend.closed .rows,.v3dlegend.closed .nd{display:none}
  .v3dlegend .row{display:flex;gap:6px;align-items:center;margin-top:3px}
  .v3dlegend .sw{width:22px;height:14px;border:1px solid var(--rule);border-radius:2px;
                 display:inline-block;flex:none}
  .v3dlegend .nd{margin-top:5px;color:var(--muted)}
  #v3dview .v3dhelp{position:absolute;left:10px;top:10px;max-width:540px;
                    background:rgba(255,255,255,.96);border:1px solid var(--line);
                    border-radius:5px;padding:8px 10px;font-size:11.5px;line-height:1.5}
  #v3dbar{position:relative}
  #v3dbar .v3dmenu{position:absolute;top:26px;z-index:20;background:var(--panel);
                   border:1px solid var(--line);border-radius:5px;padding:3px;
                   display:flex;flex-direction:column;min-width:190px;
                   box-shadow:0 4px 14px rgba(0,0,0,.12)}
  #v3dbar .v3dmenu[hidden]{display:none}
  #v3dbar .v3dmenu button{text-align:left;border:none;background:none;padding:4px 8px;
                          font-size:11.5px}
  #v3dbar .v3dmenu button:hover{background:var(--carc)}
  #v3dbar .v3dmenu button.on{font-weight:700}
  #v3dbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  #editor{width:560px;flex:none;position:sticky;top:10px;max-height:calc(100vh - 30px);
          overflow:auto}
  /* The docked editor (F4): a thin strip with a chevron on its left, the
     editor beside it; closed, only the strip. On the 3D tab it fills the
     tab's height instead of sticking to the page. */
  .dock{display:flex;flex:none;align-items:flex-start;gap:0}
  .dockstrip{width:16px;flex:none;align-self:stretch;display:flex;align-items:flex-start;
             justify-content:center;padding-top:6px}
  .dockstrip .docktog{padding:0 2px;font-size:10px;line-height:16px;border:none;
                      background:none;color:var(--muted);cursor:pointer}
  .dock.closed #editor{display:none}
  .dock.closed .docktog{transform:rotate(180deg)}
  #roomwrap{display:flex;gap:14px;align-items:flex-start}
  #v3ddock{align-self:stretch;min-height:0}
  #v3ddock #editor{position:static;max-height:100%;height:100%;margin-top:0}
  #roomdock #editor{margin-top:0}
  #editor .dockissues{padding:6px 12px 0;font-size:11.5px}
  #editor .dockissues div{margin:2px 0;cursor:pointer}
  #editor .dockissues .critical{color:var(--crit)}
  #editor .dockissues .warning{color:var(--warn)}
  #editor .dockissues .accepted{color:var(--muted)}
  #plan .cab.sel{stroke:#1f6fd0 !important;stroke-width:2 !important}
  #elevation .ecabg.sel .ecab,#elevation .ecabg.sel .epan{stroke:#1f6fd0 !important;stroke-width:2.5 !important}
  #cutlist tr.flash td{background:#dbe7f7}
  /* the 3D tab's item list and part card */
  #v3dlist{width:190px;flex:none;font-size:11.5px;display:flex;flex-direction:column;
           min-height:0;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
  #v3dlist.closed{width:22px}
  #v3dlist .hd{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;
               border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;
               letter-spacing:.05em;color:var(--muted)}
  #v3dlist.closed .hd span,#v3dlist.closed .rows{display:none}
  #v3dlist .hd button{padding:0 4px;border:none;background:none;font-size:11px}
  #v3dlist .rows{overflow:auto;flex:1}
  #v3dlist .row{display:flex;gap:6px;align-items:center;padding:3px 8px;cursor:pointer;
                border-bottom:1px solid var(--line)}
  #v3dlist .row:hover{background:var(--carc)}
  #v3dlist .row.sel{background:var(--door)}
  #v3dlist .row.off{color:var(--muted)}
  #v3dlist .row .n{width:22px;font-weight:600;text-align:right}
  #v3dlist .row .d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #v3dlist .row .eye{padding:0 4px;border:none;background:none;font-size:12px;opacity:.7}
  #v3dlist .row.hidden3d .eye{opacity:.25}
  #v3dview .v3dcard{position:absolute;left:10px;bottom:10px;max-width:min(340px,calc(100% - 310px));
                    background:rgba(255,255,255,.95);border:1px solid var(--line);
                    border-radius:5px;padding:7px 10px;font-size:11.5px;line-height:1.45}
  #v3dview .v3dcard b{font-size:12px}
  #v3dview .v3dcard .x{float:right;padding:0 5px;border:none;background:none}
  #v3dview .v3dcard button.go{margin-top:4px;padding:2px 8px;font-size:11px}
  #v3dview .v3dctx{position:absolute;z-index:30;background:var(--panel);border:1px solid var(--line);
                   border-radius:5px;padding:3px;display:flex;flex-direction:column;min-width:170px;
                   box-shadow:0 4px 14px rgba(0,0,0,.12)}
  #v3dview .v3dctx button{text-align:left;border:none;background:none;padding:4px 8px;font-size:11.5px}
  #v3dview .v3dctx button:hover{background:var(--carc)}
  #v3dview .v3dctx[hidden]{display:none}
  #cablist tr.sel td{background:var(--door)}
  #cablist tbody tr{cursor:pointer}
  #cablist tbody tr:hover td{background:var(--carc)}
  #cablist tr.sel:hover td{background:var(--door)}

  fieldset{border:none;border-top:1px solid var(--line);margin:0;padding:10px 0 4px}
  fieldset:first-of-type{border-top:none;padding-top:0}
  legend{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
         padding:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-top:7px}
  .f{display:flex;flex-direction:column;gap:2px}
  .f label{font-size:11px;color:var(--muted)}
  .f.wide{grid-column:1/-1}

  /* One coloured block per section, so the eye finds Doors without reading. */
  .sec{border:1px solid var(--line);border-radius:5px;padding:8px 10px 10px;
       margin-bottom:9px}
  .sec>h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.01em;
          display:flex;align-items:center;gap:8px}
  .f .prob{display:block;color:var(--crit);font-size:11px;line-height:1.35;margin-top:2px}
  .f input.bad{border-color:var(--crit);background:#fbeef0}
  .cdiag{margin:6px 0 4px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:4px}
  .cdiag svg{display:block;width:100%;height:auto;max-height:260px}
  .cfix{color:var(--crit);font-weight:600}
  .sec>.hint{font-size:11px;color:var(--muted);margin:3px 0 0;line-height:1.35}
  .sec>.off{font-size:11.5px;color:var(--muted);margin:5px 0 0}
  .sec .tick{margin-left:auto;font-weight:400;font-size:11px;color:var(--muted);
             display:flex;align-items:center;gap:5px;cursor:pointer}
  .sec .tick input{width:auto;cursor:pointer}
  .sec .grid{margin-top:7px}
  .sec.s-size{background:#e7eef5;border-color:#cfdce8}
  .sec.s-outline{background:#e5f0e7;border-color:#c9ded0}
  .sec.s-structure{background:#f3efe2;border-color:#e0d8c2}
  .sec.s-doors{background:#dceaee;border-color:#c1dae0}
  .sec.s-drawers{background:#f7ead2;border-color:#e6d5b4}
  .sec.s-corner{background:#ece5f3;border-color:#d7cbe5}
  .sec.s-supports{background:#eaeee9;border-color:#d3dad1}
  .unavail input,.unavail select{opacity:.5;background:var(--carc)}
  .unavail label{opacity:.65}
  .unavail .why{font-size:10.5px;color:var(--warn);font-style:italic}
  .leaf{display:flex;gap:6px;align-items:center;margin-top:4px}
  .leaf b{font-weight:600;min-width:74px}
  .leaf select{width:auto}
  .leaf .hinge{flex:none;min-width:136px}  /* so each leaf's board lines up */
  .swing{font-size:11.5px;margin-top:6px}
  .swing.bad{color:var(--warn)}
  .swing.ok{color:var(--ok)}
  .dtot{display:flex;gap:16px;align-items:baseline;margin-top:7px;
        font-variant-numeric:tabular-nums}
  .dtot .over{color:var(--crit);font-weight:700}
  .presets{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  /* the Boards tab's swatch, not a drawing legend's <rect class="swatch">,
     which this used to resize to 26 px and push over its own text */
  .swatch:not(rect){width:26px;height:26px;border-radius:3px;display:block;object-fit:cover;
          border:1px solid var(--rule)}
  .swatch.none{background:repeating-linear-gradient(45deg,var(--carc),var(--carc) 4px,
               var(--panel) 4px,var(--panel) 8px)}
  /* The board picture: Browse…, or drop the image straight on it. A drop on
     this backend hands over the file's CONTENTS and no path, so the bytes go
     to the server and it copies them into Pictures/ — see cabinetgen/pictures.py. */
  .picdrop{display:flex;gap:10px;align-items:flex-start;margin-top:4px;padding:8px;
           border:1px dashed var(--rule);border-radius:5px}
  .picdrop.empty{opacity:.92}
  .picdrop.over{border-color:var(--ok);border-style:solid;
                background:rgba(60,160,120,.08)}
  .picpreview{width:72px;height:72px;flex:0 0 auto;border-radius:4px;
              object-fit:cover;border:1px solid var(--rule);display:block}
  .picpreview.none{background:repeating-linear-gradient(45deg,var(--carc),var(--carc) 5px,
                   var(--panel) 5px,var(--panel) 10px)}
  .picdrop input[readonly]{opacity:.8}
  .note .bad{color:var(--crit)}
  header .grow,.matline .grow{flex:1}
  .orients{display:flex;gap:6px;flex-wrap:wrap}
  .orient{display:flex;align-items:center;gap:6px;padding:5px 8px;
          border:1px solid var(--rule);border-radius:6px;cursor:pointer;
          font-size:11px;line-height:1.15;max-width:170px}
  .orient.on{border-color:var(--ink);background:rgba(0,0,0,.04)}
  .orient input{margin:0}
  .orient svg{flex:0 0 auto;color:var(--ink)}
  .tape{margin-top:8px}
  .tape>label{font-size:11px;color:var(--muted);display:block}
  .tape .leaf{margin-top:2px}
  .tape .leaf select{flex:1;min-width:0}
  .tape .leaf b{min-width:96px;font-variant-numeric:tabular-nums}
  .tape .leaf b.over{color:var(--crit)}
  /* a board with no edging at all: grey, because that is a setting, not a fault */
  .tape .leaf b.off{color:var(--muted);font-weight:400}
  .tape .note{display:block;margin-top:2px;line-height:1.3}
  /* nine columns in a side panel (the settings column is 560 wide for them):
     let the numbers and board ids have the room, not the labels */
  #drawerbox table{table-layout:fixed}
  #drawerbox th,#drawerbox td{padding:2px 3px;font-size:11.5px}
  #drawerbox input,#drawerbox select{padding:2px 3px}
  #drawerbox col.c-n{width:18px}
  #drawerbox col.c-mode{width:56px}
  #drawerbox col.c-val{width:50px}
  #drawerbox col.c-mm{width:36px}
  #drawerbox col.c-box{width:50px}
  #drawerbox col.c-base{width:66px}
  #drawerbox col.c-mat{width:auto}
  #drawerbox col.c-rm{width:30px}
  #elevation{position:relative}
  #elevation svg{user-select:none;-webkit-user-select:none}
  #elevation svg .ecabg{cursor:grab}
  #elevation svg .ecabg.erun{cursor:pointer}
  #elevation svg .ecabg:hover .ecab{stroke-width:2.2}
  #elevation svg .ecabg.dragging{cursor:grabbing;opacity:.6}
  #elevdrag{position:absolute;background:var(--ink);color:#fff;font-size:11px;
            padding:2px 7px;border-radius:3px;pointer-events:none;display:none;
            white-space:nowrap;z-index:5}
  #elevation svg .fdiv{cursor:ns-resize}
  #elevation svg .fdiv:hover{stroke-opacity:.9}
  .rows td,.rows th{padding:3px 5px}
  .note{color:var(--muted);font-size:11.5px}
  .mono{font-variant-numeric:tabular-nums}
  .bespoke{background:var(--face);border:1px solid var(--rule);border-radius:4px;
           padding:7px 9px;font-size:12px;margin-top:8px}

  .issue{display:flex;gap:9px;padding:6px 12px;border-bottom:1px solid var(--line);
         align-items:baseline}
  .issue .lvl{flex:none;width:64px;font-size:10.5px;text-transform:uppercase;
              letter-spacing:.04em;font-weight:700}
  .issue.critical .lvl{color:var(--crit)}
  .issue.warning .lvl{color:var(--warn)}
  .issue .where{flex:none;width:70px;color:var(--muted);font-variant-numeric:tabular-nums}
  .issue .msg{flex:1}
  .issue .ref{flex:none;color:var(--muted);font-size:11px}
  .issue.accepted{color:var(--muted);background:#f4f5f3}
  .issue.accepted .lvl{color:var(--muted)}
  .issue .why{display:block;font-size:11.5px;margin-top:2px}
  .issue .acts{flex:none;display:flex;gap:6px;align-items:baseline}
  .acceptform{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .acceptform input{width:260px}
  .lapsenote{padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;
             color:var(--warn);background:#fbf7ea}
  tr.hasissue td{background:#fdf6f7}
  .rowissue{font-size:11.5px;padding:2px 8px 5px 18px}
  .rowissue.critical{color:var(--crit)}
  .rowissue.warning{color:var(--warn)}

  .empty{padding:26px 12px;text-align:center;color:var(--muted)}
  #toast{position:fixed;right:14px;bottom:14px;max-width:520px;background:var(--ink);
         color:#fff;padding:9px 13px;border-radius:5px;display:none;white-space:pre-wrap;
         box-shadow:0 3px 14px rgba(0,0,0,.22);z-index:9}
  #toast.bad{background:var(--crit)}
  #plan svg .cab{cursor:grab}
  #plan svg .cab.dragging{cursor:grabbing}
  /* A label is drawn over the middle of its cabinet — exactly where a cabinet is
     grabbed — and a panel's number sits beside it, over the next cabinet. Text
     that took the press left dead spots where a drag did nothing (22 Sept 2026). */
  #plan svg text{pointer-events:none}
  #plan svg .front{transition:opacity .08s}
  #plan.showfronts svg .front{opacity:1 !important}
  #dragreadout{position:absolute;background:var(--ink);color:#fff;font-size:11px;
               padding:2px 7px;border-radius:3px;pointer-events:none;display:none;
               white-space:nowrap;z-index:5}
  #plan{position:relative}
  .sheetsvg{overflow:auto;border-top:1px solid var(--line);padding:8px 12px}
  .sheetsvg svg{display:block}
  .matline{display:flex;gap:18px;align-items:baseline;padding:8px 12px;flex-wrap:wrap}
  .matline b{font-size:14px}
  /* The hand, as two small plan pictures. A corner unit is the one thing in
     this editor where a word ("left") is genuinely ambiguous until you see it,
     so the picture is the control and the word is the label. */
  .hands{display:flex;gap:6px;margin-top:4px}
  .handopt{flex:1;display:block;border:1px solid var(--rule);border-radius:6px;
           padding:6px 7px;cursor:pointer;font-size:11px;line-height:1.15}
  .handopt.on{border-color:var(--ink);background:rgba(0,0,0,.04)}
  .handopt input{display:none}
  .handopt svg{display:block;width:100%;height:44px;color:var(--ink)}
  .handopt b{display:block;font-size:11.5px;margin-top:3px}
  .handopt span{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
  .handopt .wall{stroke:currentColor;stroke-width:2.5;opacity:.4;fill:none}
  .handopt .box{fill:var(--door);stroke:currentColor;stroke-width:1.2}
  .handopt .front{stroke:currentColor;stroke-width:2;fill:none}
  .handopt .blindp{fill:currentColor;opacity:.4}
  /* A field whose answer is typed somewhere else: greyed like an unavailable
     one, but showing the engine's real figure rather than nothing. */
  .derived input{opacity:.55;background:var(--carc)}
  .derived label{opacity:.7}
  .derived .why{font-size:10.5px;color:var(--muted);font-style:italic}
</style>
</head>
<body>

<header>
  <h1>CupboardApp</h1>
  <input id="jobname" placeholder="job name" title="job name">
  <button id="new">New</button>
  <button id="save">Save</button>
  <select id="joblist" title="saved jobs"></select>
  <button id="load">Load</button>
  <button id="jobdel" title="move the selected job to jobs/_deleted/">Delete</button>
  <span id="dirty" class="dirty" hidden>unsaved changes</span>
  <button id="fixture" title="the October 2025 wardrobe regression fixture">Oct 2025</button>
  <span class="grow"></span>
  <button id="export" class="primary">Export cut list</button>
</header>

<div id="strip"></div>

<nav>
  <button data-tab="cabinets" class="on">Cabinets</button>
  <button data-tab="boards">Boards</button>
  <button data-tab="room">Room</button>
  <button data-tab="view3d">3D view</button>
  <button data-tab="cutlist">Cut list</button>
  <button data-tab="nesting">Nesting</button>
  <button data-tab="validation">Validation</button>
</nav>

<main>
  <section id="tab-cabinets">
    <div id="cabwrap">
      <div id="cabmain">
        <div class="card">
          <h2>Elevation <span id="elevzoombar" class="zoombar"><button data-zoom="0.8"
            title="zoom out">&minus;</button><button data-zoom="reset"
            id="elevzoom" title="back to 100%">100%</button><button data-zoom="1.25"
            title="zoom in">+</button></span> <span id="elevpick"></span></h2>
          <div class="scroll" id="elevation" style="padding:8px 12px"></div>
        </div>
        <div class="card" id="cablist">
          <h2>Cabinets <button id="add" style="float:right;margin-top:-3px">Add cabinet</button></h2>
          <div class="scroll" id="cabtable"></div>
        </div>
      </div>
      <!-- The ONE editor. It is moved, never copied, into whichever tab's dock
           is showing (Cabinets, Room, 3D), so there is one thing that can be
           edited and nothing that can disagree with it. -->
      <div class="dock" id="cabdock"><div class="dockstrip"><button class="docktog" title="collapse the editor">&#x276F;</button></div>
        <div class="card" id="editor"></div></div>
    </div>
  </section>

  <section id="tab-boards" hidden>
    <div class="card"><h2>Board library</h2><div id="boards"></div></div>
  </section>

  <section id="tab-room" hidden>
    <div id="roomwrap">
      <div class="card" style="flex:1;min-width:0">
        <h2>Plan <span id="planzoombar" class="zoombar"><button data-zoom="0.8"
          title="zoom out">&minus;</button><button data-zoom="reset"
          id="planzoom" title="back to 100%">100%</button><button data-zoom="1.25"
          title="zoom in">+</button></span> <span id="layers"></span></h2>
        <div class="scroll" id="plan" style="padding:8px 12px"></div>
      </div>
      <div class="dock" id="roomdock"><div class="dockstrip"><button class="docktog" title="collapse the editor">&#x276F;</button></div></div>
    </div>
    <div class="split">
      <div class="card" style="flex:1;min-width:0">
        <h2>Walls</h2>
        <div id="room"></div>
      </div>
      <div class="card" style="width:500px;flex:none">
        <h2>Placements</h2>
        <div id="places"></div>
      </div>
    </div>
    <div class="split">
      <div class="card" style="flex:1;min-width:0">
        <h2>Gaps</h2>
        <div id="gaps"></div>
      </div>
      <div class="card" style="width:500px;flex:none">
        <h2>Plinth</h2>
        <div id="plinth"></div>
      </div>
    </div>
  </section>

  <section id="tab-cutlist" hidden>
    <div class="card"><h2>Cut list</h2><div class="scroll" id="cutlist"></div></div>
  </section>

  <section id="tab-nesting" hidden>
    <div id="nesting"></div>
  </section>

  <section id="tab-validation" hidden>
    <div class="card"><h2>Validation</h2><div id="validation"></div></div>
  </section>

  <!-- The 3D view (Part F). The viewport fills the window below the tab bar
       and never makes the page scroll; the module app/view3d.js is loaded the
       first time this tab is opened, so start-up is untouched. -->
  <section id="tab-view3d" hidden>
    <div id="v3d">
      <div id="v3dbar"></div>
      <div id="v3dmain">
        <div id="v3dlist"></div>
        <div id="v3dview"></div>
        <div class="dock" id="v3ddock"><div class="dockstrip"><button class="docktog" title="collapse the editor">&#x276F;</button></div></div>
      </div>
      <div id="v3dstatus"></div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
"use strict";

/* ---------- state ------------------------------------------------------- */

const S = {
  job: null,        // the job, exactly as store.py serialises it
  res: null,        // last /api/compute response
  sel: null,        // selected cabinet index
  selRendered: -2,  // which index the editor DOM currently shows
  dirty: false,     // edits are on screen that are not on disk
  tab: "cabinets",
  def: null,        // /api/defaults
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s === null || s === undefined ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

async function post(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  return r.json();
}

let toastTimer = null;
function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.className = bad ? "bad" : "";
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, bad ? 9000 : 4000);
}

/* ---------- the job ----------------------------------------------------- */

// A new project starts with no boards at all. Nothing can be cut until one is
// selected from the library, which is the point — a cabinet has to be cut from
// something, and guessing which board that is has never ended well.
function blankJob() {
  return {name: "untitled", boards: [], materials: {}, cabinets: [], loose: [],
          placements: []};
}

/* The job's placements, always an array. A job saved with no room carries no
   `placements` key (store writes none, so the file round-trips), and neither
   does a job the server hands back after a board change — so every read goes
   through here rather than trusting the key to be there. Found 23 September
   2026: Add a room on a new job threw in renderPlaces and blanked the Room tab. */
function places() {
  if (!Array.isArray(S.job.placements)) S.job.placements = [];
  return S.job.placements;
}

function blankCabinet(number) {
  return {
    number: number, width: 600, height: 2400, depth: 500,
    kind: "tall", back: "four", template: "standard",
    support_rows: [{edge: "none", qty: 4}],
    supports: 4, edged_supports: 0, white_supports: 0,
    shelves: 0, fixed_shelves: 0, shelf_width: null,
    divider_height: null, divider_count: 0,
    doors: 1, door_height: null, door_hinges: [], has_doors: null, door_boards: [],
    drawers: [], has_drawers: null,
    exposed_sides: 0,
    carcass_board: "", exterior_board: "", back_board: "", exterior_tape: "2mm",
    door_edge_kind: null, door_edge_board: null,
    drawer_edge_kind: null, drawer_edge_board: null,
    drawer_carcass_board: null, drawer_face_board: null,
    carcass_edge: null, door_edge: null, drawer_box_edge: null,
    bespoke: [], note: "", footprint: [],
    corner_style: "", arm_a: null, arm_b: null, face_a: null, face_b: null,
    corner_unit: null, corner_hand: "", blind_width: null,
    blind_board: "", blind_edge_kind: null,
    arm_shelves: 0, arm_shelf_arm: "a", arm_shelf_depth: null,
    mitred_shelves: 0, corner_door_width: null,
  };
}

/* ---------- compute ----------------------------------------------------- */

let computeTimer = null;
// Nothing reaches the disk until Save is pressed — a saved job is the price
// capture, so an experiment must not be able to move one by itself (ruled
// 20 September 2026). The marker is what makes "not saved yet" visible, and the
// browser asks before a reload or a close throws the edits away.
function markDirty(on) {
  S.dirty = !!on;
  const el = $("dirty");
  if (el) el.hidden = !S.dirty;
}

window.addEventListener("beforeunload", (e) => {
  if (!S.dirty) return;
  e.preventDefault();
  e.returnValue = "";
});

/* A file dropped anywhere but on the board-picture zone would otherwise make the
   window navigate to that file, which throws the whole app — and the unsaved
   job with it — away. The zone stops the event before this sees it.          */
["dragover", "drop"].forEach((ev) => window.addEventListener(ev, (e) => {
  e.preventDefault();
  if (ev === "drop" && e.dataTransfer && e.dataTransfer.files.length) {
    toast("drop a board picture on the picture box in the Boards tab", true);
  }
}));

// True when the edits should be thrown away: either there are none, or the
// operator said so. Asked before anything replaces the job on screen.
function okToDiscard(what) {
  if (!S.dirty) return true;
  return window.confirm(
    `${S.job.name || "This job"} has unsaved changes.\n\n` +
    `${what} will discard them. Save first if you want to keep them.\n\nDiscard?`);
}

function schedule() {
  markDirty(true);
  clearTimeout(computeTimer);
  computeTimer = setTimeout(compute, 180);
}

let computeSeq = 0;

async function compute() {
  S.job.name = $("jobname").value.trim() || "untitled";
  const seq = ++computeSeq;
  const res = await post("/api/compute", {job: S.job});
  if (seq !== computeSeq) return;   // a newer job is already being computed
  S.res = res;
  if (!res.ok) toast(res.error, true);
  dropLapsed(res.lapsed || []);
  renderStrip();
  if (S.tab === "boards" && S.lib) drawBoards();
  renderElevation();
  renderList();
  refreshScene();          // the 3D view catches up, now or when next shown
  renderTab();
}

/* ---------- accepted criticals --------------------------------------------
   A site-dependent critical can be accepted with a reason, and the export then
   goes ahead (ruled 22 September 2026; today the tip-up check alone). Which
   checks can be accepted, and the fingerprint an acceptance is stored with, are
   the engine's answers — `/api/accept` and `validate.ACCEPTABLE`. The browser
   stores what comes back and decides nothing.

   An acceptance lapses when what the check read has changed. The engine says
   which in `lapsed`; they are taken out of the job here and said out loud, and
   the critical blocks again.                                                 */

S.lapsedNotes = [];

function acceptances() {
  if (!Array.isArray(S.job.acceptances)) S.job.acceptances = [];
  return S.job.acceptances;
}

function dropLapsed(lapsed) {
  if (!lapsed.length) return;
  const gone = (a) => lapsed.some((l) => l.check === a.check && String(l.where) === String(a.where));
  S.job.acceptances = acceptances().filter((a) => !gone(a));
  if (!S.job.acceptances.length) delete S.job.acceptances;   // written only when present
  lapsed.forEach((l) => S.lapsedNotes.push(
    `Acceptance for ${l.where} (${l.check}) was cleared because the cabinet or the ` +
    `ceiling changed — it blocks again until it is looked at afresh.`));
  markDirty(true);
  toast(S.lapsedNotes.slice(-lapsed.length).join("\n"), true);
}

// A critical that still blocks: not accepted.
function blocksExport(i) { return i.level === "critical" && !i.accepted; }

/* ---------- summary strip ----------------------------------------------- */

function renderStrip() {
  const r = S.res;
  if (!r) { $("strip").innerHTML = ""; return; }
  const cells = [];
  const cell = (k, v) => cells.push(
    `<div class="cell"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`);

  const panels = Object.values(r.summary.materials)
    .reduce((a, m) => a + m.panels, 0);
  cell("Cabinets", S.job.cabinets.length);
  cell("Panels", panels);

  const mats = Object.keys(r.summary.materials).sort();
  const boards = mats.map((m) =>
    `${esc(m)}&nbsp;<b>${r.summary.materials[m].est_boards}</b>`).join(" &nbsp;·&nbsp; ");
  cell("Boards", boards || "—");

  cell("Pot holes", r.summary.potholes);
  cell("Estimated", "R&nbsp;" + (r.cost.total_incl_vat || 0)
    .toLocaleString("en-ZA", {minimumFractionDigits: 2, maximumFractionDigits: 2}));

  const crit = r.issues.filter(blocksExport).length;
  const took = r.issues.filter((i) => i.level === "critical" && i.accepted).length;
  const warn = r.issues.filter((i) => i.level !== "critical").length;
  let v;
  if (!r.ok) v = `<span class="pill crit">engine error</span>`;
  else if (crit) v = `<span class="pill crit">${crit} critical</span>` +
    (warn ? ` <span class="pill warn">${warn} warning${warn > 1 ? "s" : ""}</span>` : "");
  else if (warn) v = `<span class="pill warn">${warn} warning${warn > 1 ? "s" : ""}</span>`;
  else v = `<span class="pill ok">clear</span>`;
  if (r.ok && took) v += ` <span class="pill">${took} accepted</span>`;
  cell("Validation", v);

  $("strip").innerHTML = cells.join("");
  $("export").disabled = !r.ok || r.blocking;
  $("export").title = r.blocking
    ? "Blocked — criticals must be cleared first" : "Write the Plazaboard CSVs";
}

/* ---------- elevation --------------------------------------------------- */

// null shows the whole job side by side; a wall id shows that wall face on.
S.elev = null;
let elevSeq = 0;

// Line or Finish (23 Sept 2026). Both draw a wall's own cabinets the same; they
// differ only in the runs on the walls either side — grey outlines end on
// (Line), or what you would see of them from this wall, in their boards
// (Finish). A view setting and nothing more: not saved in the job, and it
// moves no geometry. The Run has no walls either side, so there the toggle is
// greyed out and keeps its choice for the next wall.
S.elevMode = "line";

async function renderElevation() {
  const rm = S.job.room;
  if (!rm || !rm.walls.some((w) => w.id === S.elev)) S.elev = null;
  const onRun = S.elev === null;
  const modes = `<span class="elevmode">` + [["line", "Line"], ["finish", "Finish"]]
    .map(([k, label]) => `<button data-elevmode="${k}" class="${
      S.elevMode === k && !onRun ? "on" : ""}"${onRun
      ? ' disabled title="The Run has no walls either side: Line and Finish draw it the same"'
      : ""}>${label}</button>`).join("") + `</span>`;
  $("elevpick").innerHTML = (rm && rm.walls.length
    ? [["", "Run"]].concat(rm.walls.map((w) => [w.id, "Wall " + w.id]))
        .map(([k, label]) => `<button data-elev="${esc(k)}" class="${
          (S.elev || "") === k ? "on" : ""}">${esc(label)}</button>`).join("")
    : "") + modes;
  alignEditor();
  if (onRun) {
    $("elevation").innerHTML = ((S.res && S.res.elevation) || "")
      + `<div id="elevdrag"></div>`;
    applyZoom("elevation");
  markSelected();
    return;
  }
  const seq = ++elevSeq;
  const r = await post("/api/elevation", {job: S.job, wall: S.elev, mode: S.elevMode});
  if (seq !== elevSeq) return;             // a newer wall or job has been asked for
  if (!r.ok) { toast(r.error, true); return; }
  $("elevation").innerHTML = r.svg + `<div id="elevdrag"></div>`;
  applyZoom("elevation");
  markSelected();
}

// The settings panel starts level with the line under the Run / Wall buttons —
// the top of the drawing, not the top of the card that holds its heading. The
// heading's height depends on the font and on whether the buttons are there,
// so it is measured rather than typed in.
function alignEditor() {
  const card = document.querySelector("#cabmain > .card");
  const head = card && card.querySelector(":scope > h2");
  if (!head || $("tab-cabinets").hidden) return;
  const drop = Math.round(head.getBoundingClientRect().bottom -
                          card.getBoundingClientRect().top) - 1;
  $("editor").style.marginTop = Math.max(drop, 0) + "px";
}
window.addEventListener("resize", alignEditor);

$("elevpick").addEventListener("click", (e) => {
  const m = e.target.closest("[data-elevmode]");
  if (m) { S.elevMode = m.dataset.elevmode; renderElevation(); return; }
  const b = e.target.closest("[data-elev]");
  if (!b) return;
  S.elev = b.dataset.elev || null;
  renderElevation();
});

/* ---------- cabinet list ------------------------------------------------ */

function frontsText(c) {
  const bits = [];
  // an unticked door count is still in the job file, but nothing is built from it
  const d = tickOn(c, "has_doors") ? (c.doors || 0) : 0;
  if (d) bits.push(d + (d > 1 ? " doors" : " door"));
  // an unticked stack is still in the job file, but nothing is built from it
  const n = tickOn(c, "has_drawers") ? (c.drawers || []).length : 0;
  if (n) bits.push(n + " drw");
  return bits.join(", ") || "—";
}

function renderList() {
  const rows = S.job.cabinets.map((c, i) => {
    const shelves = (c.shelves || 0) + (c.fixed_shelves || 0);
    // A panel's declared width, height and depth are labels: its real size is
    // its board and its two typed extents, so the table shows the engine's
    // figures for one. A cupboard still shows what it is being built to.
    const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
    const isP = !!(g && ((g.is_panel) || (g.corner && g.corner.kind)));
    const dash = g && g.corner && cornerBroken(c);
    const dim = (k) => dash ? "\u2014" : (isP ? g[k] : c[k]);
    return `<tr data-i="${i}" class="${i === S.sel ? "sel" : ""}">
      <td class="n">${c.number}</td>
      <td class="n">${dim("width")}</td><td class="n">${dim("height")}</td><td class="n">${dim("depth")}</td>
      <td>${esc(c.kind)}${g && g.corner && g.corner.kind ? " \u00b7 " + esc(g.corner.kind)
        + " " + (g.corner.hand === "L" ? "L" : "R") : ""}</td>
      <td>${esc(frontsText(c))}</td>
      <td class="n">${shelves || ""}</td>
      <td>${c.template === "none" ? "bespoke" : ""}</td>
      <td class="note">${esc(c.note || "")}</td>
      <td><button data-dup="${i}" title="Duplicate">Dup</button>
          <button data-del="${i}" title="Delete">Del</button></td>
    </tr>`;
  }).join("");

  slot($("cabtable")).innerHTML = S.job.cabinets.length ? `<table>
    <thead><tr><th class="n">#</th><th class="n">W</th><th class="n">H</th><th class="n">D</th>
      <th>Kind</th><th>Fronts</th><th class="n">Shv</th><th></th><th>Note</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`
    : `<div class="empty">No cabinets yet. <b>Add cabinet</b> to start,
       or load the Oct 2025 job to see a real one.</div>`;

  renderEditor();
}

// Copy the item at `i`, with the next free number from the engine. Everything
// comes with it EXCEPT its placement: a placement names a cabinet by number, so
// a copy has none and is put where it goes. That is what a bulkhead wants —
// four panels of the same description in four different places — and it is
// what the cabinet table's Dup has always done.
async function dupCabinet(i) {
  const src = S.job.cabinets[i];
  if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  const r = await post("/api/next-number", {job: S.job});
  copy.number = r.number;
  (copy.bespoke || []).forEach((p) => { p.cabinet = copy.number; });
  S.job.cabinets.splice(i + 1, 0, copy);
  selectCabinet(i + 1);
  schedule(); renderList();
}

$("cabtable").addEventListener("click", async (e) => {
  const dup = e.target.closest("[data-dup]");
  if (dup) {
    await dupCabinet(+dup.dataset.dup);
    return;
  }
  const del = e.target.closest("[data-del]");
  if (del) {
    const i = +del.dataset.del;
    const gone = S.job.cabinets.splice(i, 1)[0];
    // Everything in the job that names the cabinet by number goes with it. A
    // placement left behind is a critical ("placement for a cabinet that does
    // not exist") that the Room tab cannot clear, since its table lists only
    // cabinets that exist. A gap or plinth choice that named it is just as dead.
    if (gone) {
      const n = gone.number;
      S.job.placements = places().filter((p) => p.cabinet !== n);
      S.job.gaps = (S.job.gaps || []).filter((g) => g.after !== n && g.before !== n);
      S.job.plinths = (S.job.plinths || []).filter((p) => p.first !== n);
      placesSig = null; gapsSig = null; plinthSig = null;
    }
    if (gone && S.isolate === gone.number) S.isolate = null;
    if (S.sel === i) S.sel = null;
    else if (S.sel > i) S.sel -= 1;
    schedule(); renderList();
    return;
  }
  const tr = e.target.closest("tr[data-i]");
  if (tr) { selectCabinet(+tr.dataset.i); renderList(); refreshPlan(); }
});

$("add").addEventListener("click", async () => {
  // Nothing can be chosen until a board is. Say exactly what is missing and
  // where to fix it, rather than making a cabinet out of nothing.
  const picked = (S.res && S.res.boards) || [];
  if (!picked.length) {
    toast("No board selected yet. A cabinet has to be cut from something — open " +
          "the Boards tab and tick at least one board into this project first.", true);
    document.querySelector('nav [data-tab="boards"]').click();
    return;
  }
  const r = await post("/api/next-number", {job: S.job});
  const fresh = blankCabinet(r.number);
  // A back is the thin sheet, so the thinnest selected board is the sensible
  // place to start. It is a starting point and not a rule — the dropdown is
  // right there, and the validator names the cabinet if it is wrong.
  const mats = (S.res && S.res.materials) || {};
  const thick = (k) => (mats[k] || {}).thickness || 999;
  fresh.back_board = picked.slice().sort((a, b) => thick(a) - thick(b))[0];
  // The carcass and what shows are both full-thickness boards, in selection
  // order: the first, and the last. The board the back is cut from is left out
  // of that — a 3 mm backing sheet is not a door, and offering it as one is how
  // a starting point becomes a wrong cut list nobody looked at twice.
  const full = picked.filter((k) => k !== fresh.back_board);
  const pool = full.length ? full : picked;
  fresh.carcass_board = pool[0];
  fresh.exterior_board = pool[pool.length - 1];
  fresh.has_doors = false;      // tick it on when this cabinet actually has doors
  S.job.cabinets.push(fresh);
  // P3: a new cabinet isolates itself. It has no placement yet, so there is
  // nothing to draw until a wall is picked for it in the Room tab — and the
  // moment there is, it is the one solid thing on the plan however much is
  // already sitting where `free_x` had to put it.
  selectCabinet(S.job.cabinets.length - 1);
  schedule(); renderList();
});

/* ---------- cabinet editor ---------------------------------------------- */

/* Seven sections, each in its own colour block, in the order a cabinet gets
   described: what it is, what shape it makes on the floor, what it is built from
   and what is inside it, what closes it, and what ties it together.

   Everything a section needs is in that section. The boards are chosen once, in
   Structure; Doors and Drawers each choose their own material and their own
   edging and say nothing about anyone else's. */
// Whether the selected item is an independent panel rather than a cupboard.
// The engine's answer where there is one; until the next compute lands, the
// kind that was just picked. It is a question about which controls to show,
// not about a dimension — every size a panel has still comes from the engine.
function isPanelCab(c) {
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  if (g && g.is_panel !== undefined) return !!g.is_panel;
  return c.kind === "panel";
}

const notPanel = (c) => !isPanelCab(c);

/* ---------- corner units ----------------------------------------------------
   The engine's reading of this cabinet's corner, read back. Every dimension in
   it was worked out in cabinetgen; the browser works out none of them, which is
   exactly what lets the Size fields be greyed and still show something true.
   Until the next compute lands, only the two things the operator has just
   clicked are known - the tick and the type - and that is all this falls back
   to. */
function cornerInfo(c) {
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  if (g && g.corner !== undefined) return g.corner;
  if (!tickOn(c, "corner_unit")) return null;
  return {ticked: true, kind: c.corner_style || "",
          hand: c.corner_hand === "L" ? "L" : "R", style: c.corner_style || ""};
}
function cornerTicked(c) { return !!cornerInfo(c); }
function cornerKind(c) { const k = cornerInfo(c); return (k && k.kind) || ""; }

// Mitre and ell derive their whole plan shape from the four measurements, so an
// entered outline is never read. A BLIND corner is a plain rectangle like any
// other cabinet and its outline IS read, so that one stays live.
function cornerShaped(c) {
  const k = cornerKind(c);
  return k === "mitre" || k === "ell";
}

// Where a dimension is really entered. It has to be obvious to somebody who has
// not read the code: a panel's sizes are in Panel design, a corner unit's are in
// Corner Unit, and Kind stays live either way because a corner can be top-hung,
// base or tall.
function sizeGrey(c, key) {
  if (!(key === "width" || key === "height" || key === "depth")) return "";
  if (isPanelCab(c)) return "Set in Panel design below";
  if (cornerTicked(c)) return "Set in Corner Unit below";
  return "";
}
function outlineGrey(c) {
  return cornerShaped(c)
    ? "Derived from the corner measurements \u2014 an entered outline is not read"
    : "";
}

// The engine's figure for a greyed dimension. A declared width on a corner unit
// or a panel is a label and no check reads it, so showing the declared one back
// would be showing the wrong number in a field that looks authoritative.
function derivedSize(c, key) {
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  if (!g) return null;
  if (cornerBroken(c)) return null;       // no shape yet, so no size to show
  return {width: g.width, height: g.height, depth: g.depth}[key];
}

// A corner unit whose measurements do not make a shape yet. Its sizes are shown
// as a dash rather than the declared figures, which were never its sizes.
function cornerBroken(c) {
  const info = cornerInfo(c);
  if (!info || !info.kind) return !!info;          // ticked, no type chosen
  return !!(info.problems && Object.keys(info.problems).length);
}

// A section this corner type does not have. Said rather than hidden - an option
// that silently does nothing is worse than one that explains itself, which is
// the rule the greyed divider controls already follow.
function cornerOff(c, key) {
  const k = cornerKind(c);
  if (!k) return "";
  if (key === "drawers") {
    return k === "blind"
      ? "No drawers in a blind corner \u2014 it is one door and a flush panel."
      : "No drawers in a mitre or an ell corner.";
  }
  if (key === "supports" && k !== "blind") {
    return "No supports on a corner unit (RULES W13). A mitre is braced by its " +
           "own top and bottom, which are cut whatever kind it is.";
  }
  return "";
}

const SECTIONS = [
  // Width, height and depth are greyed wherever they are entered somewhere
  // else, and each says where. Kind, Number and Note stay live throughout -
  // Kind because a corner unit can be top-hung, base or tall.
  {key: "size", name: "Size", grey: sizeGrey, fields: [
    ["width", "Width", "int"], ["height", "Height", "int"],
    ["depth", "Depth", "int"], ["kind", "Kind", "sel:kinds"],
    ["number", "Number", "int"], ["note", "Note", "text"]]},

  // Three types, each with its own measurements, and every dimension a corner
  // unit has is entered here - which is why Size is greyed above. It sits
  // directly under Size (moved 22 Sept 2026): "Set in Corner Unit below" has to
  // point at the very next thing on screen, not at a section four scrolls down.
  {key: "corner", name: "Corner Unit", toggle: "corner_unit", tick: "Corner unit",
   when: notPanel, slot: "cornerbox", fields: []},

  // A panel is one part, so it has one section: what it is cut from, which way
  // up it stands, its two finished sizes and its edging. The cupboard sections
  // below are hidden for it — hidden, not emptied: everything they hold stays
  // in the job file, so picking a cupboard kind again brings it all back.
  {key: "panel", name: "Panel design", slot: "panelbox", when: isPanelCab,
   hint: "An independent panel. It is not part of any cupboard, it is numbered " +
         "in the same series as the cabinets, and the sizes here are finished " +
         "cut sizes. Several of them make a bulkhead \u2014 a front, an underside " +
         "and an end cap each side \u2014 each its own numbered item.",
   fields: []},

  {key: "outline", name: "Outline", when: notPanel, grey: outlineGrey,
   hint: "Actual plan shape, x along the wall, y out from the wall. " +
         "All geometry checks read this, not the declared width/depth.",
   fields: [["footprint", "Footprint outline", "poly"]]},

  {key: "structure", name: "Structure", slot: "structurebox", when: notPanel,
   fields: []},

  {key: "doors", name: "Doors", slot: "doorbox", when: notPanel,
   toggle: "has_doors", tick: "Has doors", fields: []},

  {key: "drawers", name: "Drawers", slot: "drawerbox", when: notPanel,
   toggle: "has_drawers", tick: "Has drawers", fields: []},

  {key: "supports", name: "Supports", slot: "supportbox", when: notPanel,
   hint: "A support is a cross rail spanning the internal width, tying the two " +
         "sides together. One row per kind; the total is the sum of the rows. " +
         "A front-edged one takes the carcass edging, which is PVC in the " +
         "exterior board's colour.",
   fields: []},
];

// How the back is fixed, said in words rather than in a count of grooves.
const BACK_LABEL = {
  four: "Grooved in all round — sides, top and bottom",
  three: "Grooved into the sides and top — open under the bottom",
  none: "No back panel",
};

// Whether a tickbox is on. An explicit choice wins; failing that the engine's
// own answer is read back; failing that (a cabinet not yet computed) the same
// rule the model uses — a style, or a stack, that is already there.
function tickOn(c, key) {
  if (c[key] === true) return true;
  if (c[key] === false) return false;
  const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
  const read = {corner_unit: "corner_on", has_drawers: "drawers_on",
                has_doors: "doors_on"}[key];
  if (g && read && g[read] !== undefined) return !!g[read];
  if (key === "corner_unit") return !!c.corner_style;
  if (key === "has_doors") return (c.doors || 0) > 0;
  return (c.drawers || []).length > 0;
}

// A control that is in the app but not working yet. Shown, greyed, and told why
// — an option that silently does nothing is worse than one that says so.
// A blank or zero value is left empty so the placeholder shows; a real one (an
// older job that set it, and still cuts it) is shown, because hiding what is
// being cut would be worse than a greyed field.
function unavailableField(label, value, why) {
  const shown = value === null || value === undefined || value === 0 ? "" : value;
  return `<div class="f unavail"><label>${esc(label)}</label>
    <input value="${esc(shown)}" placeholder="function unavailable" disabled>
    <span class="why">${esc(why)}</span></div>`;
}

// A field whose answer is entered somewhere else. Greyed, and showing the
// ENGINE'S figure rather than the declared one: a declared width on a corner
// unit or a panel is a label and no check reads it, so echoing it back into a
// field that looks authoritative would be showing the wrong number.
function derivedField(label, value, why, wide) {
  const shown = value === null || value === undefined ? "" : value;
  return `<div class="f derived${wide ? " wide" : ""}"><label>${esc(label)}</label>
    <input value="${esc(shown)}" placeholder="\u2014" disabled>
    <span class="why">${esc(why)}</span>${
      wide ? `<span class="note" id="geomreadout"></span>` : ""}</div>`;
}

function fieldHTML(c, [key, label, type], sec) {
  const why = sec && sec.grey ? sec.grey(c, key) : "";
  if (why) {
    // The outline field carries the geometry readout, so a greyed one has to
    // keep it: a corner unit is precisely where that line is worth reading.
    return type === "poly"
      ? derivedField(label, (c[key] || []).map((pt) => pt[0] + "," + pt[1]).join("  "),
                     why, true)
      : derivedField(label, derivedSize(c, key), why);
  }
  const v = c[key];
  let input;
  if (type.startsWith("sel:")) {
    const opts = (S.def[type.slice(4)] || []).map((o) =>
      `<option value="${esc(o)}"${o === v ? " selected" : ""}>${esc(o)}</option>`).join("");
    input = `<select data-k="${key}" data-t="${type}">${opts}</select>`;
  } else if (type === "text") {
    input = `<input data-k="${key}" data-t="text" value="${esc(v)}">`;
  } else if (type === "poly") {
    const text = (v || []).map((pt) => pt[0] + "," + pt[1]).join("  ");
    input = `<input data-k="${key}" data-t="poly" value="${esc(text)}"
             placeholder="e.g. 0,834  850,834  850,0  0,0">
             <span class="note" id="geomreadout"></span>`;
  } else {
    input = `<input type="number" step="1" data-k="${key}" data-t="${type}"
             value="${v === null || v === undefined ? "" : v}"
             ${type === "opt" ? 'placeholder="auto"' : ""}>`;
  }
  return `<div class="f${type === "poly" ? " wide" : ""}"><label>${esc(label)}</label>${input}</div>`;
}

function sectionHTML(c, sec) {
  // A section this corner type does not have at all. Its tickbox goes with it:
  // offering "Has drawers" on a mitre would be offering a choice that is not
  // one. Nothing is emptied, exactly as an unticked section is not emptied.
  const gone = cornerOff(c, sec.key);
  const on = sec.toggle ? tickOn(c, sec.toggle) : true;
  const tick = sec.toggle && !gone
    ? `<label class="tick"><input type="checkbox" data-tick="${sec.toggle}"
         ${on ? "checked" : ""}>${esc(sec.tick)}</label>` : "";
  const hint = sec.hint && !gone ? `<p class="hint">${esc(sec.hint)}</p>` : "";
  let body;
  if (gone) {
    body = `<p class="off">${esc(gone)} Whatever is in the job file stays there,
            so changing the corner type back brings it all with it.</p>`;
  } else if (sec.toggle && !on) {
    body = `<p class="off">Off — nothing is built from it. What you typed stays in
            the job file, so ticking it back brings it all with it.</p>`;
  } else {
    body = (sec.fields.length
            ? `<div class="grid">${sec.fields.map((f) => fieldHTML(c, f, sec)).join("")}</div>`
            : "") + (sec.slot ? `<div id="${sec.slot}" data-slot="1"></div>` : "");
  }
  return `<div class="sec s-${sec.key}"><h3>${esc(sec.name)}${tick}</h3>${hint}${body}</div>`;
}

// The engine's reading of the selected cabinet — off its panels, not its labels.
function refreshGeometryReadout() {
  const el = $("geomreadout");
  const c = S.sel !== null && S.job.cabinets[S.sel];
  if (!c || !S.res || !S.res.geometry) return;
  const g = S.res.geometry[String(c.number)];
  refreshCornerReadout(c, g);
  if (!el) return;
  if (!g) { el.textContent = ""; return; }
  if (cornerBroken(c)) {
    el.textContent = "No shape yet \u2014 finish the Corner Unit measurements above.";
    return;
  }
  const how = g.source === "corner"
      ? "corner unit, derived from its arm/face measurements" +
        (g.mitre_deg !== null ? `; mitre ${g.mitre_deg}°` : "") +
        `; front face${g.face_lengths.length > 1 ? "s" : ""} ${g.face_lengths.join(" + ")} mm` +
        (g.doors.length ? `, door${g.doors.length > 1 ? "s" : ""} ${g.doors.join(" + ")}` : "")
    : g.source === "outline" ? `outline as entered, ${g.points} points`
    : g.source === "panels" ? "rectangle its panels make"
    : "declared width — its panels give none";
  el.textContent = `Checks use ${g.width} × ${g.depth}, ${g.height} high (${how}).`;
}

// What this corner unit actually comes out as. Every figure is the engine's,
// read back off /api/compute - the browser adds nothing to it but the words.
function refreshCornerReadout(c, g) {
  const el = $("cornerreadout");
  if (!el) return;
  const k = g && g.corner;
  if (!k || !k.kind) { el.textContent = ""; return; }
  if (k.problems && Object.keys(k.problems).length) {
    el.innerHTML = `<span class="cfix">Fix the field${
      Object.keys(k.problems).length > 1 ? "s" : ""} marked in red above.</span>
      Until the measurements make a shape, this unit is not drawn and nothing is cut for it.`;
    return;
  }
  if (k.kind === "mitre") {
    const parts = [`Cuts ${g.width} \u00d7 ${g.depth}, ${g.height} high`];
    if (k.mitred_shelves || k.arm_shelves) {
      parts[0] += `, blank ${k.blank ? k.blank.join(" \u00d7 ") : "\u2014"}`;
    }
    if (g.mitre_deg !== null && g.mitre_deg !== undefined) {
      parts.push(`mitre ${g.mitre_deg}\u00b0`);
    }
    if (g.face_lengths && g.face_lengths.length) {
      parts.push(`front face ${g.face_lengths.join(" + ")} mm`);
    }
    if (k.inner_span) {
      parts.push(`door cut to the ${k.inner_span} mm inner span \u2192 ${k.door_width} mm`);
    }
    el.textContent = parts.join("; ") + ".";
  } else if (k.kind === "ell") {
    el.textContent = g.face_lengths && g.face_lengths.length
      ? `Cuts ${g.width} \u00d7 ${g.depth}, ${g.height} high; front faces ` +
        `${g.face_lengths.join(" + ")} mm. Shape only \u2014 an ell cuts no panels yet.`
      : "Shape only \u2014 an ell cuts no panels yet.";
  } else if (k.kind === "blind") {
    el.textContent = k.opening === null || k.opening === undefined
      ? `W ${c.width}, and no blind panel width yet.`
      : `W ${c.width}, blind ${k.blind_width} \u2192 opening ${k.opening}, ` +
        `door ${k.door_width}` +
        (k.blind_height ? `; blind panel ${k.blind_height} \u00d7 ${k.blind_width}` +
          (k.blind_edge_name ? `, one edge in ${k.blind_edge_name}` : "") : "") + ".";
  } else {
    el.textContent = "";
  }
}

/* ---------- painting, instead of rebuilding ---------------------------------
   The editor has to be rebuilt from the job on every compute, or a dropdown
   keeps the options the library had when its section was last built — that is
   how "Ordered as" went stale, and it was never only that one.

   But rebuilding it with innerHTML threw away 49 of the editor's 59 controls on
   every compute. A native dropdown belongs to the DOM node it was opened on, so
   replacing that node closes it; the caret, the hover and the scroll go with it.
   Measured on Test.json cabinet 4: every control in Structure, Drawers and
   Supports was a new object after each compute, and the focused <select> was no
   longer in the document at all.

   So the new HTML is still built in full, and then APPLIED to the DOM that is
   already there. A node that has not changed is left exactly as it is; a value
   that has changed is written into the control in place; only a control that has
   genuinely changed shape — or gone — is replaced. Two rules make that safe:

   - A focused control is never touched: not its options, not its value. Focus
     is what an open dropdown is, and it is also what is being typed into. It
     catches up the moment focus leaves it (the focusout listener below).
   - A slot div belongs to its own render function. sectionHTML emits it empty,
     and wiping what renderStructure and the rest put there would defeat the lot.

   Nothing in the editor attaches a listener to a control — they are all
   delegated on #editor — so reusing a node cannot stack a second handler on it. */

const VALUE_TAGS = {INPUT: 1, SELECT: 1, TEXTAREA: 1};

function paint(box, html) {
  if (!box) return;
  if (!box.firstChild) { box.innerHTML = html; return; }
  const next = document.createElement("div");
  next.innerHTML = html;
  morphChildren(box, next);
}

function morphChildren(dst, src) {
  const want = src.childNodes;
  for (let i = 0; i < want.length; i++) {
    const b = want[i];
    const a = dst.childNodes[i];
    if (!a) { dst.appendChild(document.importNode(b, true)); continue; }
    if (!alike(a, b)) { dst.replaceChild(document.importNode(b, true), a); continue; }
    morphNode(a, b);
  }
  while (dst.childNodes.length > want.length) dst.removeChild(dst.lastChild);
}

// Two nodes are the same thing when they are the same sort of node in the same
// place. A control is told apart by what NAMES it as well, so a rebuild that
// reorders rows replaces the control rather than quietly re-pointing it at
// another row — a drawer's board landing on the wrong drawer would be a wrong
// cut list, which is worse than a flicker.
function alike(a, b) {
  if (a.nodeType !== b.nodeType) return false;
  if (a.nodeType !== 1) return true;
  if (a.tagName !== b.tagName) return false;
  if ((a.id || "") !== (b.id || "")) return false;
  if (!VALUE_TAGS[a.tagName]) return true;
  return controlKey(a) === controlKey(b);
}

function controlKey(el) {
  const d = el.dataset || {};
  return ["sup", "sk", "d", "dk", "k", "dboard", "edge", "ek", "leaf", "tick",
          "t", "pk", "po"]
    .map((a) => (d[a] === undefined ? "" : d[a])).concat(el.type || "").join("|");
}

function morphNode(a, b) {
  if (a.nodeType !== 1) {
    if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
    return;
  }
  if (a === document.activeElement) return;      // open, or being typed into
  syncAttrs(a, b);
  if (a.dataset.slot !== undefined) return;      // its render function owns it
  if (a.tagName === "SELECT") { morphSelect(a, b); return; }
  morphChildren(a, b);
  if (a.tagName === "INPUT" || a.tagName === "TEXTAREA") morphValue(a, b);
}

function syncAttrs(a, b) {
  for (let i = a.attributes.length - 1; i >= 0; i--) {
    const n = a.attributes[i].name;
    if (!b.hasAttribute(n)) a.removeAttribute(n);
  }
  for (let i = 0; i < b.attributes.length; i++) {
    const at = b.attributes[i];
    if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  }
}

// A control's value is a property, not an attribute, the moment anything has
// typed into it — so the attribute is synced above and the property here.
function morphValue(a, b) {
  if (a.type === "checkbox" || a.type === "radio") {
    const on = b.hasAttribute("checked");
    if (a.checked !== on) a.checked = on;
    return;
  }
  const v = b.getAttribute("value");
  if (v !== null && a.value !== v) a.value = v;
}

// The options are morphed like any other children, so the <select> itself is
// never replaced and an open list is never yanked out from under the pointer.
function morphSelect(a, b) {
  morphChildren(a, b);
  const want = pickedValue(b);
  if (want !== null && a.value !== want) a.value = want;
}

// A stand-in for a section's element, whose `innerHTML =` paints instead of
// rebuilding. Each render function goes on writing its whole section as one
// template literal — which is how they read best — and the DOM underneath is
// updated in place.
function slot(el) {
  if (!el) return null;
  return {el: el, set innerHTML(html) { paint(el, html); }};
}

function pickedValue(sel) {
  const opts = sel.options;
  for (let i = 0; i < opts.length; i++) {
    if (opts[i].hasAttribute("selected")) return opts[i].value;
  }
  return opts.length ? opts[0].value : null;
}

// The whole editor, every time. What that costs is one HTML string; what it
// buys is that no control can still be offering what the library said an edit
// ago. `paint` is what stops it being a rebuild — see above.
function renderEditor() {
  const box = $("editor");
  if (S.sel === null || S.sel === undefined || !S.job.cabinets[S.sel]) {
    box.innerHTML = `<h2>Cabinet</h2><div class="empty">Select a cabinet in the drawing or the list.</div>`;
    S.selRendered = -2;
    return;
  }

  const c = S.job.cabinets[S.sel];
  const sets = SECTIONS.filter((sec) => !sec.when || sec.when(c))
    .map((sec) => sectionHTML(c, sec)).join("");
  // This cabinet's own criticals and warnings, one line each, at the top of
  // the dock (F4). They come from the compute reply; clicking one opens the
  // Validation tab. Nothing is decided here.
  const own = cabinetIssues(c.number);
  const issues = own.length ? `<div class="dockissues">${own.map((i) =>
    `<div class="${i.level === "critical" && i.accepted ? "accepted" : i.level}" data-goto="validation">${
      i.level === "critical" ? (i.accepted ? "accepted" : "critical") : "warning"} — ${esc(i.message)}</div>`).join("")}</div>` : "";

  const bespoke = c.template === "none"
    ? `<div class="bespoke"><b>Bespoke cabinet.</b> The template generates nothing;
       its ${c.bespoke.length} panel${c.bespoke.length === 1 ? " is" : "s are"} specified
       by hand in the job file. Size and finish fields above do not drive them.</div>` : "";

  const html = `<h2>Cabinet ${c.number}</h2>${issues}<div class="body">${sets}${bespoke}</div>`;

  // A different cabinet is a different editor and there is nothing on screen
  // worth protecting, so it is built outright. The same cabinet is painted over
  // what is already there.
  if (S.selRendered !== S.sel) {
    box.innerHTML = html;
    S.selRendered = S.sel;
  } else {
    paint(box, html);
  }

  renderStructure();
  renderCorner();
  renderDoors();
  renderDrawers();
  renderSupports();
  renderPanel();
  refreshGeometryReadout();
  refreshSwing();
  refreshEdging();
  refreshSupports();
}

// A control that had focus was skipped by the paint — that is the rule that
// keeps an open dropdown open and the caret where it was. Paint again once
// focus has left it, so it cannot sit there offering options the Boards tab has
// moved on from.
let repaintTimer = null;
$("editor").addEventListener("focusout", () => {
  clearTimeout(repaintTimer);
  repaintTimer = setTimeout(() => {
    if (S.sel !== null && S.sel === S.selRendered) renderEditor();
  }, 120);
});

$("editor").addEventListener("input", (e) => {
  const c = S.job.cabinets[S.sel];
  if (!c) return;

  // a panel field. The record is one object, so it is written into rather than
  // onto the cabinet, and every figure the editor SHOWS still comes back from
  // the engine on the next compute.
  const pk = e.target.dataset.pk;
  if (pk !== undefined) {
    const p = panelOf(c);
    const v = e.target.value;
    if (pk === "a" || pk === "b" || pk === "edge_long" || pk === "edge_short") {
      p[pk] = parseInt(v, 10) || 0;
    } else {
      p[pk] = v;
      // A kind the new colour board does not offer is not quietly kept: the
      // board is what offers edging, so the colour follows the board it is on.
      if (pk === "edge_kind" && !v) p.edge_board = "";
    }
    schedule();
    return;
  }

  // which board one door leaf is cut from; "" hands it back to the exterior board
  const dboard = e.target.dataset.dboard;
  if (dboard !== undefined) {
    const n = +dboard;
    if (!Array.isArray(c.door_boards)) c.door_boards = [];
    while (c.door_boards.length <= n) c.door_boards.push("");
    c.door_boards[n] = e.target.value;
    schedule();
    return;
  }

  // edging: a thickness and a colour, per section. "" on either hands that half
  // back to the cabinet, and the name beside them is always the engine's.
  const edge = e.target.dataset.edge;
  if (edge !== undefined) {
    c[(edge === "door" ? "door_edge_" : "drawer_edge_") + e.target.dataset.ek] =
      e.target.value || null;
    schedule();
    return;
  }

  const leaf = e.target.dataset.leaf;
  if (leaf !== undefined) {
    const n = +leaf;
    if (!Array.isArray(c.door_hinges)) c.door_hinges = [];
    while (c.door_hinges.length <= n) c.door_hinges.push("");
    c.door_hinges[n] = e.target.value;      // "" hands it back to the default rule
    schedule();                // the side shown beside it is the engine's answer
    return;
  }

  const k = e.target.dataset.k;
  if (k === "kind" && e.target.value === "panel" && !isPanelCab(c)) {
    // Turning a cupboard into a panel hides every cupboard section at once, so
    // it is said out loud first. Nothing is emptied - the same bargain as the
    // tickboxes - and picking a cupboard kind again brings it all back, which
    // is why this asks only in this direction.
    const has = [];
    if ((c.doors || 0) > 0 && c.has_doors !== false) has.push(`${c.doors} door(s)`);
    if ((c.drawers || []).length && c.has_drawers !== false) {
      has.push(`${c.drawers.length} drawer face(s)`);
    }
    if ((c.support_rows || []).length) has.push(`${c.support_rows.length} support row(s)`);
    if ((c.shelves || 0) + (c.fixed_shelves || 0)) {
      has.push(`${(c.shelves || 0) + (c.fixed_shelves || 0)} shelves`);
    }
    if ((c.bespoke || []).length) has.push(`${c.bespoke.length} hand-specified panel(s)`);
    if (has.length) {
      const ok = window.confirm(
        `Cabinet ${c.number} becomes a single panel.\n\n` +
        `It is built from its Panel design only, so these stop being cut:\n\n` +
        `    ${has.join("\n    ")}\n\n` +
        `Nothing is thrown away \u2014 every one of them stays in the job file exactly ` +
        `as it is, and picking a cupboard kind again brings it all back unchanged. ` +
        `The number does not change.\n\nMake it a panel?`);
      if (!ok) { e.target.value = c.kind; return; }
    }
  }
  if (k) {
    // The number is applied when the field is finished with, not per keystroke:
    // everything that names the cabinet by number has to move with it, and typing
    // 12 passes through 1, which is another cabinet's. See the change handler.
    if (k === "number") return;
    const t = e.target.dataset.t;
    const raw = e.target.value;
    if (t === "text" || t.startsWith("sel:")) c[k] = raw;
    // a board that may be left to follow the one chosen in Structure
    else if (t === "optext") c[k] = raw === "" ? null : raw;
    // data entry only: pairs of numbers as typed; the engine reads the shape
    else if (t === "poly") c[k] = raw.trim() === "" ? []
      : raw.trim().split(/[\s;]+/).map((pt) => pt.split(",").map((n) => parseInt(n, 10)))
          .filter((pt) => pt.length === 2 && pt.every((n) => !isNaN(n)));
    else if (t === "opt") c[k] = raw === "" ? null : parseInt(raw, 10);
    else c[k] = raw === "" ? 0 : parseInt(raw, 10);
    cornerFollowUp(c, k);
    // A board decides materials and edging, and the door count decides how many
    // leaf rows there are. Both used to force the whole editor to be rebuilt;
    // the compute that follows repaints every section off the reply, which is
    // the same answer without throwing the controls away.
    schedule();
    return;
  }

  const tape = e.target.dataset.tape;
  if (tape !== undefined) {
    // "" is not a tape name: it means hand it back to the boards
    c[tape] = e.target.value === "" ? null : e.target.value;
    schedule();                 // the value beside it is the engine's answer
    return;
  }

  const sup = e.target.dataset.sup;
  if (sup !== undefined) {
    const rows = supportRows();
    const sk = e.target.dataset.sk;
    const row = rows[+sup];
    if (sk === "qty") {
      row.qty = Math.max(parseInt(e.target.value, 10) || 0, 0);
    } else if (sk === "cut_board") {
      // What the rail is cut from. If the edging colour was only following the
      // cut board, it follows it here too; a colour chosen outright stays.
      const followed = !row.board || row.board === row.cut_board;
      row.cut_board = e.target.value;
      if (followed) row.board = row.cut_board;
      if (row.kind && !boardOffers(row.board, row.kind)) row.kind = "";
      renderSupports();
    } else if (sk === "board") {
      row.board = e.target.value;
      // the colour board no longer offers what this row asked for: drop the kind
      // rather than order an edging that board does not have
      if (row.kind && !boardOffers(row.board, row.kind)) row.kind = "";
      renderSupports();
    } else if (sk === "kind") {
      row.kind = e.target.value;
      // a kind with no colour board yet takes the board the rail is cut from —
      // its own edging, which is the answer that needs no second thought
      if (row.kind && !row.board) row.board = row.cut_board || c.carcass_board || "";
      if (row.kind && row.board && !boardOffers(row.board, row.kind)) {
        const fit = ((S.res && S.res.boards) || []).find((k) => boardOffers(k, row.kind));
        if (fit) row.board = fit;
      }
      renderSupports();
    } else { row.edge = e.target.value; renderSupports(); }
    schedule();
    return;
  }

  const i = e.target.dataset.d;
  if (i === undefined) return;
  const d = c.drawers[+i];
  const dk = e.target.dataset.dk;
  if (dk === "mode") { d.mode = e.target.value; renderDrawers(); return; }
  if (dk === "base") d.base = e.target.value;
  // "" is not a board: it hands this drawer back to the cabinet's
  else if (dk === "box_board" || dk === "face_board") d[dk] = e.target.value || null;
  else if (dk === "share") d.share = parseFloat(e.target.value) || 0;
  else d[dk] = parseInt(e.target.value, 10) || 0;
  solveStack();
});

/* ---------- the two tickboxes ---------------------------------------------
   Unticking never empties anything: the drawer list and the corner
   measurements stay in the job file exactly as they were, so ticking the box
   again brings the section back whole. What unticking can do is take panels
   off the cut list, and that is never silent — the engine is asked which
   designations would go, and they are named before anything happens. A
   designation is only ever removed, never renamed and never reused.         */

/* Renumbering a cabinet. Everything in the job that names it by number moves
   with it — its wall placement, the gap choices either side of it, the plinth
   run it starts, and its own hand-specified panels — otherwise its placement is
   left naming a cabinet that no longer exists, which is a critical the Room tab
   cannot clear. Two cabinets cannot share a number, so a taken one is refused
   rather than merging their placements. */
$("editor").addEventListener("change", (e) => {
  if (e.target.dataset.k !== "number") return;
  const c = S.job.cabinets[S.sel];
  if (!c) return;
  const from = c.number;
  const to = parseInt(e.target.value, 10);
  if (!(to > 0)) {
    toast("A cabinet number is a whole number, 1 or more.", true);
    e.target.value = from;
    return;
  }
  if (to === from) { e.target.value = from; return; }
  if (S.job.cabinets.some((x) => x !== c && x.number === to)) {
    toast(`Cabinet ${to} already exists — two cabinets cannot share a number.`, true);
    e.target.value = from;
    return;
  }
  c.number = to;
  c.bespoke.forEach((p) => { p.cabinet = to; });
  places().forEach((p) => { if (p.cabinet === from) p.cabinet = to; });
  (S.job.gaps || []).forEach((g) => {
    if (g.after === from) g.after = to;
    if (g.before === from) g.before = to;
  });
  (S.job.plinths || []).forEach((p) => { if (p.first === from) p.first = to; });
  placesSig = null; gapsSig = null; plinthSig = null;
  schedule(); renderList();
});

$("editor").addEventListener("change", async (e) => {
  const key = e.target.dataset.tick;
  if (key === undefined) return;
  const c = S.job.cabinets[S.sel];
  if (!c) return;
  const on = e.target.checked;

  if (!on) {
    const r = await post("/api/what-if",
                         {job: S.job, cabinet: c.number, set: {[key]: false}});
    if (!r.ok) { toast(r.error, true); e.target.checked = true; return; }
    if (r.removed.length) {
      const n = r.removed.length;
      const qty = r.removed.reduce((a, x) => a + x.qty, 0);
      const lines = r.removed.map((x) =>
        `    ${x.label}   ${x.role}   ${x.length} x ${x.width}  x${x.qty}`).join("\n");
      const ok = window.confirm(
        `Turning this off removes ${n} cut-list line${n === 1 ? "" : "s"} ` +
        `(${qty} panel${qty === 1 ? "" : "s"}) from cabinet ${c.number}:\n\n${lines}\n\n` +
        `Everything you typed stays in the job file, so ticking it back restores ` +
        `these unchanged. No designation is renamed or reused — these are removed, ` +
        `not renumbered.\n\nRemove them?`);
      if (!ok) { e.target.checked = true; return; }
    }
  }

  c[key] = on;
  if (key === "corner_unit" && on) cornerFollowUp(c, "corner_unit");
  // A cabinet saved with no doors has a count of 0, and ticking the box must
  // not show "1" while building nothing: it gets the one door it is showing.
  if (key === "has_doors" && on && !((c.doors || 0) > 0)) c.doors = 1;
  renderEditor();
  schedule();
});

$("editor").addEventListener("click", (e) => {
  // Duplicate, from the Panel design section. The same path the cabinet table's
  // Dup takes: the next free number from the engine, everything copied but the
  // placement - a panel is put where it is put, so a copy is not.
  if (e.target.closest("#paneldup")) {
    dupCabinet(S.sel);
    return;
  }
  if (e.target.closest("[data-clearedge]")) {
    const c = S.job.cabinets[S.sel];
    c.door_edge = null;
