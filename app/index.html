       font-size:12px;text-transform:none;letter-spacing:0">Cabinet ${cab}</th></tr>`
      + cabIssues + rows;
  }).join("");

  // What was accepted rather than cleared goes out with this list, reasons and
  // all — here and in the export folder, never in the Plazaboard CSV.
  const took = r.issues.filter((i) => i.level === "critical" && i.accepted);
  const acceptedBlock = took.length
    ? `<div class="body" style="border-bottom:1px solid var(--line)"><b>Accepted</b>
       — site-dependent criticals this cut list goes out with:${took.map((i) =>
        `<div class="note">${esc(i.where)} — ${esc(i.message)} <b>Accepted: ${
          esc(i.accepted)}</b></div>`).join("")}</div>`
    : "";
  $("cutlist").innerHTML = acceptedBlock + `<table>
    <thead><tr><th>Label</th><th>Role</th><th>Mat</th><th class="n">Length</th>
      <th class="n">Width</th><th class="n">Qty</th><th>Edges</th><th>Edge mat</th>
      <th class="n">Edging m</th><th class="n">Holes</th>
      <th title="a grained board locks the panel: Length is the grain direction and the nester cannot turn it">Grain</th>
      <th>Note</th></tr></thead><tbody>${out}</tbody></table>`;
}

/* ---------- nesting ------------------------------------------------------ */

function renderNest() {
  const r = S.res;
  const mats = r ? Object.keys(r.nest).sort() : [];
  if (!mats.length) {
    $("nesting").innerHTML = `<div class="card"><div class="empty">Nothing nested yet.</div></div>`;
    return;
  }
  const rejects = r.rejects.length
    ? `<div class="card"><h2>Not nested</h2><div class="body">
       ${r.rejects.map((x) => `<div class="rowissue critical">${esc(x.label)} —
         ${x.length}×${x.width} does not fit a bare board</div>`).join("")}</div></div>`
    : "";

  $("nesting").innerHTML = rejects + mats.map((m) => {
    const n = r.nest[m];
    return `<div class="card">
      <h2>${esc(m)}</h2>
      <div class="matline">
        <span><b>${n.sheets}</b> boards</span>
        <span>yield <b>${n.yield}%</b></span>
        <span class="note">${n.used_m2} of ${n.area_m2} m²</span>
        <span class="note">won by ${esc(n.sort)} / ${esc(n.rule)}</span>
        <span class="note">${n.detail.map((d, i) =>
          `sheet ${i + 1}: ${d.panels}p ${d.yield}%`).join(" · ")}</span>
      </div>
      <div class="sheetsvg">${n.svg}</div></div>`;
  }).join("");
}

/* ---------- validation --------------------------------------------------- */

function renderValidation() {
  const r = S.res;
  if (!r) { $("validation").innerHTML = ""; return; }
  let head = "";
  if (!r.ok) {
    head = `<div class="issue critical"><span class="lvl">Engine</span>
      <span class="where"></span><span class="msg">${esc(r.error)}</span></div>`;
  }
  const notes = S.lapsedNotes.map((n) => `<div class="lapsenote">${esc(n)}</div>`).join("");
  if (!r.issues.length && r.ok) {
    $("validation").innerHTML = notes +
      `<div class="empty">No issues. Export is allowed.</div>`;
    return;
  }
  const crit = r.issues.filter(blocksExport).length;
  const took = r.issues.filter((i) => i.level === "critical" && i.accepted).length;
  const warn = r.issues.filter((i) => i.level !== "critical").length;
  const banner = `<div class="matline" style="border-bottom:1px solid var(--line)">
    ${crit ? `<span class="pill crit">${crit} critical — export blocked</span>`
           : `<span class="pill ok">no criticals — export allowed</span>`}
    ${took ? `<span class="pill">${took} accepted</span>` : ""}
    <span class="note">${warn} warning(s) do not block.</span></div>`;

  $("validation").innerHTML = banner + notes + head + r.issues.map((i) => {
    const key = i.check + "|" + i.where;
    let lvl = i.level === "critical" ? "Critical" : "Warning";
    let cls = i.level, why = "", acts = "";
    if (i.level === "critical" && i.accepted) {
      lvl = "Accepted"; cls = "accepted";
      why = `<span class="why">Accepted: ${esc(i.accepted)}</span>`;
      acts = `<button data-unaccept="${esc(key)}">Undo</button>`;
    } else if (i.level === "critical" && i.acceptable) {
      acts = S.acceptOpen === key ? "" : `<button data-accept="${esc(key)}">Accept…</button>`;
      if (S.acceptOpen === key) {
        why = `<span class="acceptform">
          ${i.check === "tip-up"
            ? `<button data-acceptpreset="${esc(key)}">Assembled in place</button>` : ""}
          <input id="acceptreason" placeholder="or type the reason (required)"
                 value="${esc(S.acceptDraft || "")}">
          <button data-acceptok="${esc(key)}">Accept</button>
          <button data-acceptcancel="1">Cancel</button></span>`;
      }
    }
    return `<div class="issue ${esc(cls)}">
      <span class="lvl">${lvl}</span>
      <span class="where">${esc(i.where)}</span>
      <span class="msg">${esc(i.message)}${why}</span>
      <span class="ref" title="see docs/RULES.md">${i.ref ? esc(i.ref) : ""}</span>
      <span class="acts">${acts}</span>
    </div>`;
  }).join("");
  const box = $("acceptreason");
  if (box) box.focus();
}

async function acceptIssue(key, reason) {
  reason = (reason || "").trim();
  if (!reason) { toast("Give a reason for accepting it — it is required.", true); return; }
  const [check, where] = key.split("|");
  const r = await post("/api/accept", {job: S.job, check: check, where: where});
  if (!r.ok) { toast(r.error, true); return; }
  const list = acceptances().filter((a) => !(a.check === check && String(a.where) === where));
  list.push({check: check, where: where, reason: reason, fingerprint: r.fingerprint});
  S.job.acceptances = list;
  S.acceptOpen = null; S.acceptDraft = "";
  markDirty(true);
  compute();
}

$("validation").addEventListener("input", (e) => {
  if (e.target.id === "acceptreason") S.acceptDraft = e.target.value;
});

$("validation").addEventListener("keydown", (e) => {
  if (e.target.id === "acceptreason" && e.key === "Enter") acceptIssue(S.acceptOpen, e.target.value);
});

$("validation").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.accept) { S.acceptOpen = b.dataset.accept; S.acceptDraft = ""; renderValidation(); }
  else if (b.dataset.acceptcancel) { S.acceptOpen = null; renderValidation(); }
  else if (b.dataset.acceptpreset) acceptIssue(b.dataset.acceptpreset, "Assembled in place");
  else if (b.dataset.acceptok) acceptIssue(b.dataset.acceptok, ($("acceptreason") || {}).value);
  else if (b.dataset.unaccept) {
    const [check, where] = b.dataset.unaccept.split("|");
    S.job.acceptances = acceptances().filter((a) =>
      !(a.check === check && String(a.where) === where));
    if (!S.job.acceptances.length) delete S.job.acceptances;
    markDirty(true);
    compute();
  }
});

/* ---------- tabs ---------------------------------------------------------- */

/* One card's render, on its own. A render that throws says so in its own card
   and in the console, and the cards after it still draw: renderPlaces throwing
   used to leave the plan, Gaps and Plinth silently stale on every compute.
   `reset` clears that card's signature so the next compute tries it again. */
function guarded(box, render, reset) {
  const fail = (err) => {
    console.error(err);
    reset();
    $(box).innerHTML = `<div class="empty cfix">This card could not be drawn: ` +
      `${esc(String(err && err.message || err))}</div>`;
  };
  try {
    const r = render();
    if (r && typeof r.catch === "function") r.catch(fail);
  } catch (err) { fail(err); }
}

function renderTab() {
  if (S.tab === "catalogue") { if (S.catSub === "runners") renderRunnersTab(); else renderBoardsTab(); }
  else if (S.tab === "cabinets") renderCab3D();
  else if (S.tab === "room") {
    renderUnplaced();
    if (S.roomSub === "elev") { guarded("elevation", renderElevation, () => {}); return; }
    guarded("room", renderRoom, () => { roomSig = null; });
    guarded("places", renderPlaces, () => { placesSig = null; });
    guarded("gaps", renderGaps, () => { gapsSig = null; });
    guarded("plinth", renderPlinth, () => { plinthSig = null; });
    guarded("plan", renderPlan, () => {});
  }
  else if (S.tab === "view3d") { renderUnplaced(); render3D(); }
  else if (S.tab === "cutlist") renderCutlist();
  else if (S.tab === "nesting") renderNest();
  else if (S.tab === "validation") renderValidation();
}

document.querySelector("nav").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  const was = S.tab;
  S.tab = b.dataset.tab;
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
  ["catalogue", "cabinets", "room", "view3d", "cutlist", "nesting", "validation"].forEach((t) => {
    $("tab-" + t).hidden = t !== S.tab;
  });
  // Nothing renders in 3D while its tab is hidden: a laptop left on another
  // tab must not run its fan for a view nobody is looking at.
  if (was === "view3d" && S.tab !== "view3d" && V3D) V3D.setVisible(false);
  if (was === "cabinets" && S.tab !== "cabinets" && V3C) V3C.setVisible(false);
  dockEditor();
  renderTab();
  alignEditor();          // measured, so only once the tab is showing
  markSelected();
});

/* ---------- the one docked editor (F4) --------------------------------------
   `#editor` is MOVED into whichever tab's dock is showing — never cloned. Its
   listeners are delegated on the element itself, so they travel with it, and
   `paint` goes on working on the DOM that is already there. Open/closed and
   the width are remembered per viewer in localStorage, every access wrapped,
   and the app works without it. */

const DOCKS = {cabinets: "cabdock", room: "roomdock", view3d: "v3ddock"};

function dockPref(key, value) {
  try {
    if (value === undefined) return localStorage.getItem("cupboard." + key);
    if (value === null) localStorage.removeItem("cupboard." + key);
    else localStorage.setItem("cupboard." + key, String(value));
  } catch (e) { /* private window, blocked storage: the default is fine */ }
  return null;
}

function dockEditor() {
  const id = DOCKS[S.tab];
  const ed = $("editor");
  const closed = dockPref("dock") === "closed";
  const width = parseInt(dockPref("dockwidth") || "", 10);
  document.querySelectorAll(".dock").forEach((d) => d.classList.toggle("closed", closed));
  if (width >= 320 && width <= 900) ed.style.width = width + "px";
  if (!id) return;
  const host = $(id);
  if (ed.parentElement !== host) host.appendChild(ed);
  if (S.tab !== "cabinets") ed.style.marginTop = "";
  if (S.tab === "view3d") size3D();
}

document.addEventListener("click", (e) => {
  const tog = e.target.closest(".docktog");
  if (!tog) return;
  const closed = !tog.closest(".dock").classList.contains("closed");
  dockPref("dock", closed ? "closed" : "open");
  document.querySelectorAll(".dock").forEach((d) => d.classList.toggle("closed", closed));
  if (V3D) V3D.resize();
  if (V3C) V3C.resize();
});

// Drag the strip to resize the editor; the width is remembered.
document.addEventListener("pointerdown", (e) => {
  const strip = e.target.closest(".dockstrip");
  if (!strip || e.target.closest(".docktog") || strip.closest(".dock").classList.contains("closed")) return;
  const ed = $("editor");
  const start = e.clientX, w0 = ed.getBoundingClientRect().width;
  const move = (ev) => {
    const w = Math.max(320, Math.min(900, Math.round(w0 - (ev.clientX - start))));
    ed.style.width = w + "px";
    if (V3D) V3D.resize();
    if (V3C) V3C.resize();
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    dockPref("dockwidth", Math.round(ed.getBoundingClientRect().width));
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  e.preventDefault();
});

// A validation line in the dock opens the Validation tab.
$("editor").addEventListener("click", (e) => {
  const go = e.target.closest("[data-goto]");
  if (go) document.querySelector(`nav [data-tab="${go.dataset.goto}"]`).click();
});

// Open the Cut list tab scrolled to one designation, highlighted (F4).
function showInCutList(label) {
  if (!label) return;
  document.querySelector('nav [data-tab="cutlist"]').click();
  const row = document.querySelector(`#cutlist tr[data-label="${CSS.escape(String(label))}"]`);
  document.querySelectorAll("#cutlist tr.flash").forEach((r) => r.classList.remove("flash"));
  if (!row) { toast(`${label} is not on the cut list.`, true); return; }
  row.classList.add("flash");
  row.scrollIntoView({block: "center"});
}

dockEditor();            // the remembered open/closed state, from the start

/* ---------- 3D view (Part F) ---------------------------------------------
   The whole of the 3D code is app/view3d.js, a module of a different kind of
   code, loaded the FIRST time the tab is opened and never before — so
   start-up is exactly as fast as it was. index.html talks to it through a
   small interface: mount, update, select, setLayers, setVisible, dispose. */

let V3D = null;          // the 3D tab's view, once loaded
let v3dLoading = null;   // the one in-flight mount, so two clicks load it once
let VIEW3D_MODULE = null;
// app/view3d.js, imported once and shared: each view is its own `createView`
function view3dModule() {
  if (!VIEW3D_MODULE) VIEW3D_MODULE = import("/app/view3d.js");
  return VIEW3D_MODULE;
}
S.sceneStale = true;     // the 3D view has not seen the job as it now stands
S.sceneJob = null;       // which job object the view last drew: a new one opens at Home

function size3D() {
  const box = $("v3d");
  if (!box || $("tab-view3d").hidden) return;
  // Fill the window below the tab bar: measured, because the header wraps at
  // narrow widths and the strip's height depends on what is in it.
  const top = box.getBoundingClientRect().top;
  box.style.height = Math.max(window.innerHeight - top - 14, 240) + "px";
  if (V3D) V3D.resize();
}
window.addEventListener("resize", size3D);

function selNumber() {
  const c = S.sel !== null && S.job && S.job.cabinets[S.sel];
  return c ? c.number : null;
}

async function render3D() {
  if (!V3D) {
    if (!v3dLoading) {
      v3dLoading = view3dModule().then((m) => {
        V3D = m.createView();
        V3D.mount({view: $("v3dview"), bar: $("v3dbar"), list: $("v3dlist"),
                   dock: $("v3ddock"), status: $("v3dstatus")}, {
          // a click in 3D selects without isolating; the item list isolates
          select: (number, part, opts) => select3D(number, part, opts),
          // the layer toggle is the plan's: one answer to "what am I looking at"
          toggleLayer: (k) => {
            const on = planLayers();
            const i = on.indexOf(k);
            if (i >= 0) on.splice(i, 1); else on.push(k);
            V3D.setLayers(planLayers());
            refreshPlan();
          },
          // the 3D Isolate toggle is the plan's isolate: one answer
          isolate: (number) => { S.isolate = number; sync3D(); refreshPlan(); },
          card: (number, part) => showPartCard(number, part, "v3dview"),
          showLine: (label) => showInCutList(label),
          snapshot: (dataUrl) => snapshot3D(dataUrl),
          // F6: one /api/drag per press, the same the plan and the elevation
          // make; the drop writes the placement and nothing else, then the
          // one compute redraws every view
          dragModel: (number) => post("/api/drag", {job: S.job, cabinet: number}),
          drop: (number, at) => {
            const p = places().find((x) => x.cabinet === number);
            if (!p) return;
            p.x = at.x;
            p.z = at.z;
            if (at.y !== undefined) p.y = at.y;
            placesSig = null;            // the placements table shows the new numbers
            markDirty(true);
            compute();
          },
        });
        $("v3dview").appendChild(cardEl("v3dview"));
      }).catch((err) => {
        v3dLoading = null;
        VIEW3D_MODULE = null;
        $("v3dview").innerHTML = `<div class="empty">The 3D view could not load: ${esc(err && err.message || err)}</div>`;
        throw err;
      });
    }
    await v3dLoading;
  }
  size3D();
  V3D.setVisible(true);
  if (S.sceneStale && sceneTimer === null) fetchScene();
  else V3D.select(selNumber());
}

// After every compute: the 3D view asks /api/scene, debounced, and only while
// its tab is showing — a hidden tab refreshes when it is next shown. Nothing
// is computed for the 3D view that the plan or the validation does not
// already compute; the scene is one more read-only view of the job.
let sceneSeq = 0, sceneTimer = null;
function refreshScene() {
  S.sceneStale = true;
  refreshCabScene();
  if (S.tab !== "view3d" || !V3D) return;
  clearTimeout(sceneTimer);
  sceneTimer = setTimeout(() => { sceneTimer = null; fetchScene(); }, 40);
}

async function fetchScene() {
  clearTimeout(sceneTimer);
  sceneTimer = null;
  if (!V3D || !S.job) return;
  const seq = ++sceneSeq;
  const t0 = performance.now();
  const r = await post("/api/scene", {job: S.job});
  if (seq !== sceneSeq) return;                    // a newer job is on its way
  if (!r.ok) { toast(r.error, true); return; }
  S.sceneStale = false;
  const fresh = S.sceneJob !== S.job;              // a newly loaded job opens at Home
  S.sceneJob = S.job;
  V3D.setLayers(planLayers());
  V3D.update(r, {fresh: fresh});
  V3D.select(selNumber());
  S.sceneMs = Math.round(performance.now() - t0);
}

// A selection made in the 3D view: the one selection, the one editor, opened
// at the section the picked part belongs to.
function select3D(number, part, opts) {
  const i = number === null ? -1 : S.job.cabinets.findIndex((c) => c.number === number);
  selectCabinet(i >= 0 ? i : null, {isolate: !!(opts && opts.isolate)});
  renderList();
  refreshPlan();
  jumpToSection(part);
}

// Which editor section a picked part is set in. A reading of the part's role,
// nothing more: the section says everything about it.
const PART_SECTION = {door: "doors", drawer: "drawers", support: "supports", shelf: "structure",
                      drawer_side: "drawers", drawer_front: "drawers", drawer_back: "drawers",
                      drawer_base: "drawers", runner_outer: "drawers", runner_inner: "drawers",
                      side: "structure", top: "structure", bottom: "structure", back: "structure",
                      carcass: "outline", blind: "corner", panel: "panel"};

function jumpToSection(part) {
  const key = part && PART_SECTION[part.role];
  const ed = $("editor");
  const sec = key && ed.querySelector(`.sec.s-${key}`);
  if (!sec) return;
  ed.scrollTop += sec.getBoundingClientRect().top - ed.getBoundingClientRect().top - 8;
  ed.querySelectorAll(".sec.flash").forEach((x) => x.classList.remove("flash"));
  sec.classList.add("flash");
  setTimeout(() => sec.classList.remove("flash"), 1200);
}

/* ---------- the Cabinets tab's 3D: one cabinet alone -------------------------
   UI restructure (28 September 2026). The same view as the 3D tab — its own
   `createView({single: true})` — drawing the selected cabinet alone, with its
   shelves, supports and attached panels, off `/api/scene-cabinet`: no walls,
   no neighbours. A selected attached panel shows its cabinet with it; a
   standalone panel shows alone; nothing selected shows the first cabinet.
   It is the live model: every compute refreshes it while the tab is showing.
   Picking a part selects its item and opens the editor at that section. An
   ATTACHED panel is dragged here on its three arrows (spec B4): the server
   names the snap targets and the offsets to write, and they go into the same
   at_x / at_y / at_z Panel design types. */

let V3C = null, v3cLoading = null;
S.cabSceneStale = true;
S.cab3dShown = null;     // which cabinet the view last drew
S.cab3dJob = null;
let cabSeq = 0, cabTimer = null;

// The item the view draws for the selection: an attached panel's cabinet, or
// the item itself; nothing selected, the first in the job.
function cabShown() {
  const c = S.sel !== null ? S.job.cabinets[S.sel] : S.job.cabinets[0];
  if (!c) return null;
  const host = attachedTo(c);
  const hc = host === null ? null : S.job.cabinets.find((x) => x.number === host);
  return hc && hc.kind !== "panel" ? hc.number : c.number;
}

async function renderCab3D() {
  if (!V3C) {
    if (!v3cLoading) {
      v3cLoading = view3dModule().then((m) => {
        V3C = m.createView({single: true});
        V3C.mount({view: $("c3dview"), bar: $("c3dbar"), status: $("c3dstatus")}, {
          // a pick selects its item and opens the editor at that section; an
          // empty click keeps the selection — this view IS the selection
          select: (number, part) => selectCab3D(number, part),
          card: (number, part) => showPartCard(number, part, "c3dview"),
          showLine: (label) => showInCutList(label),
          attachModel: (number) => post("/api/attach-snaps", {job: S.job, cabinet: number}),
          attachDrop: (number, at) => attachDrop(number, at),
        });
        $("c3dview").appendChild(cardEl("c3dview"));
        const empty = document.createElement("div");
        empty.className = "v3dempty";
        empty.id = "c3dempty";
        empty.hidden = true;
        $("c3dview").appendChild(empty);
      }).catch((err) => {
        v3cLoading = null;
        VIEW3D_MODULE = null;
        $("c3dview").innerHTML = `<div class="empty">The 3D view could not load: ${esc(err && err.message || err)}</div>`;
        throw err;
      });
    }
    await v3cLoading;
  }
  if (S.tab !== "cabinets") return;
  V3C.setVisible(true);
  V3C.resize();
  if (S.cabSceneStale || cabShown() !== S.cab3dShown || S.cab3dJob !== S.job) {
    if (cabTimer === null) fetchCabScene();     // else a refresh is already due
  } else V3C.select(selNumber());
}

// After every compute and every selection: the view asks again, debounced,
// only while its tab is showing — hidden, it catches up when next shown.
function refreshCabScene() {
  S.cabSceneStale = true;
  if (S.tab !== "cabinets" || !V3C) return;
  clearTimeout(cabTimer);
  cabTimer = setTimeout(() => { cabTimer = null; fetchCabScene(); }, 40);
}

async function fetchCabScene() {
  clearTimeout(cabTimer);
  cabTimer = null;
  if (!V3C || !S.job) return;
  const n = cabShown();
  const seq = ++cabSeq;
  const empty = $("c3dempty");
  if (n === null) {
    V3C.update({ok: true, banner: "", room: null, looks: {}, items: [], room_parts: [],
                overlays: {swings: [], overlaps: [], issues: []}, not_drawn: ""}, {fresh: true});
    S.cabSceneStale = false;
    S.cab3dShown = null;
    S.cab3dJob = S.job;
    $("c3dtitle").textContent = "";
    if (empty) {
      empty.innerHTML = `No cabinets yet. <b>&nbsp;Add cabinet&nbsp;</b> below to start — ` +
        `it is drawn here, alone, as it is built.`;
      empty.hidden = false;
    }
    return;
  }
  const r = await post("/api/scene-cabinet", {job: S.job, number: n});
  if (seq !== cabSeq) return;                     // a newer one is on its way
  if (!r.ok) { toast(r.error, true); return; }
  if (empty) empty.hidden = true;
  S.cabSceneStale = false;
  const fresh = r.single !== S.cab3dShown || S.cab3dJob !== S.job;
  S.cab3dShown = r.single;
  S.cab3dJob = S.job;
  V3C.update(r, {fresh: fresh});
  V3C.select(selNumber());
  const main = r.items[0];
  const more = r.items.length - 1;
  $("c3dtitle").textContent = main ? `— ${main.number} · ${main.panel ? "panel" : main.kind}` +
    (more ? ` with ${more} attached panel${more === 1 ? "" : "s"}` : "") +
    (selNumber() === null ? " (nothing selected: the first item)" : "") : "";
}

function selectCab3D(number, part) {
  if (number === null) { V3C.select(selNumber()); return; }
  const i = S.job.cabinets.findIndex((c) => c.number === number);
  if (i < 0) return;
  if (i !== S.sel) { selectCabinet(i, {isolate: false}); renderList(); }
  jumpToSection(part);
}

// The drop of an attached panel's drag in that view: the server hands back the
// offsets to write, into the panel's own record — the fields Panel design types.
async function attachDrop(number, at) {
  const r = await post("/api/attach-move", {job: S.job, cabinet: number, at: at});
  if (!r.ok) { toast(r.error, true); return; }
  const c = S.job.cabinets.find((x) => x.number === number);
  if (c) c.panel = r.panel;
  markDirty(true);
  compute();
}

/* ---------- the part card (F4) ----------------------------------------------
   Clicking a part shows its cabinet, its role and its CUT-LIST LINE, read from
   the compute reply by the designation the scene gave — designation, finished
   L x W x thickness, board, grain, edging — and a button that lands on that
   row of the cut list. A part with no line says why. That is the spec's rule:
   a panel cannot be admired in 3D and wrong on the list. */

const cardBoxes = {};
function cardEl(view) {
  let cardBox = cardBoxes[view];
  if (!cardBox) {
    cardBox = cardBoxes[view] = document.createElement("div");
    cardBox.className = "v3dcard";
    cardBox.hidden = true;
    cardBox.addEventListener("click", (e) => {
      if (e.target.closest(".x")) { cardBox.hidden = true; return; }
      const go = e.target.closest("[data-line]");
      if (go) showInCutList(go.dataset.line);
    });
  }
  return cardBox;
}

function showPartCard(number, part, view) {
  const box = cardEl(view || "v3dview");
  if (number === null && !part) { box.hidden = true; return; }
  const c = number !== null && S.job.cabinets.find((x) => x.number === number);
  const g = c && S.res && S.res.geometry && S.res.geometry[String(number)];
  const kind = c ? (c.kind === "panel" ? "Panel" : c.kind + (g && g.corner && g.corner.kind ? " · " + g.corner.kind : "")) : "";
  const roleNames = {side: "Side", top: "Top", bottom: "Bottom", door: "Door leaf", drawer: "Drawer face",
                     blind: "Blind panel", panel: "Panel", back: "Backing", carcass: "Carcass",
                     plinth: "Plinth board", filler: "Filler"};
  let role = part ? (roleNames[part.role] || part.role) : "";
  if (part && (part.role === "door" || part.role === "drawer")) role += " " + (part.index + 1);
  let line = "";
  if (part && part.line) {
    const p = (S.res.panels || []).find((x) => x.label === part.line);
    const mat = S.res.materials && S.res.materials[part.board];
    const t = mat && mat.thickness ? ` × ${mat.thickness}` : "";
    line = p
      ? `<div><span class="mono"><b>${esc(p.label)}</b></span> ${esc(p.role)} · ${p.length} × ${p.width}${t} · ${esc(p.material)}
         · ${p.grain ? `locked along L ${p.length}` : "free"}${p.edge_material ? " · " + esc(p.edge_material) : ""}${
           p.qty > 1 ? ` · qty ${p.qty}` : ""}</div>
         <button class="go" data-line="${esc(p.label)}">Show in cut list</button>`
      : `<div class="note">${esc(part.line)} is not on the cut list as computed.</div>`;
  } else if (part) {
    line = `<div class="note">No cut-list line: ${esc(part.reason || "not matched")}.</div>`;
  }
  box.innerHTML = `<button class="x" title="close">×</button>
    <b>${number !== null ? `${number} · ${esc(kind)}` : esc(role)}</b>${number !== null && role ? ` — ${esc(role)}` : ""}${
    part ? ` <span class="note">${esc(part.board)}</span>` : ""}${line}`;
  box.hidden = false;
}

// Snapshot (F5): the view as a PNG, written by the server into
// output/<job>/snapshots/ under a name that never overwrites; an export never
// touches that folder. The toast names the file.
async function snapshot3D(dataUrl) {
  if (!dataUrl) return;
  const r = await post("/api/snapshot", {name: S.job.name, png: dataUrl});
  if (!r.ok) { toast(r.error, true); return; }
  toast(`Saved ${r.file}`);
}

/* ---------- job files ----------------------------------------------------- */

async function refreshJobs() {
  const r = await post("/api/jobs", {});
  $("joblist").innerHTML = (r.jobs || [])
    .map((n) => `<option>${esc(n)}</option>`).join("") ||
    `<option value="">(no saved jobs)</option>`;
}

function adopt(job) {
  S.job = job;
  places();                  // a file saved with no room has no placements key
  markDirty(false);          // what is on screen is what is on disk
  S.sel = null;
  S.isolate = null;
  S.lapsedNotes = [];
  S.acceptOpen = null;
  S.selRendered = -2;
  S.freshRows = new Map();   // every stored cabinet's rows are its own
  roomSig = null;
  placesSig = null;
  gapsSig = null;
  plinthSig = null;
  $("jobname").value = job.name || "untitled";
  compute();
}

$("new").addEventListener("click", () => {
  if (!okToDiscard("Starting a new job")) return;
  adopt(blankJob());
  // a new job starts on Catalogue -> Boards: nothing can be cut until a board is selected
  openCatalogue("boards");
});

$("save").addEventListener("click", async () => {
  const r = await post("/api/save", {job: S.job, path: $("jobname").value.trim()});
  if (!r.ok) { toast(r.error, true); return; }
  markDirty(false);
  toast("Saved jobs/" + r.path);
  await refreshJobs();
  $("joblist").value = r.path;
});

// Deleting a saved job. It is moved to jobs/_deleted/, never unlinked: a job is
// a quote somebody may want back, and "I picked the wrong one" has no undo
// otherwise. The job on screen cannot be deleted — that would leave the editor
// showing something with nowhere to save it back to — and Test.json says what
// it is before it goes, because the checks run against it (every other job the
// checks read is frozen under tools/fixtures/, out of the app's reach).
$("jobdel").addEventListener("click", async () => {
  const name = $("joblist").value;
  if (!name) { toast("No saved job selected.", true); return; }

  const info = await post("/api/job-delete-info",
                          {path: name, open: currentJobFile()});
  if (!info.ok) { toast(info.error, true); return; }
  if (!info.exists) { toast(`There is no saved job ${name}.`, true); return; }
  if (info.is_open) {
    toast(`${name} is the job open here — load or start another one first, ` +
          `then delete it.`, true);
    return;
  }

  const warn = info.fixture
    ? `\n!! ${name} is one of the two jobs the CHECKS run against. ` +
      `Deleting it stops tools/regen_check.py and several check_*.py scripts ` +
      `working until it is put back.\n`
    : "";
  const ok = window.confirm(
    `Delete the project ${name}?\n` + warn +
    `\nIt is moved to jobs/_deleted/${name}, not erased, so it can be put back ` +
    `by moving the file. It stops appearing in the job list.\n\nDelete ${name}?`);
  if (!ok) return;

  const r = await post("/api/job-delete", {path: name, open: currentJobFile()});
  if (!r.ok) { toast(r.error, true); return; }
  await refreshJobs();
  toast(`${r.path} moved to ${r.moved_to} — put it back by moving the file.`);
});

// Which FILE the job on screen came from, which is what "do not delete the open
// one" has to be asked of. The name box is the job's name, and Save uses it as
// the file name, so it is the same question.
function currentJobFile() {
  const n = ($("jobname").value || "").trim();
  return n ? (n.endsWith(".json") ? n : n + ".json") : "";
}

$("load").addEventListener("click", async () => {
  const name = $("joblist").value;
  if (!name) { toast("No saved job selected.", true); return; }
  if (!okToDiscard(`Loading ${name}`)) return;
  const r = await post("/api/load", {path: name});
  if (!r.ok) { toast(r.error, true); return; }
  adopt(r.job);
  // A board the file names by an id the library has since renamed, shown under
  // its current id. Said out loud: the file itself is not touched until saved.
  // And every board's details — name, edging, thickness, grain — are the
  // library's, whatever they were when the job was saved; its prices are kept.
  const said = (r.renamed || []).map((m) => `${name} names ${m.from}, which the ` +
    `library now calls ${m.to} — shown here as ${m.to}.`);
  if ((r.refreshed || []).length) {
    said.push(`Board details updated from the library: ${r.refreshed.join(", ")} ` +
              `(prices as quoted are kept).`);
  }
  if (said.length) {
    toast(said.join("\n") + `\nThe file on disk is unchanged until you save it.`);
  }
});

$("fixture").addEventListener("click", async () => {
  if (!okToDiscard("Loading the October 2025 fixture")) return;
  const r = await post("/api/fixture", {});
  if (!r.ok) { toast(r.error, true); return; }
  adopt(r.job);
  toast("Loaded the October 2025 wardrobe — " + r.job.cabinets.length + " cabinets.");
});

// Export (UI restructure, 28 September 2026): one elevation per wall, the walls
// ticked in a short list — all by default — and the plan. No Run drawing.
$("export").addEventListener("click", () => {
  const rm = S.job.room;
  if (!rm || !rm.walls.length) { runExport(null); return; }
  $("exportwalls").innerHTML = rm.walls.map((w) =>
    `<label style="display:flex;gap:6px;align-items:center"><input type="checkbox"
      style="width:auto" data-exwall="${esc(w.id)}" checked> Wall ${esc(w.id)} elevation</label>`).join("");
  const dlg = $("exportdlg");
  dlg.returnValue = "";
  dlg.showModal();
});

$("exportdlg").addEventListener("close", () => {
  if ($("exportdlg").returnValue !== "go") return;
  runExport([...document.querySelectorAll("#exportwalls [data-exwall]")]
    .filter((x) => x.checked).map((x) => x.dataset.exwall));
});

async function runExport(walls) {
  const r = await post("/api/export", walls === null ? {job: S.job} : {job: S.job, walls: walls});
  if (!r.ok) {
    toast(r.error + "\n" + (r.issues || []).map((i) =>
      `${i.where}: ${i.message}`).join("\n"), true);
    S.tab = "validation";
    document.querySelector('nav [data-tab="validation"]').click();
    return;
  }
  // The folders written, by name: the last export's are in _previous/ now,
  // and snapshots/ is untouched (output-folders brief, 28 September 2026).
  const into = Object.entries(r.folders || {}).map(([d, f]) => `${d}/ (${f.length})`).join(", ");
  toast("Wrote " + r.files.length + " files to " + (r.rel || r.dir) + "\n" + into +
        (r.previous ? "\nThe previous export is in _previous/" : "") +
        ((r.accepted || []).length ? "\nWith " + r.accepted.length + " accepted critical(s): " +
          r.accepted.map((i) => `${i.where} (${i.accepted})`).join(", ") : ""));
  S.lastExport = r;
}

$("jobname").addEventListener("input", schedule);

/* ---------- go ------------------------------------------------------------ */

// Set up synchronously: a click that lands while start() is still awaiting must
// not be overwritten by a late blank job.
S.job = blankJob();
$("jobname").value = S.job.name;

(async function start() {
  S.def = await post("/api/defaults", {});
  await refreshJobs();
  compute();
})();
</script>
</body>
</html>
