   The whole of the 3D code is app/view3d.js, a module of a different kind of
   code, loaded the FIRST time the tab is opened and never before — so
   start-up is exactly as fast as it was. index.html talks to it through a
   small interface: mount, update, select, setLayers, setVisible, dispose. */

let V3D = null;          // the module, once loaded
let v3dLoading = null;   // the one in-flight import, so two clicks load it once
S.sceneStale = true;     // the 3D view has not seen the job as it now stands
S.sceneJob = null;       // which job object the view last drew: a new one opens at Home

function size3D() {
  const box = $("v3d");
  if (!box || $("tab-view3d").hidden) return;
  // Fill the window below the tab bar: measured, because the header wraps at
  // narrow widths and the strip's height depends on what is in it.
  const top = box.getBoundingClientRect().top;
  box.style.height = Math.max(window.innerHeight - top - 14, 240) + "px";
  if (V3D) V3D.resize();
}
window.addEventListener("resize", size3D);

function selNumber() {
  const c = S.sel !== null && S.job && S.job.cabinets[S.sel];
  return c ? c.number : null;
}

async function render3D() {
  if (!V3D) {
    if (!v3dLoading) {
      v3dLoading = import("/app/view3d.js").then((m) => {
        V3D = m;
        V3D.mount({view: $("v3dview"), bar: $("v3dbar"), list: $("v3dlist"),
                   dock: $("v3ddock"), status: $("v3dstatus")}, {
          // a click in 3D selects without isolating; the item list isolates
          select: (number, part, opts) => select3D(number, part, opts),
          // the layer toggle is the plan's: one answer to "what am I looking at"
          toggleLayer: (k) => {
            const on = planLayers();
            const i = on.indexOf(k);
            if (i >= 0) on.splice(i, 1); else on.push(k);
            V3D.setLayers(planLayers());
            if (S.tab === "room") renderPlan();
          },
          // the 3D Isolate toggle is the plan's isolate: one answer
          isolate: (number) => { S.isolate = number; sync3D(); if (S.tab === "room") renderPlan(); },
          card: (number, part) => showPartCard(number, part),
          showLine: (label) => showInCutList(label),
          snapshot: (dataUrl) => snapshot3D(dataUrl),
          // F6: one /api/drag per press, the same the plan and the elevation
          // make; the drop writes the placement and nothing else, then the
          // one compute redraws every view
          dragModel: (number) => post("/api/drag", {job: S.job, cabinet: number}),
          drop: (number, at) => {
            const p = places().find((x) => x.cabinet === number);
            if (!p) return;
            p.x = at.x;
            p.z = at.z;
            if (at.y !== undefined) p.y = at.y;
            placesSig = null;            // the placements table shows the new numbers
            compute();
          },
        });
        $("v3dview").appendChild(cardEl());
      }).catch((err) => {
        v3dLoading = null;
        $("v3dview").innerHTML = `<div class="empty">The 3D view could not load: ${esc(err && err.message || err)}</div>`;
        throw err;
      });
    }
    await v3dLoading;
  }
  size3D();
  V3D.setVisible(true);
  if (S.sceneStale && sceneTimer === null) fetchScene();
  else V3D.select(selNumber());
}

// After every compute: the 3D view asks /api/scene, debounced, and only while
// its tab is showing — a hidden tab refreshes when it is next shown. Nothing
// is computed for the 3D view that the plan or the validation does not
// already compute; the scene is one more read-only view of the job.
let sceneSeq = 0, sceneTimer = null;
function refreshScene() {
  S.sceneStale = true;
  if (S.tab !== "view3d" || !V3D) return;
  clearTimeout(sceneTimer);
  sceneTimer = setTimeout(() => { sceneTimer = null; fetchScene(); }, 40);
}

async function fetchScene() {
  clearTimeout(sceneTimer);
  sceneTimer = null;
  if (!V3D || !S.job) return;
  const seq = ++sceneSeq;
  const t0 = performance.now();
  const r = await post("/api/scene", {job: S.job});
  if (seq !== sceneSeq) return;                    // a newer job is on its way
  if (!r.ok) { toast(r.error, true); return; }
  S.sceneStale = false;
  const fresh = S.sceneJob !== S.job;              // a newly loaded job opens at Home
  S.sceneJob = S.job;
  V3D.setLayers(planLayers());
  V3D.update(r, {fresh: fresh});
  V3D.select(selNumber());
  S.sceneMs = Math.round(performance.now() - t0);
}

// A selection made in the 3D view: the one selection, the one editor.
function select3D(number, part, opts) {
  const i = number === null ? -1 : S.job.cabinets.findIndex((c) => c.number === number);
  selectCabinet(i >= 0 ? i : null, {isolate: !!(opts && opts.isolate)});
  renderList();
  refreshPlan();
}

/* ---------- the part card (F4) ----------------------------------------------
   Clicking a part shows its cabinet, its role and its CUT-LIST LINE, read from
   the compute reply by the designation the scene gave — designation, finished
   L x W x thickness, board, grain, edging — and a button that lands on that
   row of the cut list. A part with no line says why. That is the spec's rule:
   a panel cannot be admired in 3D and wrong on the list. */

let cardBox = null;
function cardEl() {
  if (!cardBox) {
    cardBox = document.createElement("div");
    cardBox.className = "v3dcard";
    cardBox.hidden = true;
    cardBox.addEventListener("click", (e) => {
      if (e.target.closest(".x")) { cardBox.hidden = true; return; }
      const go = e.target.closest("[data-line]");
      if (go) showInCutList(go.dataset.line);
    });
  }
  return cardBox;
}

function showPartCard(number, part) {
  const box = cardEl();
  if (number === null && !part) { box.hidden = true; return; }
  const c = number !== null && S.job.cabinets.find((x) => x.number === number);
  const g = c && S.res && S.res.geometry && S.res.geometry[String(number)];
  const kind = c ? (c.kind === "panel" ? "Panel" : c.kind + (g && g.corner && g.corner.kind ? " · " + g.corner.kind : "")) : "";
  const roleNames = {side: "Side", top: "Top", bottom: "Bottom", door: "Door leaf", drawer: "Drawer face",
                     blind: "Blind panel", panel: "Panel", back: "Backing", carcass: "Carcass",
                     plinth: "Plinth board", filler: "Filler"};
  let role = part ? (roleNames[part.role] || part.role) : "";
  if (part && (part.role === "door" || part.role === "drawer")) role += " " + (part.index + 1);
  let line = "";
  if (part && part.line) {
    const p = (S.res.panels || []).find((x) => x.label === part.line);
    const mat = S.res.materials && S.res.materials[part.board];
    const t = mat && mat.thickness ? ` × ${mat.thickness}` : "";
    line = p
      ? `<div><span class="mono"><b>${esc(p.label)}</b></span> ${esc(p.role)} · ${p.length} × ${p.width}${t} · ${esc(p.material)}
         · ${p.grain ? `locked along L ${p.length}` : "free"}${p.edge_material ? " · " + esc(p.edge_material) : ""}${
           p.qty > 1 ? ` · qty ${p.qty}` : ""}</div>
         <button class="go" data-line="${esc(p.label)}">Show in cut list</button>`
      : `<div class="note">${esc(part.line)} is not on the cut list as computed.</div>`;
  } else if (part) {
    line = `<div class="note">No cut-list line: ${esc(part.reason || "not matched")}.</div>`;
  }
  box.innerHTML = `<button class="x" title="close">×</button>
    <b>${number !== null ? `${number} · ${esc(kind)}` : esc(role)}</b>${number !== null && role ? ` — ${esc(role)}` : ""}${
    part ? ` <span class="note">${esc(part.board)}</span>` : ""}${line}`;
  box.hidden = false;
}

// Snapshot (F5): the view as a PNG, written by the server into output/<job>/
// under a name that never overwrites. The toast names the file.
async function snapshot3D(dataUrl) {
  if (!dataUrl) return;
  const r = await post("/api/snapshot", {name: S.job.name, png: dataUrl});
  if (!r.ok) { toast(r.error, true); return; }
  toast(`Saved ${r.file}`);
}

/* ---------- job files ----------------------------------------------------- */

async function refreshJobs() {
  const r = await post("/api/jobs", {});
  $("joblist").innerHTML = (r.jobs || [])
    .map((n) => `<option>${esc(n)}</option>`).join("") ||
    `<option value="">(no saved jobs)</option>`;
}

function adopt(job) {
  S.job = job;
  places();                  // a file saved with no room has no placements key
  markDirty(false);          // what is on screen is what is on disk
  S.sel = null;
  S.isolate = null;
  S.lapsedNotes = [];
  S.acceptOpen = null;
  S.selRendered = -2;
  roomSig = null;
  placesSig = null;
  gapsSig = null;
  plinthSig = null;
  $("jobname").value = job.name || "untitled";
  compute();
}

$("new").addEventListener("click", () => {
  if (!okToDiscard("Starting a new job")) return;
  adopt(blankJob());
});

$("save").addEventListener("click", async () => {
  const r = await post("/api/save", {job: S.job, path: $("jobname").value.trim()});
  if (!r.ok) { toast(r.error, true); return; }
  markDirty(false);
  toast("Saved jobs/" + r.path);
  await refreshJobs();
  $("joblist").value = r.path;
});

// Deleting a saved job. It is moved to jobs/_deleted/, never unlinked: a job is
// a quote somebody may want back, and "I picked the wrong one" has no undo
// otherwise. The job on screen cannot be deleted — that would leave the editor
// showing something with nowhere to save it back to — and the two fixture jobs
// say what they are before they go, because the checks run against them.
$("jobdel").addEventListener("click", async () => {
  const name = $("joblist").value;
  if (!name) { toast("No saved job selected.", true); return; }

  const info = await post("/api/job-delete-info",
                          {path: name, open: currentJobFile()});
  if (!info.ok) { toast(info.error, true); return; }
  if (!info.exists) { toast(`There is no saved job ${name}.`, true); return; }
  if (info.is_open) {
    toast(`${name} is the job open here — load or start another one first, ` +
          `then delete it.`, true);
    return;
  }

  const warn = info.fixture
    ? `\n!! ${name} is one of the two jobs the CHECKS run against. ` +
      `Deleting it stops tools/regen_check.py and several check_*.py scripts ` +
      `working until it is put back.\n`
    : "";
  const ok = window.confirm(
    `Delete the project ${name}?\n` + warn +
    `\nIt is moved to jobs/_deleted/${name}, not erased, so it can be put back ` +
    `by moving the file. It stops appearing in the job list.\n\nDelete ${name}?`);
  if (!ok) return;

  const r = await post("/api/job-delete", {path: name, open: currentJobFile()});
  if (!r.ok) { toast(r.error, true); return; }
  await refreshJobs();
  toast(`${r.path} moved to ${r.moved_to} — put it back by moving the file.`);
});

// Which FILE the job on screen came from, which is what "do not delete the open
// one" has to be asked of. The name box is the job's name, and Save uses it as
// the file name, so it is the same question.
function currentJobFile() {
  const n = ($("jobname").value || "").trim();
  return n ? (n.endsWith(".json") ? n : n + ".json") : "";
}

$("load").addEventListener("click", async () => {
  const name = $("joblist").value;
  if (!name) { toast("No saved job selected.", true); return; }
  if (!okToDiscard(`Loading ${name}`)) return;
  const r = await post("/api/load", {path: name});
  if (!r.ok) { toast(r.error, true); return; }
  adopt(r.job);
  // A board the file names by an id the library has since renamed, shown under
  // its current id. Said out loud: the file itself is not touched until saved.
  // And every board's details — name, edging, thickness, grain — are the
  // library's, whatever they were when the job was saved; its prices are kept.
  const said = (r.renamed || []).map((m) => `${name} names ${m.from}, which the ` +
    `library now calls ${m.to} — shown here as ${m.to}.`);
  if ((r.refreshed || []).length) {
    said.push(`Board details updated from the library: ${r.refreshed.join(", ")} ` +
              `(prices as quoted are kept).`);
  }
  if (said.length) {
    toast(said.join("\n") + `\nThe file on disk is unchanged until you save it.`);
  }
});

$("fixture").addEventListener("click", async () => {
  if (!okToDiscard("Loading the October 2025 fixture")) return;
  const r = await post("/api/fixture", {});
  if (!r.ok) { toast(r.error, true); return; }
  adopt(r.job);
  toast("Loaded the October 2025 wardrobe — " + r.job.cabinets.length + " cabinets.");
});

$("export").addEventListener("click", async () => {
  const r = await post("/api/export", {job: S.job});
  if (!r.ok) {
    toast(r.error + "\n" + (r.issues || []).map((i) =>
      `${i.where}: ${i.message}`).join("\n"), true);
    S.tab = "validation";
    document.querySelector('nav [data-tab="validation"]').click();
    return;
  }
  toast("Wrote " + r.files.length + " files to\n" + r.dir +
        ((r.accepted || []).length ? "\nWith " + r.accepted.length + " accepted critical(s): " +
          r.accepted.map((i) => `${i.where} (${i.accepted})`).join(", ") : ""));
});

$("jobname").addEventListener("input", schedule);

/* ---------- go ------------------------------------------------------------ */

// Set up synchronously: a click that lands while start() is still awaiting must
// not be overwritten by a late blank job.
S.job = blankJob();
$("jobname").value = S.job.name;

(async function start() {
  S.def = await post("/api/defaults", {});
  await refreshJobs();
  compute();
})();
</script>
