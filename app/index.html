        ${num("price", "Price per pair", x.price || 0, "0.01", "captured into a project when it is ticked")}
        <div class="f"><label>Type</label><select id="rf-type">${types.map((t) =>
          `<option${t === x.type ? " selected" : ""}>${esc(t)}</option>`).join("")}</select></div>
        ${num("height", "Height (mm)", x.height, "0.1", "the outer channel", true)}
        ${num("side_clearance", "Side clearance (mm each side)", x.side_clearance, "0.1",
              "box width = opening − 2 × this", true)}
        ${num("rail_thickness", "Rail thickness (mm)", x.rail_thickness, "0.1",
              "the outer channel, fixed to the carcass: drawn in 3D", true)}
        ${num("inner_height", "Inner member height (mm)",
              x.inner_height || x.inner_h, "0.1", "fixed to the drawer side: drawn in 3D", true)}
        ${num("inner_thickness", "Inner member thickness (mm)",
              x.inner_thickness || x.inner_t, "0.1", "travels with the box", true)}
        <div class="f wide${miss.indexOf("lengths") >= 0 ? " bad" : ""}" style="grid-column:1/-1"><label>Lengths available (mm) <b class="req" title="required">*</b></label>
          <input id="rf-lengths" value="${esc((x.lengths || []).join(" "))}" placeholder="300 350 400 450 500">
          <span class="note">the box length is the longest of these that leaves
            ${(S.def.standard || {}).runner_clearance || 40} mm behind it</span></div>
        <div class="f"><label>Extension</label>
          <input id="rf-extension" value="${esc(x.extension === undefined ? "full" : String(x.extension))}"
                 placeholder="full, or a fraction like 0.75">
          <span class="note">full: travel = length</span></div>
        ${num("capacity_kg", "Capacity (kg)", x.capacity_kg, "1", "")}
        ${num("lift", "Lift (mm)", x.lift, "0.1", "drawer side bottom above the rail bottom", true)}
        ${num("setback", "Setback (mm)", x.setback, "0.1", "inner member behind the box front", true)}
      </div>
      <div class="presets">
        <button id="rf-save" class="primary">Save to the library</button>
        <button id="rf-cancel">Cancel</button>
      </div>
    </div></div>`;

$("runners").addEventListener("click", async (e) => {
  const ed = e.target.closest("[data-redit]");
  if (ed) {
    S.rEdit = Object.assign({}, S.rlib.runners.find((x) => x.id === ed.dataset.redit));
    S.rMissing = [];
    drawRunnerEditor();
    $("runneredit").scrollIntoView({block: "nearest"});
    return;
  }
  if (e.target.id === "rnew") {
    const seed = S.rlib.runners.find((x) => x.id === S.def.runner_seed) || {};
    // a new runner starts from the seed's fitting figures, with no id, name or price
    S.rEdit = {id: "", name: "", supplier: "", sku: "", price: 0,
               type: (S.def.runner_types || [])[0], height: seed.height || 45,
               side_clearance: seed.side_clearance || 13.5, rail_thickness: seed.rail_thickness || 12.7,
               lengths: [], extension: "full", capacity_kg: 0, lift: seed.lift || 5,
               setback: seed.setback || 3, inner_height: seed.inner_h || null,
               inner_thickness: seed.inner_t || null,
               // the seed's inner member is an estimate until it is confirmed
               estimated: ["inner_height", "inner_thickness"]};
    S.rMissing = [];
    drawRunnerEditor();
    $("runneredit").scrollIntoView({block: "nearest"});
    return;
  }
  if (e.target.id === "rf-cancel") { S.rEdit = null; S.rMissing = []; drawRunnerEditor(); return; }
  if (e.target.id === "rf-save") {
    const v = (id) => $("rf-" + id).value;
    const runner = {id: v("id").trim().toUpperCase(), name: v("name").trim(),
      supplier: v("supplier").trim(), sku: v("sku").trim(), price: v("price"),
      type: v("type"), height: v("height"), side_clearance: v("side_clearance"),
      rail_thickness: v("rail_thickness"), lengths: v("lengths"),
      extension: v("extension"), capacity_kg: v("capacity_kg"), lift: v("lift"),
      setback: v("setback"), inner_height: v("inner_height"),
      inner_thickness: v("inner_thickness")};
    const r = await post("/api/runner-save", {runner: runner, from: S.rEdit.id || "", job: S.job});
    if (!r.ok) {
      toast(r.error, true);
      // keep what was typed, and light the fields the server named
      S.rEdit = Object.assign({}, S.rEdit, runner, {lengths: String(runner.lengths).split(/[\s,]+/)});
      S.rMissing = r.missing || (runner.name ? [] : ["name"]);
      drawRunnerEditor();
      return;
    }
    S.rMissing = [];
    if (r.job) { S.job = r.job; markDirty(true); }
    toast(`Saved ${r.id} to the library` + (r.project_follows
      ? " — this project's copy follows it (its captured price is kept); saved jobs keep theirs." : "."));
    S.rEdit = null;
    await compute();
    await renderRunnersTab();
    return;
  }
  const del = e.target.closest("[data-rdel]");
  if (del) {
    if (!window.confirm(`Remove ${del.dataset.rdel} from the runner library?`)) return;
    const r = await post("/api/runner-delete", {id: del.dataset.rdel});
    if (!r.ok) { toast(r.error, true); return; }
    await renderRunnersTab();
    return;
  }
  const sw = e.target.closest("[data-rswap]");
  if (sw) { await swapRunner(sw.dataset.rswap); return; }
});

// Ticking a runner into the project copies its record — price included.
$("runners").addEventListener("change", async (e) => {
  const id = e.target.dataset.rpick;
  if (id === undefined) return;
  const r = await post("/api/runner-select", {job: S.job, id: id, on: e.target.checked});
  if (!r.ok) { toast(r.error, true); e.target.checked = !e.target.checked; return; }
  S.job = r.job;
  places();
  markDirty(true);
  await compute();
  drawRunners();
});

// Every drawer cabinet onto one runner. The engine says first which drawer
// lines move — re-pointing an old job may legitimately change drawer lengths —
// and nothing is written until that has been confirmed.
async function swapRunner(to) {
  const pre = await post("/api/runner-swap", {job: S.job, to: to});
  if (!pre.ok) { toast(pre.error, true); return; }
  if (!pre.cabinets.length) { toast(`Every drawer cabinet is already on ${to}.`); return; }
  if (pre.error_after) { toast(pre.error_after, true); return; }
  const lines = pre.moves.map((m) => `    ${m.cabinet}: ${m.label}   ${m.role}   ` +
    (m.before ? `${m.before[0]} x ${m.before[1]}` : "—") + "  ->  " +
    (m.after ? `${m.after[0]} x ${m.after[1]}` : "—")).join("\n");
  const ok = window.confirm(`Hang cabinet${pre.cabinets.length === 1 ? "" : "s"} ` +
    `${pre.cabinets.join(", ")} on ${to}?\n\n` +
    (pre.moves.length ? `These drawer lines move:\n\n${lines}\n\n` +
      `That is a design change — the boxes are sized off the runner. No designation is renamed.`
      : `No drawer line moves: every box comes out the same size.`));
  if (!ok) return;
  const r = await post("/api/runner-swap", {job: S.job, to: to, apply: true});
  if (!r.ok) { toast(r.error, true); return; }
  S.job = r.job;
  places();
  markDirty(true);
  await compute();
  drawRunners();
  toast(`Cabinet${r.cabinets.length === 1 ? "" : "s"} ${r.cabinets.join(", ")} now on ${to}.`);
}

/* Swapping a project board propagates everywhere it is used, so nothing is
   written until the change has been shown: which cabinets, which panels, and
   what it does to the board count and the cost. Same pattern as the drawer
   tickbox — the engine answers first, and cancelling changes nothing. */
async function swapBoard(fromId, to) {
  if (!fromId || !to) return;

  const pre = await post("/api/board-swap", {job: S.job, from: fromId, to: to});
  if (!pre.ok) { toast(pre.error, true); return; }
  if (!pre.cabinets.length) {
    toast(`No cabinet is cut from ${fromId}, so nothing would change.`);
    return;
  }

  const money = (v) => "R " + (v || 0).toLocaleString("en-ZA",
    {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const boards = (t) => Object.keys(t.boards).sort()
    .map((m) => `${m} ${t.boards[m]}`).join(", ");
  // The field labels are the engine's words already ("door leaf 2 board"), so
  // they are shown as they come rather than translated here.
  const cabs = pre.cabinets.map((c) =>
    `    cabinet ${c.cabinet} — ${c.fields.join(", ")}`).join("\n");
  const shown = pre.panels.slice(0, 12).map((p) =>
    `    ${p.label}  ${p.role}  ${p.from} -> ${p.to}` +
    (p.tape_from !== p.tape_to ? `,  edging ${p.tape_from} -> ${p.tape_to}` : "")).join("\n");
  const more = pre.panels.length > 12
    ? `\n    ... and ${pre.panels.length - 12} more panels` : "";

  // How many panels each board gains or loses: the figure to sanity check a
  // swap against.
  const moved = (pre.moved_by_board || []).map((m) =>
    `    ${m.board}  ${m.before} -> ${m.after}`).join("\n");

  // Bespoke and loose panels carry a TYPED grain and edging, so a swap brings
  // those into line too — and says which it could not.
  const retyped = (pre.retyped || []).length
    ? `\n${pre.retyped.length} hand-specified panel${pre.retyped.length === 1 ? "" : "s"}` +
      ` re-derived from the new board:\n` +
      pre.retyped.slice(0, 8).map((r) =>
        `    ${r.label}` +
        (r.grain_to !== undefined ? `  grain ${r.grain_from} -> ${r.grain_to}` : "") +
        (r.tape_to !== undefined
          ? `  edging ${r.tape_from || "none"} -> ${r.tape_to || "NONE OFFERED"}` : "")
      ).join("\n") +
      (pre.retyped.length > 8 ? `\n    ... and ${pre.retyped.length - 8} more` : "") + "\n"
    : "";

  const unmapped = (pre.unmapped || []).length
    ? `\n!! ${pre.unmapped.length} panel${pre.unmapped.length === 1 ? "" : "s"} ` +
      `ask for edging ${pre.to} does not offer, so there is none to give:\n` +
      pre.unmapped.slice(0, 8).map((u) =>
        `    ${u.label}  was ${u.was || "—"}`).join("\n") + "\n"
    : "";

  // Grain, said out loud. `Length` IS the grain direction on a grained board and
  // a locked panel cannot be turned by the nester, so both the direction and what
  // the lost rotation costs are listed. Whether that direction is the right one
  // to look at is not something the app can judge — it is listed to be checked.
  const gr = pre.grain || [];
  const locking = gr.filter((x) => x.locked);
  const freeing = gr.filter((x) => !x.locked);
  const grainLine = (x) =>
    `    ${x.label}  ${x.role}  ${x.length} x ${x.width}${x.qty > 1 ? "  x" + x.qty : ""}` +
    `  ${x.board}  —  grain ${x.runs}`;
  const grainBlock = gr.length
    ? `\nGRAIN — check these directions:\n` +
      (locking.length
        ? `  ${locking.length} panel${locking.length === 1 ? "" : "s"} become ` +
          `grain-LOCKED (cannot be turned):\n` +
          locking.slice(0, 10).map(grainLine).join("\n") +
          (locking.length > 10 ? `\n    ... and ${locking.length - 10} more` : "") + "\n"
        : "") +
      (freeing.length
        ? `  ${freeing.length} panel${freeing.length === 1 ? "" : "s"} become plain ` +
          `(the nester may turn them):\n` +
          freeing.slice(0, 10).map(grainLine).join("\n") +
          (freeing.length > 10 ? `\n    ... and ${freeing.length - 10} more` : "") + "\n"
        : "")
    : "";

  // What the lock costs on its own: the same panels re-nested with grain freed.
  const rot = pre.rotation;
  const rotBlock = rot && rot.cost_of_lock
    ? `  Lost rotation costs ${money(rot.cost_of_lock)}: ` +
      `${boards({boards: rot.boards_with_lock})} locked, against ` +
      `${boards({boards: rot.boards_if_free})} if the grain did not hold.\n`
    : rot && gr.length ? `  The grain lock costs no extra board on this job.\n` : "";

  // What the swap does to the VALIDATION, not just to the cost. A swap is how a
  // design gets previewed, so a grain lock that no longer fits a sheet, or an
  // edging the new board cannot supply, has to be on screen before it is written.
  const issueLine = (i) =>
    `    ${i.level === "critical" ? "CRITICAL" : "warning "}  ${i.where}  ${i.message}`;
  const fresh = (pre.new_issues || []).length
    ? `\nNEW problems this swap creates:\n` +
      pre.new_issues.slice(0, 10).map(issueLine).join("\n") +
      (pre.new_issues.length > 10
        ? `\n    ... and ${pre.new_issues.length - 10} more` : "") + "\n"
    : `\nNo new validation problems.\n`;
  const fixed = (pre.fixed_issues || []).length
    ? `\n${pre.fixed_issues.length} existing problem${
        pre.fixed_issues.length === 1 ? "" : "s"} would go away.\n` : "";
  // Only worth saying if THIS swap is what blocks it: a job that was already
  // blocked before the swap is not news, and saying so every time teaches the
  // reader to skip the line that matters.
  const newCrits = (pre.new_issues || []).filter((i) => i.level === "critical").length;
  const blocked = newCrits
    ? `\nThis swap ADDS ${newCrits} critical${newCrits === 1 ? "" : "s"} — the export ` +
      `is blocked until they are cleared.\n`
    : pre.blocks ? `\n(The export was already blocked before this swap.)\n` : "";

  // Merging is not reversible: once both boards are one, nothing records which
  // panels used to be which, so swapping back does not undo it.
  const merge = pre.merged
    ? `\n!! ${pre.to} is ALREADY used in this project, so this MERGES the two ` +
      `boards. Swapping back afterwards will not undo it — nothing records which ` +
      `panels used to be ${pre.from}.\n`
    : "";

  const ok = window.confirm(
    `Swap ${pre.from} for ${pre.to} across this project?\n` +
    merge +
    `\n${pre.cabinets.length} cabinet${pre.cabinets.length === 1 ? "" : "s"}:\n${cabs}\n\n` +
    (pre.panels.length
      ? `${pre.panels.length} panel${pre.panels.length === 1 ? "" : "s"} change ` +
        `board or edging:\n${shown}${more}\n`
      : `No generated panel changes board or edging.\n`) +
    retyped + unmapped +
    (moved ? `\nPanels per board:\n${moved}\n` : "") +
    grainBlock + rotBlock +
    fresh + fixed + blocked +
    `\nBoards: ${boards(pre.before)}\n` +
    `    ->  ${boards(pre.after)}\n\n` +
    `Cost:   ${money(pre.before.cost)}\n` +
    `    ->  ${money(pre.after.cost)}\n\n` +
    `No panel is renamed — a panel keeps its designation and changes what it is ` +
    `cut from. Cancel and nothing is written.\n\nApply?`);
  if (!ok) return;

  const done = await post("/api/board-swap",
                          {job: S.job, from: fromId, to: to, apply: true});
  if (!done.ok) { toast(done.error, true); return; }
  S.job = done.job;
  S.selRendered = -2;
  await compute();
  drawBoards();
}

/* ---------- the elevation as a control ------------------------------------
   Dragging a cabinet moves it along the wall and up and down it. Dragging the
   join between two drawer faces pins those two and leaves the rest of the stack
   alone. A door is not a control here — which edge it hangs from is set in the
   Doors section, where the answer can be read rather than guessed at from a
   picture.

   The browser works out no dimension in either drag. The drawing carries the
   millimetre-to-pixel mapping and every position the engine will allow, and the
   browser only picks the nearest of them.                                   */

let FDRAG = null;

function svgY(svg, evt) {
  const r = svg.getBoundingClientRect();
  return (evt.clientY - r.top) * (svg.viewBox.baseVal.height || r.height) / r.height;
}

$("elevation").addEventListener("pointerdown", (e) => {
  const line = e.target.closest(".fdiv");
  if (!line) return;
  const c = S.job.cabinets.find((x) => x.number === +line.dataset.cab);
  if (!c) return;
  FDRAG = {line: line, cab: c, svg: line.ownerSVGElement,
           above: +line.dataset.above, below: +line.dataset.below,
           mm: +line.dataset.mm, top: +line.dataset.top, px: +line.dataset.px,
           at: null, moved: false};
  // on the window, not the line: a drag that runs off the drawing must finish
  window.addEventListener("pointermove", onFaceDrag);
  window.addEventListener("pointerup", endFaceDrag);
  window.addEventListener("pointercancel", endFaceDrag);
  e.preventDefault();
});

function onFaceDrag(e) {
  if (!FDRAG) return;
  const y = svgY(FDRAG.svg, e);
  const perMm = FDRAG.px / FDRAG.mm;   // both came from the engine; this only reads back
  FDRAG.at = Math.round((y - FDRAG.top) / perMm);
  FDRAG.moved = true;
  FDRAG.line.setAttribute("y1", y.toFixed(2));
  FDRAG.line.setAttribute("y2", y.toFixed(2));
  FDRAG.line.setAttribute("stroke-opacity", "1");
}

async function endFaceDrag() {
  const d = FDRAG;
  FDRAG = null;
  window.removeEventListener("pointermove", onFaceDrag);
  window.removeEventListener("pointerup", endFaceDrag);
  window.removeEventListener("pointercancel", endFaceDrag);
  if (!d || !d.moved) return;
  const a = d.cab.drawers[d.above], b = d.cab.drawers[d.below];
  if (!a || !b) return;
  const r = await post("/api/drawer-divider", {
    top: a.face_height, bottom: b.face_height, at: d.at,
    top_box: a.box_height, bottom_box: b.box_height,
    job: S.job, index: S.job.cabinets.indexOf(d.cab), above: d.above, below: d.below});
  if (!r.ok) { toast(r.error, true); return; }
  a.mode = "fixed"; a.face_height = r.top;
  b.mode = "fixed"; b.face_height = r.bottom;
  markDirty(true);             // an edit like any other: the screen and the disk now differ
  compute();                   // those two rows are Fixed now; the rest is untouched
}

/* ---------- dragging a cabinet in the elevation ----------------------------
   Sideways along the wall and up and down it, in one drag. The drawing carries
   where 0 mm and the floor are and how many pixels a millimetre is; the engine
   hands over every position and every height it will allow, with the reason for
   each. The browser projects the pointer onto that mapping and picks the nearest
   candidate within the standard's snap tolerance — it invents neither a position
   nor a height, and on drop the whole job is recomputed server-side.

   Placement.z is what moves vertically: 0 is the floor, where the carcass stands
   on its legs, and anything above it is a hung unit's underside.            */

let EDRAG = null;

function elevTrack() {
  const t = document.querySelector("#elevation .etrack");
  if (!t) return null;
  return {wall: t.dataset.wall, len: +t.dataset.len, scale: +t.dataset.scale,
          x0: +t.dataset.x0, y0: +t.dataset.y0, ceiling: +t.dataset.ceiling,
          svg: t.ownerSVGElement};
}

function elevPoint(svg, evt) {
  const r = svg.getBoundingClientRect();
  return {x: (evt.clientX - r.left) * (svg.viewBox.baseVal.width || r.width) / r.width,
          y: (evt.clientY - r.top) * (svg.viewBox.baseVal.height || r.height) / r.height,
          rect: r};
}

$("elevation").addEventListener("pointerdown", async (e) => {
  const grp = e.target.closest(".ecabg");
  if (!grp) return;
  const number = +grp.dataset.cab;
  const track = elevTrack();
  // No wall drawn to move along (the side-by-side Run, which the UI no longer
  // shows, or a job with no room): a press selects the cabinet, starts nothing.
  if (!track || !S.job.room) {
    const i = S.job.cabinets.findIndex((x) => x.number === number);
    if (i >= 0 && i !== S.sel) { selectCabinet(i, {isolate: false}); renderList(); refreshPlan(); }
    return;
  }
  const p = places().find((x) => x.cabinet === number);
  if (!p) { attachedPress(number); return; }

  // Everything that has to happen on the press happens now, before the snap
  // model is fetched: stop the drawing's text being selected, and listen for
  // the release. Waiting for the reply first meant a quick drag could let go
  // before anything was listening, and the cabinet then stuck to the pointer.
  e.preventDefault();
  const pt = elevPoint(track.svg, e);
  const hosted = [...document.querySelectorAll(`#elevation .ecabg[data-host="${number}"]`)];
  const d = {model: null, grp: grp, place: p, track: track, press: pt,
             from: {x: p.x, z: p.z}, at: {x: p.x, z: p.z}, moved: false,
             last: null, released: false,
             // the panels attached to it, and their labels, move with it on screen
             hosted: hosted.concat(...hosted.map((h) => [...elevTags(h)]))};
  EDRAG = d;
  grp.classList.add("dragging");
  selectCabinet(S.job.cabinets.findIndex((x) => x.number === number), {isolate: false});
  window.addEventListener("pointermove", onElevDrag);
  window.addEventListener("pointerup", endElevDrag);
  window.addEventListener("pointercancel", endElevDrag);

  const model = await post("/api/drag", {job: S.job, cabinet: number});
  if (EDRAG !== d && !d.released) return;       // superseded by a newer press
  if (!model.ok) { toast(model.error, true); d.moved = false; finishElevDrag(d); return; }
  d.model = model;
  // where in the carcass it was grabbed, so it does not jump to centre
  d.grabX = (pt.x - track.x0) / track.scale - p.x;
  d.grabZ = (track.y0 - pt.y) / track.scale - carcassZ(p, model);
  // Replay what happened while the model was on its way: the last position the
  // pointer reached, and the release if it has already come.
  if (d.last) moveElevDrag(d, d.last);
  if (d.released) finishElevDrag(d);
});

// Where the underside actually is, which is not the same as Placement.z: a
// carcass on the floor stands on its legs, a hung unit does not — and neither
// does a PANEL, which is a part put where it is put. How much the lift is when
// z is 0 is `room.carcass_z`'s answer, handed over by /api/drag and read back
// here. It used to be derived from the layer, which would have stood every
// panel 100 mm off the floor.
function carcassZ(p, model) {
  return p.z > 0 ? p.z : (model.leg_lift || 0);
}

function onElevDrag(e) {
  const d = EDRAG;
  if (!d) return;
  // Before the snap model has arrived there is nothing to snap to: keep where
  // the pointer is, and move there as soon as it comes.
  if (!d.model) { d.last = {clientX: e.clientX, clientY: e.clientY}; return; }
  moveElevDrag(d, e);
}

function moveElevDrag(d, e) {
  const EDRAG = d;                         // this drag, whatever the global says now
  const t = EDRAG.track;
  const wall = EDRAG.model.walls[t.wall];
  if (!wall) return;
  const pt = elevPoint(t.svg, e);
  const at = elevSnap(EDRAG.model, wall,
                      Math.round((pt.x - t.x0) / t.scale - EDRAG.grabX),
                      Math.round((t.y0 - pt.y) / t.scale - EDRAG.grabZ));
  const x = at.x, z = at.z, why = at.why, whyZ = at.whyZ;

  EDRAG.moved = true;
  EDRAG.at = {x: x, z: z};
  const moveBy = `translate(${
    ((x - EDRAG.from.x) * t.scale).toFixed(2)} ${
    ((carcassZ({z: EDRAG.from.z}, EDRAG.model) -
      carcassZ({z: z}, EDRAG.model)) * t.scale).toFixed(2)})`;
  EDRAG.grp.setAttribute("transform", moveBy);
  // a thin panel's number is drawn outside its group, over the neighbours
  // (render: `late`), so it is moved alongside rather than left behind
  elevTags(EDRAG.grp).forEach((el) => el.setAttribute("transform", moveBy));
  (EDRAG.hosted || []).forEach((el) => el.setAttribute("transform", moveBy));

  const out = $("elevdrag");
  if (out) {
    out.style.display = "block";
    out.style.left = (e.clientX - pt.rect.left + 14) + "px";
    out.style.top = (e.clientY - pt.rect.top + 14) + "px";
    out.textContent = `wall ${t.wall} · ${x} mm` + (why ? ` (${why})` : "") +
      ` · ${z === 0 ? "on the floor" : z + " mm up"}` + (whyZ && z ? ` (${whyZ})` : "");
  }
}

// Where the pointer's x and underside z settle on one wall: clamped to the wall
// and the ceiling, and the NEAREST candidate the engine named within tolerance
// on each axis. The elevation drag's rule, shared with a drop from the list of
// unplaced items (28 September 2026) so the two cannot disagree.
function elevSnap(model, wall, x, z) {
  const tol = model.tolerance;
  x = Math.max(0, Math.min(x, wall.max_x));
  // The NEAREST candidate within tolerance, not the first one found. The engine
  // hands them over sorted, and taking the first meant a farther target could
  // win over a nearer one wherever two fall within the same 20 mm — which the
  // vertical axis now does routinely, with an opening's datums among the
  // neighbours' (21 September 2026).
  let why = "", pick = null, best = tol + 1;
  for (const sn of wall.snaps) {
    const off = Math.abs(sn.x - x);
    if (off < best) { best = off; pick = sn; }
  }
  if (pick) { x = pick.x; why = pick.why; }

  const maxZ = model.max_z;      // null when no ceiling has been measured
  z = Math.max(0, maxZ === null || maxZ === undefined ? z : Math.min(z, maxZ));
  let whyZ = "";
  const w = model.width;
  // The pointer gives the underside, but "on the floor" is Placement.z 0 with
  // the underside up on the legs. So the floor is compared where the carcass
  // really stands, not at 0 — compared at 0 it could never be reached from a
  // standing start, and a sideways drag with a little wobble hung the unit.
  const legs = carcassZ({z: 0}, model);
  // Several cabinets on the floor put their undersides on one line, so a whole
  // row of candidates can share a height and differ only in which one they name.
  // The nearest along the wall is the one worth saying — the engine sorts them
  // that way for the position the drag STARTED at, and this keeps it true as the
  // item moves (21 September 2026). It chooses between candidates the engine
  // named; it works out no height of its own.
  const away = (sn) => {
    const a = sn.x0 !== null && sn.x0 !== undefined ? [sn.x0, sn.x1]
            : (sn.not_x0 !== null && sn.not_x0 !== undefined
               ? [sn.not_x0, sn.not_x1] : null);
    return a === null ? 0 : Math.max(0, a[0] - (x + w), x - a[1]);
  };
  let zPick = null, zBest = tol + 1, zAway = 0;
  for (const sn of wall.z_snaps) {
    // a height that belongs to another cabinet only applies where this one is
    // actually over or under it — the engine hands over the stretch, this only
    // asks whether the two overlap
    if (sn.x0 !== null && sn.x0 !== undefined &&
        (sn.x0 >= x + w || sn.x1 <= x)) continue;
    // and a level line with a neighbour applies everywhere except over or under
    // it — there, level tops would put one cabinet inside the other
    if (sn.not_x0 !== null && sn.not_x0 !== undefined &&
        !(sn.not_x0 >= x + w || sn.not_x1 <= x)) continue;
    const at = sn.z === 0 ? legs : sn.z;
    const off = Math.abs(at - z);
    const gap = away(sn);
    if (off < zBest || (off === zBest && gap < zAway)) {
      zBest = off; zAway = gap; zPick = sn;
    }
  }
  const snapped = zPick !== null;
  if (zPick) { z = zPick.z; whyZ = zPick.why; }
  // Nothing hangs lower than its own legs would stand it: an underside between
  // the floor and the leg height is standing on the floor.
  if (!snapped && z > 0 && z < legs) { z = 0; whyZ = "on the floor"; }
  return {x: x, z: z, why: why, whyZ: whyZ};
}

function endElevDrag() {
  const d = EDRAG;
  if (!d) return;
  window.removeEventListener("pointermove", onElevDrag);
  window.removeEventListener("pointerup", endElevDrag);
  window.removeEventListener("pointercancel", endElevDrag);
  // Let go before the snap model arrived: the press handler finishes it, with
  // the last position replayed, once the model is here.
  if (!d.model) { d.released = true; return; }
  finishElevDrag(d);
}

// A press on an item with no placement of its own. An ATTACHED panel is the
// case: it is selected, and told where it is moved from.
function attachedPress(number) {
  const i = S.job.cabinets.findIndex((x) => x.number === number);
  if (i < 0) return;
  const host = attachedTo(S.job.cabinets[i]);
  if (i !== S.sel) { selectCabinet(i, {isolate: false}); renderList(); }
  if (host !== null) {
    toast(`Panel ${number} is attached to cabinet ${host} and moves with it — drag ` +
          `cabinet ${host}, or type the panel's offsets in Panel design.`);
  }
}

function elevTags(grp) {
  return document.querySelectorAll(
    `#elevation .eplabel[data-cab="${grp.dataset.cab}"]`);
}

function finishElevDrag(d) {
  if (EDRAG === d) EDRAG = null;
  window.removeEventListener("pointermove", onElevDrag);
  window.removeEventListener("pointerup", endElevDrag);
  window.removeEventListener("pointercancel", endElevDrag);
  d.grp.classList.remove("dragging");
  d.grp.removeAttribute("transform");
  elevTags(d.grp).forEach((el) => el.removeAttribute("transform"));
  (d.hosted || []).forEach((el) => el.removeAttribute("transform"));
  const out = $("elevdrag");
  if (out) out.style.display = "none";
  if (!d.moved || (d.at.x === d.from.x && d.at.z === d.from.z)) { renderList(); return; }
  d.place.x = d.at.x;
  d.place.z = d.at.z;
  placesSig = null;            // the placements table shows the new numbers
  markDirty(true);
  compute();
}

/* ---------- zoom: wall elevation and plan --------------------------------
   The drawing is scaled by setting the SVG ELEMENT's CSS size. Its viewBox is
   left alone, so every conversion from a pointer to millimetres — elevPoint,
   svgPoint, the wall tracks, the .etrack mapping and the panels' fat hit areas
   — goes on reading getBoundingClientRect() against the same viewBox and comes
   out right at any zoom level. Scaling the viewBox instead, or a CSS transform
   on a wrapper, would each have needed that arithmetic changed in five places.

   Nothing here is a dimension: it is how big the picture is drawn.          */

S.zoom = {elevation: 1, plan: 1};
const ZOOM_MIN = 0.4, ZOOM_MAX = 6;

function applyZoom(id) {
  const box = $(id);
  const svg = box && box.querySelector("svg");
  const out = $(id === "plan" ? "planzoom" : "elevzoom");
  if (out) out.textContent = Math.round((S.zoom[id] || 1) * 100) + "%";
  if (!svg) return;
  const vb = svg.viewBox.baseVal;
  const w = (vb && vb.width) || svg.getBoundingClientRect().width;
  const h = (vb && vb.height) || svg.getBoundingClientRect().height;
  const z = S.zoom[id] || 1;
  svg.style.maxWidth = "none";
  svg.style.width = (w * z).toFixed(1) + "px";
  svg.style.height = (h * z).toFixed(1) + "px";
  // Zoomed in, the box scrolls rather than pushing the rest of the page down.
  box.style.maxHeight = z > 1 ? Math.round(h) + "px" : "";
}

function zoomAt(id, factor, evt) {
  const box = $(id);
  if (!box || !box.querySelector("svg")) return;
  const was = S.zoom[id] || 1;
  const z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, was * factor));
  if (z === was) return;
  // keep whatever is under the pointer under the pointer
  const r = box.getBoundingClientRect();
  const px = (evt ? evt.clientX - r.left : box.clientWidth / 2) + box.scrollLeft;
  const py = (evt ? evt.clientY - r.top : box.clientHeight / 2) + box.scrollTop;
  S.zoom[id] = z;
  applyZoom(id);
  box.scrollLeft += px * (z / was - 1);
  box.scrollTop += py * (z / was - 1);
}

function zoomReset(id) {
  S.zoom[id] = 1;
  applyZoom(id);
  $(id).scrollLeft = 0;
  $(id).scrollTop = 0;
}

// Ctrl+wheel zooms; a plain wheel is left alone and scrolls the page. A plain
// two-finger trackpad scroll arrives as a wheel event too, so zooming on every
// one of them hijacked ordinary scrolling. One check covers both gestures: a
// trackpad PINCH is reported as a wheel event with ctrlKey true — that is how
// Chrome, Firefox and Safari all report it — so pinch and an explicit
// Ctrl+scroll on a mouse come down the same path, and there is no separate
// pinch detection to keep working.
//
// Zoom speed (29 September 2026): one factor per gesture. A mouse notch
// (deltaY 100 in pixels) zooms by exp(100 x ZOOM_WHEEL) = 1.35, double the old
// step (0.0015, 1.16). A trackpad pinch arrives as MANY small ctrlKey wheel
// events in pixels, and Chromium sizes them so the page's own zoom is
// exp(-deltaY / 100) — so ZOOM_PINCH 0.01 makes the drawing follow the fingers
// one for one. Told apart by size: a wheel notch is 100 or 120, a pinch step a
// few pixels; a line-mode wheel (Firefox) is never a pinch.
const ZOOM_WHEEL = 0.003;
const ZOOM_PINCH = 0.01;

function isPinch(e) {
  return e.ctrlKey && e.deltaMode === 0 && Math.abs(e.deltaY) < 50;
}

for (const id of ["elevation", "plan"]) {
  $(id).addEventListener("wheel", (e) => {
    if (!e.ctrlKey) return;           // a plain scroll is the page's, untouched
    if (!$(id).querySelector("svg")) return;
    e.preventDefault();
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 100 : e.deltaY;
    zoomAt(id, Math.exp(-dy * (isPinch(e) ? ZOOM_PINCH : ZOOM_WHEEL)), e);
  }, {passive: false});
}

// − / 100% / + beside each drawing. The percentage is the way back: a viewer
// with no way out of a bad zoom level is worse than no zoom at all.
for (const [bar, id] of [["elevzoombar", "elevation"], ["planzoombar", "plan"]]) {
  $(bar).addEventListener("click", (e) => {
    const b = e.target.closest("[data-zoom]");
    if (!b) return;
    if (b.dataset.zoom === "reset") zoomReset(id);
    else zoomAt(id, +b.dataset.zoom, null);
  });
}

/* ---------- room --------------------------------------------------------- */

// Rebuild the form only when its shape changes, so typing in a wall field is
// not interrupted by the compute that the typing triggered.
let roomSig = null;

function renderRoom(force) {
  const rm = S.job.room;
  const sig = rm ? "r" + rm.walls.length : "none";
  if (!force && sig === roomSig) { renderClosure(); return; }
  roomSig = sig;

  if (!rm) {
    $("room").innerHTML = `<div class="empty">
      This job has no room. Cabinets are drawn side by side in list order.<br>
      <button id="roomadd" style="margin-top:10px">Add a room</button></div>`;
    return;
  }

  const walls = rm.walls.map((w, i) => `<tr>
    <td><input data-w="${i}" data-wk="id" value="${esc(w.id)}" style="width:46px"></td>
    <td><input type="number" step="1" data-w="${i}" data-wk="length" value="${w.length}"></td>
    <td><input type="number" step="1" data-w="${i}" data-wk="offset_start" value="${w.offset_start}"></td>
    <td><input type="number" step="1" data-w="${i}" data-wk="offset_end" value="${w.offset_end}"></td>
    <td class="n note">${w.openings.length || ""}</td>
    <td class="n note">${w.obstructions.length || ""}</td>
    <td><button data-wrm="${i}">×</button></td></tr>`).join("");

  $("room").innerHTML = `<div class="body">
    <div class="grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="f"><label>Name</label>
        <input data-r="name" value="${esc(rm.name)}"></div>
      <div class="f"><label>Ceiling</label>
        <input type="number" step="1" data-r="ceiling" placeholder="required — measure it"
               value="${rm.ceiling === null || rm.ceiling === undefined ? "" : rm.ceiling}"></div>
      <div class="f"><label>Offset depth</label>
        <input type="number" step="1" data-r="offset_depth" value="${rm.offset_depth}"></div>
      <div class="f"><label>Walls form a loop</label>
        <select data-r="closed">
          <option value="yes"${rm.closed ? " selected" : ""}>closed</option>
          <option value="no"${rm.closed ? "" : " selected"}>open run</option>
        </select></div>
    </div>
    <div id="closure" style="margin:12px 0"></div>
    <table class="rows"><thead><tr>
      <th>Wall</th><th>Length</th><th>Offset start</th><th>Offset end</th>
      <th class="n">Op</th><th class="n">Obs</th><th></th>
    </tr></thead><tbody>${walls}</tbody></table>
    <div style="margin-top:9px">
      <button data-walladd="start">+ Wall before ${esc(rm.walls.length ? rm.walls[0].id : "the first")}</button>
      <button data-walladd="end">+ Wall after ${esc(rm.walls.length ? rm.walls[rm.walls.length - 1].id : "the last")}</button>
      <button id="roomdel" style="float:right">Remove room</button>
    </div>
    <p class="note" style="margin-top:14px;max-width:64ch">
      Walls run clockwise, first to last. To build an L or a U run, set
      <b>open run</b> and add walls before the first or after the last — each new
      wall turns the corner at that end and starts square. A closed room is a
      loop, so a wall added to it shows as a miss until the shape closes again.
      <b>Offsets</b> are the deviation from square at each
      corner, measured ${rm.offset_depth} mm out from the wall face — zero is
      square, positive means the return wall opens away from the room. Each
      corner is measured twice, once from each wall; enter whichever you took,
      and the two are cross-checked. Openings and obstructions are carried in the
      job file and are not editable here yet.</p>
  </div>`;
  renderClosure();
}

function renderClosure() {
  const box = $("closure");
  if (!box) return;
  const info = S.res && S.res.room;
  if (!info) { box.innerHTML = ""; return; }
  const std = S.def.standard || {};
  const e = info.closure_error;
  let pill;
  if (!info.closed) pill = `<span class="pill ok">open run — nothing to close</span>`;
  else if (e > (std.closure_block || 20))
    pill = `<span class="pill crit">misses closing by ${e} mm — remeasure</span>`;
  else if (e > (std.closure_warn || 5))
    pill = `<span class="pill warn">misses closing by ${e} mm</span>`;
  else pill = `<span class="pill ok">walls close${e ? " within " + e + " mm" : ""}</span>`;
  box.innerHTML = `${pill} <span class="note">${info.walls.length} walls,
    ${info.placed} cabinet${info.placed === 1 ? "" : "s"} placed</span>`;
}

/* ---------- plan view ----------------------------------------------------- */

// Which layers are drawn SOLID. Base, wall, tall and panels each toggle on and
// off on their own (21 Sept 2026) — it used to be one radio, so choosing a layer
// meant giving up every other one at the same time. Everything not shown is
// ghosted, not hidden: that is the existing rule, and an overhead means nothing
// without the base run underneath it. Null until the first render fills it from
// the engine's layer list; the browser holds no list of its own.
S.layers = null;

// ISOLATE (21 September 2026). One item's number, or null. A cabinet given a
// wall can land underneath one that is already there — `room.free_x` only keeps
// it clear of its OWN run, so a new wall unit lands over the base run quite
// legitimately — and once it is under something there is nothing to click on.
// So it is reached from the LIST, not from the plan: clicking is exactly what
// does not work when the thing is hidden. Everything else is then ghosted, not
// hidden, which is the treatment the layer toggle already uses; one convention
// for "not the focus", not two. It overrides the layer toggle for this one item
// and changes the toggle for nothing else.
S.isolate = null;

// Selecting an item is what isolates it, wherever the selection was made — the
// list, the editor, or a press in the wall elevation. Never a click in the plan:
// see above. A newly added or duplicated cabinet comes through here too, which
// is all P3 needs — it is selected on creation, so it is isolated on creation.
// Selecting and isolating are separate for a click in a DRAWING (Part F, 23
// September 2026). From the list, Add, Duplicate and the 3D item list a
// selection still isolates — that is how a cabinet hidden under another is
// reached. From a click in the plan, a press in the elevation or a click in 3D
// it does not: an isolated view takes pointer events away from everything
// else, so clicking to select would leave nothing else clickable. While
// isolate is on, it follows the selection.
function selectCabinet(i, opts) {
  S.sel = i;
  const c = i === null ? null : S.job.cabinets[i];
  const number = c ? c.number : null;
  if (opts && opts.isolate === false) {
    if (S.isolate !== null) S.isolate = number;
  } else {
    S.isolate = number;
  }
  sync3D();
  markSelected();
}

// The 3D views follow the one selection; the 3D tab the one isolate too. The
// Cabinets tab's view redraws when the selection names another cabinet.
function sync3D() {
  if (V3C) {
    if (cabShown() !== S.cab3dShown) refreshCabScene();
    else V3C.select(selNumber());
  }
  if (!V3D) return;
  V3D.select(selNumber());
  V3D.isolate(S.isolate);
}

// The plan and the elevation show the selection too (F4): a class on the
// selected cabinet's group, so a drawing is never re-fetched for it.
function markSelected() {
  const n = selNumber();
  document.querySelectorAll("#plan .cab, #elevation .ecabg").forEach((el) => {
    el.classList.toggle("sel", n !== null && +el.dataset.cab === n);
  });
}

// "panels" is not one of room.LAYERS — those are the three CABINET layers, and
// layer_of is never asked about a panel. It is a fourth toggle over the top.
function planLayers() {
  if (S.layers === null) S.layers = allLayers();
  return S.layers;
}

function allLayers() {
  return (S.def.layers || []).concat(["panels"]);
}

function renderLayers() {
  const info = S.res && S.res.room;
  const box = $("layers");
  if (!info) { box.innerHTML = ""; return; }
  const on = planLayers();
  const names = {base: "Base", wall: "Wall", tall: "Tall", panels: "Panels"};
  // Ghosting on its own looks like a fault, so say what is going on and give it
  // a way out that is not "guess where the empty canvas is".
  const iso = S.isolate === null ? "" :
    `<button id="unisolate" class="on" title="show the whole room again"
      >isolating ${S.isolate} ×</button>`;
  box.innerHTML = iso + allLayers().map((k) => {
    const n = k === "panels" ? (info.panels || 0) : (info.layers[k] || 0);
    return `<button data-layer="${esc(k)}" class="${on.indexOf(k) >= 0 ? "on" : ""}">${
      esc(names[k] || k)} ${n}</button>`;
  }).join("");
}

// A selection made on the Cabinets tab changes what the plan isolates, but the
// plan is not on screen there — so it is redrawn only when it is being looked
// at. Switching to the Room tab renders it anyway, and reads S.isolate then.
function refreshPlan() {
  if (S.tab === "room" && S.roomSub === "plan") renderPlan();
}

async function renderPlan() {
  const rm = S.job.room;
  if (!rm) {
    $("plan").innerHTML = `<div class="empty">No room yet — add one below.</div>`;
    $("layers").innerHTML = "";
    return;
  }
  renderLayers();
  const show = planLayers();
  const ghost = allLayers().filter((l) => show.indexOf(l) < 0);
  const r = await post("/api/plan", {job: S.job, show: show, ghost: ghost,
                                     isolate: S.isolate});
  if (!r.ok) { toast(r.error, true); return; }
  // A number the job no longer carries isolates nothing; the engine says so and
  // the pill catches up rather than naming a cabinet that has been deleted.
  if (r.isolate !== S.isolate) { S.isolate = r.isolate; renderLayers(); }
  const un = (S.res && S.res.room && S.res.room.unplaced) || [];
  $("plan").innerHTML = r.svg
    + `<div id="dragreadout"></div>`
    + (un.length ? `<div class="note" style="padding:6px 2px">
        Not placed, so not drawn: ${un.join(", ")}</div>` : "");
  applyZoom("plan");
  markSelected();
}

/* ---------- drag placement ------------------------------------------------
   The engine hands over every position this drag is allowed to settle on, and
   the wall tracks to project the pointer onto. Nothing here works out a
   dimension of its own: it picks the nearest candidate the server supplied, and
   on drop the whole job is recomputed server-side, so the cut list is always
   the engine's answer rather than the interface's.                          */

let DRAG = null;

function tracks() {
  return [...document.querySelectorAll("#plan .track")].map((t) => {
    const x1 = +t.getAttribute("x1"), y1 = +t.getAttribute("y1");
    const x2 = +t.getAttribute("x2"), y2 = +t.getAttribute("y2");
    return {wall: t.dataset.wall, len: +t.dataset.len,
            x1: x1, y1: y1, dx: x2 - x1, dy: y2 - y1,
            nx: +t.dataset.nx || 0, ny: +t.dataset.ny || 0};
  });
}

// How far a point stands off a wall INTO THE ROOM, in mm — the engine's normal
// for that wall, read off the drawing. Only a panel's drag asks: its y.
function offWall(track, px, py) {
  const len = Math.hypot(track.dx, track.dy);
  if (!len) return 0;
  return ((px - track.x1) * track.nx + (py - track.y1) * track.ny) * track.len / len;
}

// Where a point falls along a wall: how far along it in mm, and how far off it.
function project(track, px, py) {
  const sq = track.dx * track.dx + track.dy * track.dy;
  if (!sq) return null;
  let t = ((px - track.x1) * track.dx + (py - track.y1) * track.dy) / sq;
  const offX = track.x1 + t * track.dx - px;
  const offY = track.y1 + t * track.dy - py;
  return {mm: Math.round(Math.max(0, Math.min(1, t)) * track.len),
          away: Math.hypot(offX, offY),
          pxPerMm: Math.sqrt(sq) / track.len};
}

function svgPoint(evt) {
  const svg = document.querySelector("#plan svg");
  const r = svg.getBoundingClientRect();
  return {x: (evt.clientX - r.left) * (svg.viewBox.baseVal.width || r.width) / r.width,
          y: (evt.clientY - r.top) * (svg.viewBox.baseVal.height || r.height) / r.height,
          svg: svg, rect: r};
}

$("plan").addEventListener("pointerdown", async (e) => {
  const poly = e.target.closest(".cab");
  // Empty canvas — a wall line, a gap, the paper — is how you get the room back.
  if (!poly && S.isolate !== null) { S.isolate = null; renderPlan(); return; }
  if (!poly || !S.job.room) return;
  const number = +poly.dataset.cab;
  if (S.isolate !== null) {
    // Isolated: that one item is the only thing that moves, and it moves
    // whatever its layer is doing — which is the whole point of isolating it.
    if (number !== S.isolate) return;
  } else if (planLayers().indexOf(poly.dataset.layer) < 0) {
    // A ghosted layer is not draggable: a wall unit moves only while its own
    // layer is one of the ones being shown solid.
    return;
  }
  const p = places().find((x) => x.cabinet === number);
  if (!p) { attachedPress(number); return; }

  // Everything that has to happen on the press happens now, before the snap
  // model is fetched: the wall tracks read off the drawing as it stands, the
  // drawing stopped from selecting its own text, and the release listened for.
  // Waiting for the reply first meant a quick drag could let go before anything
  // was listening, and the cabinet then stuck to the pointer — the same fault
  // the elevation drag was cured of, and the same cure.
  e.preventDefault();
  // A PANEL moves along its wall and off it (22 September 2026): its drawn
  // footprint and its grab area both carry data-panel, and both move together.
  const panel = !!poly.dataset.panel;
  const shapes = panel
    ? [...document.querySelectorAll(`#plan [data-panel="${number}"]`)] : [poly];
  const d = {model: null, poly: poly, shapes: shapes, panel: panel, place: p,
             from: {wall: p.wall, x: p.x, y: p.y || 0}, at: {x: p.x, y: p.y || 0},
             tracks: tracks(), moved: false, last: null, released: false,
             grab: null, grabY: 0,
             // the panels attached to it move with it on screen (preview only)
             hosted: [...document.querySelectorAll(`#plan [data-host="${number}"]`)]};
  // Where along the cabinet it was grabbed, so it does not jump to put its
  // middle under the pointer — the elevation drag's rule, read off the same
  // track the drag projects onto. Null until known; the middle is the fallback.
  // A panel keeps how far off its back it was grabbed, for the same reason.
  const own = d.tracks.find((t) => t.wall === p.wall);
  const sp = svgPoint(e);
  const at = own && project(own, sp.x, sp.y);
  if (at) d.grab = at.mm - p.x;
  if (own && panel) d.grabY = offWall(own, sp.x, sp.y) - (p.y || 0);
  DRAG = d;
  shapes.forEach((el) => el.classList.add("dragging"));
  // On the window, not the element: a drag that runs off the plan must still
  // finish rather than stick to the pointer.
  window.addEventListener("pointermove", onDragMove);
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);

  const model = await post("/api/drag", {job: S.job, cabinet: number});
  if (DRAG !== d && !d.released) return;        // superseded by a newer press
  if (!model.ok) { toast(model.error, true); d.moved = false; finishDrag(d); return; }
  d.model = model;
  // Replay what happened while the model was on its way: the last position the
  // pointer reached, and the release if it has already come.
  if (d.last) moveDrag(d, d.last);
  if (d.released) finishDrag(d);
});

function onDragMove(e) {
  const d = DRAG;
  if (!d) return;
  // Before the snap model has arrived there is nothing to snap to: keep where
  // the pointer is, and move there as soon as it comes.
  if (!d.model) { d.last = {clientX: e.clientX, clientY: e.clientY}; return; }
  moveDrag(d, e);
}

function moveDrag(d, e) {
  if (d.panel) { movePanelDrag(d, e); return; }
  const DRAG = d;                          // this drag, whatever the global says now
  const pt = svgPoint(e);
  let best = null;
  for (const t of DRAG.tracks) {
    const pr = project(t, pt.x, pt.y);
    if (pr && (best === null || pr.away < best.pr.away)) best = {t: t, pr: pr};
  }
  if (!best) return;

  const wall = DRAG.model.walls[best.t.wall];
  if (!wall) return;
  const grab = DRAG.grab !== null && DRAG.grab >= 0 && DRAG.grab <= DRAG.model.width
    ? DRAG.grab : DRAG.model.width / 2;
  let x = Math.max(0, Math.min(Math.round(best.pr.mm - grab), wall.max_x));
  // The NEAREST candidate within tolerance, not the first one found — the
  // elevation's rule since 21 September 2026, and now the plan's too.
  let why = "", pick = null, near = DRAG.model.tolerance + 1;
  for (const s of wall.snaps) {
    const off = Math.abs(s.x - x);
    if (off < near) { near = off; pick = s; }
  }
  if (pick) { x = pick.x; why = pick.why; }

  DRAG.moved = true;
  DRAG.place.wall = best.t.wall;
  DRAG.place.x = x;

  // Preview only — slide the drawn shape along the wall it now belongs to.
  const shift = (x - DRAG.from.x) * best.pr.pxPerMm;
  const unit = Math.hypot(best.t.dx, best.t.dy) || 1;
  if (best.t.wall === DRAG.from.wall) {
    const tr = `translate(${best.t.dx / unit * shift} ${best.t.dy / unit * shift})`;
    DRAG.poly.setAttribute("transform", tr);
    (DRAG.hosted || []).forEach((el) => el.setAttribute("transform", tr));
  } else {
    DRAG.poly.setAttribute("opacity", "0.35");
    (DRAG.hosted || []).forEach((el) => el.setAttribute("opacity", "0.35"));
  }

  const out = $("dragreadout");
  if (out) {
    out.style.display = "block";
    out.style.left = (e.clientX - pt.rect.left + 14) + "px";
    out.style.top = (e.clientY - pt.rect.top + 14) + "px";
    out.textContent = `wall ${best.t.wall} · ${x} mm` + (why ? ` · ${why}` : "");
  }
}

// A panel in the plan: along its OWN wall and off it, never onto another wall
// and never up or down — its z is the elevation's business. Both axes pick the
// nearest candidate the engine named (`snaps`, `y_snaps`), within tolerance.
function movePanelDrag(d, e) {
  const t = d.tracks.find((k) => k.wall === d.from.wall);
  const wall = t && d.model.walls[t.wall];
  if (!wall) return;
  const pt = svgPoint(e);
  const pr = project(t, pt.x, pt.y);
  if (!pr) return;
  const tol = d.model.tolerance;
  const grab = d.grab !== null && d.grab >= 0 && d.grab <= d.model.width
    ? d.grab : d.model.width / 2;
  let x = Math.max(0, Math.min(Math.round(pr.mm - grab), wall.max_x));
  let why = "", pick = null, near = tol + 1;
  for (const sn of wall.snaps) {
    const off = Math.abs(sn.x - x);
    if (off < near) { near = off; pick = sn; }
  }
  if (pick) { x = pick.x; why = pick.why; }

  let y = Math.max(0, Math.round(offWall(t, pt.x, pt.y) - d.grabY));
  // Several faces can share one depth — a run of base units all 570 deep. The
  // one nearest along the wall at the panel's LIVE position is the one named,
  // the elevation's tie-break; it picks between candidates, it invents none.
  const w = d.model.width;
  const away = (sn) => sn.x0 === null || sn.x0 === undefined ? 0
    : Math.max(0, sn.x0 - (x + w), x - sn.x1);
  let whyY = "", yPick = null, yNear = tol + 1, yAway = 0;
  for (const sn of (wall.y_snaps || [])) {
    const off = Math.abs(sn.y - y), gap = away(sn);
    if (off < yNear || (off === yNear && gap < yAway)) { yNear = off; yAway = gap; yPick = sn; }
  }
  if (yPick) { y = yPick.y; whyY = yPick.why; }

  d.moved = true;
  d.at = {x: x, y: y};
  const unit = Math.hypot(t.dx, t.dy) || 1;
  const along = (x - d.from.x) * pr.pxPerMm, off = (y - d.from.y) * pr.pxPerMm;
  const tx = t.dx / unit * along + t.nx * off, ty = t.dy / unit * along + t.ny * off;
  d.shapes.forEach((el) => el.setAttribute("transform",
    `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`));

  const out = $("dragreadout");
  if (out) {
    out.style.display = "block";
    out.style.left = (e.clientX - pt.rect.left + 14) + "px";
    out.style.top = (e.clientY - pt.rect.top + 14) + "px";
    out.textContent = `panel ${d.place.cabinet} · wall ${t.wall} · ${x} mm` +
      (why ? ` (${why})` : "") + ` · ${y} mm off the wall` + (whyY ? ` (${whyY})` : "");
  }
}

function endDrag() {
  const d = DRAG;
  if (!d) return;
  window.removeEventListener("pointermove", onDragMove);
  window.removeEventListener("pointerup", endDrag);
  window.removeEventListener("pointercancel", endDrag);
  // Let go before the snap model arrived: the press handler finishes it, with
  // the last position replayed, once the model is here.
  if (!d.model) { d.released = true; return; }
  finishDrag(d);
}

function finishDrag(d) {
  if (DRAG === d) DRAG = null;
  window.removeEventListener("pointermove", onDragMove);
  window.removeEventListener("pointerup", endDrag);
  window.removeEventListener("pointercancel", endDrag);
  (d.shapes || [d.poly]).concat(d.hosted || []).forEach((el) => {
    el.classList.remove("dragging");
    el.removeAttribute("transform");
    el.removeAttribute("opacity");
  });
  const out = $("dragreadout");
  if (out) out.style.display = "none";
  // A press and release without moving is a CLICK, and a click in the plan
  // selects — without isolating (F4, 23 September 2026). A drag selects what
  // it dragged, the same way.
  const idx = S.job.cabinets.findIndex((x) => x.number === d.place.cabinet);
  if (idx >= 0 && idx !== S.sel) { selectCabinet(idx, {isolate: false}); renderList(); }
  if (!d.moved) return;
  if (d.panel) {
    // Only the placement moves: x along the wall and y off it. z, the wall and
    // every dimension stay exactly as they were.
    if (d.at.x === d.from.x && d.at.y === d.from.y) return;
    d.place.x = d.at.x;
    d.place.y = d.at.y;
    placesSig = null;            // the placements table shows the new numbers
    markDirty(true);
    compute();
    return;
  }
  if (d.place.wall !== d.from.wall) placesSig = null;   // the table's shape changed
  markDirty(true);
  compute();
}

// Door swings and drawer pull-outs are already in the SVG, hidden. Hovering a
// cabinet just reveals its own.
$("plan").addEventListener("pointerover", (e) => {
  const poly = e.target.closest(".cab");
  document.querySelectorAll("#plan .front").forEach((g) => {
    g.style.opacity = (poly && g.dataset.front === poly.dataset.cab) ? "1" : "0";
  });
});

$("layers").addEventListener("click", (e) => {
  if (e.target.closest("#unisolate")) { S.isolate = null; renderPlan(); return; }
  const b = e.target.closest("[data-layer]");
  if (!b) return;
  const on = planLayers();
  const i = on.indexOf(b.dataset.layer);
  if (i >= 0) on.splice(i, 1); else on.push(b.dataset.layer);
  renderPlan();
  if (V3D) V3D.setLayers(planLayers());    // one toggle: the 3D view follows it
});

/* ---------- placing from the list of unplaced items -------------------------
   UI restructure (28 September 2026; reverses the 21 September "not needed").
   Room -> Plan, Room -> Elevation and the 3D tab each carry a slim list of the
   cabinets and standalone panels with no placement — never an attached panel,
   which stands where its cabinet puts it. Drag one onto a wall to place it.
   The same bargain as every drag: one /api/drag on the press (listening before
   it lands), the pointer projected onto a wall, the NEAREST snap the engine
   named within tolerance, and on the drop a placement written and the whole
   job recomputed — overlaps, clashes and the rest are the engine's answer.
   It lands where it is released, snapped. The Placements table's wall picker,
   which lands an item clear of its neighbours (E8), is still there. */

function unplacedItems() {
  return S.job.cabinets.filter((c) => attachedTo(c) === null &&
    !places().some((p) => p.cabinet === c.number));
}

function renderUnplaced() {
  const rm = S.job.room;
  const items = rm && rm.walls.length ? unplacedItems() : [];
  const html = items.length
    ? `<span>Not placed — drag one onto a wall:</span>` + items.map((c) =>
        `<span class="upchip" data-up="${c.number}" title="drag onto a wall to place ${c.number}">${
          c.number} · ${esc(c.kind === "panel" ? "panel" : c.kind)}</span>`).join("")
    : "";
  ["unplaced-room", "unplaced-3d"].forEach((id) => {
    const box = $(id);
    if (box && box.innerHTML !== html) box.innerHTML = html;
  });
}

let UDRAG = null;

document.addEventListener("pointerdown", (e) => {
  const chip = e.target.closest(".upchip");
  if (!chip || e.button !== 0) return;
  e.preventDefault();
  const number = +chip.dataset.up;
  const d = {number: number, model: null, last: null, released: false, at: null};
  UDRAG = d;
  window.addEventListener("pointermove", onUpMove);
  window.addEventListener("pointerup", onUpEnd);
  window.addEventListener("pointercancel", onUpCancel);
  const tag = $("updrag");
  tag.textContent = `${number}`;
  tag.style.display = "block";
  tag.style.left = (e.clientX + 12) + "px";
  tag.style.top = (e.clientY + 12) + "px";
  post("/api/drag", {job: S.job, cabinet: number}).then((model) => {
    if (UDRAG !== d && !d.released) return;
    if (!model.ok) { toast(model.error, true); endUp(d, true); return; }
    d.model = model;
    if (d.last) moveUp(d, d.last);
    if (d.released) endUp(d, false);
  });
});

function onUpMove(e) {
  const d = UDRAG;
  if (!d) return;
  const tag = $("updrag");
  tag.style.left = (e.clientX + 12) + "px";
  tag.style.top = (e.clientY + 12) + "px";
  if (!d.model) { d.last = {clientX: e.clientX, clientY: e.clientY}; return; }
  moveUp(d, e);
}

function inside(el, e) {
  if (!el) return false;
  const r = el.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
}

// Where the item would land with the pointer here, or null over nothing that
// takes it: the plan (x along the nearest wall, z 0 as the table puts it), the
// wall elevation (x and the underside, the elevation's snapping), or the 3D
// view (the wall under the cursor, or the nearest to the floor under it).
function upTarget(d, e) {
  const m = d.model;
  const planSvg = document.querySelector("#plan svg");
  if (S.tab === "room" && S.roomSub === "plan" && inside(planSvg, e)) {
    const pt = svgPoint(e);
    let best = null;
    for (const t of tracks()) {
      const pr = project(t, pt.x, pt.y);
      if (pr && (best === null || pr.away < best.pr.away)) best = {t: t, pr: pr};
    }
    const wall = best && m.walls[best.t.wall];
    if (!wall) return null;
    let x = Math.max(0, Math.min(Math.round(best.pr.mm - m.width / 2), wall.max_x));
    let why = "", pick = null, near = m.tolerance + 1;
    for (const sn of wall.snaps) {
      const off = Math.abs(sn.x - x);
      if (off < near) { near = off; pick = sn; }
    }
    if (pick) { x = pick.x; why = pick.why; }
    return {wall: best.t.wall, x: x, z: 0, why: why, whyZ: ""};
  }
  const elevSvg = document.querySelector("#elevation svg");
  const t = elevTrack();
  if (S.tab === "room" && S.roomSub === "elev" && t && inside(elevSvg, e)) {
    const wall = m.walls[t.wall];
    if (!wall) return null;
    const pt = elevPoint(t.svg, e);
    // held by its middle, as a drag from nothing has no grab point of its own;
    // the pointer gives the underside, exactly as in the elevation's own drag
    const at = elevSnap(m, wall, Math.round((pt.x - t.x0) / t.scale - m.width / 2),
                        Math.round((t.y0 - pt.y) / t.scale - m.height / 2));
    return Object.assign({wall: t.wall}, at);
  }
  if (S.tab === "view3d" && V3D && inside($("v3dview"), e)) {
    const hit = V3D.wallAt(e.clientX, e.clientY);
    const wall = hit && m.walls[hit.wall];
    if (!wall) return null;
    // over a wall, held by its middle at the point under the cursor; over
    // the floor, standing on it
    const at = elevSnap(m, wall, Math.round(hit.along - m.width / 2),
                        hit.floor ? 0 : Math.round(hit.up - m.height / 2));
    return Object.assign({wall: hit.wall}, at);
  }
  return null;
}

function moveUp(d, e) {
  d.at = upTarget(d, e);
  const a = d.at;
  $("updrag").textContent = a
    ? `${d.number} → wall ${a.wall} · ${a.x} mm` + (a.why ? ` (${a.why})` : "") +
      (S.roomSub === "elev" || S.tab === "view3d"
        ? ` · ${a.z === 0 ? "on the floor" : a.z + " mm up"}` + (a.whyZ && a.z ? ` (${a.whyZ})` : "")
        : "")
    : `${d.number} — drop it on a wall`;
}

function onUpEnd(e) {
  const d = UDRAG;
  if (!d) return;
  if (!d.model) { d.last = {clientX: e.clientX, clientY: e.clientY}; d.released = true; return; }
  moveUp(d, e);
  endUp(d, false);
}

function onUpCancel() {
  const d = UDRAG;
  if (d) endUp(d, true);
}

function endUp(d, cancelled) {
  if (UDRAG === d) UDRAG = null;
  window.removeEventListener("pointermove", onUpMove);
  window.removeEventListener("pointerup", onUpEnd);
  window.removeEventListener("pointercancel", onUpCancel);
  $("updrag").style.display = "none";
  if (cancelled || !d.at) return;
  if (places().some((p) => p.cabinet === d.number)) return;     // placed meanwhile
  places().push({cabinet: d.number, wall: d.at.wall, x: d.at.x, z: d.at.z, y: 0,
                 flip: false, layer: null});
  const cc = S.job.cabinets.find((c) => c.number === d.number);
  if (cc) cornerFollowUp(cc, "corner_unit");   // a corner unit goes into its corner
  placesSig = null;
  const i = S.job.cabinets.findIndex((c) => c.number === d.number);
  if (i >= 0) selectCabinet(i, {isolate: false});
  toast(`${d.number} placed on wall ${d.at.wall} at ${d.at.x} mm` +
        (d.at.z ? `, ${d.at.z} mm up` : "") + (d.at.why ? ` (${d.at.why})` : "") + ".");
  markDirty(true);
  compute();
}

/* ---------- placements ---------------------------------------------------- */

// Same discipline as the other forms: rebuild only when the shape changes, so
// typing an X does not pull the caret out of the field that triggered it.
let placesSig = null;

function renderPlaces(force) {
  const rm = S.job.room;
  const sig = !rm ? "none"
    // the kind is in the signature because Y is a panel's field: an item turned
    // into a panel has to get its Y cell, and one turned back has to lose it
    : S.job.cabinets.map((c) => c.number + (c.kind === "panel" ? "p" : "") +
                                (attachedTo(c) !== null ? "a" + attachedTo(c) : "")).join(",") + "|" +
      places().map((p) => p.cabinet + p.wall).join(",") + "|" +
      rm.walls.map((w) => w.id).join(",");
  if (!force && sig === placesSig) { refreshLayerCells(); return; }
  placesSig = sig;

  if (!rm) { $("places").innerHTML = `<div class="empty">No room.</div>`; return; }
  if (!S.job.cabinets.length) {
    $("places").innerHTML = `<div class="empty">No cabinets to place.</div>`;
    return;
  }
  const wallOpts = rm.walls.map((w) => w.id);
  const rows = S.job.cabinets.map((c) => {
    const i = places().findIndex((p) => p.cabinet === c.number);
    const p = i < 0 ? null : places()[i];
    // Y is a PANEL's field. A carcass sits against the wall it is placed on, so
    // its Y is 0 and the cell is not offered — the table cannot put a cabinet
    // off its own wall.
    const pan = c.kind === "panel";
    const host = attachedTo(c);
    if (host !== null) {
      // where its cabinet puts it — the engine's figures, read back, and not
      // editable here: the offsets are typed in Panel design
      const g = S.res && S.res.geometry && S.res.geometry[String(c.number)];
      const at = g && g.panel && g.panel.placed_at;
      return `<tr data-cab="${c.number}">
        <td class="n">${c.number} <span class="note">pnl</span></td>
        <td><span class="note">with ${host}</span></td>
        <td><input type="number" value="${at ? at.x : ""}" disabled title="moves with cabinet ${host}"></td>
        <td><input type="number" value="${at ? at.z : ""}" disabled title="moves with cabinet ${host}"></td>
        <td><input type="number" value="${at ? at.y : ""}" disabled title="moves with cabinet ${host}"></td>
        <td class="note">attached to ${host}</td>
      </tr>`;
    }
    return `<tr data-cab="${c.number}">
      <td class="n">${c.number}${pan ? ' <span class="note">pnl</span>' : ""}</td>
      <td><select data-p="${c.number}" data-pk="wall">
        <option value="">—</option>
        ${wallOpts.map((w) => `<option${p && p.wall === w ? " selected" : ""}>${esc(w)}</option>`).join("")}
      </select></td>
      <td><input type="number" step="1" data-p="${c.number}" data-pk="x"
           value="${p ? p.x : ""}" ${p ? "" : "disabled"}></td>
      <td><input type="number" step="1" data-p="${c.number}" data-pk="z"
           value="${p ? p.z : ""}" ${p ? "" : "disabled"}></td>
      <td><input type="number" step="1" data-p="${c.number}" data-pk="y"
           value="${p && pan ? (p.y || 0) : ""}" ${p && pan ? "" : "disabled"}
           title="${pan ? "out from the wall face to the panel's back"
                        : "a cabinet is against its wall"}"></td>
      <td class="note">${esc(placedLayer(c.number))}</td>
    </tr>`;
  }).join("");
  $("places").innerHTML = `<div class="body">
    <table class="rows"><thead><tr>
      <th class="n">Item</th><th>Wall</th><th>X</th><th>Z</th><th>Y</th><th>Layer</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <p class="note" style="margin-top:10px">
      X is from the wall's start corner to the item's left edge, facing the
      wall. Z is 0 for anything standing on the floor — it stands on its legs,
      which the engine allows for, plinth board or not. Set Z only for a hung
      unit, to its underside; a panel stands on no legs, so its Z is its
      underside exactly as typed. Layer is read from the cabinet's kind and its
      Z. Pick a wall to place an item, or “—” to take it out; it lands clear of
      whatever is already on that wall.</p>
    <p class="note">
      Y is out from the wall face to the back of an independent PANEL — 0 is
      flush against the wall, and it is what puts a bulkhead underside out over
      the units below it. A cabinet is against its wall, so it has no Y.
      A panel attached to a cabinet stands where the cabinet puts it: its
      offsets are typed in Panel design, and it moves with the cabinet.</p>
  </div>`;
}

// A cabinet's layer changes when its Z does, so that one cell refreshes in place.
function refreshLayerCells() {
  document.querySelectorAll("#places tr[data-cab]").forEach((tr) => {
    tr.lastElementChild.textContent = placedLayer(+tr.dataset.cab);
  });
}

// The layer is derived by the engine and read back, never worked out here.
function placedLayer(number) {
  const layers = (S.res && S.res.room && S.res.room.placements) || {};
  const p = layers[String(number)];
  return p ? (p.layer + (p.override ? " (set)" : "")) : "";
}

$("places").addEventListener("input", async (e) => {
  const num = e.target.dataset.p;
  if (num === undefined) return;
  const n = +num;
  const pk = e.target.dataset.pk;
  const i = places().findIndex((p) => p.cabinet === n);
  if (pk === "wall") {
    if (!e.target.value) {
      if (i >= 0) places().splice(i, 1);
      renderPlaces(true);
    } else if (i >= 0) {
      places()[i].wall = e.target.value;
      const cc = S.job.cabinets.find((c) => c.number === n);
      if (cc) cornerFollowUp(cc, "corner_unit");   // a corner unit goes into a corner
      renderPlaces(true);
    } else {
      // A NEW placement. Where it goes is the engine's answer, not 0 mm: at 0 it
      // landed on top of whatever was already at the start of that wall and out
      // of sight underneath it. `free_x` comes off the same candidates the drag
      // reads, so nothing is worked out here.
      const place = {cabinet: n, wall: e.target.value, x: 0, z: 0, y: 0,
                     flip: false, layer: null};
      places().push(place);
      renderPlaces(true);
      const model = await post("/api/drag", {job: S.job, cabinet: n});
      const w = model.ok && model.walls[place.wall];
      if (w && places().indexOf(place) >= 0) {
        place.x = w.free_x;
        const cc = S.job.cabinets.find((c) => c.number === n);
        if (cc) cornerFollowUp(cc, "corner_unit");   // ...unless it is a corner unit
        renderPlaces(true);
      }
    }
  } else if (i >= 0) {
    // Y is a panel's field, and the cell is disabled on a cabinet row — this is
    // the second lock, so nothing can put a carcass off its own wall.
    if (pk === "y" && S.job.cabinets.some((c) => c.number === n && c.kind !== "panel")) {
      return;
    }
    places()[i][pk] = parseInt(e.target.value, 10) || 0;
  }
  schedule();
});

// A fresh room, from the Walls card's "Add a room" or the Elevation's prompt.
async function addRoom() {
  const r = await post("/api/room-new", {name: S.job.name});
  if (!r.ok) { toast(r.error, true); return; }
  S.job.room = r.room;
  places();
  renderRoom(true); schedule();
}

$("room").addEventListener("click", async (e) => {
  if (e.target.id === "roomadd") { await addRoom(); return; }
  if (e.target.id === "roomdel") {
    S.job.room = null;
    S.job.placements = [];
    renderRoom(true); schedule();
    return;
  }
  const end = e.target.closest("[data-walladd]");
  if (end) {
    // the engine adds and names the wall, the same way it built the room
    const r = await post("/api/room-extend", {room: S.job.room, at: end.dataset.walladd});
    if (!r.ok) { toast(r.error, true); return; }
    S.job.room = r.room;
    renderRoom(true); schedule();
    return;
  }
  const rm = e.target.closest("[data-wrm]");
  if (rm) {
    S.job.room.walls.splice(+rm.dataset.wrm, 1);
    renderRoom(true); schedule();
  }
});

$("room").addEventListener("input", (e) => {
  const rm = S.job.room;
  if (!rm) return;
  const rk = e.target.dataset.r;
  if (rk) {
    rm[rk] = rk === "name" ? e.target.value
      : rk === "closed" ? e.target.value === "yes"
      // blank is "not measured", never 0 — the validator blocks on it until it is
      : rk === "ceiling" ? (e.target.value === "" ? null : (parseInt(e.target.value, 10) || null))
      : (parseInt(e.target.value, 10) || 0);
    schedule();
    return;
  }
  const i = e.target.dataset.w;
  if (i === undefined) return;
  const wk = e.target.dataset.wk;
  rm.walls[+i][wk] = wk === "id" ? e.target.value
    : (parseInt(e.target.value, 10) || 0);
  schedule();
});

/* ---------- gaps ---------------------------------------------------------- */

const GAP_KEY = (g) => [g.wall, g.layer, g.after, g.before].join("|");
const SUGGEST = {filler: "fit a filler", grow: "grow a cabinet",
                 cabinet: "add a cabinet or a blind corner"};

let gapsSig = null;

function renderGaps(force) {
  const info = S.res && S.res.room;
  if (!info) { $("gaps").innerHTML = `<div class="empty">No room.</div>`; gapsSig = null; return; }
  const list = info.gaps || [];
  if (!list.length) {
    $("gaps").innerHTML = `<div class="empty">No gaps — every run meets its corners.</div>`;
    gapsSig = "empty";
    return;
  }
  const sig = list.map((g) => GAP_KEY(g) + ":" + g.width + ":" + g.treatment).join(";");
  if (!force && sig === gapsSig) return;
  gapsSig = sig;

  const rows = list.map((g) => {
    const between = (g.after === null ? "wall start" : "cab " + g.after) + " → " +
                    (g.before === null ? "wall end" : "cab " + g.before);
    const taper = g.taper
      ? `<span class="pill warn">tapers ${g.taper}</span>` : "";
    const chosen = g.treatment || "";
    return `<tr class="${chosen ? "" : "hasissue"}">
      <td>${esc(g.wall)}</td><td>${esc(g.layer)}</td><td>${esc(between)}</td>
      <td class="n">${g.width}</td>
      <td class="n note">${g.nominal}→${g.front}</td>
      <td>${taper}</td>
      <td class="note">${esc(SUGGEST[g.proposal] || g.proposal)}</td>
      <td><select data-gap="${esc(GAP_KEY(g))}">
        <option value=""${chosen ? "" : " selected"}>— undecided —</option>
        <option value="filler"${chosen === "filler" ? " selected" : ""}>filler</option>
        <option value="blind"${chosen === "blind" ? " selected" : ""}>blind corner</option>
        <option value="open"${chosen === "open" ? " selected" : ""}>leave open</option>
      </select></td>
      <td class="n note">${chosen === "filler" ? g.filler_width + " cut" : ""}</td>
    </tr>`;
  }).join("");

  const undecided = list.filter((g) => !g.treatment).length;
  $("gaps").innerHTML = `
    <div class="matline" style="border-bottom:1px solid var(--line)">
      ${undecided ? `<span class="pill crit">${undecided} undecided</span>`
                  : `<span class="pill ok">every gap ruled on</span>`}
      <span class="note">The app suggests; it never fits a filler on its own.</span>
    </div>
    <div class="scroll"><table><thead><tr>
      <th>Wall</th><th>Layer</th><th>Between</th><th class="n">Widest</th>
      <th class="n">Back→front</th><th></th><th>Suggestion</th>
      <th>Treatment</th><th class="n">Panel</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note" style="padding:8px 12px 12px">
      A filler ships as a rectangle at the gap's widest point plus a
      ${(S.def.standard || {}).scribe_allowance} mm scribe allowance, trimmed on
      site — the beam saw cuts edge to edge and cannot make a taper.</p>`;
}

$("gaps").addEventListener("input", (e) => {
  const key = e.target.dataset.gap;
  if (key === undefined) return;
  const [wall, layer, after, before] = key.split("|");
  const num = (v) => (v === "null" ? null : parseInt(v, 10));
  const match = (g) => g.wall === wall && g.layer === layer &&
                       g.after === num(after) && g.before === num(before);
  const i = S.job.gaps.findIndex(match);
  if (!e.target.value) {
    if (i >= 0) S.job.gaps.splice(i, 1);
  } else if (i < 0) {
    S.job.gaps.push({wall: wall, after: num(after), before: num(before),
                     layer: layer, treatment: e.target.value, note: ""});
  } else {
    S.job.gaps[i].treatment = e.target.value;
  }
  schedule();
});

/* ---------- plinth -------------------------------------------------------- */

let plinthSig = null;

function renderPlinth(force) {
  const info = S.res && S.res.room;
  if (!info) { $("plinth").innerHTML = `<div class="empty">No room.</div>`;
               plinthSig = null; return; }
  const list = (info.runs || []).filter((r) => r.on_floor);
  if (!list.length) {
    $("plinth").innerHTML = `<div class="empty">No runs on the floor to plinth.</div>`;
    plinthSig = "empty";
    return;
  }
  const sig = list.map((r) => [r.wall, r.layer, r.first, r.length, r.fitted,
                               r.boards.join("/")].join(":")).join(";");
  if (!force && sig === plinthSig) return;
  plinthSig = sig;

  const std = S.def.standard || {};
  const rows = list.map((r) => `<tr>
    <td>${esc(r.wall)}</td>
    <td class="note">${r.cabinets[0]}–${r.cabinets[r.cabinets.length - 1]}</td>
    <td class="n">${r.length}</td>
    <td><input type="checkbox" data-run="${esc([r.wall, r.layer, r.first].join("|"))}"
         ${r.fitted ? "checked" : ""} style="width:auto"></td>
    <td class="n note">${r.boards.length ? r.boards.join(" + ") : ""}</td>
  </tr>`).join("");

  $("plinth").innerHTML = `<div class="body">
    <table class="rows"><thead><tr>
      <th>Wall</th><th>Cabinets</th><th class="n">Run</th><th>Plinth</th>
      <th class="n">Boards</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <p class="note" style="margin-top:10px">
      A ${std.leg_height} mm board to cover the legs, set back
      ${std.plinth_setback} mm behind the door face. Every standing carcass is on
      legs (${std.leg_min}–${std.leg_max} mm) whether or not a board is fitted —
      the board is the operator's choice per run, and it moves no height. Carcass
      board, banded both long edges to seal it at floor level. A run over
      ${std.sheet_l} mm splits at a cabinet division, and internal corners butt.</p>
  </div>`;
}

$("plinth").addEventListener("change", (e) => {
  const key = e.target.dataset.run;
  if (key === undefined) return;
  const [wall, layer, first] = key.split("|");
  const n = parseInt(first, 10);
  const i = S.job.plinths.findIndex(
    (p) => p.wall === wall && p.layer === layer && p.first === n);
  if (e.target.checked) {
    if (i < 0) S.job.plinths.push({wall: wall, layer: layer, first: n,
                                   fitted: true, note: ""});
    else S.job.plinths[i].fitted = true;
  } else if (i >= 0) {
    S.job.plinths.splice(i, 1);
  }
  schedule();
});

/* ---------- cut list ----------------------------------------------------- */

// The issues that belong to one cabinet: named by its number, or by a
// designation of one of its panels (the cabinet number followed by a code).
function cabinetIssues(number) {
  const n = String(number);
  return ((S.res && S.res.issues) || []).filter((i) => {
    const w = String(i.where || "");
    return w === n || (/^\d+$/.test(w) && w.startsWith(n) && w.length >= n.length + 2);
  });
}

function issueIndex() {
  const byLabel = {}, byCab = {};
  ((S.res && S.res.issues) || []).forEach((i) => {
    (byLabel[i.where] = byLabel[i.where] || []).push(i);
    if (/^\d+$/.test(i.where)) (byCab[i.where] = byCab[i.where] || []).push(i);
  });
  return {byLabel, byCab};
}

function renderCutlist() {
  const r = S.res;
  if (!r || !r.panels.length) {
    $("cutlist").innerHTML = `<div class="empty">Nothing to cut yet.</div>`;
    return;
  }
  const {byLabel, byCab} = issueIndex();
  const groups = {};
  r.panels.forEach((p) => { (groups[p.cabinet] = groups[p.cabinet] || []).push(p); });

  const edges = (p) => [p.edge_l ? "L×" + p.edge_l : "", p.edge_w ? "W×" + p.edge_w : ""]
    .filter(Boolean).join(" ");

  const out = Object.keys(groups).map(Number).sort((a, b) => a - b).map((cab) => {
    const cabIssues = (byCab[String(cab)] || []).map((i) =>
      `<tr><td colspan="12" class="rowissue ${i.accepted ? "note" : i.level}">${
        esc(i.message)}${i.ref ? " [" + esc(i.ref) + "]" : ""}${
        i.accepted ? " — accepted: " + esc(i.accepted) : ""}</td></tr>`).join("");

    const rows = groups[cab].map((p) => {
      const iss = byLabel[p.label] || [];
      const main = `<tr class="${iss.length ? "hasissue" : ""}" data-label="${esc(p.label)}">
        <td class="mono">${esc(p.label)}</td><td>${esc(p.role)}</td>
        <td>${esc(p.material)}</td>
        <td class="n">${p.length}</td><td class="n">${p.width}</td>
        <td class="n">${p.qty}</td>
        <td>${esc(edges(p))}</td><td>${esc(p.edge_material)}</td>
        <td class="n">${p.edging_m || ""}</td>
        <td class="n">${p.holes_total || ""}</td>
        <td class="grain">${p.grain
          ? `<b>locked</b> <span class="note">along L ${p.length}</span>`
          : `<span class="note">free</span>`}</td>
        <td class="note">${esc(p.note)}</td></tr>`;
      const extra = iss.map((i) =>
        `<tr><td colspan="12" class="rowissue ${i.level}">${esc(i.message)}${
          i.ref ? " [" + esc(i.ref) + "]" : ""}</td></tr>`).join("");
      return main + extra;
    }).join("");

    return `<tr><th colspan="12" style="background:var(--carc);color:var(--ink);
